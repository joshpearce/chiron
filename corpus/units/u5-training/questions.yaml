# u5 (training) item bank.
# Misconception IDs: M* from corpus/misconception-bank.yaml,
# U5M* from this unit's misconceptions.yaml.

pretest:
  - id: u5-p1
    concept: c-xent
    kind: mcq
    prompt: "Unlimited compute, unlimited data, a perfect architecture. What cross-entropy loss does that ideal model reach on held-out English text, and why that value?"
    options:
      - text: "About $1.7$ nats per token - the entropy of the true next-token distribution, since cross-entropy is (entropy of the data) $+$ (KL from model to data) and only the KL term is reducible."
        correct: true
        explain: "Right. After 'I went to the' there are many legitimate continuations, and the ideal model assigns each its true frequency. The entropy term is a property of language, not of the model, so no amount of scale removes it."
      - text: "$0$ nats - a perfect model assigns probability $1.0$ to the token that actually came next at every position."
        misconception: M18
        explain: "This is the expected first answer: the loss is the objective and $\\min(-\\log p_t) = 0$. But $p_t = 1$ means one deterministic continuation per prefix, which is a lookup table, not a language model. Near-zero loss is reached in practice only by memorizing a small corpus, and held-out loss then rises."
      - text: "Slightly above $0$ - never exactly zero, because floating-point precision and finite optimizer steps always leave a small residual."
        misconception: M18
        explain: "Attractive because it concedes zero is unattainable. But it locates the floor in the optimizer and the hardware, so with a better optimizer the floor would shrink. The floor is set by the information content of the data and is unmoved by any engineering."
      - text: "About $\\ln V \\approx 10.8$ nats for a $50{,}257$-token vocabulary - the vocabulary size bounds how well any model can do."
        misconception: M2
        explain: "That is the loss of a model that has learned nothing: uniform logits give $L = \\ln V$ and $\\text{PPL} = V$. It is the ceiling, not the floor, and it treats the softmax output as if it were fixed by the vocabulary rather than shaped by training."
      - text: "Whatever value gives $\\text{PPL} = 1$, since perplexity $1$ means total certainty and that is what a perfect predictor has."
        misconception: M18
        explain: "$\\text{PPL} = 1$ is $L = 0$ restated in the friendlier unit, so it carries the same error. A perfect predictor of a genuinely stochastic source is uncertain by exactly the source's entropy: $\\text{PPL} = e^{1.7} \\approx 5.5$, not $1$."
    answer: "About $1.7$ nats per token - the entropy of the true next-token distribution, since cross-entropy is (entropy of the data) $+$ (KL from model to data) and only the KL term is reducible."
    check: choice

  - id: u5-p2
    concept: c-backprop
    kind: mcq
    prompt: "A 70-billion-parameter model, one scalar loss for one batch. How many backward passes are needed to obtain $\\partial L / \\partial w$ for all $7 \\times 10^{10}$ parameters, and what does one backward pass cost relative to one forward pass?"
    options:
      - text: "One backward pass, costing roughly $2\\times$ a forward pass, so a full training step is about $3\\times$ inference on the same batch."
        correct: true
        explain: "Right. Reverse-mode differentiation gives the sensitivity of ONE output to ALL inputs in a single sweep - the right direction when there is one loss and many parameters. Each layer does one vector-Jacobian product to pass blame back plus one outer product for its own weight gradient, each comparable to that layer's forward matmul."
      - text: "About $7 \\times 10^{10}$ passes - one per parameter, since each parameter must be perturbed separately to measure its effect on the loss."
        misconception: U5M1
        explain: "This is finite differences, the derivative algorithm most engineers have actually implemented. It would make one training step take thousands of years for a 70B model. Backprop computes exact analytic derivatives for every parameter in one sweep; nothing is perturbed."
      - text: "One pass per layer, run in sequence, each costing about one forward pass - so roughly as many passes as the model is deep."
        misconception: U5M1
        explain: "Right that the cost is not per-parameter, wrong that layers are separate passes. Visiting each layer once in reverse order is what the single backward pass IS; the layers are stages of one sweep, not repeated sweeps over the network."
      - text: "One backward pass, but costing $100\\times$ to $1000\\times$ the forward pass, because the derivative of a $10^{11}$-parameter function is far more work than evaluating it."
        misconception: U5M1
        explain: "The count is right and the cost is badly wrong. The constant factor is about 2, independent of parameter count. This belief is what makes people think training is unaffordable for reasons other than data volume - a $100\\times$ backward pass would make pretraining impossible."
      - text: "Two backward passes - one to accumulate the activations and a second to apply the chain rule to the weights."
        misconception: U5M1
        explain: "The activations are stored on the way FORWARD, which is why training memory dwarfs inference memory and why gradient checkpointing exists. No second backward sweep is needed: blame arriving times local sensitivity equals blame departing, computed once per node."
    answer: "One backward pass, costing roughly $2\\times$ a forward pass, so a full training step is about $3\\times$ inference on the same batch."
    check: choice

  - id: u5-p3
    concept: c-posttrain
    kind: mcq
    prompt: "Base model and chat model, same checkpoint lineage: the chat model answers helpfully, the base model rambles. Which statement about where the chat model's factual knowledge came from is best supported by measurement?"
    options:
      - text: "Essentially all of it came from pretraining: measure MMLU on the base model with careful few-shot prompting and on the post-trained model and the score moves a couple of points, sometimes down, while post-training touches on the order of $10^{-6}$ of the pretraining token budget."
        correct: true
        explain: "Right, and both halves matter. The benchmark comparison is the direct evidence; the compute accounting says why - an SFT set of $10^{5}$ examples at 500 tokens is $5 \\times 10^{7}$ tokens against $1.5 \\times 10^{13}$ pretrained, which cannot install a world model. Post-training raises the probability of continuations the base model could already produce."
      - text: "Most of it came from post-training: the reasoning and factual recall you see in the chat model are what SFT and RLHF taught it, which is why the base model cannot produce them."
        misconception: M15
        explain: "The expected answer, because the behavior change is enormous and post-training is the only phase most people can observe. But the base model CAN produce a polite correct answer - that continuation already had probability, competing with a hundred others. What changed is which mode is selected, not what is known."
      - text: "Roughly half: pretraining supplies raw facts and post-training supplies the reasoning ability that combines them into answers."
        misconception: M15
        explain: "A tidy division of labour with no measurement behind it. Reasoning benchmarks behave like knowledge benchmarks across post-training - a few points, sometimes negative. Compositional ability is bought by scale during pretraining, which is what the scaling-law curve on held-out data is measuring."
      - text: "None, and post-training adds only refusals - everything else the chat model does is exactly the base model's behavior with a different prompt template."
        misconception: M15
        explain: "Right on the fraction, wrong on the scope. Instruction following and answer formatting are real behavioral changes that post-training installs, not template artifacts. Understating them makes it hard to explain why a base model rambles at all."
      - text: "Most of it came from post-training, and the evidence is that the chat model can answer questions about events the base model gets wrong."
        misconception: M4
        explain: "This treats knowledge as rows that post-training inserted. The observation usually reflects the base model continuing the document instead of answering; prompt it few-shot and the same facts come out. The mechanism is selection among behaviors, not new storage."
    answer: "Essentially all of it came from pretraining: measure MMLU on the base model with careful few-shot prompting and on the post-trained model and the score moves a couple of points, sometimes down, while post-training touches on the order of $10^{-6}$ of the pretraining token budget."
    check: choice

check:
  - id: u5-q1
    concept: c-xent
    kind: constructed
    congruent: true
    callback_eligible: false
    difficulty: warmup
    prompt: >
      A model over a 3-token vocabulary emits logits z = [3.0, 1.0, 1.0] and
      the true next token is index 0. Compute the cross-entropy loss in nats,
      to 3 decimal places. Useful values: e^3.0 = 20.085537, e^1.0 = 2.718282.
    answer: 0.240
    check: numeric(0.01)
    rubric: >
      Sum = 20.085537 + 2.718282 + 2.718282 = 25.522101; p_0 = 0.786986;
      L = -ln(0.786986) = 0.239545. An answer near 0.787 reported the
      probability instead of its negative log. An answer near 2.240 took the
      loss on a wrong index (index 1 or 2, where p = 0.106507). An answer near
      0.104 used log base 10 instead of the natural log, which is the units
      error behind most cross-model perplexity confusion; nats are the ML
      convention and the tolerance will not absorb the factor of ln(10).

  - id: u5-q2
    concept: c-xent
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: "Two teams report on the same held-out corpus with the same tokenizer. Team A: loss $2.05$. Team B: loss $1.55$. A third engineer says \"so Team B is 24% of the way from A to a perfect model.\" What is the right reading of these numbers?"
    options:
      - text: "The comparison should be excess over the entropy floor, not distance to zero - and with a floor near $1.7$ nats, Team B's $1.55$ sits BELOW it, so the first move is to audit Team B's evaluation for contamination rather than to rank the models."
        correct: true
        explain: "Right. Cross-entropy decomposes into the irreducible entropy of the data plus the KL divergence from the model to it, and only the second term is reducible. Team A's excess is about $0.35$; a reported $1.55$ is not a better model but evidence the held-out set was not held out, or that the two numbers were not measured the same way."
      - text: "The arithmetic is fine: $2.05 \\to 1.55$ closes $0.50$ of the $2.05$ gap to a loss of $0$, so Team B is about 24% of the way to a perfect model."
        misconception: M18
        explain: "This is the framing under test. It takes $0$ as the endpoint, but $L = 0$ means $p_t = 1$ at every position - one deterministic continuation per prefix. The reachable endpoint is the entropy of language, so the denominator is wrong before the division starts."
      - text: "Convert to perplexity: $e^{2.05} = 7.77$ against $e^{1.55} = 4.71$, so Team B's model is meaningfully better and the ranking is what the numbers are for."
        misconception: M18
        explain: "The conversion is correct and the conclusion skips the anomaly. Perplexity is a strictly monotone function of loss, so it ranks identically and hides the same problem: $\\text{PPL} = 4.71$ is below the floor's $e^{1.7} \\approx 5.5$, which is the signal to investigate."
      - text: "A loss of $1.55$ is mathematically impossible below the $1.7$-nat entropy of English, so Team B has made an arithmetic error in computing the mean cross-entropy."
        misconception: M18
        explain: "Close, and wrong about what is impossible. The floor bounds expected loss on data drawn from the true distribution; on a contaminated or memorized evaluation set $1.55$ is entirely achievable. Calling it impossible rules out the diagnosis that actually fits."
      - text: "Neither number is comparable to the other or to any floor, because perplexity and loss depend on the tokenizer and no cross-model comparison is meaningful."
        misconception: U5M4
        explain: "The tokenizer caveat is real but the premise here removes it: same corpus, same tokenizer, so these two ARE comparable. Refusing the comparison outright loses the specific finding, which is that one of the numbers is under the floor."
    answer: "The comparison should be excess over the entropy floor, not distance to zero - and with a floor near $1.7$ nats, Team B's $1.55$ sits BELOW it, so the first move is to audit Team B's evaluation for contamination rather than to rank the models."
    check: choice
    difficulty: core

  - id: u5-q3
    concept: c-xent
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: warmup
    check: choice
    prompt: >
      A model reports a mean cross-entropy of 2.0 nats per token on a
      50,257-token vocabulary, so its perplexity is e^2.0 = 7.39. What does
      that number mean?
    options:
      - text: >
          At each position the model is as uncertain as if it were picking
          uniformly among about 7.4 equally likely tokens.
        correct: true
        explain: >
          Correct. Perplexity is the effective branching factor. A uniform
          distribution over k options has perplexity exactly k, so exp(loss)
          reads as "how many options is this model effectively weighing". Here
          the model has narrowed 50,257 possibilities to the equivalent of
          about 7.
      - text: >
          The model gets the next token right about 7.4% of the time.
        misconception: U5M4
        explain: >
          Attractive because perplexity is reported as a single headline
          quality number and people assume a bounded, accuracy-like scale.
          But perplexity is unbounded above and is not a rate: its worst case
          here is 50,257, the vocabulary size. It also has no direct conversion
          to top-1 accuracy, since a model can be confidently narrowed to seven
          candidates and still pick the right one most of the time.
      - text: >
          The model assigns probability 1/7.39 = 0.135 to the correct token at
          every position.
        misconception: U5M4
        explain: >
          Close to a real relationship but wrong in an important way. The
          reciprocal of perplexity is the GEOMETRIC MEAN of the probabilities
          assigned to the true tokens across the corpus, not the value at every
          position. Individual positions range from near 1.0 (predictable
          function words) to near 0 (the surprising ones), and the log-scale
          averaging is what makes the rare surprises dominate the reported
          number.
      - text: >
          The model has 2.0 nats of loss left to eliminate before it is
          correctly trained.
        misconception: M18
        explain: >
          This is the zero-loss goal. Language has an irreducible entropy of
          roughly 1.7 nats per token on standard corpora, so a loss of 2.0 has
          about 0.3 of reducible gap, not 2.0. Driving a training loss to zero
          means memorization and worse held-out performance.

  - id: u5-q4
    concept: c-backprop
    kind: constructed
    congruent: true
    callback_eligible: true
    difficulty: stretch
    prompt: >
      Work this from scratch. A 2-layer network: input x = [2.0, 1.0];
      W1 = [[0.2, 0.4], [0.5, -0.3]] with b1 = [0, 0]; ReLU; then
      W2 = [[1.0, -1.0], [0.5, 0.5]] with b2 = [0, 0]; then softmax and
      cross-entropy against target class 0. Rows index output units. Compute
      dL/d(W1)_10, the gradient on the weight from input component 0 to hidden
      unit 1. Give it to 3 decimal places. Useful values: e^0.1 = 1.105171,
      e^0.75 = 2.117000.
    answer: 1.971
    check: numeric(0.01)
    rubric: >
      Forward: a1 = [0.8, 0.7], both positive so h = [0.8, 0.7];
      z = [0.1, 0.75]; sum of exponentials 3.222171; p = [0.342990, 0.657010].
      Backward: dL/dz = p - y = [-0.657010, 0.657010];
      dL/dh = W2^T (dL/dz) = [-0.328505, 0.985516]; both ReLU gates open so
      dL/da1 is unchanged; dL/d(W1)_10 = (dL/da1)_1 * x_0 = 0.985516 * 2.0 =
      1.971031.
      An answer near 0.986 multiplied by x_1 = 1.0 instead of x_0 = 2.0
      (index transposition). An answer near -0.657 used dL/da1 index 0.
      An answer near 0.657 stopped at dL/dz and never propagated through W2 at
      all. A negative answer of the right magnitude dropped the transpose and
      contracted W2 along the wrong axis - the single most common structural
      error. Any answer requiring more than one backward sweep in the worked
      reasoning cites U5M1.

  - id: u5-q5
    concept: c-backprop
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: "For softmax followed by cross-entropy with a one-hot target, $\\partial L / \\partial z = p - y$. Which reading of that vector, and which reason for fusing softmax and cross-entropy into one operation, are both correct?"
    options:
      - text: "Each entry is the misallocated probability at that slot - $p_t - 1$ at the true token (negative, the mass the model failed to put there) and $p_i$ at every other (the mass it wasted there); fused because computing them separately needs $1/p_t$, which overflows exactly when $p_t$ is tiny and the example is most informative, while the joint derivation cancels that factor analytically."
        correct: true
        explain: "Right on both. Since updates move against the gradient, the true logit rises and the others fall in proportion to the mass misplaced. The fusion also avoids materializing the $V \\times V$ softmax Jacobian - $2.5$ billion entries per position at $V = 50{,}000$."
      - text: "Each entry is the misallocated probability mass as described, and the fusion is a throughput optimization: one kernel launch instead of two, saving a pass over the logits."
        misconception: U5M1
        explain: "The interpretation is right and the fusion reason is not. Kernel-launch savings are real but incidental; the load-bearing reason is numerical, since the separate path evaluates $1/p_t$ and loses precision or overflows precisely on the high-loss examples that matter most."
      - text: "Each entry is a finite-difference estimate of how much the loss would change if that logit were nudged, so the fusion exists to pick a single well-scaled epsilon for the whole vector."
        misconception: U5M1
        explain: "There is no epsilon anywhere. $p - y$ is an exact analytic derivative, correct to floating-point rounding; what is approximate about a training gradient is the minibatch, not the differentiation. A step-size choice would make the gradient depend on a tuning knob it does not have."
      - text: "Each entry is the probability that the model's answer at that slot is correct, and the fusion exists so the two normalizations - softmax's and cross-entropy's - are not applied twice."
        misconception: M2
        explain: "Softmax outputs are a normalized exponential weighting of scores, not correctness probabilities; temperature reshapes them with no new evidence. And cross-entropy performs no normalization to duplicate - it reads one entry of an already-normalized $p$."
      - text: "Each entry is the raw prediction error $p_i$ scaled by the learning rate, so the fusion exists to apply $\\eta$ once rather than in both stages."
        misconception: U5M3
        explain: "The learning rate lives in the optimizer's update $w \\leftarrow w - \\eta \\, u(g)$, not in the gradient; backprop never sees $\\eta$. It also drops the true token's entry, which is the only negative one and the only one telling a logit to rise."
    answer: "Each entry is the misallocated probability at that slot - $p_t - 1$ at the true token (negative, the mass the model failed to put there) and $p_i$ at every other (the mass it wasted there); fused because computing them separately needs $1/p_t$, which overflows exactly when $p_t$ is tiny and the example is most informative, while the joint derivation cancels that factor analytically."
    check: choice
    difficulty: core

  - id: u5-q6
    concept: c-backprop
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: core
    check: choice
    prompt: >
      During training you notice a hidden unit whose pre-activation is negative
      on every example in every batch, so its ReLU output is always 0. What
      happens to the weights feeding that unit over the next 10,000 steps, with
      AdamW as the optimizer?
    options:
      - text: >
          They receive exactly zero gradient and never change, except for
          weight decay slowly shrinking them toward zero. The unit cannot
          recover on its own.
        correct: true
        explain: >
          Correct, and the weight-decay detail matters. The ReLU local
          derivative is 0 for negative pre-activation, so the incoming blame is
          annihilated and every weight into the unit gets gradient 0 regardless
          of how large the downstream blame was. AdamW's decoupled decay is the
          one term that still touches them, since it does not go through the
          gradient path - it shrinks them, which does not help. This
          self-sustaining failure is why leaky variants and careful
          initialization exist.
      - text: >
          They receive small gradients that shrink as the pre-activation gets
          more negative, so recovery is slow but possible.
        misconception: U5M6
        explain: >
          This imports smooth-gate intuition from sigmoid-like activations,
          where the derivative is small but nonzero and recovery genuinely is
          slow-but-possible. ReLU's derivative is not small for negative input,
          it is exactly 0. Zero times any blame is zero, and no step size,
          optimizer, or patience multiplies zero into a nonzero update.
      - text: >
          Adam's normalization divides the tiny gradient by its own tiny running
          magnitude, so the unit still gets a full-size step and recovers.
        misconception: U5M3
        explain: >
          A sharp guess that gets Adam's mechanism right and the input wrong.
          Adam does turn tiny-but-nonzero gradients into full-size steps, which
          is exactly its dangerous property. But m and v are both driven to
          exactly 0 here, so the step is 0/(0 + epsilon) = 0. Normalizing
          nothing yields nothing.
      - text: >
          The gradients are zero on this batch but nonzero on others, since the
          loss is computed over generated sequences that vary between steps.
        misconception: U5M2
        explain: >
          Two errors. The premise states the unit is negative on every example
          in every batch, so there are no batches where it is not. And the loss
          is not computed over generated sequences: teacher forcing scores every
          position against the corpus's true next token, in parallel, with no
          generation involved.

  - id: u5-q7
    concept: c-optimizers
    kind: constructed
    congruent: true
    callback_eligible: false
    difficulty: core
    prompt: >
      A weight w = 0.8 receives gradient g = 0.4. Learning rate 0.01, weight
      decay lambda = 0.05, beta1 = 0.9, beta2 = 0.999, epsilon = 1e-8,
      optimizer state fresh at step t = 1. Compute w after one AdamW step, to
      4 decimal places.
    answer: 0.7896
    check: numeric(0.00005)
    rubric: >
      m = 0.04, v = 0.00016; bias-corrected mhat = 0.04/0.1 = 0.4 and
      vhat = 0.00016/0.001 = 0.16, so sqrt(vhat) = 0.4 and the adaptive step is
      0.01 * (0.4/0.4) = 0.01. Decoupled decay is 0.01 * 0.05 * 0.8 = 0.0004.
      w = 0.8 - 0.01 - 0.0004 = 0.7896.
      An answer of 0.7960 is the SGD update, skipping the adaptive
      normalization. An answer of 0.7900 omitted the decoupled weight decay.
      An answer of 0.7680 skipped bias correction on both moments, giving
      raw m/sqrt(v) = 0.04/0.012649 = 3.162 and a step 3x too large - the error
      that makes uncorrected Adam diverge in its first few hundred steps. Any
      answer whose adaptive step is far from 0.01 mishandled bias correction,
      since at t = 1 the corrected ratio is exactly sign(g).
      The tolerance is deliberately tighter than the 0.0004 decay term so that
      the omitted-decay answer is scored wrong rather than absorbed by it.

  - id: u5-q8
    concept: c-optimizers
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: "Your script uses `torch.optim.Adam` with `weight_decay=0.1`. A colleague calls a switch to AdamW cosmetic since \"both do weight decay.\" At the level of the update equation, what differs, and which parameters shift most?"
    options:
      - text: "Adam adds $\\lambda w$ into $g$ before the moment updates, so the decay is then divided by $\\sqrt{\\hat v}$ and the effective decay becomes $\\lambda / \\sqrt{\\hat v}$; AdamW subtracts $\\eta \\lambda w$ separately, a fixed shrink meaning the same thing everywhere. Most affected: the extremes of the gradient-magnitude distribution - rare embedding rows (tiny $\\hat v$, previously over-decayed) and high-gradient projections (previously under-decayed)."
        correct: true
        explain: "Right. The placement relative to the adaptive normalization is the whole difference, and it changes effective regularization strength per parameter by orders of magnitude. Not cosmetic."
      - text: "Nothing meaningful differs at the update equation: both subtract a multiple of $w$ each step, and with the same $\\lambda$ the trajectories match to within numerical noise."
        misconception: U5M3
        explain: "This is the claim under test. It would be true under SGD, where L2 regularization and weight decay are literally the same update. Under Adam the division by $\\sqrt{\\hat v}$ sits between the two formulations, which is the only reason AdamW exists."
      - text: "AdamW performs true weight decay while Adam applies an L2 penalty on the loss - two different regularizers, so $\\lambda$ has to be retuned when switching."
        misconception: U5M3
        explain: "The names are right and the mechanism is missing. L2-on-the-loss and decoupled decay are identical updates under SGD; the distinction only exists because Adam divides the step by $\\sqrt{\\hat v}$, catching the $\\lambda w$ term along with the gradient."
      - text: "AdamW's decay is scaled by the adaptive term too, but it also stores a third moment vector to track the decay separately, which is why its memory footprint is higher."
        misconception: U5M3
        explain: "Backwards on both counts. AdamW keeps exactly the same two moment vectors as Adam and adds no state, and the point of the change is that the decay is NOT scaled by the adaptive term."
      - text: "The change matters most for parameters with the largest weights, since the decay term $\\eta \\lambda w$ is proportional to $w$ and Adam's normalization makes the step size independent of it."
        misconception: U5M6
        explain: "Both formulations scale the decay by $w$, so weight magnitude does not distinguish them. What does is $\\hat v$: the divisor Adam applies to the decay and AdamW does not, which sorts parameters by recent gradient magnitude, not by size."
    answer: "Adam adds $\\lambda w$ into $g$ before the moment updates, so the decay is then divided by $\\sqrt{\\hat v}$ and the effective decay becomes $\\lambda / \\sqrt{\\hat v}$; AdamW subtracts $\\eta \\lambda w$ separately, a fixed shrink meaning the same thing everywhere. Most affected: the extremes of the gradient-magnitude distribution - rare embedding rows (tiny $\\hat v$, previously over-decayed) and high-gradient projections (previously under-decayed)."
    check: choice
    difficulty: core

  - id: u5-q9
    concept: c-optimizers
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: core
    check: choice
    prompt: >
      A 7B model's loss has been flat for 20,000 steps. Which diagnosis is best
      supported?
    options:
      - text: >
          Something in the schedule, data, or numerics - check the learning rate
          schedule, for gradient clipping firing constantly, and for loss
          spikes or NaNs in a subset of the batch.
        correct: true
        explain: >
          Correct. In 7 billion dimensions, a point where the loss cannot
          decrease requires upward curvature in all 7 billion directions
          simultaneously; critical points are overwhelmingly saddles with
          available descent directions, and minibatch noise finds them. A flat
          loss is far more likely to be an operational cause: the schedule
          decayed the learning rate to nearly nothing, clipping is truncating
          every update, or a data problem is producing gradients that cancel.
      - text: >
          The optimizer has settled into a local minimum and needs a restart
          from a different seed to find a better one.
        misconception: M5
        explain: >
          This is the 2D bowl picture applied to a 7-billion-dimensional
          surface. Local minima are vanishingly rare at that dimension, and
          restarting from a different seed does not find "a better minimum" -
          it finds a different low-loss region of comparable quality, since
          there are astronomically many and they are not ranked in the way this
          answer assumes.
      - text: >
          The gradient is pointing away from the minimum, so the model is
          walking in the wrong direction and needs a larger learning rate to
          escape.
        misconception: U5M6
        explain: >
          The gradient never points at a minimum; it is the direction of
          steepest local increase and carries no information about where any
          minimum sits. "Pointing away from the minimum" is not a state the
          system can be in, because there is no such direction being tracked.
          A larger learning rate may or may not help, but this is not why.
      - text: >
          The model has reached the entropy floor of the data and no further
          improvement is possible.
        misconception: M18
        explain: >
          Correct concept, wrong application. The floor is real and does flatten
          loss curves at the end of a well-run training job, but a 7B model
          20,000 steps into training is nowhere near it - scaling laws put a
          model that size well above the floor. Invoking the floor to explain
          an early plateau is unfalsifiable comfort; check the operational
          causes first.

  - id: u5-q10
    concept: c-scaling
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: >
      A team has a fixed compute budget and proposes doubling $N$ and halving
      $D$ versus a current plan already near 20 tokens per parameter, keeping
      $C \approx 6ND$ constant. Which statement best captures the effect on
      held-out loss and the outside-the-training-budget consideration?
    options:
      - text: >
          It hurts: with $L(N,D) = E + A/N^{\alpha} + B/D^{\beta}$ both shrinking
          terms have to come down together, and starving $D$ leaves the extra
          capacity untrained - about 0.07 nats worse at the same $C$. It also
          doubles the per-token serving cost, paid for the deployment's whole
          life.
        correct: true
        explain: >
          Correct. The Chinchilla fit is a sum of an $N$ term and a $D$ term;
          moving budget from $D$ to $N$ past the optimum raises $B/D^{\beta}$
          more than it lowers $A/N^{\alpha}$. And training compute is paid once
          while inference compute is paid forever, which is why production models
          are trained well past 20:1.
      - text: >
          It helps: parameters are what carry capability, so at fixed $C$ the
          larger model is the stronger one, and the extra serving cost is the
          price of that capability.
        misconception: M11
        explain: >
          This is the storage view of parameters - more weights, more stored
          capability. The measured curve says otherwise: held-out loss depends on
          $N$ and $D$ jointly, and a $3\times$ smaller model at 20 tokens per
          parameter beats a larger one at 2 tokens per parameter on the same
          budget.
      - text: >
          It hurts, because a model twice as large on half the data will memorize
          that data and overfit, so held-out loss rises even though training loss
          falls.
        misconception: M11
        explain: >
          Right verdict, wrong mechanism, and the mechanism predicts the wrong
          curve. If capacity were storage, held-out loss would U-turn as $N$
          grows; it does not - it improves smoothly over five orders of
          magnitude. The loss here comes from the undertrained $D$ term, not from
          overfitting.
      - text: >
          It is neutral: $C \approx 6ND$ is held constant, and loss is a function
          of compute, so any allocation of the same FLOPs reaches the same
          held-out loss.
        misconception: M11
        explain: >
          Compute-optimality is exactly the claim that allocation matters at
          fixed $C$. $L$ is a function of $N$ and $D$ separately, not of their
          product, which is why the Chinchilla fit has two independent shrinking
          terms.
      - text: >
          It helps on training loss but the decision is unimportant either way,
          since enough scale drives loss toward zero on either allocation.
        misconception: M18
        explain: >
          Loss does not approach zero; it approaches the fitted irreducible term
          $E = 1.69$ nats, the entropy of the data. The gap that scaling closes
          is $L - E$, and allocation determines how fast you close it.
    check: choice
    difficulty: core

  - id: u5-q11
    concept: c-scaling
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: core
    check: choice
    prompt: >
      Held-out loss improves smoothly as parameter count grows across five
      orders of magnitude, with no upturn. What does this rule out?
    options:
      - text: >
          That parameters function primarily as storage for training examples,
          since a storage device gains nothing on data it never saw and would
          show a classic overfitting upturn as capacity outgrew the dataset.
        correct: true
        explain: >
          Correct, and this is the load-bearing observation. The measured curve
          is the signature of improving generalization, not accumulating
          storage. Capacity buys richer feature composition - more
          representable features, more relationships, more layers of
          composition - which is why scaled models handle inputs no training
          example demonstrates.
      - text: >
          That the loss has any lower bound, since a smooth unbroken improvement
          implies it continues to zero given enough scale.
        misconception: M18
        explain: >
          The curve is a power law with an additive constant, so it is smooth
          AND bounded below. It approaches the irreducible entropy term
          asymptotically and never crosses it. Smoothness says nothing about
          where a curve terminates; extrapolating this one to zero contradicts
          the fitted form it was extrapolated from.
      - text: >
          That larger models memorize any training data at all, since
          memorization would show up as degraded held-out loss.
        misconception: M11
        explain: >
          Overcorrection. Larger models demonstrably do memorize more, and
          verbatim extraction of training data from large models is a
          documented result. What the curve rules out is memorization being the
          PRIMARY mechanism. Memorization exists and dominates in the
          small-data regime; it is the exception, not the engine.
      - text: >
          That model quality depends on training data volume, since the
          improvement is attributed to parameter count alone.
        misconception: M11
        explain: >
          The premise is a single-variable slice of a two-variable relationship.
          Loss depends on both N and D, and the scaling experiments vary both;
          holding D fixed while raising N gives diminishing returns precisely
          because the D term does not shrink. Chinchilla's whole result is that
          data volume matters as much as parameter count.

  - id: u5-q12
    concept: c-posttrain
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: >
      SFT, PPO-based RLHF and DPO all consume human judgments and update the
      same weights. Which option correctly gives the shape of supervision each
      loss consumes, which of them can push probability AWAY from a bad
      response, and the one capability PPO has that DPO structurally lacks?
    options:
      - text: >
          SFT consumes a target (prompt, response) scored with masked
          cross-entropy and can only push probability TOWARD it; PPO consumes a
          learned scalar $r_\phi$ over the model's own samples and can push
          away; DPO consumes a (winner, loser) pair directly and can push away.
          PPO alone is online - it samples from the improving policy, so it can
          correct behavior that did not exist when the data was collected.
        correct: true
        explain: >
          Correct on all three counts. Cross-entropy's only sentence is "this is
          the target", so SFT has no way to say "worse"; both preference methods
          do. And DPO reads a fixed file of pairs, so it can never see what the
          current policy actually produces.
      - text: >
          SFT consumes a target and pushes toward it; PPO consumes a learned
          scalar and can push away; DPO is a lighter reinforcement learner that
          trains its own reward model and samples rollouts more cheaply than PPO.
          PPO's structural advantage is that it is faster per step.
        misconception: U5M7
        explain: >
          DPO trains no reward model and draws no samples: the reward cancels out
          of the KL-constrained optimum, leaving a supervised loss on fixed pairs
          that runs through the same code path as SFT. The real difference is
          offline versus online, not speed.
      - text: >
          SFT consumes a target; PPO shows the model its reward score so it can
          read that it was rated 0.7 and try again; DPO consumes a pair. Both
          preference methods push away, and PPO's advantage is that the model
          receives explicit numeric feedback DPO cannot give it.
        misconception: U5M5
        explain: >
          Nothing about the reward reaches the model except as a gradient on its
          weights. $r_\phi$ is computed outside the model and used to weight a
          policy gradient; the model never represents or reasons about the score.
      - text: >
          All three consume a target and differ only in data curation, so all
          three can push probability away from a bad response; PPO's advantage is
          that its preference data is higher quality because humans compared
          responses.
        misconception: M15
        explain: >
          SFT's masked cross-entropy can only raise the probability of the
          demonstrated response - there is no "worse" term in it. And the
          distinction among these methods is the shape of supervision the loss
          consumes, not the quality of the annotation.
      - text: >
          SFT consumes a target; PPO consumes a scalar; DPO consumes a pair. All
          push away. PPO's structural advantage is that it installs new knowledge
          DPO cannot, because sampling exposes the model to text it has not seen.
        misconception: M15
        explain: >
          The supervision shapes are right, but no post-training method installs
          knowledge: an SFT-scale set is about 0.0003% of the pretraining token
          budget, and rollouts are the model's own output, not new corpus. PPO's
          advantage is being online.
    check: choice
    difficulty: core

  - id: u5-q13
    concept: c-posttrain
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: core
    check: choice
    prompt: >
      A base model and its RLHF'd chat descendant are evaluated on MMLU. The
      base model is prompted carefully with few-shot examples. What result
      should you expect, and why?
    options:
      - text: >
          Within a couple of points of each other, because post-training
          reallocates probability among behaviors the base model already had
          rather than adding knowledge.
        correct: true
        explain: >
          Correct, and this is the standard measured result. The compute
          accounting explains the mechanism: post-training touches on the order
          of 10^-6 to 10^-4 of the pretraining token budget, which is far too
          small a perturbation to install a world model. The dramatic
          base-versus-chat difference is in format compliance, instruction
          following, and refusals - all behavioral.
      - text: >
          A large jump for the chat model, since RLHF is where it learns to
          answer questions correctly.
        misconception: M15
        explain: >
          This conflates answering in the expected FORM with knowing the answer.
          RLHF makes the model reliably emit a single lettered choice instead of
          continuing the document; careful few-shot prompting gets the base
          model to do the same, and once it does, the scores converge. The
          behavior change is real and the knowledge change is not.
      - text: >
          A large jump for the chat model, because the reward signal teaches it
          which answers are rated correct and it learns to seek that reward.
        misconception: U5M5
        explain: >
          The model never sees a reward. The scalar is computed outside it by a
          separate reward model and enters only as a gradient on weights;
          nothing about "seeking reward" happens inside a forward pass. And the
          reward model was trained on human preferences over response quality,
          not on MMLU answer keys, so there is no path by which it transmits
          factual correctness.
      - text: >
          A large drop for the chat model, because RLHF overwrites pretrained
          weights with the much smaller preference dataset.
        misconception: M4
        explain: >
          This is the lookup-table model of parameters - preference data
          "overwriting rows" of stored facts. Weights are not rows and
          post-training does not overwrite regions of them; it makes a small
          update to all of them. There IS a real and much smaller effect here
          (the alignment tax, a point or two on some benchmarks, partly from
          the KL-constrained drift and partly from format changes), but the
          mechanism is not overwriting.

  - id: u5-q14
    concept: c-backprop
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: >
      Training needs far more memory than inference at the same batch size and
      sequence length, and the gap grows with depth. Which option gives the
      mechanism, what gradient checkpointing trades, and where its roughly 33%
      compute increase comes from?
    options:
      - text: >
          Every intermediate activation from the forward pass must stay resident
          until the backward pass reaches it, because each local derivative is
          evaluated at the value its input actually took - a live set of
          $O(L \cdot B \cdot S \cdot d)$, where inference frees each layer's
          activations once the next consumes them. Checkpointing stores only
          every $\sqrt{L}$-th layer and recomputes the rest, adding one forward
          pass to a step that costs about 3 forward-equivalents: 3 to 4, or ~33%.
        correct: true
        explain: >
          Correct. The depth-scaling term is the stored activations, and the
          trade is recomputation for residency. A step is one forward plus about
          two forward-equivalents of backward, so one extra forward is a third
          more.
      - text: >
          Backprop perturbs each weight and measures the change in loss, so it
          must keep a copy of the network state per perturbation. Checkpointing
          stores fewer of those copies and re-perturbs from the nearest one, and
          the 33% is the cost of the re-perturbation sweep.
        misconception: U5M1
        explain: >
          Backprop is reverse-mode automatic differentiation, not finite
          differences. Perturbing would cost one forward pass per parameter -
          $10^{11}$ of them per step. The whole backward pass costs about twice
          the forward, total.
      - text: >
          The gap is optimizer state: AdamW keeps two extra values per parameter,
          so training memory is roughly three times the weights. Checkpointing
          keeps the moments for only a subset of layers and recomputes the rest,
          and the 33% is the extra moment arithmetic.
        misconception: U5M1
        explain: >
          Optimizer state is real and large, but it is fixed by parameter count -
          it does not scale with depth, batch or sequence length, and it is not
          what checkpointing addresses. Checkpointing discards and recomputes
          activations; moments are never recomputed.
      - text: >
          Training runs the sequence position by position to score each token,
          so it holds $S$ separate forward states at once where inference holds
          one. Checkpointing keeps only some positions and replays the rest,
          costing about a third more compute.
        misconception: U5M2
        explain: >
          Teacher forcing scores every position in one parallel forward pass; the
          model never consumes its own output during pretraining. The memory is
          per-layer activations retained for the backward sweep, not per-position
          replay states.
      - text: >
          Training stores the KV cache for the whole batch so the backward pass
          can re-read the conversation, which inference discards between calls.
          Checkpointing drops most of that cache and rebuilds it, at roughly a
          third more compute.
        misconception: M17
        explain: >
          The KV cache is a generation-time optimization to avoid re-projecting
          old tokens; it is not the training memory bill and carries no state
          beyond what the tokens themselves determine. What training retains is
          the forward activations needed to evaluate local derivatives.
    check: choice
    difficulty: stretch
