# u4 - The transformer block. Item bank.
#
# Pretest items target the three refutations this unit is built on (U4M1,
# M8, M7) and are expected to fail - that is the calibration signal.
#
# Check bank: 14 items, 9 constructed+congruent (64%), 5 MCQ. Every MCQ
# distractor cites a misconception ID from corpus/misconception-bank.yaml or
# this unit's misconceptions.yaml. Sibling pairs (MHA/MQA/GQA, pre-LN/post-LN)
# are deliberately mixed within single items rather than blocked.
#
# Fade sequence rung 3 (solo items) for the unit's three procedures:
#   attention-param-count -> u4-q1
#   kv-cache-per-token    -> u4-q3
#   mlp-param-count       -> u4-q5

pretest:
  - id: u4-p1
    concept: c-mha
    kind: mcq
    prompt: |
      A transformer block has $d = 1024$ and 16 attention heads. An engineer
      reconfigures it to 4 heads, leaving $d = 1024$ and everything else
      unchanged. Which statement about the attention sublayer after the change
      is correct?
    options:
      - text: "The parameter count is unchanged at $4d^2 = 4{,}194{,}304$; the block now forms 4 attention distributions per query position instead of 16, each with rank up to $d_k = 256$ instead of 64."
        correct: true
        explain: "$W^Q, W^K, W^V, W^O$ are $1024 \\times 1024$ at any head count; $h$ only sets how their columns are sliced. The trade is count of simultaneous patterns against per-head rank."
      - text: "The parameter count drops by 4x, to $1{,}048{,}576$, because each head carries its own $W^Q, W^K, W^V$ and there are now a quarter as many heads."
        misconception: U4M1
        explain: "This is the replication model of heads. Heads are not copies: the four projection matrices stay $d \\times d$ and are sliced into $h$ contiguous blocks of width $d_k = d/h$, so the count is $4d^2$ either way."
      - text: "The parameter count is unchanged, but expressiveness is unchanged too, since the same matrices with the same entries are applied to the same input."
        misconception: U4M1
        explain: "The count is right and the conclusion is wrong. The slicing decides how many separate softmax rows a query position gets: 4 mixing distributions rather than 16, at width 256 rather than 64. Same weights, different computation."
      - text: "The parameter count is unchanged, but the model loses expressiveness outright, because 12 of the specialised heads (previous-token, subject-verb, and so on) no longer exist."
        misconception: U4M1
        explain: "Head specialisation is an emergent consequence of having several restricted read/write channels, not a fixed inventory of functions that is deleted. Fewer heads means fewer simultaneous patterns but each one higher-rank - a trade, not a pure loss."
      - text: "The parameter count rises, because $d_k$ grows from 64 to 256 and each head's projection is $d \\times d_k$."
        misconception: U4M1
        explain: "Per-head projections are $d \\times d_k$, but there are $h$ of them: $h \\cdot d \\cdot d_k = h \\cdot d \\cdot d/h = d^2$ per projection regardless of $h$. Widening the heads is exactly compensated by having fewer."
    check: choice

  - id: u4-p2
    concept: c-residual
    kind: mcq
    prompt: |
      You have a trained 24-block transformer. At inference time you delete
      block 12 entirely - its tensors are gone and the forward pass goes
      straight from block 11 to block 13. Given
      $h = x + \mathrm{MHA}(\mathrm{Norm}(x))$ and
      $y = h + \mathrm{MLP}(\mathrm{Norm}(h))$, which outcome and reason are
      correct?
    options:
      - text: "Fluent but measurably degraded text - a few percent on downstream accuracy - because the deletion removes 2 of 48 additive updates from a stream that blocks 13-24 read directly."
        correct: true
        explain: "Both sublayers add to a persistent stream, so $x_{24}$ is the embedding plus a sum of updates. Removing two terms perturbs that sum slightly; nothing downstream was reading block 12's output as its input."
      - text: "Noise, because block 13's weights were fitted to consume block 12's output and now receive an activation from the wrong pipeline stage."
        misconception: M8
        explain: "This is the pipeline reading of a residual stack. Block 13 reads the residual stream through its own projections, not block 12's output; the stream still carries everything blocks 1-11 wrote."
      - text: "Noise, because the residual connections exist to carry gradients during training and cannot repair a missing block at inference."
        misconception: M8
        explain: "The gradient-highway story is true but secondary. At inference the residual additions are the mechanism by which the stream persists, which is precisely why a missing middle block degrades gracefully."
      - text: "No measurable change at all, because the residual path $x + \\mathrm{Sublayer}(x)$ means every block's contribution is optional."
        explain: "An over-correction. Block 12's two updates were fitted to be useful; deleting them costs real quality, typically a few percent. Graceful is not free."
        misconception: M8
      - text: "Fluent text with no loss on any task, because the remaining 23 blocks re-normalize the stream and absorb the missing contribution."
        misconception: M7
        explain: "Normalization sits on each block's branch and discards magnitude; it does not reconstruct information that was never written. And in a pre-LN model the main path is untouched addition, so there is nothing to absorb the loss."
    check: choice

  - id: u4-p3
    concept: c-layernorm
    kind: mcq
    prompt: |
      You load a trained model in full fp32 - no possibility of fp16 overflow -
      and delete every LayerNorm operation from the forward pass, leaving all
      other weights untouched. Which prediction is correct?
    options:
      - text: "Garbage output immediately, and running in fp64 would change nothing: every downstream matrix was fitted against normalized inputs and the residual stream's magnitude grows with depth."
        correct: true
        explain: "Normalization enforces a learned scale contract, not a float-range guard. Nothing overflows; the vectors are simply in units no downstream weight was trained on, at any precision."
      - text: "Output is essentially unchanged, because fp32 has range $\\pm 3.4 \\times 10^{38}$ and normalization exists to keep activations from overflowing."
        misconception: M7
        explain: "This is the numerical-stability model. It predicts a cheap experiment that has been run: drop the norms in fp32 and the model emits garbage with nothing anywhere near overflow."
      - text: "Output degrades slightly in fp32 and would be fully restored in fp64, since the remaining error is accumulated rounding in the unnormalized stream."
        misconception: M7
        explain: "Same float-range framing one step softer. The failure is a depth-dependent scale mismatch of order the stream's growth, not rounding; extra mantissa bits address neither."
      - text: "Output is unchanged at batch size 1 and degrades only for larger batches, since without the norm the examples in a batch no longer share statistics."
        misconception: U4M7
        explain: "LayerNorm and RMSNorm compute statistics across the $d$ features of a single token vector - never across the batch. There is no cross-example coupling to lose."
      - text: "Output is garbage in fp32 but would be fine in fp64, because the deeper layers' activations exceed fp32's precision once nothing rescales them."
        misconception: M7
        explain: "Precision is irrelevant here. $\\mathrm{LN}(au) = \\mathrm{LN}(u)$ for $a > 0$: a device whose defining property is that magnitude is discarded is not a magnitude-management device, and restoring it is what the model needs, not more bits."
    check: choice

check:
  - id: u4-q1
    concept: c-mha
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Model configuration: $d = 4096$, $h = 32$ query heads, standard
      multi-head attention, no biases. The attention sublayer's four matrices
      $W^Q, W^K, W^V, W^O$ are each $d \times d$. How many parameters does the
      attention sublayer hold at $h = 64$? Give the number.
    answer: "67108864"
    check: exact
    difficulty: warmup

  - id: u4-q2
    concept: c-mha
    kind: mcq
    congruent: false
    callback_eligible: true
    check: choice
    prompt: |
      Which statement correctly describes the relationship between multi-head
      attention (MHA), multi-query attention (MQA) and grouped-query
      attention (GQA)?
    options:
      - text: |
          All three keep $h$ query heads. They differ only in the number of
          key/value heads $g$: MHA has $g = h$, GQA has $1 < g < h$ with each
          group of $h/g$ query heads sharing one K and one V, and MQA has
          $g = 1$.
        correct: true
        explain: |
          Correct, and the framing to keep: GQA is the family and the other
          two are its endpoints. $W^Q$ and $W^O$ stay $d \times d$ in all
          three; only $W^K$ and $W^V$ shrink to $d \times g d_k$.
      - text: |
          MQA and GQA reduce the number of query heads while keeping one
          key/value head per remaining query head.
        misconception: U4M2
        explain: |
          Attractive because the names say "query". But the query side is
          exactly what does not change - if it did, $W^O$ would have to
          change shape, and it does not. The reduction is on K and V.
      - text: |
          MQA shares one key/value head across all layers; GQA shares
          key/value heads across groups of heads within a layer.
        misconception: U4M2
        explain: |
          Cross-layer KV sharing is a real and separate technique, which is
          what makes this plausible. MQA is not it: MQA is $g = 1$ within
          each layer, and every layer still has its own K and V projections.
      - text: |
          GQA groups nearby sequence positions so each query attends to a
          coarser summary of the sequence, which is where the savings come
          from.
        misconception: U4M3
        explain: |
          This is the "fewer of X means less work" instinct pointed at
          positions instead of heads. Every query head still attends over
          every allowed position under GQA; the sequence is never
          summarized or grouped. The saving is bytes of cached K/V.
      - text: |
          MQA gives each query head its own key projection but shares one
          value projection across all heads.
        misconception: U4M2
        explain: |
          Half-remembering that "something is shared" and guessing which.
          MQA shares both K and V - keeping per-head K would leave the cache
          at half of MHA rather than $1/h$, which is not what MQA delivers.
    difficulty: warmup

  - id: u4-q3
    concept: c-mha
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A model has $d = 5120$, $h = 40$ query heads, $d_k = 128$, $L = 40$
      layers, and uses GQA with $g = 8$ key/value heads. Weights and KV cache
      are fp16 (2 bytes per element). Compute the total KV cache size, in
      MiB, for a single sequence of 4096 tokens.
      Answer with the number of MiB only.
    answer: 640
    check: numeric(0.5)
    rubric: |
      $2 \times g \times d_k \times b = 2 \times 8 \times 128 \times 2 =
      4096$ B per token per layer; $\times 40$ layers $= 163{,}840$ B per
      token; $\times 4096$ tokens $= 671{,}088{,}640$ B $= 640$ MiB.
      Diagnostic wrong answers: 3200 means $h = 40$ was used in place of
      $g = 8$ (U4M2); 320 means the factor of 2 for both K and V was dropped;
      16 means the per-layer figure was reported without multiplying by $L$.
    difficulty: core

  - id: u4-q4
    concept: c-mha
    kind: mcq
    congruent: false
    callback_eligible: true
    check: choice
    prompt: |
      A team switches an 8B model from MHA ($h = g = 32$) to GQA ($h = 32$,
      $g = 8$) and retrains. What is the primary resource this saves, and
      where does the speedup show up?
    options:
      - text: |
          KV cache bytes and the HBM bandwidth to stream them - a 4x
          reduction - which shows up as lower per-token decode latency and 4x
          more concurrent sequences per GPU.
        correct: true
        explain: |
          Correct. Decode reads the whole cache per generated token and runs
          at about 1 FLOP/byte under MHA against a ridge point near 150, so
          it is bandwidth-bound and latency tracks bytes moved, which scale
          with $g$.
      - text: |
          Attention FLOPs, by a factor of 4, which speeds up both prompt
          prefill and decode proportionally.
        misconception: U4M3
        explain: |
          The most common wrong answer and the one worth diagnosing. Score
          computation is $h \cdot n \cdot d_k$ MACs per new token in every
          variant - shared keys are broadcast to the query heads that share
          them, not skipped. Prefill is compute-bound and is essentially
          unaffected by GQA.
      - text: |
          The size of the attention score tensor, which drops from
          $32 \times n \times n$ to $8 \times n \times n$, cutting activation
          memory during prefill.
        misconception: U4M2
        explain: |
          This follows from believing $g$ counts query heads. It does not:
          all 32 query heads still form their own $n \times n$ score matrix,
          so the score tensor is unchanged.
      - text: |
          Parameter count, primarily - the 37.5% reduction in attention
          weights is what makes the model cheaper to serve.
        misconception: U4M3
        explain: |
          The 37.5% figure is real ($2d^2 + 2d^2 g/h$ against $4d^2$), which
          makes this the subtlest distractor. But attention is under a third
          of a SwiGLU model's non-embedding weights, so this is about a 10%
          total parameter saving - far less consequential than the 4x on
          cache, which is why GQA exists.
      - text: |
          Nothing measurable at inference; GQA is a training-stability
          technique that lets larger models converge.
        misconception: U4M3
        explain: |
          GQA has no training-stability motivation. It is an inference-time
          memory technique, adopted with a small quality cost, and it is
          measurable immediately in cache footprint and decode throughput.
    difficulty: core

  - id: u4-q5
    concept: c-mlp-block
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A block has $d = 2048$, a two-matrix MLP with $d_{ff} = 8192$, standard
      MHA with $h = 16$, and no biases. Give the total number of parameters
      in the whole block (attention plus MLP).
      Answer with the integer only.
    answer: 50331648
    check: numeric(1)
    rubric: |
      Attention $= 4d^2 = 16{,}777{,}216$. MLP $= 2 d\,d_{ff} =
      2 \times 2048 \times 8192 = 33{,}554{,}432$. Total $= 50{,}331{,}648$,
      which is $12d^2$.
      Diagnostic wrong answers: 33,554,432 means attention was omitted;
      16,777,216 means the MLP was omitted (U4M5, treating the MLP as
      negligible); 268,435,456 means attention was multiplied by $h = 16$
      (U4M1); 46,137,344 means $W^O$ was left out of the attention count.
      Note that 33,554,432 is ambiguous here - it is both "attention omitted"
      and "only one MLP matrix counted", since $4d^2 = d\,d_{ff}$ when
      $d_{ff} = 4d$; probe before diagnosing.
    difficulty: core

  - id: u4-q6
    concept: c-mlp-block
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      The MLP can be written exactly as
      $\mathrm{MLP}(u) = \sum_{i=1}^{d_{ff}} \sigma(u \cdot k_i)\, v_i$, where
      $k_i$ is column $i$ of the up-projection and $v_i$ is row $i$ of the
      down-projection. A colleague concludes: "so the model is a key-value
      store of facts, and hallucination is a cache miss returning corrupted
      data - we should be able to fix it by storing more facts." Which
      assessment is correct?
    options:
      - text: "The algebra is exact, but the claim fails: a store would return a miss for an absent key, whereas the model returns a fluent confident answer, because $u \\cdot k_i$ is continuous and near-misses blend related $v_i$ - the same operation as generalization."
        correct: true
        explain: "Soft associative memory is a fair reading of the sum. The error is the 'rows' reading: interpolation between stored patterns is what answers unseen questions and what hallucinates, so more capacity cannot remove one without the other."
      - text: "The claim is right: each $(k_i, v_i)$ is a stored row, a bigger $d_{ff}$ holds more facts, and hallucination is what happens when the query misses every row."
        misconception: M4
        explain: "A lookup table returns nothing for an absent key. Models instead produce specific confident wrong answers - a successful soft match on near-misses, not a failed retrieval - and single neurons are polysemantic, so there is no row to miss."
      - text: "The key-value framing is wrong from the start: $\\sigma(u \\cdot k_i)$ is just a nonlinearity, the MLP is plumbing that keeps the stack from collapsing to one linear map, and no memory reading of it is legitimate."
        misconception: U4M5
        explain: "The sum-over-$i$ form is an algebraic identity, not a metaphor, and probing does find $k_i$ that fire on legible patterns. The MLP also holds two thirds to four fifths of the block's parameters - it is not plumbing."
      - text: "The algebra is exact and hallucination is a miss, but the fix is retrieval rather than more parameters: give the model an external store to consult when no $k_i$ matches."
        misconception: M4
        explain: "This keeps the failing prediction and changes only the remedy. There is no 'no $k_i$ matches' state to detect: every key returns some coefficient, and the blend that results is the same mechanism that generalizes."
      - text: "The algebra is exact, and hallucination is a separate defect from generalization: blending near-miss values is a bug in $\\sigma$ that a sharper nonlinearity would remove while leaving generalization intact."
        misconception: M4
        explain: "Sharpening the match toward a hard lookup removes exactly the interpolation that lets the model answer questions phrased in ways it never saw. Generalization and hallucination are one map evaluated at different distances from training-dense regions."
    difficulty: core
    check: choice

  - id: u4-q7
    concept: c-residual
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Layer-pruning tools ship a recipe: "drop 25% of the middle blocks from a
      32-block model, then briefly fine-tune; expect a few points of quality
      loss." Which account of why this works in the middle but not at either
      end is correct?
    options:
      - text: "Unrolled, $x_L = e(t) + p(t) + \\sum_l (\\mathrm{MHA}_l + \\mathrm{MLP}_l)$, so dropping 8 middle blocks removes 16 of 64 additive terms and later blocks still read the stream. Early blocks write the features later read projections were trained to find, and late blocks rotate the stream into the directions the unembedding reads."
        correct: true
        explain: "Nothing is overwritten, so a middle deletion is a perturbation of a sum. The ends are not interchangeable terms: one supplies what every later read expects, the other converts the accumulated stream into logits."
      - text: "Residual connections let gradients skip a block, so a pruned block's absence is routed around; the ends fail because their gradients have no alternative path."
        misconception: M8
        explain: "Gradient flow is a training-time property and says nothing about an inference-time deletion. The inference-time fact is that each sublayer writes an additive update to a persistent stream that later blocks read directly."
      - text: "Middle blocks are redundant copies of one another produced by overparameterization, so removing some loses nothing; the first and last blocks are the only ones doing distinct work."
        misconception: M8
        explain: "The conclusion is roughly right with no mechanism, and the premise is wrong: middle blocks write distinct features (entities, relations, factual associations). They prune gracefully because their contributions are terms in a sum, not because they duplicate each other."
      - text: "Pruning works anywhere in the stack, ends included, provided you fine-tune afterwards, since the surviving blocks re-learn the missing computation."
        misconception: M8
        explain: "Empirically the ends are not droppable at acceptable cost. Deleting block 1 corrupts the input to all 31 downstream read projections, and deleting the last blocks leaves the stream in directions the unembedding cannot read."
      - text: "Middle pruning works because each block re-normalizes the residual stream, so the stack self-corrects for a missing contribution; the ends lack a normalization to do this."
        misconception: U4M4
        explain: "In a pre-LN model the norm sits on the branch, not on the main path - the stream itself is never re-normalized, and a final norm before the unembedding is needed for exactly that reason. The graceful degradation comes from additivity, not from renormalization."
    difficulty: core
    check: choice

  - id: u4-q8
    concept: c-residual
    kind: mcq
    congruent: false
    callback_eligible: false
    check: choice
    prompt: |
      Four single edits to a trained 32-block pre-LN model, applied at
      inference with all weights left intact. Which one destroys the model's
      output entirely, rather than degrading it?
    options:
      - text: |
          In block 16, replace both residual additions with assignment:
          $h = \mathrm{MHA}(\mathrm{Norm}(x))$ and
          $y = \mathrm{MLP}(\mathrm{Norm}(h))$.
        correct: true
        explain: |
          Correct. The residual stream is the accumulated state - the
          embedding plus every update written by blocks 1-15. Assignment
          discards all of it and hands blocks 17-32 a vector with no history,
          in the wrong scale and the wrong subspaces. The weights being
          intact is irrelevant; the sum, not the weights, carries the state.
      - text: |
          Delete block 16 entirely, wiring block 15's output straight into
          block 17.
        misconception: M8
        explain: |
          The pipeline intuition says this is fatal - block 17 gets input
          from the wrong stage. It is not: this removes 2 terms from a sum of
          64 and costs a few percent. This is exactly the discrimination the
          correct answer tests against, and choosing it means the additive
          read/write view has not replaced the pipeline view.
      - text: |
          Swap the execution order of blocks 16 and 17.
        misconception: M8
        explain: |
          Also survivable, and for the same reason: both still read the
          stream and add to it. Adjacent middle-block reordering costs
          little. Picking this over assignment means ordering is being
          treated as load-bearing when the additive structure is what
          matters.
      - text: |
          Delete block 1, so the embedding feeds block 2 directly.
        misconception: M8
        explain: |
          The strongest distractor, because this genuinely is more damaging
          than deleting block 16 - later blocks' read projections were
          trained against features block 1 writes. But it still removes only
          2 additive terms and leaves the embedding in the stream; output
          degrades badly and stays structured. Assignment erases the stream
          outright, which is categorically worse.
    difficulty: core

  - id: u4-q9
    concept: c-layernorm
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      An engineer proposes: "LayerNorm is a numerical-stability guard. We are
      serving in fp32 where overflow is impossible, so let us strip the norm
      layers to save two kernel launches per block." Which single fact most
      directly refutes the proposal?
    options:
      - text: "The stripped model emits garbage in fp32 and in fp64 alike, with nothing overflowing, because every downstream matrix was fitted against normalized inputs while the residual stream's magnitude grows with depth."
        correct: true
        explain: "This is the refutation: removal breaks the model at any precision, so the failure is a broken learned scale contract, not a float-range event. Normalization sets a fixed operating point at every depth and conditions the gradient (its Jacobian projects out the component along the current activation and scales by $1/\\sigma$)."
      - text: "The proposal is sound at fp32 but unsafe at fp16, where attention logits can overflow and softmax needs max-subtraction; keep the norms only for reduced-precision serving."
        misconception: M7
        explain: "Attractive because those fp16 numerics are real - but they are different operations in different places. Conflating them with LayerNorm is exactly the stability story: it predicts that fp32 removal is harmless, and fp32 removal destroys the outputs."
      - text: "Stripping the norms lets activations grow past the fp32 maximum of about $3.4 \\times 10^{38}$ after enough blocks, so the stream eventually overflows to inf and the logits become NaN."
        misconception: M7
        explain: "This keeps the overflow framing and merely moves the threshold. The model degrades immediately, long before any float range is approached, and it degrades identically in fp64 where the headroom is vastly larger."
      - text: "The saving is illusory because LayerNorm's learned $\\gamma$ and $\\beta$ are $2d$ parameters per norm, so deleting them removes a large share of the block's weights."
        misconception: M7
        explain: "The parameter count is right and irrelevant - $2d$ is negligible against a block's $12d^2$. Arguing from parameters concedes that the operation itself is only numerical housekeeping, which is the error under test."
      - text: "LayerNorm cannot be removed because it computes batch statistics that inference reuses as running averages, so the block would have no calibrated mean and variance to divide by."
        misconception: U4M7
        explain: "LayerNorm and RMSNorm compute their mean and variance across the $d$ features of a single token vector - never across the batch. There are no running averages, which is why batch-1 inference is exact and batch-order-independent."
    check: choice
    difficulty: core

  - id: u4-q10
    concept: c-layernorm
    kind: mcq
    congruent: false
    callback_eligible: false
    check: choice
    prompt: |
      A checkpoint's key list contains, per block, `attn.norm.weight` and
      `mlp.norm.weight`, plus exactly one extra tensor `model.norm.weight` of
      shape $[d]$ applied after the last block and before the unembedding.
      There are no `.bias` tensors on any norm and no running statistics.
      What can you conclude?
    options:
      - text: |
          Pre-LN with RMSNorm. The trailing `model.norm` is required
          precisely because the residual stream is never normalized on the
          main path, and the absent bias tensors indicate RMSNorm rather than
          LayerNorm.
        correct: true
        explain: |
          Correct on both counts. Pre-LN puts the norm on the branch
          ($x_l = x_{l-1} + \mathrm{Sublayer}(\mathrm{Norm}(x_{l-1}))$), so
          something must normalize the stream before the unembedding sees it.
          RMSNorm has a gain and no bias; LayerNorm has both.
      - text: |
          Post-LN with RMSNorm. The per-block norms sit after each residual
          addition, and `model.norm` is a final cleanup before the output
          head.
        misconception: U4M4
        explain: |
          The sibling confusion this item exists to catch. A post-LN model's
          last operation already was a normalization of the stream, so a
          trailing norm would be redundant - and post-LN checkpoints do not
          ship one. The dangling final norm is the tell for pre-LN.
      - text: |
          Cannot be determined from the key list. Pre-LN and post-LN use
          identical tensors and differ only in the order operations are
          called in the forward function.
        misconception: U4M4
        explain: |
          Tempting because both do have two norms per block. But the tensor
          inventories are not identical: the trailing stream norm exists in
          one arrangement and not the other, and that difference is
          structural, not a matter of call order.
      - text: |
          The absence of running statistics means normalization is disabled
          at inference, so this checkpoint normalizes during training only.
        misconception: U4M7
        explain: |
          This imports BatchNorm's train/inference asymmetry. LayerNorm and
          RMSNorm compute statistics across the $d$ features of a single
          token vector at every forward pass, so there are no running
          statistics to store and no train/inference difference at all.
      - text: |
          The missing bias tensors mean the norms are frozen at
          initialization; only the gains were trained.
        misconception: U4M7
        explain: |
          Conflates "has no bias parameter" with "was not trained". RMSNorm
          has one learned parameter per feature - the gain - by design, and
          it is trained. There is no bias to freeze.
    difficulty: core

  - id: u4-q11
    concept: c-depth
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      In-context pattern completion - given `[A][B] ... [A]`, predict `[B]` for
      a token pair never seen in training - appears at two attention layers and
      is unreachable at one, at any width. Which statement gives the reason?
    options:
      - text: "Layer 1's previous-token head writes \"my predecessor was $x_{i-1}$\" additively into a subspace of position $i$'s stream, and layer 2's induction head forms its KEYS by reading that subspace; a one-layer model's keys can only be functions of the raw embeddings, so no width supplies the missing stage."
        correct: true
        explain: "This is the composition claim: layer 2's keys are a function of what layer 1 wrote (K-composition), communicated through the residual stream as a shared bus rather than a hand-off. A one-layer attention-only model is limited to bigrams and skip-trigrams; more width buys more skip-trigrams, never a second stage."
      - text: "The second layer receives a cleaner, sharper version of the first layer's representation and so resolves the pattern the first layer could only approximate; a wide enough one-layer model gets close but stays noisier."
        misconception: U4M6
        explain: "The refinement picture, and it predicts that width trades off against depth. It cannot: the boundary here is sharp, not a matter of quality, because the required key is a function of another layer's output."
      - text: "Two layers hold twice the attention parameters, so the extra capacity stores the $[A] \\to [B]$ associations that a one-layer model has no room for."
        misconception: M4
        explain: "Two errors at once: the pair is novel, so no stored association could cover it, and parameter count is not what is missing - the missing thing is a stage of dependency."
      - text: "With two layers there are twice as many heads, so one head can specialize in predecessors while another specializes in copying; a one-layer model must force both linguistic jobs through a single head."
        misconception: U4M1
        explain: "Head specialization is an emergent consequence of restricted read/write channels, not the mechanism, and head count is free within a layer - a one-layer model can have as many heads as you like and still cannot form the induction key."
      - text: "Layer 1 hands its output vectors directly to layer 2 as a pipeline stage, and it is that sequential hand-off, absent in a single layer, that carries the earlier `[A]` forward to the final position."
        misconception: M8
        explain: "The pipeline reading of the stack. Blocks write additive updates into a persistent shared stream that any later block can read - which is why middle blocks drop gracefully - so 'hand-off' names the wrong object even though two layers are indeed needed."
    check: choice
    difficulty: core

  - id: u4-q12
    concept: c-residual
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      A 40-block pre-LN model, $d = 5120$, $h = 40$, $d_k = 128$,
      $d_{ff} = 13824$ (SwiGLU), MHA, fp16. Serving is decode-latency-bound at
      8k context with many concurrent sessions, and you may retrain. Which pair
      of changes is highest-leverage, for the right reason?
    options:
      - text: "GQA at $g = 8$ - attention drops from $4d^2 = 104{,}857{,}600$ to $2d^2 + 2d^2(8/40) = 62{,}914{,}560$ per block and the cache from 20 KiB to 4 KiB per token per layer, cutting bytes streamed from HBM per generated token 5x - together with pruning middle blocks (say 12-27) plus a short fine-tune, which cuts FLOPs, weight memory and cache with layer count."
        correct: true
        explain: "Both are right and the attribution is right: decode is bandwidth-bound, so GQA's win is bytes moved, not arithmetic, and pruning is safe in the middle because the stream is a sum of $2L$ additive updates whose middle terms are the most redundant. Leave the first two and last two blocks alone."
      - text: "GQA at $g = 8$ - it cuts the attention score computation by $h/g = 5$, so both prefill and decode run about 5x faster on the attention kernels - together with pruning middle blocks 12-27 plus a short fine-tune."
        misconception: U4M3
        explain: "The recommendation is right and the reason is wrong, which is worse than it looks: score computation is $h \\cdot n \\cdot d_k$ MACs per new token under MHA, GQA and MQA alike, because shared keys are broadcast to the query heads sharing them, not skipped. Prefill is compute-bound and essentially unaffected."
      - text: "MQA at $g = 1$ for the largest possible cache cut, together with pruning the first two and last two blocks, which are cheapest to remove because the middle of the stack carries the model's abstract features."
        misconception: M8
        explain: "Pruning the ends is the damaging choice: early blocks write the features every later read projection expects and late blocks rotate the stream into the unembedding's directions, while the middle is what ablates gracefully. $g = 1$ also measurably degrades quality, where $g = 8$ does not."
      - text: "Cut the query heads from $h = 40$ to $h = 8$ while keeping 40 key/value heads, so each query head attends over fewer positions and the KV cache shrinks with it - together with a short fine-tune."
        misconception: U4M2
        explain: "This reduces the wrong heads. In MHA, MQA and GQA the query-head count is unchanged and every query head still attends over every allowed position; only $W^K$ and $W^V$ shrink, to $d \\times (g \\cdot d_k)$. Cutting query heads leaves the cache at 20 KiB per token per layer."
      - text: "Halve $d_{ff}$ from 13824 to 6912 and raise $h$ from 40 to 80 - the MLP is peripheral plumbing between attention layers, so most of the block's weight can be reclaimed there at little cost, and more heads add attention capacity to compensate."
        misconception: U4M5
        explain: "The MLP is $3 d\\, d_{ff} = 212{,}336{,}640$ parameters against attention's $104{,}857{,}600$ here - the majority of the block, not plumbing - so halving it is the largest quality cut on offer. Raising $h$ adds no parameters at all: $W^Q, W^K, W^V, W^O$ stay $d \\times d$ and are only sliced differently. Neither move touches the KV cache that is setting decode latency."
    check: choice
    difficulty: stretch

  - id: u4-q13
    concept: c-mha
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A GQA model has $d = 6144$, $h = 48$ query heads, $d_k = 128$, and
      $g = 6$ key/value heads. Counting $W^Q, W^K, W^V, W^O$ with no biases,
      how many parameters are in the attention sublayer?
      Answer with the integer only.
    answer: 84934656
    check: numeric(1)
    rubric: |
      $W^Q = d^2 = 37{,}748{,}736$; $W^K = W^V = d \times g d_k =
      6144 \times 768 = 4{,}718{,}592$ each; $W^O = d^2 = 37{,}748{,}736$.
      Total $= 84{,}934{,}656$, which is $2d^2 + 2d^2(g/h) = 2.25 d^2$, or
      56.25% of MHA's $4d^2 = 150{,}994{,}944$.
      Diagnostic wrong answers: 150,994,944 means $g$ was ignored and MHA was
      counted (U4M2); 18,874,368 means $W^Q$ and $W^O$ were shrunk by $g/h$
      as well, which is the same error in the other direction - the query and
      output projections never shrink; 75,497,472 means $W^K$ and $W^V$ were
      dropped entirely rather than shrunk; 9,437,184 means only K and V were
      counted.
    difficulty: core

  - id: u4-q14
    concept: c-mha
    kind: mcq
    congruent: false
    callback_eligible: false
    check: choice
    prompt: |
      Parameter count is $4d^2$ regardless of $h$. So why does pushing $h$
      very high at fixed $d$ - say $h = 256$ with $d = 4096$, giving
      $d_k = 16$ - degrade quality rather than improving it?
    options:
      - text: |
          Each head's score-forming map $W^Q_i W^{K\top}_i$ and its output
          map $W^V_i W^O_i$ have rank at most $d_k$. At $d_k = 16$ every head
          can only read from and write to a 16-dimensional subspace of a
          4096-dimensional stream, which is too restrictive to express a
          useful attention pattern or a useful update.
        correct: true
        explain: |
          Correct. The trade heads make is pattern count against per-pattern
          rank. Count wins down to roughly $d_k = 64$; below that the
          rank constraint bites and each head stops being able to express
          anything worth expressing.
      - text: |
          At $h = 256$ the parameters are spread across 256 heads, so each
          head has 16x fewer parameters to learn with than at $h = 16$.
        misconception: U4M1
        explain: |
          The replication intuition wearing a different hat. Parameters are
          not "spread": the four matrices are the same size and every entry
          is still learned. What changes is the rank of the per-head
          products, not how much parameter mass exists.
      - text: |
          More heads means more attention score matrices to compute, so the
          quadratic cost in sequence length grows by a factor of 16 and the
          model must be trained on shorter contexts.
        misconception: M10
        explain: |
          The total score computation is $h \cdot n^2 \cdot d_k = n^2 d$,
          which is independent of $h$ - narrower heads exactly offset more of
          them. Cost does not change, and in any case a cost argument would
          not explain a quality drop at fixed training budget.
      - text: |
          The $\sqrt{d_k}$ scaling becomes too small at $d_k = 16$, so
          pre-softmax scores blow up and the softmax saturates.
        misconception: M7
        explain: |
          Backwards: $\sqrt{d_k}$ is the correct normalizer for a dot product
          over $d_k$ dimensions, so the score variance stays around 1 at any
          $d_k$ - that is what the scaling is for. Reaching for a numerical
          explanation where the real one is structural is the same reflex
          that produces M7.
    difficulty: stretch
