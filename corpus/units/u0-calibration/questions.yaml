  concept: c-notation
  kind: mcq
  congruent: true
  callback_eligible: true
  prompt: |
    $Y = XW$, with $X$ of shape $(n, d)$ and $W$ of shape $(d, m)$. You are
    handed $G = \partial L / \partial Y$, of shape $(n, m)$. Which expression
    for $\partial L / \partial W$, with which shape, is correct?
  options:
    - text: "$X^T G$, of shape $(d, m)$"
      correct: true
      explain: "Right. $X^T$ is $(d, n)$ and $G$ is $(n, m)$, so the $n$ axis contracts and the result is $(d, m)$ - the shape of $W$ itself, one number per weight."
    - text: "$X G$, of shape $(d, m)$"
      misconception: U0-M4
      explain: "The shape is right and the expression cannot produce it: $X$ is $(n,d)$ and $G$ is $(n,m)$, so the inner dimensions $d$ and $n$ do not meet. The transpose here is load-bearing, not tidying done after the fact."
    - text: "$G X^T$, of shape $(n, d)$"
      misconception: U0-M4
      explain: "Operand order is not free. This is the shape of $\\partial L / \\partial X$, the other gradient of the same layer; the gradient with respect to $W$ must come out shaped like $W$."
    - text: "A single scalar, the slope of $L$ along the direction training is moving"
      misconception: U0-M3
      explain: "That is the one-variable derivative carried one domain over. If it were a scalar, $W \\leftarrow W - \\eta \\, \\partial L / \\partial W$ would shift every weight by the same amount forever. The gradient is shaped like $W$: entry $(i,j)$ is the sensitivity of $L$ to $W_{ij}$ alone."
    - text: "$G$ itself, of shape $(n, m)$ - the gradient passes through the layer unchanged"
      misconception: U0-M3
      explain: "Appealing because $G$ is the only gradient in hand, but $(n, m)$ is the shape of the layer's output, not of its weights. There is no entrywise update this could define, since $W$ has $d \\times m$ entries."
  check: choice
  difficulty: stretch
  band: 5
