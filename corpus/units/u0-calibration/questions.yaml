      k \rVert$ times the cosine of the angle, so length is the deciding factor.
    misconception: U0-M2
    explain: 'The arithmetic here is right - $k_2$ does score higher, and with $q$ fixed,
      ranking by $\lVert k \rVert \cos\theta$ agrees with the dot product''s ranking - but
      the formula omits $\lVert q \rVert$, and the reading is wrong on both sides. The score
      is $\lVert q \rVert \lVert k \rVert \cos\theta$, scaled by BOTH magnitudes, not the
      key''s alone. And length is not the deciding factor in general: a long vector at 90
      degrees still scores zero. Magnitude and alignment both matter, multiplicatively.'
