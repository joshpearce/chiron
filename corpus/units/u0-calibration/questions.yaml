    - text: "The value of $f(x)$ you should expect to see - the typical or most likely outcome when $x$ is drawn from $\\mathcal{D}$; training reads it off the most common example."
      misconception: U0-M7
      explain: "'Expected' in English does mean 'what you would predict', and on symmetric distributions the mean is near the typical value. But $\\mathbb{E}$ is the probability-weighted mean, not the mode: the expected roll of a fair die is 3.5, a value the die cannot produce."
    - text: "The largest value $f$ can take over the support of $\\mathcal{D}$; training computes it as the worst-case loss in the batch."
      misconception: U0-M7
      explain: "This confuses a weighted average with an extremum. A maximum ignores probability entirely, and optimizing it would be a different objective (worst case) from the one the notation states."
