  - text: They are different objects - $AB$ is $2 \times 2$ and $BA$ is $3 \times 3$ - because
      each is a different composition of the two maps.
    correct: true
    explain: Correct. Matrix multiply composes functions, and the order of composition determines
      both the shape and the function. $AB$ means 'apply $A$'s map, then $B$'s'; $BA$ is
      the other order, a different function on a different space.
  - text: They are equal, because matrix multiplication is built out of multiplying and
