  check: choice
  options:
  - text: $k_2$, by a factor of 10, even though the two keys point in identical directions
      - the dot product scales with magnitude as well as alignment.
    correct: true
    explain: Correct. $q \cdot k_1 = 1.8$ and $q \cdot k_2 = 18$. Same direction, same angle,
      ten times the score. This is exactly why unnormalized attention scores can be dominated
      by a single large-magnitude key.
  - text: Neither - the scores are equal, since the two keys have the same direction and
      the dot product measures direction agreement.
    misconception: U0-M2
    explain: Attractive because on unit-length vectors - which is all your embedding database
      ever stores - the dot product and cosine similarity are the same number. They are
      not the same function. Cosine divides out both magnitudes; the dot product does not,
      and nothing inside a transformer normalizes before the score is taken.
  - text: $k_1$, because it is much closer to $q$ in the plane, and closeness is what a
      similarity score rewards.
    misconception: U0-M6
    explain: 'Attractive because ''similar'' and ''nearby'' are the same word in everyday
      use. Check it: $\lVert q - k_1 \rVert \approx 2.53$ while $\lVert q - k_2 \rVert \approx
