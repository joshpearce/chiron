  check: choice
  options:
    - text: "The average of $f$ over all possible inputs, weighted by their probability under $\\mathcal{D}$; since $\\mathcal{D}$ cannot be enumerated, training estimates it by the mean of $f(x_i)$ over a batch."
      correct: true
      explain: "Right. The objective is defined over a distribution nobody can write down; the batch mean is an unbiased but noisy estimate of it, which is why gradient noise falls as $1/\\sqrt{b}$."
    - text: "The average of $f(x_i)$ over the training set - the distribution notation is formality for the mean of the data you have."
      misconception: U0-M5
