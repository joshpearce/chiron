# u1 core-bet: pretest + terminal check bank.
# Solo fade items: u1-q3 (bpe-tokenize), u1-q8 (embedding-param-count),
# u1-q9 (hidden-to-logits). Each is the third appearance of a procedure that
# was worked in canon prose and drilled as a completion beat.

pretest:
  - id: u1-p1
    concept: c-lm-objective
    kind: mcq
    prompt: |
      A language model is trained until it is as good as any model can possibly
      be at predicting the next token in natural English text. Which statement
      about its training loss $\mathcal{L}$ is correct?
    options:
      - text: |
          $\mathcal{L}$ stays well above zero: it is floored by the entropy of
          the text itself - Chinchilla's fitted irreducible term is about 1.7
          nats per token - because after "The cat sat on the ____" several
          continuations are genuinely possible.
        correct: true
        explain: |
          A perfect model reproduces the true conditional distribution, which
          still assigns less than probability 1 to whichever token the writer
          happened to choose, so $-\log P_\theta(x_t \mid x_{<t})$ of the
          observed token stays positive no matter how good the model is.
      - text: |
          $\mathcal{L} = 0$: a perfect predictor assigns probability 1 to the
          token that actually occurred, and $\log 1 = 0$.
        misconception: M18
        explain: |
          Appealing because every test suite goes green at zero. It predicts a
          model that puts probability 1 on a single continuation, which would
          mean language is deterministic. Near-zero loss on real text is the
          signature of memorization, not of perfection.
      - text: |
          $\mathcal{L}$ is as close to zero as the corpus allows; whatever
          residue remains is noise and typos in the training data, and cleaner
          data would remove it.
        misconception: M18
        explain: |
          Right that the number is nonzero, wrong about its source. The floor
          survives on perfectly clean text: it is the irreducible entropy of
          language, not corruption in the sample.
      - text: |
          $\mathcal{L}$ equals the global minimum of the loss surface - the
          value any sufficiently trained model converges to.
        misconception: M5
        explain: |
          Two runs from different seeds reach comparable loss with entirely
          different weights, so there is no single minimum for the answer to
          name. SGD lands in one of astronomically many good-enough regions, and
          the floor being discussed is a property of the text, not of the search.
    check: choice

  - id: u1-p2
    concept: c-tokens
    kind: mcq
    prompt: |
      An LLM is asked how many times the letter `r` appears in `strawberry`
      (written with no leading space). Which option correctly states what the
      model receives as input for that word, and what it would take to answer
      correctly?
    options:
      - text: |
          Three integers - the IDs for `str`, `aw`, `berry`. No character
          appears anywhere in the input, so a correct count must come from a
          learned association between those IDs and spelling, or from re-emitting
          the word one character per token and counting those.
        correct: true
        explain: |
          Tokenization happens before the model sees anything. The letters are
          not in the input at all, which is why spelling ability is indirect and
          why chain-of-thought that spells the word out helps.
      - text: |
          The characters s-t-r-a-w-b-e-r-r-y, one per position; the letters are
          all present and the model simply miscounts, because counting is a weak
          skill for it.
        misconception: U1-M1
        explain: |
          Attractive because tokenizer output looks like ordinary text on the
          page. It predicts uniform character-level behavior, but accuracy
          depends on how the particular string happens to chunk - ` strawberry`
          is one token, `strawberry` is three.
      - text: |
          The whole word as one unit, with attention heads deciding which of its
          letters to look at; the failure happens when they select the wrong ones.
        misconception: M1
        explain: |
          Two errors compounded: there are no letters in the input to select
          among, and attention does not select - it computes a similarity-weighted
          average of value vectors.
      - text: |
          The token `strawberry` if it is in the vocabulary, and an `<UNK>` token
          otherwise; letter questions fail on words outside the vocabulary.
        misconception: U1-M3
        explain: |
          This was true of word-level models before subword tokenization. BPE has
          no unknown token: merges compose down to bytes, so every string is
          representable and rare ones merely cost more tokens.
      - text: |
          A pretrained semantic vector for `strawberry` whose dimensions encode
          its properties, spelling included.
        misconception: M3
        explain: |
          An embedding is a learned position whose only content is relational
          geometry, and it is looked up per token ID - not a struct of fields,
          and not a place where letters live.
    check: choice

  - id: u1-p3
    concept: c-embeddings
    kind: mcq
    prompt: |
      Two 7B models are trained on identical data with identical code and
      hyperparameters, differing only in the random seed used for weight
      initialization. Both reach the same final loss. Which option gives the
      cosine similarity you should expect between their embedding vectors for
      the token `dog`, with the right reason?
    options:
      - text: |
          Near 0. There is no privileged basis - permute the $d_{model}$
          coordinates consistently and the model computes an identical function -
          so the two runs land in different members of an enormous equivalence
          class. What does correspond across runs is relational: $\cos$ between
          `dog` and `cat` within each model.
        correct: true
        explain: |
          The absolute vectors are arbitrary coordinates; only the geometry that
          downstream layers read is shared, and that is a statement about
          distances and directions, not about any particular vector.
      - text: |
          Near 1, because both models learned what `dog` means, and the meaning
          of `dog` is the same in both.
        misconception: M3
        explain: |
          This is the storage model of embeddings. It predicts that a row could
          be transplanted between models and still mean `dog`; in fact the
          transplant produces noise, and the same row must serve both senses of
          `bank`.
      - text: |
          Near 1, because identical data and hyperparameters mean both runs
          descend to the same minimum of the loss surface, up to small numerical
          noise.
        misconception: M5
        explain: |
          Equal loss is not equal weights. In high dimensions there are
          astronomically many good-enough low-loss regions, and two seeds reach
          different ones - which is why the weights differ while the loss agrees.
      - text: |
          Near 1, because the embedding table holds pretrained word vectors
          loaded in as fixed input, and those do not depend on the training seed.
        misconception: U1-M4
        explain: |
          That was the 2013-2018 architecture. The embedding matrix here is a
          parameter, randomly initialized and updated by the same backward pass
          as every other weight, so the seed determines where its rows start.
    check: choice

check:
  - id: u1-q1
    concept: c-lm-objective
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A 4,000-token document is used as one training example. Let $T$ be the
      document length in tokens, $x_t$ the token that actually occurred at
      position $t$, $x_{<t}$ the prefix $x_1, \ldots, x_{t-1}$, and $\theta$ the
      model's parameters. Which pairing of prediction-problem count and loss
      expression is correct?
    options:
      - text: |
          4,000 problems, one per position, all produced in a single forward
          pass:
          $\mathcal{L}(\theta) = -\frac{1}{T}\sum_{t=1}^{T} \log P_\theta(x_t \mid x_{<t})$
        correct: true
        explain: |
          The sum runs over every position $t$, so one document of length $T$ is
          $T$ prediction problems, each conditioned on its own prefix, and all of
          them computed together in one pass.
      - text: |
          1 problem - read the document, then predict its final token:
          $\mathcal{L}(\theta) = -\log P_\theta(x_T \mid x_{<T})$
        misconception: M9
        explain: |
          This reads training as an RNN-style walk that ends in one guess. Under
          it, a 4,000-token document would supply a single training signal;
          in fact every position is scored, which is why one document teaches
          4,000 conditionals at once.
      - text: |
          4,000 problems, with a correctness term so the objective rewards true
          continuations:
          $\mathcal{L}(\theta) = -\frac{1}{T}\sum_{t=1}^{T}\big[\log P_\theta(x_t \mid x_{<t}) + \lambda\, r(x_t)\big]$,
          where $r$ scores whether the token is correct.
        misconception: M2
        explain: |
          Appealing because the model's outputs get called probabilities and
          graded as right or wrong. Nothing in $\mathcal{L}$ mentions truth: the
          only quantity optimized is agreement with the empirical distribution of
          the training text.
      - text: |
          4,000 problems and the standard average of
          $-\log P_\theta(x_t \mid x_{<t})$, but because the per-position terms
          are independent, the gradient reaching position $t$ cannot depend on
          anything after $t$.
        misconception: U1-M2
        explain: |
          The terms are additive; the computations producing them share
          parameters. Gradient from the term at $t+40$ flows back into whatever
          produced the hidden state at $t$, so the objective decomposes per
          position while credit assignment does not.
    check: choice
    difficulty: core

  - id: u1-q2
    concept: c-lm-objective
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A colleague argues: "Compression proves LLMs understand the world. Loss
      equals bits per token, you can only spend few bits by exploiting real
      structure, therefore GPT-4 has a world model. It's a theorem." The
      premises are correct and the conclusion does not follow. Which option
      names the gap and supplies evidence that it is real rather than
      hypothetical?
    options:
      - text: |
          The coding theorem constrains the limit - a predictor at the entropy
          floor must have captured the generating structure - and says nothing
          about a specific architecture at its achieved loss, where a pile of
          shallow heuristics can lower $\mathcal{L}$ a great deal while
          implementing no mechanism. Evidence: arithmetic accurate on common
          operand magnitudes and degrading on rare ones, and reasoning that
          survives the textbook phrasing but fails when the variables are renamed.
        correct: true
        explain: |
          Correct on both halves: the theorem is a statement about codes at the
          floor, and frequency- or surface-dependent failure is exactly what a
          heuristic standing in for a mechanism looks like from outside.
      - text: |
          There is no gap worth pressing: GPT-4's loss is already near zero, so
          it is essentially the perfect predictor the theorem describes, and the
          world model follows.
        misconception: M18
        explain: |
          Loss is nowhere near zero and could not be - cross-entropy has an
          irreducible floor at the entropy of language. Treating zero as the
          reference point makes any achieved loss look like the limit case.
      - text: |
          The gap is that the model only stores continuations it has seen, so it
          compresses by keeping the corpus rather than by modeling anything; no
          amount of loss reduction changes that.
        misconception: M4
        explain: |
          This is the lookup-table model, and it fails on its own terms: a store
          cannot answer about operand pairs it never held, yet models answer
          novel ones - and hallucinate. It also concedes nothing to why
          compression pressures toward mechanism at all.
      - text: |
          The gap is optimization: the model sits above the entropy floor only
          because gradient descent fails to reach the true minimum, and with a
          better optimizer the conclusion would go through.
        misconception: M5
        explain: |
          Attractive because it keeps the theorem's force intact and blames the
          search. But different seeds reach comparable loss by different routes,
          and no optimizer can drive loss below the entropy of the text, so
          "reach the minimum" is not the missing step.
    check: choice
    difficulty: stretch

  - id: u1-q3
    concept: c-tokens
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A BPE tokenizer learned exactly these five merges, in this order:

        1. e + s   -> es
        2. es + t  -> est
        3. est + _ -> est_
        4. l + o   -> lo
        5. lo + w  -> low

      Tokenize the word `widest`. Apply the merges in order to the character
      sequence `w i d e s t _`.

      Answer with the final token sequence, pipe-separated, no spaces.
      Example format: `ab|cd|e`
    answer: "w|i|d|est_"
    check: exact
    difficulty: core

  - id: u1-q4
    concept: c-tokens
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      With GPT-4's tokenizer, `2847 + 1913` becomes six tokens:
      `284`, `7`, ` +`, ` `, `191`, `3`. Which option states why this
      tokenization makes addition structurally difficult, together with the
      right prediction about how the difficulty varies with the number of digits
      in the two operands?
    options:
      - text: |
          Addition needs operands aligned by place value and carried right to
          left, but digits are chunked into runs of up to three counted from the
          left, so where the boundaries fall relative to the units digit depends
          on digit count mod 3. Prediction: errors are lowest when both operands
          have the same length mod 3, higher when they differ, and a tokenizer
          that gives each digit its own token does markedly better.
        correct: true
        explain: |
          The units column sits at no fixed position within a token, so the model
          must learn a separate re-alignment for each combination of length
          residues - a difficulty that is a property of the chunking, not of
          arithmetic.
      - text: |
          The model is a language model, not a calculator; tokenization is a
          cosmetic preprocessing step, so the difficulty would be the same however
          the digits were chunked, and it varies only with how large the numbers are.
        misconception: U1-M1
        explain: |
          This predicts uniform digit-level behavior across tokenizers. Models
          that tokenize digits individually are measurably better at arithmetic on
          the same operands, which is exactly the comparison the claim rules out.
      - text: |
          Because the digits arrive as several tokens, the model must process
          them one position at a time, left to right, so long operands run out of
          sequential steps; difficulty rises with total token count.
        misconception: M9
        explain: |
          Within a forward pass all positions are computed simultaneously; order
          lives in positional information and the causal mask. There is no
          step budget being exhausted - the problem is where the boundaries fall.
      - text: |
          The sum is not stored anywhere to be retrieved: addition works exactly
          when the operand pair appeared in training and fails otherwise, so
          difficulty tracks how often the pair occurs and no chunking change helps.
        misconception: M4
        explain: |
          The lookup framing has no referent here - 96% of the parameters are a
          function with no rows. It also cannot explain why a digit-level
          tokenizer improves accuracy on pairs neither model ever saw.
      - text: |
          Attention decides which digits to look at, and for long operands it
          picks the wrong ones; difficulty rises with how many digits compete for
          the model's attention.
        misconception: M1
        explain: |
          Attention does not decide - it is a similarity-weighted average of value
          vectors. And the digits it would need are not separable in the input to
          begin with: `284` is one symbol.
    check: choice
    difficulty: core

  - id: u1-q5
    concept: c-tokens
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A model's tokenizer has a vocabulary of 32,000 entries. Which statement is
      correct?
    check: choice
    options:
      - text: "The model can represent any string, including words that appear nowhere in the vocabulary, by composing subword pieces down to individual bytes."
        correct: true
        explain: "Correct. BPE vocabularies retain the base units (bytes or characters) as fallbacks, and merges only add longer pieces on top. Nothing is unrepresentable; rare strings just cost more tokens. This is the property that eliminated the unknown-token problem that plagued word-level models."
      - text: "The model has a working vocabulary of 32,000 words and cannot produce anything outside it."
        misconception: U1-M3
        explain: "Attractive because 'vocabulary' means exactly this for a person, and because word-level NLP models really did have this limitation. But V is a budget for subword pieces, not a cap on expressible words. Vocabulary size trades embedding and output-layer cost against tokens-per-character; it bounds nothing about what can be said."
      - text: "Tokens correspond to words, so this model knows 32,000 words - roughly the vocabulary of an educated adult."
        misconception: U1-M1
        explain: "The coincidence in magnitude makes this feel right. It is wrong twice: tokens are not words (many are fragments, many include leading spaces, many are punctuation or code artifacts), and a token being present says nothing about the model 'knowing' the word - the embedding for a rare token may be near its random initialization."
      - text: "Vocabulary size determines how many distinct facts the model can store, since each token is one entry in the model's knowledge table."
        misconception: M4
        explain: "This is the lookup-table model of parameters applied to the embedding matrix. The embedding table has exactly one row per token and those rows contain positions, not facts. Whatever knowledge the model has lives in the 96%+ of parameters that are transformations with no rows to index."
    difficulty: warmup

  - id: u1-q6
    concept: c-embeddings
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Four experiments on a trained model, each reported with the result it
      actually produces. Which one falsifies the claim "the embedding vector for
      a token contains that token's meaning", while leaving intact the weaker
      claim that the embedding space carries real relational geometry?
    check: choice
    options:
      - text: |
          Pick a permutation of the $d_{model}$ coordinates. Apply it to the
          columns of $E$, to the input side of every matrix that reads the
          residual stream, to the output side of every matrix that writes into
          it, and to every normalization gain and bias. Result: the logits are
          identical on every input.
        correct: true
        explain: |
          $d_{model}!$ parameter settings implement exactly the same function, so
          no coordinate can carry a fixed semantic field - "dimension 412 is
          formality" is a fact about one arbitrary labeling, not about the model.
          It falsifies intrinsic per-vector content without denying structure:
          the permutation preserves every distance and every direction, so the
          relational geometry the rest of the model reads is untouched.
      - text: |
          Search the coordinates of $E$ for an interpretable axis, and find that
          no single dimension correlates with formality, animacy or any other
          semantic field above chance. Result: no interpretable axis exists.
        misconception: M3
        explain: |
          Attractive because it looks like the direct test of "meaning is stored
          in the vector". It settles nothing: a null result on axis alignment is
          compatible with meaning being distributed across dimensions, and a
          positive result would only be a fact about one run's arbitrary basis.
          Probing coordinates instead of testing the invariance of the function
          is exactly the M3 move.
      - text: |
          Freeze $E$ at its random initialization and train everything else.
          Result: final loss is measurably worse than when $E$ is trained.
        misconception: U1-M4
        explain: |
          The result is real - the embedding matrix is a parameter and training
          it helps - but it argues in the opposite direction. It shows the rows
          are learned end to end rather than supplied by a separate earlier
          semantic process, which corrects U1-M4; it says nothing against "the
          vector contains meaning".
      - text: |
          Zero the embedding rows for 500 rare tokens. Result: the model can no
          longer state facts about the entities those tokens name.
        misconception: M4
        explain: |
          This is what the claim under test predicts, so it confirms rather than
          falsifies - and it reads the model as a table whose rows can be
          deleted. Destroying a token's input representation stops that token
          from being processed at all; it locates no fact, since facts live
          distributed across the 96% of parameters that have no rows.
    difficulty: stretch

  - id: u1-q7
    concept: c-embeddings
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      You measure a trained model's embedding matrix and find that coordinate
      412 correlates strongly with word formality across 500 sampled tokens.
      What does this establish?
    check: choice
    options:
      - text: "That in this particular training run, a formality-related direction happens to have substantial overlap with coordinate 412. Retraining with a different seed would place it elsewhere."
        correct: true
        explain: "Correct. Coordinate 412 is a label from one arbitrary member of a huge equivalence class of parameter settings (permute all coordinates consistently and the model is bit-identical). The correlation is real for this checkpoint and carries no information about embeddings in general. Interpretability work reports directions, not coordinates, for exactly this reason."
      - text: "That embeddings store semantic features in their dimensions, and dimension 412 is the formality field."
        misconception: M3
        explain: "This is the intuition the finding seems to confirm, which is what makes it dangerous. It fails the permutation test: relabel the coordinates consistently across E and every consumer and the model computes the identical function while your formality field moves to a different index. A field that can be arbitrarily renumbered without consequence is not a field."
      - text: "That the embeddings were initialized from pretrained word vectors in which that dimension encoded formality."
        misconception: U1-M4
        explain: "Plausible to anyone who remembers loading GloVe or word2vec vectors as a first layer. Modern LLM embedding matrices are randomly initialized and trained end to end by the same backward pass as every other parameter. There is no pretrained table being loaded and no inherited dimension semantics."
      - text: "That the embedding table is where the model's knowledge lives, and formality is one of its stored columns."
        misconception: M4
        explain: "The lookup-table model of parameters, applied to the one component that really is a table. The embedding matrix is 2-4% of a large model's parameters and contains starting positions, not knowledge. The remaining 96% has no rows and no columns to store a feature in."
    difficulty: core

  - id: u1-q8
    concept: c-embeddings
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Llama-3-8B has a vocabulary of 128,256 tokens and $d_{model} = 4096$.
      How many parameters are in its input embedding matrix?

      Answer with the exact integer, digits only, no separators.
    answer: "525336576"
    check: exact
    difficulty: core

  - id: u1-q9
    concept: c-logits
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A toy model has $d_{model} = 3$ and $V = 3$, with vocabulary
      [` yes`, ` no`, ` maybe`] at indices 0, 1, 2. Its unembedding matrix, one
      row per vocabulary entry, is

        W_U = [[ 2,  0, -1],
               [ 0,  1,  1],
               [-1, -1,  2]]

      The stack produces hidden state h = [1, 2, -1].

      Compute the logit vector. Answer as three comma-separated numbers, no
      spaces, in vocabulary order. Example format: `4,-2,0`
    answer: "3,1,-5"
    check: exact
    difficulty: core

  - id: u1-q10
    concept: c-logits
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      A teammate debugging a generation bug logs the raw logit of the sampled
      token and reports: "Token A had logit 18.4 and token B had logit 6.2, so
      the model was three times as confident in A."

      Which statement correctly names what is wrong and what should be logged
      instead?
    check: choice
    options:
      - text: |
          Absolute logits are not quantities - adding the same $c$ to every logit
          leaves the distribution unchanged - so a logged value means nothing on
          its own and nothing across forward passes; and within one distribution
          it is the gap that converts, $z_i - z_j = \log(P_i/P_j)$, so A is
          $e^{12.2} \approx 2\times10^5$ times as likely, not 3. Log the top-k
          probabilities after softmax, or logit gaps within one forward pass.
        correct: true
        explain: |
          Both halves are load-bearing. Shift invariance is why an absolute logit
          is like a voltage with no stated reference, and the log scale is why a
          ratio of logits is not a ratio of probabilities. The margin between the
          top two logits in a single pass is a real quantity; 18.4 by itself is
          not.
      - text: |
          The only error is that logits have not been normalized. Pass them
          through softmax and the resulting numbers are the probabilities that
          each token is the correct continuation, at which point the 3x
          comparison is well founded.
        misconception: M2
        explain: |
          Softmax outputs are a normalized exponential weighting of scores - a
          sampling distribution calibrated to training-data frequencies, not
          probabilities of being correct. And normalizing does not rescue the
          arithmetic: after softmax the ratio is $e^{12.2}$, nowhere near 3.
      - text: |
          The numbers are fine within one forward pass, but logits move with the
          sampling temperature, so the fix is to log them at $T=0$ where they
          reflect what the model really knows.
        misconception: M6
        explain: |
          Temperature rescales fixed logits on the way into softmax; the logits
          the forward pass produced are identical at every $T$, and $T=0$ is just
          argmax over the same distribution. This misdiagnoses a shift-invariance
          and log-scale error as a sampling-configuration error.
      - text: |
          The gap, not the ratio, is the right quantity, but absolute logits are
          calibrated on a fixed scale, so logging the top logit across different
          prompts is still a sound confidence signal.
        misconception: M2
        explain: |
          Gets the log-scale half right and then drops the half that produces
          real bugs. There is no fixed scale: any constant added to all $V$
          logits yields the same distribution, so "logit 18.4" is not comparable
          between prompts, and treating it as calibrated confidence is M2 in a
          new costume.
    difficulty: core

  - id: u1-q11
    concept: c-logits
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      For prompt A, the model's top token has logit 18.4. For prompt B, the top
      token has logit 6.2. What can you conclude?
    check: choice
    options:
      - text: "Nothing. Logits are defined only up to an additive constant, so absolute values are not comparable across forward passes; only gaps within one distribution carry information."
        correct: true
        explain: "Correct. softmax(z + c) = softmax(z) exactly, so a forward pass that produced [18.4, 17.0, ...] and one that produced [6.2, 4.8, ...] can encode identical distributions. The comparable quantity is the margin between top and runner-up within each pass."
      - text: "The model is much more confident on prompt A - 18.4 versus 6.2 is a large difference in probability."
        misconception: M2
        explain: "This treats the score as if it were already a probability, or at least a monotone stand-in for one on a shared scale. The scale is not shared. Even the phrase 'confident' overreaches: after softmax these are sampling weights calibrated to training-corpus frequencies, not estimates of being correct."
      - text: "Prompt A hits material the model knows well; running prompt B at a lower temperature would raise its logit."
        misconception: M6
        explain: "Attractive because temperature visibly changes output quality. But temperature is applied AFTER the logits are computed - it divides them before sampling. It cannot change a logit, because the logit is its input. Nothing downstream of the forward pass can alter what the forward pass produced."
      - text: "Prompt A's continuation was memorized from training data; prompt B's had to be generalized, which is why its score is lower."
        misconception: M4
        explain: "The retrieval framing: high score means a row was found, low score means it had to be reconstructed. There is no such distinction in the mechanism. The logit is a dot product between the hidden state and a token's direction, computed identically whether the continuation is verbatim from the corpus or has never existed."
    difficulty: warmup

  - id: u1-q12
    concept: c-lm-objective
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      The training loss
      $\mathcal{L}(\theta) = -\frac{1}{T}\sum_{t=1}^{T} \log P_\theta(x_t \mid x_{<t})$
      is a sum of independent per-position terms: each position is scored only
      on the token that immediately follows it.

      A colleague concludes the model must be myopic - it cannot set anything up
      in advance, because no term rewards a token for helping a token 40
      positions later. The premise is exactly right and the conclusion is wrong.
      Which option says why, and names a behavior that could not exist if the
      conclusion held?
    check: choice
    options:
      - text: |
          The terms are additive but the computations producing them share
          parameters, so the gradient of $\mathcal{L}$ is the sum of every
          position's gradient and the term at $t+40$ flows back into whatever
          produced the hidden state at $t$; encoding a plan early is therefore
          directly rewarded. Behavior: a correctly scanning rhymed couplet, where
          the word ending line 1 constrains what must be reachable at the end of
          line 2.
        correct: true
        explain: |
          The objective decomposes per position; credit assignment does not.
          Backpropagation routes gradient from the late term through the shared
          weights that produced the early state, so "set up now, pay off later"
          is a loss-reducing strategy the optimizer can find - and the couplet,
          the matched closing delimiter after deep nesting, and the punchline 60
          tokens out are what it looks like from outside.
      - text: |
          The conclusion stands: the model is myopic, and apparent long-range
          structure is the accumulation of locally likely tokens, each chosen
          without reference to anything further ahead.
        misconception: U1-M2
        explain: |
          Appealing because the inference from "objective is local" to "behavior
          is local" looks sound. It predicts long-range commitments happen only
          by coincidence, yet matched delimiters after deep nesting and scanning
          couplets appear at rates no coincidence explains. The premise is about
          the loss terms; the conclusion is about credit assignment, and those
          are different things.
      - text: |
          Self-attention lets each position read the whole sequence, so while
          producing the token at $t$ the model can already see the tokens at
          $t+40$ and write toward them.
        misconception: M9
        explain: |
          This substitutes a mechanism that does not exist. Order lives in
          positional information and the causal mask, and the mask makes position
          $t$ strictly unable to attend to anything after it - training would be
          trivially degenerate otherwise. The planning is encoded in the state at
          $t$, not read off a future the model has not produced.
      - text: |
          The objective is genuinely myopic, and the model works around it by
          retrieving whole memorized spans stored in its parameters, which is why
          couplets and matched delimiters come out intact.
        misconception: M4
        explain: |
          The lookup-table picture again. It predicts long-range structure only
          for spans that occurred in training, yet the behavior appears on novel
          content, novel identifiers and novel nesting depths. Parameters define
          a function over the token stream; there is no span to retrieve.
    difficulty: stretch
