# u10 - The iron: hardware and training at scale. Item bank.
# Concepts: c-memory-hierarchy, c-roofline, c-parallelism, c-precision-scale.
# Refutation targets: U10-M1..U10-M5 (unit-local), reinforcing M10 and M16.
# 14 check items: 9 constructed/congruent (64%), 5 mcq. 4 callback_eligible,
# 2 stretch. q1 is the fade-sequence solo item for `roofline`.

pretest:
  - id: u10-p1
    concept: c-roofline
    kind: mcq
    prompt: |
      Two accelerators are for sale at the same price. Card A does 320 TFLOP/s
      of bf16 with 1.6 TB/s of memory bandwidth. Card B does 160 TFLOP/s with
      2.4 TB/s.

      You will use it to serve one interactive user at a time from a dense 13B
      model in bf16 (2 bytes per parameter), one token position per forward
      pass. Which card generates tokens faster, and by what ratio?
    answer: "Card B, by 1.5x"
    check: choice
    options:
      - text: "Card B, by 1.5x"
        correct: true
        explain: >-
          Batch-1 decode reads all 13B weights from memory once per token, which
          is 26 GB, so the ceiling is bandwidth divided by bytes: 1.6/0.026 =
          61.5 tok/s for Card A and 2.4/0.026 = 92.3 tok/s for Card B. The ratio
          is exactly the bandwidth ratio, 2.4/1.6 = 1.5, because the FLOPs term
          never enters the cost model. Card A would be running its arithmetic
          units at about 0.5% of peak.
      - text: "Card A, by 2x"
        misconception: U10-M1
        explain: >-
          This reads the ratio straight off the FLOP/s column, which is the right
          column for training and for large-batch serving and the wrong one here.
          One position per pass means 26 GFLOP of work against 26 GB of weight
          traffic - an intensity of 1 FLOP/byte - so the arithmetic units starve
          whatever their rating says.
      - text: "Card A, by about 1.25x - its 2x arithmetic is partly offset by Card B's 1.5x bandwidth"
        misconception: U10-M1
        explain: >-
          Appealing because it looks like a balanced weighing of both spec-sheet
          numbers, but the roofline takes a min, not an average. Below the ridge
          point the attainable rate is intensity x bandwidth and the peak FLOP/s
          term contributes nothing at all, so there is no partial offset to
          compute.
      - text: "Neither can be ranked from these numbers - token rate is set by core count and clock, which are not given"
        misconception: U10-M2
        explain: >-
          Core count is a latency-hiding mechanism, not the throughput mechanism.
          A decode step at one position saturates no arithmetic unit on either
          card; both sit waiting on HBM, so bandwidth and bytes-per-token are
          sufficient to rank them, and they do so to two significant figures.
      - text: "Card A, because batch-1 decode is compute-bound - every token needs a full forward pass - while bandwidth binds only during training"
        misconception: U10-M3
        explain: >-
          The regimes are the other way round. Training pushes thousands of
          positions through the same weights per pass, so its intensity is in the
          thousands and it is compute-bound; single-user decode pushes one, so it
          is bandwidth-bound by a factor of hundreds. Batch size, not the identity
          of the operations, decides which side of the ridge you are on.

  - id: u10-p2
    concept: c-memory-hierarchy
    kind: mcq
    prompt: |
      A GPU kernel that applies a GELU activation elementwise to a large tensor
      runs at 100% occupancy across every streaming multiprocessor on an H100,
      and delivers under 2% of the chip's peak FLOP/s. A large 4096x4096 matrix
      multiply on the same chip, at the same occupancy, delivers 75%.

      Which statement identifies what is different about the two kernels?
    answer: "GELU moves roughly one byte per FLOP - about 0.5 FLOP/byte against a machine balance of 295 - so it runs on the bandwidth roof, while a square matmul's intensity is n/3 and crosses the balance"
    check: choice
    options:
      - text: "GELU moves roughly one byte per FLOP - about 0.5 FLOP/byte against a machine balance of 295 - so it runs on the bandwidth roof, while a square matmul's intensity is n/3 and crosses the balance"
        correct: true
        explain: >-
          GELU reads a value, does one or two operations, writes it back, and
          waits. The ratio has no free parameter in it, so no batch size, chip or
          compiler changes it. A matmul does 2n^3 FLOPs against 3n^2 elements, so
          its intensity grows linearly in n: it is the only primitive in the
          network that gets more efficient as it gets bigger.
      - text: "GELU issues to the general vector units rather than the tensor cores, and the roughly 15x gap between them is the whole difference"
        misconception: U10-M2
        explain: >-
          Attractive because the 15x arithmetic-density gap is real. But the
          measured gap is about 40x, and even scored against the CUDA cores' own
          67 TFLOP/s peak the GELU kernel is still far short, because it is
          waiting on HBM rather than on issue slots. Arithmetic density is a
          second-order advantage; bandwidth is the first-order one.
      - text: "The matmul performs far more total FLOPs, so a higher fraction of peak is expected - percentage of peak tracks the size of the job"
        misconception: M10
        explain: >-
          This conflates total work with rate. Percentage of peak is FLOP/s
          delivered against FLOP/s available, a ratio of rates, and it is
          perfectly possible for a huge kernel to deliver 2% and a small one to
          deliver 75%. What decides it is FLOPs per byte moved, not FLOPs.
      - text: "The H100's rating is simply optimistic for elementwise work; a card with more peak FLOP/s would raise both figures proportionally"
        misconception: U10-M1
        explain: >-
          Raising peak FLOP/s raises the compute roof and pushes the ridge point
          further out, which makes the machine harder to feed. The GELU kernel
          sits on the bandwidth roof, which did not move, so its delivered
          FLOP/s is unchanged and its percentage of peak gets worse.

  - id: u10-p3
    concept: c-precision-scale
    kind: mcq
    prompt: |
      fp16 and bf16 are both 16-bit floating-point formats. Training runs in
      fp16 historically required a "loss scaling" step - multiplying the loss by
      a large constant before the backward pass and dividing it out afterwards.
      Training runs in bf16 do not.

      Which statement gives both the reason bf16 needs no loss scaler and the
      reason mixed-precision training still keeps certain tensors in fp32?
    answer: "fp16's 5-bit exponent floors near 6e-8, so 1e-8 gradients round to exactly zero and loss scaling exists to lift them into range; bf16 carries fp32's 8-bit exponent and floors at 1.2e-38. Master weights and the Adam moments stay fp32 because they accumulate increments below bf16's 0.4% resolution"
    check: choice
    options:
      - text: "fp16's 5-bit exponent floors near 6e-8, so 1e-8 gradients round to exactly zero and loss scaling exists to lift them into range; bf16 carries fp32's 8-bit exponent and floors at 1.2e-38. Master weights and the Adam moments stay fp32 because they accumulate increments below bf16's 0.4% resolution"
        correct: true
        explain: >-
          Range is the scarce resource, not resolution. bf16 is fp32 with 16
          mantissa bits deleted, so nothing realistic underflows. The one place
          coarse resolution bites is accumulation: bf16's spacing just below 1.0
          is 0.0039, so an update of relative size 1e-4 rounds straight back to
          the original weight and vanishes - hence fp32 masters and moments, and
          hence 16 bytes per parameter.
      - text: "bf16 is the more accurate of the two 16-bit formats, so no gradient is lost; fp32 is kept for the forward activations, where accuracy matters most"
        misconception: U10-M4
        explain: >-
          fp16 actually has the finer resolution of the two - 0.05% against
          bf16's 0.4% - so "more accurate" is exactly backwards. And the forward
          pass is the part that tolerates 0.4% error happily, which is M16's
          point about 4-bit inference; it is accumulation, not the forward pass,
          that needs fp32.
      - text: "fp16 needed scaling because 16 bits carry half the information of 32; bf16 recovers it with a smarter encoding, and fp32 is kept for the loss value itself to prevent overflow"
        misconception: U10-M4
        explain: >-
          The bit-counting model cannot explain the observation in the prompt at
          all: fp16 and bf16 have the SAME bit count and behave completely
          differently. One number cannot account for a difference between two
          formats that share it. The variable is how the bits are split between
          exponent and mantissa.
      - text: "Each mantissa bit dropped deletes a proportional slice of every weight's information; fp32 master weights hold the bits bf16 threw away, and bf16 avoids loss scaling because its coarser storage never overflows"
        misconception: M16
        explain: >-
          This is lossy-compression intuition applied to a float format. Networks
          absorb proportional perturbation and are destroyed by values going
          missing, which is the opposite ordering. The failure loss scaling
          addresses is underflow to exactly zero, not overflow, and fp32 masters
          exist so small updates accumulate rather than to store deleted bits.

check:
  - id: u10-q1
    concept: c-roofline
    kind: constructed
    congruent: true
    callback_eligible: true
    difficulty: core
    prompt: |
      Run the roofline procedure on hardware you have not seen.

        Hardware:  peak 600 TFLOP/s bf16,  HBM bandwidth 1.5 TB/s
        Workload:  one forward pass over a dense 50B-parameter model,
                   bf16 weights (2 bytes each), 128 token positions in the pass

      Weight bytes cross the HBM boundary once per pass and are reused across
      all 128 positions; activation traffic is negligible. Arithmetic intensity
      for the pass is 2 * (positions) / (bytes per weight), and one token costs
      2 * (parameters) FLOPs.

      The vendor now ships a card with the same 1.5 TB/s of bandwidth and twice
      the peak, 1,200 TFLOP/s. Give the aggregate throughput of this workload on
      the NEW card, in tokens per second. Bare number, no units.
    answer: 1920
    check: numeric(1)

  - id: u10-q2
    concept: c-roofline
    kind: constructed
    congruent: true
    callback_eligible: true
    difficulty: core
    prompt: |
      A colleague benchmarks your serving stack on an H100 (989 TFLOP/s peak
      bf16, 3.35 TB/s HBM) and reports: prefill runs at about 70% of the rated
      FLOPs, decode at batch 1 runs at 0.3%. There is no bug in the decode path.

      Weight bytes are read once per forward pass and reused across every token
      position in that pass, so with bf16 weights the arithmetic intensity in
      FLOP/byte equals the number of positions in the pass.

      How many token positions per forward pass does the decode step need in
      order to sit exactly at the ridge point? Round to the nearest whole
      number. Bare number, no units.
    answer: 295
    check: numeric(1)

  - id: u10-q3
    concept: c-memory-hierarchy
    kind: mcq
    congruent: true
    difficulty: core
    prompt: |
      A textbook attention kernel for one head at sequence length n = 4096, head
      width d = 128, fp16, materializes the n x n score matrix S = QK^T in HBM:
      4096 * 4096 * 2 = 33,554,432 bytes, or 32 MiB, for one head of one layer,
      against roughly 33 MB of SRAM on the entire chip. FlashAttention never
      materializes it.

      Which statement is true of FlashAttention relative to that kernel?
    check: choice
    options:
      - text: "FLOPs are identical (4 n^2 d) and the outputs are bit-comparable; HBM traffic falls by more than an order of magnitude because S is produced a tile at a time in SRAM, raising intensity to order n/b and moving attention from the bandwidth roof to the compute roof"
        correct: true
        explain: >-
          The change is in the denominator of FLOPs/bytes, not the numerator.
          Exactness comes from the online softmax: carry a running row maximum m
          and sum l, and when a tile arrives with a larger maximum m', rescale
          the accumulated output and sum by exp(m - m') before adding the new
          contribution, which exactly compensates for the earlier normalization.
      - text: "It lowers attention's cost from O(n^2) to O(n) in sequence length, which is what makes long context affordable"
        misconception: M10
        explain: >-
          This conflates memory traffic with compute complexity. Every query
          still dots every key, so compute remains O(n^2 d); it is HBM traffic
          that drops to O(n d). The quadratic term is exactly what does not go
          away, which is why long context stays expensive.
      - text: "It approximates the softmax, discarding score tiles whose contribution is negligible, trading a small accuracy loss for a large memory saving"
        misconception: M16
        explain: >-
          The most common wrong belief about the algorithm, and it imports the
          lossy-compression intuition wholesale. Nothing is discarded: the
          rescaling by exp(m - m') makes the streaming result equal to the batch
          result, and the outputs match bit for bit.
      - text: "It is faster because tiling raises occupancy and keeps more of the 132 SMs busy on the same HBM traffic"
        misconception: U10-M2
        explain: >-
          The textbook kernel already saturates the cores; it is short of bytes,
          not of cores, so more occupancy on unchanged traffic would buy nothing.
          SRAM is the venue for the fix, but the mechanism is that the n x n
          intermediate never crosses the HBM boundary.

  - id: u10-q4
    concept: c-memory-hierarchy
    kind: mcq
    congruent: true
    difficulty: core
    prompt: |
      A transformer's normalization, activation and residual-add kernels are
      elementwise: in bf16 each element costs about 4 bytes of HBM traffic for
      about 2 FLOPs. A square n x n x n bf16 matmul does 2n^3 FLOPs against
      3n^2 elements. An H100's machine balance is B = 295 FLOP/byte.

      Which statement about these two kinds of kernel is correct?
    options:
      - text: >-
          Elementwise kernels sit at I ~ 0.5 FLOP/byte and that ratio has no
          free parameter in it, since enlarging the tensor or the batch
          multiplies FLOPs and bytes equally, so they stay roughly 590x short
          of B on any accelerator; a matmul's I = n/3 grows with size and
          crosses B at n ~ 886. The move for the elementwise kernels is fusion
          into the kernel that produced their input, so the value never crosses
          the HBM boundary and the elementwise FLOPs ride on the matmul's
          bytes.
        correct: true
        explain: >-
          Both halves are the point. Elementwise intensity is a constant, matmul
          is the only primitive whose work grows faster than its data, and
          fusion does not raise the elementwise kernel's intensity so much as
          delete its HBM traffic from the graph altogether.
      - text: >-
          Both kinds are bandwidth-bound at small sizes, but a large enough
          batch pushes either one past B; the matmul merely crosses sooner, so
          the fix for the elementwise kernels is to run them at a larger batch.
        misconception: U10-M3
        explain: >-
          Batch size is the right lever for a weight matmul, where the bytes are
          the weights and are read once per pass however many positions ride
          along. An elementwise kernel has no reused operand: doubling the batch
          doubles the elements read and written along with the FLOPs, so I stays
          at ~0.5 forever. This is the batch-crosses-the-ridge rule transferred
          to a kernel with no reuse in it.
      - text: >-
          The elementwise kernels are core-starved rather than byte-starved.
          They occupy the SMs poorly, and fusion helps by raising occupancy so
          that more of the 16,896 CUDA cores are issuing work.
        misconception: U10-M2
        explain: >-
          Profile one: it saturates every SM at full occupancy and still runs
          under 2% of peak FLOPs. It is not short of cores. It reads a value,
          does one or two operations, writes it back and waits. Occupancy is the
          mechanism that hides ~500-cycle HBM latency, not the mechanism that
          sets throughput.
      - text: >-
          Neither kernel is intrinsically bandwidth-bound. On a card with enough
          peak FLOP/s both would run near peak, and fusion helps mainly by
          cutting the number of kernel launches.
        misconception: U10-M1
        explain: >-
          Raising peak FLOP/s lifts the compute roof, and these kernels sit on
          the bandwidth roof, which did not move, so the extra FLOP/s buy
          exactly nothing. Launch overhead is nanoseconds against milliseconds
          of HBM traffic.
      - text: >-
          Elementwise work is O(n) and matmul is O(n^3), so the matmul is the
          expensive kernel and the elementwise ones are already negligible;
          optimizing them is not worth the effort.
        misconception: M10
        explain: >-
          An asymptotic FLOP count is not a cost. The kernels that are cheap in
          FLOPs are precisely the ones that run at a fraction of a percent of
          peak, and unfused normalizations and activations take a large share of
          wall-clock in a real forward pass while doing almost no arithmetic.
    check: choice

  - id: u10-q5
    concept: c-parallelism
    kind: mcq
    congruent: true
    difficulty: core
    prompt: |
      You have 8,192 accelerators. Inside each node, 8 GPUs are connected by
      NVLink at 900 GB/s. Between nodes, each GPU has one 400 Gb/s (50 GB/s)
      InfiniBand link. You will train a dense 80-layer model with d_model 8192.

      Which arrangement of data, tensor and pipeline parallelism, with its
      stated reason, is correct?
    options:
      - text: >-
          Tensor parallel 8 inside a node, pipeline parallel 8 across nodes,
          data parallel 128 across nodes. Tensor parallelism all-reduces the
          activation tensor twice per layer (160 times per forward pass), so it
          takes the fastest link; pipeline parallelism sends one activation
          tensor point-to-point per stage boundary per microbatch and pays in
          idleness rather than bandwidth; data parallelism all-reduces gradients
          once per optimizer step and can tolerate the slowest link in the
          building.
        correct: true
        explain: >-
          8 x 8 x 128 = 8,192, and the placement rule is frequency: the
          collective that fires most often gets the fastest interconnect. Those
          tensor-parallel all-reduces are ~40 GiB per forward pass, 48 ms over
          NVLink against 859 ms over InfiniBand.
      - text: >-
          Data parallel 8 inside each node, tensor parallel 8 and pipeline
          parallel 128 across nodes, because the gradient buffer is by far the
          largest thing communicated - 140 GB in bf16 for a 70B model - and the
          biggest transfer belongs on the fastest link.
        misconception: U10-M5
        explain: >-
          Volume per collective is the wrong criterion; frequency is the right
          one. The gradient all-reduce is the largest single transfer and fires
          once per optimizer step, so it is the one axis that survives a slow
          link. Tensor parallelism moves less per collective and fires 160 times
          per forward pass, which is what makes it unplaceable across nodes.
      - text: >-
          Any factorization with the right product works - tensor 8 across
          nodes, pipeline 8, data 128 is as good as any other - because the
          bytes communicated are identical wherever the shards physically sit,
          and placement is a deployment concern rather than a design one.
        misconception: U10-M5
        explain: >-
          The bytes are identical and the time is not. The same tensor-parallel
          degree of 8 costs 48 ms per forward pass inside an NVLink node and
          859 ms across InfiniBand: an 18x slowdown from placement alone, with
          no code change. Sharding a stateless service is nearly placement-free;
          this is not.
      - text: >-
          Tensor parallel 8 inside a node, data parallel 8 inside the remaining
          NVLink capacity and pipeline parallel 128 across nodes, because a ring
          all-reduce's cost per device grows with the number of participants, so
          the data-parallel axis must be kept small and local.
        misconception: U10-M5
        explain: >-
          A ring all-reduce moves 2(P-1)/P * S bytes per device, which tends to
          2S and is essentially independent of P. That independence is exactly
          why data parallelism is the axis you scale outward over the slow
          network. Pushing pipeline parallelism to 128 stages also drives the
          bubble, (p-1)/(m+p-1), to absurd levels.
    check: choice

  - id: u10-q6
    concept: c-parallelism
    kind: mcq
    congruent: true
    difficulty: stretch
    prompt: |
      A run uses 8-stage pipeline parallelism with 64 microbatches per optimizer
      step. The bubble fraction - the share of time each device spends idle
      while the pipeline fills and drains - is (p - 1) / (m + p - 1), so the run
      currently loses 7 / 71 = 9.9%.

      The team halves the global batch size to improve convergence per token,
      holding the microbatch size fixed, so m falls from 64 to 32. Which
      statement about the new bubble and the cheapest protection against it is
      correct?
    options:
      - text: >-
          The bubble rises to 7 / 39 = 17.9%. The cheapest protection is to
          halve the microbatch size as well, restoring m = 64 and the 9.9%
          bubble at the cost of slightly lower arithmetic intensity per device.
          A faster interconnect would not help, because the bubble is absence of
          available work rather than time spent waiting on a transfer.
        correct: true
        explain: >-
          Right on all three counts. The formula depends on m, the fix is a
          scheduling one (more microbatches, fewer stages, or an interleaved /
          zero-bubble schedule), and pipeline communication is point-to-point
          sends of a single activation tensor - the cheapest pattern in the run.
      - text: >-
          The bubble rises to 7 / 39 = 17.9%, and the cheapest fix is to move
          the pipeline stage boundaries onto NVLink, since the per-boundary
          activation sends then run 18x faster and the fill and drain shrink
          accordingly.
        misconception: U10-M5
        explain: >-
          The arithmetic is right and the diagnosis is not. The bubble is
          idleness, not transfer time: a stage has nothing to compute because no
          microbatch has reached it yet. Upgrading the link changes it by
          approximately nothing, which is precisely why pipeline parallelism is
          the axis that tolerates a slow network.
      - text: >-
          The bubble is unchanged at 9.9%, because pipeline idleness is set by
          the stage count p alone; halving the global batch simply halves the
          time of every step, bubble included.
        misconception: U10-M5
        explain: >-
          m is in the denominator. Halving the batch at fixed microbatch size
          halves the number of microbatches that can be kept in flight, and the
          fill and drain cost is amortized over half as much work: 7 / 39 =
          17.9%. The fill and drain do not shrink with the batch; only the
          useful work does.
      - text: >-
          The bubble rises to 17.9%, and the fix is to raise p from 8 to 16 so
          each stage holds fewer layers and drains faster.
        misconception: U10-M5
        explain: >-
          More stages is the wrong direction. At p = 16 and m = 32 the bubble is
          15 / 47 = 31.9%, worse than the 17.9% it was meant to cure. p sits in
          both the numerator and the denominator, and increasing it always
          increases the fraction at fixed m.
      - text: >-
          The bubble rises to 17.9%, and the cheapest fix is accelerators with
          twice the peak FLOP/s, so each stage completes its microbatch sooner
          and spends less of the step idle.
        misconception: U10-M1
        explain: >-
          Faster stages shorten the useful work and the fill and drain in the
          same proportion, so the fraction (p-1)/(m+p-1) is untouched - it
          contains no hardware term at all. Reaching for the spec sheet when the
          cost model has no FLOPs in it is the recurring error.
    check: choice

  - id: u10-q7
    concept: c-precision-scale
    kind: mcq
    congruent: true
    difficulty: core
    prompt: |
      Mixed-precision AdamW stores five tensors per parameter: bf16 weights,
      bf16 gradients, fp32 master weights, and two fp32 moments - 2 + 2 + 4 + 4
      + 4 = 16 bytes per parameter, or 1.12 TB for a 70B model. bf16 has 8
      exponent bits (min normal 1.2e-38) and a relative resolution of 2^-8, so
      representable values just below 1.0 are spaced 0.00390625 apart. The bf16
      forward pass costs essentially nothing in final model quality.

      Which statement correctly justifies the fp32 master copy and reconciles it
      with the harmless bf16 forward pass?
    options:
      - text: >-
          Take w = 1.0 and an update dw = -1e-4, an ordinary relative step size.
          1e-4 is far below half of bf16's 0.00390625 spacing, so w + dw rounds
          back to exactly 1.0 and the update is discarded, every step, forever.
          The forward pass only reads weights, where 0.4% is proportional noise
          spread over thousands of dimensions and the network absorbs it - the
          same reason 4-bit quantization costs a couple of points. Coarse
          resolution is survivable when you read and fatal when you accumulate.
        correct: true
        explain: >-
          The mechanism is a rounding no-op in the accumulation, not a loss of
          accuracy in the arithmetic, and the read-versus-accumulate split is
          what makes bf16 forward passes and fp32 master weights consistent with
          each other.
      - text: >-
          16 bits is half of 32, so every value stored in bf16 carries about
          half the quality of its fp32 counterpart; the master copy buys that
          quality back in the one place - the parameters themselves - where it
          matters most.
        misconception: U10-M4
        explain: >-
          Bit-counting cannot explain this. fp16 and bf16 have the same bit count
          and behave completely differently, and bf16 training matches fp32 at
          matched hyperparameters. What matters is whether a specific quantity
          survives a specific operation, and here it is an increment of 1e-4
          landing below half a representable step.
      - text: >-
          bf16's exponent field is too narrow to hold small updates: an update
          of 1e-4 falls below bf16's smallest representable value and flushes to
          zero, so the fp32 master copy (or loss scaling) exists to keep the
          update inside representable range.
        misconception: U10-M4
        explain: >-
          Range and resolution are being swapped. bf16 has fp32's 8-bit exponent
          and a floor of 1.2e-38, so 1e-4 is nowhere near underflow, and bf16 is
          the format that made loss scaling unnecessary. The update is lost to
          rounding against a large operand, not to underflow - fp16's 5-bit
          exponent is the format that has the range problem.
      - text: >-
          The bf16 forward pass does degrade quality in proportion to the
          mantissa bits given up; the fp32 master copy is cast down each step to
          refresh the working weights and cancel that accumulated drift.
        misconception: M16
        explain: >-
          The forward pass does not measurably degrade quality at matched
          hyperparameters, which is the same fact that lets 4-bit inference cost
          a few percent rather than seven eighths of the model. The master copy
          is not a corrective refresh; it is the only place the optimizer's small
          increments are representable at all.
      - text: >-
          fp32 master weights are there for numerical safety: the optimizer
          update can overflow or produce NaNs in 16-bit arithmetic, and keeping
          the parameters in fp32 stops the run from blowing up.
        misconception: M7
        explain: >-
          This is the float-safety intuition applied where it does not fit.
          bf16's dynamic range is identical to fp32's, so there is nothing extra
          to overflow. The failure is silent and undramatic: no NaN, no error,
          just a weight that never moves because the increment rounds away.
    check: choice

  - id: u10-q8
    concept: c-roofline
    kind: constructed
    congruent: true
    difficulty: warmup
    prompt: |
      An accelerator does 500 TFLOP/s of bf16 and has 2.5 TB/s of HBM
      bandwidth. You run batch-1 decode on a dense 40B-parameter model with
      bf16 weights (2 bytes per parameter).

      Give the bandwidth-bound decode ceiling in tokens per second. Bare
      number, two decimal places.
    answer: 31.25
    check: numeric(0.001)
    rubric: |
      Bytes read per token = 40e9 * 2 = 80 GB. Ceiling = 2.5e12 / 80e9 =
      31.25 tok/s. Confirm the regime first: I = 2/b = 1 FLOP/byte against a
      balance of 500/2.5 = 200, so bandwidth-bound by a factor of 200.
      Graded numerically.
      Diagnostic values: 6250 means the learner computed from FLOPs
      (500e12 / 8e10), which is U10-M1 and is the error the item is built to
      catch - it is off by a factor of 200, exactly the ratio by which the
      workload misses the ridge. 62.5 means they used 1 byte per parameter.
      15.63 means they used 4 bytes. 0.03 means they inverted the division.

  - id: u10-q9
    concept: c-precision-scale
    kind: constructed
    congruent: true
    callback_eligible: true
    difficulty: stretch
    prompt: |
      A pretraining run:

        Model:    40e9 parameters
        Data:     8e12 tokens
        Cluster:  4,096 accelerators at 800e12 FLOP/s peak bf16 each

      With C = 6ND for the FLOPs the model mathematics requires, the run reports
      35% MFU, where

        MFU = (6ND / wall-clock seconds) / (aggregate peak FLOP/s)

      and recomputation is excluded from the numerator by definition.

      The team then enables full activation checkpointing, which takes the FLOPs
      the hardware actually executes from 6ND to 8ND. The hardware keeps
      converting the same 35% of aggregate peak into executed FLOPs (HFU is
      unchanged), and nothing else about the run changes.

      What MFU does the run now report, as a percentage? Bare number, two
      decimal places.
    answer: 26.25
    check: numeric(0.05)

  - id: u10-q10
    concept: c-roofline
    kind: mcq
    congruent: false
    callback_eligible: true
    difficulty: warmup
    check: choice
    prompt: |
      Your vendor offers two upgrades at the same price: (A) double the peak
      FLOP/s with the same memory bandwidth, or (B) double the memory bandwidth
      with the same peak FLOP/s. You serve one interactive user at a time from
      a 4-bit MoE model on a laptop-class part. Which do you take?
    options:
      - text: "B. Batch-1 decode sits far below the machine's balance point, so the ceiling is (intensity x bandwidth) and doubling bandwidth roughly doubles tokens per second. Doubling FLOP/s moves a roof the workload is nowhere near."
        correct: true
        explain: "Correct, and the factor is close to exactly 2 because the bandwidth-bound ceiling is linear in bandwidth. At 4.35 bits per weight the workload offers 3.7 FLOP/byte against a machine balance of 65 - it misses the ridge by 18x, so the compute roof is irrelevant."
      - text: "A. More arithmetic throughput is the general-purpose upgrade; it helps every workload at least somewhat, while bandwidth only helps memory-heavy ones."
        misconception: U10-M1
        explain: "This is the spec-sheet comparison. Below the ridge point the compute roof does not participate in the answer at all - not 'somewhat', not at the margin. The workload runs at 5.6% of the FLOPs it already has, and doubling them takes it to 2.8%."
      - text: "A. The model is a mixture of experts, so it already reads few bytes per token; bandwidth has stopped being the constraint and compute is what remains."
        misconception: U7-M4
        explain: "MoE cuts bytes read per token by the total/active ratio, which raises the ceiling but does not change the regime. The intensity is still 2/b - a property of matrix-vector products, unchanged by which matrices you skip - so at batch 1 the workload is exactly as bandwidth-bound after the architecture change as before it. It is faster while remaining on the same roof."
      - text: "Neither meaningfully. Single-user latency is dominated by the KV cache growing as the conversation lengthens, so both upgrades are swamped."
        misconception: M17
        explain: "The cache does grow and does cost traffic, but weight traffic per token is constant from token 1 onward and far larger: 1.8 GB of weights against u6's 96 KiB of cache per token of context, so cache traffic does not match weight traffic until roughly 18,000 tokens. (u6's 8,469-token crossover is the arithmetic one - attention FLOPs against weight FLOPs - which is a different comparison and irrelevant here, since the workload is bandwidth-bound either way.) The cache is also read from the same memory system, so doubling bandwidth helps that term too. Nothing here is swamped."

  - id: u10-q11
    concept: c-memory-hierarchy
    kind: mcq
    congruent: false
    difficulty: warmup
    check: choice
    prompt: |
      A fused elementwise kernel (GELU, residual add, RMSNorm) runs at 100%
      occupancy across all 132 SMs of an H100 and delivers under 2% of the
      chip's peak FLOP/s. What is the explanation?
    options:
      - text: "Its arithmetic intensity is around 0.5 FLOP/byte - it reads a value, does one or two operations, and writes it back - against a machine that needs 295 FLOP/byte to keep its arithmetic units fed."
        correct: true
        explain: "Correct. The kernel is short of bytes, not of cores, and the ratio has no free parameter: larger tensors and larger batches multiply the FLOPs and the bytes equally. The only available move is fusion, which stops the value from crossing the HBM boundary between operations at all."
      - text: "Occupancy is high but per-core utilization is not; issuing more threads per block, or using a grid-stride loop, would let the cores do more work per launch."
        misconception: U10-M2
        explain: "This is the core-count model. The cores are already fully occupied and already have nothing to do - they are stalled on memory, and adding more of them or scheduling them differently adds more things to stall. Occupancy is a latency-hiding metric, and it is doing its job here; there is simply no arithmetic to hide behind."
      - text: "GELU uses transcendental functions, which issue on the special function units at a fraction of the throughput of the main pipelines, so the kernel is compute-bound on those units."
        misconception: U10-M1
        explain: "Plausible-sounding and testable: replace GELU with a plain residual add, which has no transcendentals at all, and the kernel still runs at a similar fraction of peak. The constraint is the load and the store, not the operation between them. Attributing the limit to an arithmetic unit is U10-M1 pointed at a smaller target."
      - text: "The comparison is not meaningful. An elementwise op is O(n) work while a matmul is O(n^3), so of course the elementwise kernel accounts for a smaller share of the chip's FLOPs."
        misconception: M10
        explain: "This conflates total work with rate. Percentage of peak is a rate - FLOPs delivered per second while the kernel is running - and it is entirely comparable between kernels of different total sizes. The same conflation of asymptotic cost with wall-clock behaviour is what makes attention look cheap at short context."

  - id: u10-q12
    concept: c-parallelism
    kind: mcq
    congruent: false
    difficulty: core
    check: choice
    prompt: |
      A team configures tensor parallelism at degree 8 by placing the 8 shards
      on 8 separate nodes connected by InfiniBand, rather than on 8 GPUs inside
      one NVLink node. The total bytes communicated are identical either way.
      What happens?
    options:
      - text: "Throughput collapses. Tensor parallelism all-reduces the activation tensor twice per layer, so an 80-layer forward pass moves tens of GiB; at 900 GB/s that is about 48 ms and at 50 GB/s it is about 859 ms, an 18x penalty from placement alone."
        correct: true
        explain: "Correct, and the criterion is frequency, not volume. Tensor parallelism is the most frequent collective in the run - 160 all-reduces per forward pass - so it gets the fastest link and stays inside a node. This is why TP degree in practice equals the number of GPUs sharing an NVLink domain."
      - text: "Nothing significant. The same number of bytes crosses the same number of links; the only difference is a slightly higher per-message latency, which is amortized away by the message sizes involved."
        misconception: U10-M5
        explain: "Bytes are not the cost - bytes divided by bandwidth is. The two links differ by 18x in bandwidth, and the operation happens 160 times per forward pass, so the penalty compounds rather than amortizing. This is the belief that parallelism is 'just sharding' and the axis is an implementation detail."
      - text: "It is fine, and in fact preferable: spreading the shards across nodes means each shard gets its own full memory bandwidth instead of contending with seven peers for one node's HBM."
        misconception: U10-M5
        explain: "The premise is wrong - GPUs in a node do not share HBM; each has its own 80 GB at 3.35 TB/s, so there is nothing to contend for. The reasoning also inverts the actual constraint, which is the link between the shards, not the memory behind them."
      - text: "Throughput is unaffected, but memory usage rises, because cross-node tensor parallelism cannot overlap the all-reduce with compute and must buffer activations."
        misconception: U10-M5
        explain: "Overlap is genuinely harder across nodes, and buffering is real, but naming memory as the consequence gets the magnitude backwards: the cost here is an 18x slowdown on the critical path of every layer. Any answer that keeps throughput 'unaffected' has not priced the collective."

  - id: u10-q13
    concept: c-precision-scale
    kind: mcq
    congruent: false
    difficulty: core
    check: choice
    prompt: |
      fp16 training required dynamic loss scaling - multiplying the loss by a
      large constant before the backward pass and dividing it out before the
      optimizer step. bf16 training does not. Both are 16-bit formats. Why?
    options:
      - text: "bf16 has 8 exponent bits, the same as fp32, so its smallest normal value is 1.2e-38. fp16 has 5, floors out at 6.0e-8 for subnormals, and gradients below that round to exactly zero."
        correct: true
        explain: "Correct. Loss scaling exists to shift gradients up into a five-bit exponent's representable range, nothing more. bf16 buys the range by spending mantissa bits, ending up with 0.4% relative resolution - coarser than fp16 - and that trade is the right one because gradients need range far more than resolution."
      - text: "bf16 packs more information into its 16 bits than fp16 does, so it is simply the more accurate 16-bit format and needs less protection."
        misconception: U10-M4
        explain: "Both formats have exactly 16 bits and neither carries more information than the other; they allocate it differently. bf16 is in fact *less* precise than fp16 - 8 significant bits against 11. It is more robust, which is a different property, and the word 'accurate' is what conceals the difference."
      - text: "bf16 runs are stable because mixed precision keeps fp32 master weights, which fp16 training did not do."
        misconception: U10-M4
        explain: "fp16 mixed-precision training also kept fp32 master weights - they were introduced together. Master weights solve a different failure: the accumulation of updates smaller than the representable step into a weight. Loss scaling solves gradient underflow during the backward pass. Two mechanisms, two failures, and conflating them means neither is understood."
      - text: "Because 4-bit and 8-bit quantization show that networks tolerate large weight perturbations, so 16-bit gradients never needed protection in the first place - loss scaling was cargo cult."
        misconception: M16
        explain: "The quantization robustness result is about proportional perturbation of stored weights at inference time, and it is genuinely correct there. It says nothing about a gradient becoming exactly zero during training, which is not perturbation but absence. Remove loss scaling from a real fp16 run and it diverges - this is measurable, not folklore."

  - id: u10-q14
    concept: c-roofline
    kind: mcq
    congruent: false
    difficulty: core
    check: choice
    prompt: |
      You are decoding at 85 tok/s from a 4-bit model on a 153 GB/s machine,
      one user, and the workload is bandwidth-bound by a factor of 18. Which
      change raises the ceiling?
    options:
      - text: "Anything that cuts bytes read per token: a more aggressive quantization, or an architecture that activates fewer parameters per token."
        correct: true
        explain: "Correct. Below the ridge the ceiling is (bytes moved) divided into (bandwidth), so the only two levers are more bandwidth or fewer bytes. This is the single move that u6's quantization, u7's mixture of experts, and grouped-query attention all make - three different techniques, one denominator."
      - text: "A chip with three times the peak FLOP/s and the same 153 GB/s of memory bandwidth."
        misconception: U10-M1
        explain: "The workload uses 5.6% of the FLOPs it already has. Tripling the compute roof takes that to 1.9% and leaves the ceiling exactly where it was, because the workload is on the bandwidth roof and only the compute roof moved."
      - text: "Enabling FlashAttention, which removes the n x n score matrix from HBM and dramatically cuts attention traffic."
        misconception: U10-M3
        explain: "FlashAttention targets the regime where the n x n score matrix exists - prefill and training, where n queries attend over n keys. During single-token decode there is one query, so the score 'matrix' is a 1 x n vector that was never a problem. Applying a compute-bound-regime optimization to a bandwidth-bound decode loop is the regime confusion this unit is built around."
      - text: "Storing the KV cache in fp32 rather than fp16, so attention arithmetic over the cache is more accurate and the model needs fewer tokens to reach the answer."
        misconception: U10-M4
        explain: "This moves the ceiling in the wrong direction twice. Doubling cache precision doubles cache traffic on a machine where traffic is the binding constraint, and it halves attention's arithmetic intensity (which is 2 x H_q / (H_kv x b), inversely proportional to bytes per scalar). The premise is also the bit-counting model - fp16 caches cost close to nothing in quality."
