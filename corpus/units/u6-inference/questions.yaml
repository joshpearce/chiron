# u6 - Inference: making it run
# Pretest items are expected to fail; they exist for calibration and the
# pretesting effect. Check items compose an 8+ item terminal check.

pretest:
  - id: u6-p1
    concept: c-sampling
    prompt: >
      You call your local model twice with the identical prompt, once with
      temperature=0 and once with temperature=1.2. Which statement about the two
      calls is correct?
    options:
      - text: >
          Every quantity inside the forward pass - embeddings, attention scores,
          MLP activations, the residual stream and the final logit vector z - is
          bit-identical across the two calls, and temperature=0 guarantees
          determinism only, not correctness.
        correct: true
        explain: >
          Temperature is never an argument to the network. It is applied after the
          forward pass returns, dividing the logits before the softmax that
          defines the sampling distribution, so temperature=0 is argmax over the
          same distribution every other temperature samples from. That buys
          reproducibility and nothing about truth, which is why a greedy decode
          reproduces the same hallucination on every run.
      - text: >
          The logit vector z differs between the calls: at temperature=0 the
          network sharpens its scores so the strongest continuation dominates, and
          at temperature=1.2 it computes a flatter set of scores.
        misconception: M6
        explain: >
          Attractive because the behaviour change is real and large. But you can
          compute the logits once and sample them at ten different temperatures
          without re-running the model: the division by T happens outside the
          network, so z is bit-identical at both settings.
      - text: >
          Nothing in the forward pass differs, and temperature=0 returns what the
          model actually knows, so its output is the more trustworthy of the two.
        misconception: M6
        explain: >
          Half right, and the half that matters is wrong. Determinism feels
          authoritative, but argmax over a frequency-calibrated distribution has
          no correctness signal to consult; greedy decoding hallucinates at close
          to the rate of moderate sampling, and can be worse by locking into a
          confident wrong opening and conditioning everything after it.
      - text: >
          Nothing in the forward pass differs, and the softmax probability that
          temperature=0 takes the argmax of is the model's probability that the
          token is correct, so a high value means the answer is right.
        misconception: M2
        explain: >
          Softmax output is a normalized exponential weighting of scores that
          parameterizes a sampling distribution calibrated to training-data
          frequencies. A false claim seen ten thousand times gets high
          probability; the number measures frequency, not truth.
    check: choice

  - id: u6-p2
    concept: c-kv-cache
    prompt: >
      You are running a 35B-parameter model locally - 48 layers, 32 query heads,
      4 key/value heads of width 128, d_model 4096, fp16 cache - with a
      32,000-token conversation loaded. Which figure for the KV cache, and which
      account of what sets it, is correct?
    options:
      - text: >
          About 2.9 GiB. bytes = 2 * L * H_kv * d_head * b * n, so
          2 * 48 * 4 * 128 * 2 = 96 KiB per token, times 32,000 tokens. Only the
          layer count, the key/value head count, the head width, the cache
          precision and the sequence length appear.
        correct: true
        explain: >
          One key and one value vector, per layer, per key/value head, per token -
          that is the factor of 2 and the whole formula. d_model, the MLP width,
          the expert count and the total parameter count are all absent: the cache
          does not care how big the model is.
      - text: >
          About 23 GiB, since each of the 32 query heads needs its own key and
          value vectors: 2 * 48 * 32 * 128 * 2 = 768 KiB per token, times 32,000.
        misconception: M10
        explain: >
          This is the right formula with H_q substituted for H_kv, and it is
          exactly the counterfactual figure for full multi-head attention (768 KiB
          is 8x 96 KiB, the ratio H_q / H_kv). Under grouped-query attention the
          32 query heads read 4 shared key/value heads; queries consume the cache,
          they do not enlarge it.
      - text: >
          Roughly 19 GB, on the order of the weight file itself, because the cache
          scales with the parameter count - a bigger model has more stored context
          to keep per token.
        misconception: M4
        explain: >
          The storage analogy again: bigger model, more rows. Cache size is set by
          L, H_kv, d_head, the precision and n only. A far smaller model with the
          same layer count and head geometry holds a cache of exactly the same
          size.
      - text: >
          A few hundred megabytes: the cache holds the conversation's accumulated
          state, which is much smaller than the raw tokens because the model has
          already condensed 32,000 tokens down to what it needs.
        misconception: M17
        explain: >
          The cache holds no condensed state. It holds the K and V projections of
          every position, recomputable bit-identically from the tokens, at a flat
          96 KiB per token with no compression - which is why long context costs
          memory linearly in n.
    check: choice

  - id: u6-p3
    concept: c-quant
    prompt: >
      The model file on your laptop is 19 GB and the model has 35.35 billion
      parameters. Which statement about the bits per weight, and about what
      quantization gave up to get there, is correct?
    options:
      - text: >
          About 4.3 bits per weight - 4 bits of payload plus roughly 0.31 bits of
          per-group overhead, one fp16 scale and one 4-bit zero-point per group of
          64 - and what was spent is precision: every weight is still present,
          stored as one of 16 levels spanning its group's range and reconstructed
          as s * (q - z), off by at most s/2.
        correct: true
        explain: >
          19e9 * 8 / 35.35e9 is about 4.3 bits per weight. Nothing was removed.
          The reconstruction error is under half a grid step, roughly 9% of the
          weights' own standard deviation, which perturbs the function the network
          computes rather than truncating its contents.
      - text: >
          About 4.3 bits per weight, which keeps 4 of every 16 bits, so about a
          quarter of the stored knowledge survives and the model should behave
          like an fp16 model roughly a quarter its size.
        misconception: M16
        explain: >
          The arithmetic is right and the model behind it is wrong. Bit-counting
          predicts the wrong ordering, not merely the wrong magnitude: the 4-bit
          35B beats an fp16 9B by a wide margin and lands within a couple of
          points of its own fp16 self.
      - text: >
          About 4.3 bits per weight, and the quantizer keeps the largest weights
          while flushing the smallest to zero, so the entries holding
          rarely-seen facts are the ones dropped.
        misconception: M4
        explain: >
          There are no rows to drop. Parameters define a function, not a key-value
          store; affine quantization moves every weight to the nearest of 16
          levels spanning its group's range and deletes none of them - the sign
          and the magnitude ordering largely survive.
      - text: >
          About 4.3 bits per weight, and the only thing given up is disk space -
          the reconstruction is exact, and once loaded the model runs at the same
          speed and produces the same outputs as the fp16 build.
        misconception: U6-4
        explain: >
          The reconstruction is not exact: each weight is off by up to s/2. And
          the speed claim inverts the main benefit - decode is bandwidth-bound, so
          moving 1.80 GB of active weights per token instead of 6.66 GB makes
          4-bit decoding roughly 3.7x faster. Prefill, being compute-bound, is the
          phase that barely changes.
    check: choice

check:
  - id: u6-q1
    concept: c-sampling
    kind: constructed
    congruent: true
    callback_eligible: false
    difficulty: core
    prompt: >
      A forward pass returns logits z = [2.0, 0.0, -1.0] over a three-token
      vocabulary. Compute the probability assigned to the first token at
      temperature T = 0.5. Answer as a bare decimal to four places.
    answer: "0.9796"
    check: numeric(0.001)
    rubric: >
      Expected work: divide logits by T to get [4, 0, -2]; exponentiate to
      [54.5982, 1.0, 0.1353]; sum 55.7335; 54.5982/55.7335 = 0.9796.
      Diagnostic wrong answers: 0.8438 means the learner used T = 1 and never
      applied temperature; 0.6285 means they multiplied the logits by T instead
      of dividing, giving [1.0, 0, -0.5]; 0.9997 means they divided by T twice,
      giving [8, 0, -4].
      Note for graders: dividing the EXPONENTIALS by T rather than the logits is
      a no-op, since the common factor cancels in the normalization - a learner
      who describes doing that and reports 0.8438 has made the T = 1 error.

  - id: u6-q2
    concept: c-sampling
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: warmup
    check: choice
    prompt: >
      Two API calls, identical prompt, one at temperature=0.7 and one at
      temperature=1.5. Which statement is true?
    options:
      - text: >
          The logit vectors are identical; only the distribution sampled from
          them differs.
        correct: true
        explain: >
          Correct. Temperature is applied after the forward pass returns. The
          network never receives it, so every activation including the logits
          is bit-identical across the two calls.
      - text: >
          The higher-temperature call activates a broader set of the model's
          knowledge, producing different logits.
        misconception: M6
        explain: >
          This is the core temperature-changes-knowledge error. It predicts the
          logits differ; they do not. Nothing about temperature reaches the
          weights, and the ranking of tokens is provably identical at every
          temperature because x -> x^(1/T) is monotone increasing.
      - text: >
          The logits differ because the higher temperature adds noise to the
          attention scores during the forward pass.
        misconception: M6
        explain: >
          Same error with a mechanism attached, which makes it more seductive.
          No serving stack injects noise into attention on the basis of the
          temperature parameter; temperature is a scalar divide applied to the
          returned logit vector, typically a single line of Python.
      - text: >
          The softmax outputs at temperature=0.7 are better-calibrated estimates
          of which token is factually correct.
        misconception: M2
        explain: >
          Softmax outputs are not probabilities of correctness at any
          temperature. They are a normalized exponential weighting calibrated to
          training-data frequency. Lowering temperature concentrates that
          weighting; it does not make it truth-tracking.

  - id: u6-q3
    concept: c-sampling
    kind: mcq
    congruent: true
    callback_eligible: true
    difficulty: core
    prompt: >
      A teammate argues: we should run all production inference at
      temperature=0, because it removes the randomness, so the model gives us its
      actual best answer instead of a random one, and that will cut our
      hallucination rate. Which evaluation of that argument is correct?
    options:
      - text: >
          Wrong on the payoff: temperature=0 is argmax over the same distribution
          every other temperature samples from, with the logits unchanged, so it
          buys determinism for tests, diffs and bug reproduction and nothing on
          correctness - and argmax per position does not even maximize the
          sequence probability, which is why beam search exists.
        correct: true
        explain: >
          Both halves matter. The hallucinated token is high-scoring in the logits
          that pretraining produced, so greedy returns it reproducibly, every run.
          And greedy is a local heuristic: with step 1 at [0.6, 0.4], the 0.6
          branch continuing at best 0.5 and the 0.4 branch at 0.99, greedy scores
          0.30 against 0.396.
      - text: >
          Correct as stated: sampling noise is what produces hallucinated tokens,
          so removing the sampling step drives the hallucination rate toward zero
          and temperature=0 is the right production default for accuracy.
        misconception: M6
        explain: >
          Measure it and the prediction fails: greedy hallucinates at close to the
          rate of temperature=0.7, and on some tasks worse, because it locks into
          a confident wrong opening. The failure mode is upstream of the sampler,
          in the logits.
      - text: >
          Backwards: hallucination comes from the model being stuck in a narrow
          mode, so the fix is to raise temperature to about 1.2 and let it reach
          the correct continuation.
        misconception: M6
        explain: >
          The same belief inverted - that some temperature setting reaches back
          into what the model knows. Raising T changes how often you visit the
          tail, so it changes which wrong token you get, not whether it is wrong.
      - text: >
          Right conclusion for the right reason: at temperature=0 the softmax
          probability of the chosen token is the model's probability that the
          token is correct, so argmax selects the continuation most likely to be
          true.
        misconception: M2
        explain: >
          Softmax output is a normalized exponential weighting of scores that
          parameterizes a sampling distribution calibrated to training-data
          frequencies. It is a frequency weight, not a truth probability -
          temperature reshapes it with no new evidence at all.
      - text: >
          Sound, and there is a second benefit: greedy also maximizes the
          probability of the whole output sequence, so beam search can only match
          it at extra cost.
        misconception: U6-5
        explain: >
          If greedy maximized sequence probability, beam search could never find a
          higher-probability sequence - it routinely does, which is its entire
          reason to exist. Argmax per step has no exchange property on the search
          tree; it is a local heuristic.
    check: choice

  - id: u6-q14
    concept: c-sampling
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: core
    check: choice
    prompt: >
      A service is pinned at top_p = 0.9. On the logit vector
      z = [3.0, 1.0, 0.0, -1.0, -2.0], that setting keeps 1 token at T = 0.5,
      2 tokens at T = 1.0, 4 tokens at T = 2.0, and all 5 at T = 4.0. What does
      this demonstrate about the relationship between the two settings?
    options:
      - text: >
          top-p truncates the distribution that temperature has already
          reshaped, so its cut point - and therefore the number of reachable
          tokens - is a property of the pair, not of top_p alone. At low
          temperature top_p silently becomes greedy decoding.
        correct: true
        explain: >
          Correct. The two operate in sequence on the same logits: temperature
          reweights, then top-p reads the cumulative mass of the reweighted
          distribution and deletes the tail beyond it. A fixed top_p is
          therefore not a fixed setting, which is why (T=0.3, top_p=0.9) and
          (T=1.2, top_p=0.9) are different samplers rather than two points on
          one dial.
      - text: >
          The two are redundant controls on the same creativity axis, so the
          survivor count varying with temperature is just the expected additive
          effect of turning both knobs.
        misconception: U6-2
        explain: >
          The one-dial model, which is what the numbers refute. If the effects
          merely added, top_p = 0.9 would remove a roughly fixed amount of tail
          at any temperature. Instead its effect ranges from disabling sampling
          entirely to doing nothing at all - not an additive contribution but a
          dependent one, since top-p consumes temperature's output.
      - text: >
          Temperature changes the ranking of the tokens, so different tokens
          enter the top-p nucleus at different temperatures.
        misconception: U6-2
        explain: >
          Temperature never reorders anything. Dividing logits by T and
          softmaxing is equivalent to raising each probability to the power 1/T
          and renormalizing, and x -> x^(1/T) is monotone increasing, so the
          ranking is identical at every temperature. What changes is the
          cumulative mass at each rank, which is what moves the cut point.
      - text: >
          At high temperature the model considers more candidate continuations,
          so there are simply more tokens available for top-p to keep.
        misconception: M6
        explain: >
          The model does not "consider" anything at sampling time and the
          candidate set never changes - all five tokens have a nonzero logit at
          every temperature, including T = 0.5 where top-p discards four of
          them. The tail was always there; temperature only sets how much mass
          sits in it.
      - text: >
          It shows top_p should be applied before temperature, so that the
          survivor set is stable and the two settings stop interfering.
        misconception: U6-2
        explain: >
          Reordering does not decouple them, it just changes which one reads the
          other's output - top-p on raw logits still has a cut point that the
          subsequent temperature divide then reweights. Some older
          implementations did truncate first; the standard order (temperature,
          then top-k, then top-p, then sample) is a convention worth checking in
          your stack, not a fix for a dependency that cannot be removed.

  - id: u6-q4
    concept: c-kv-cache
    kind: constructed
    congruent: true
    callback_eligible: false
    difficulty: core
    prompt: >
      A model has 32 layers, d_model = 4096, 32 query heads, 8 key/value heads,
      head width 128, and an fp16 KV cache (2 bytes per scalar). Compute the
      total KV cache size in GiB for a 4,096-token context. Answer as a bare
      decimal.
    answer: "0.5"
    check: numeric(0.01)
    rubric: >
      Expected work: 2 * 32 * 8 * 128 * 2 = 131,072 bytes per token = 128 KiB;
      times 4,096 tokens = 536,870,912 bytes = 0.5 GiB.
      Diagnostic wrong answers: 2.0 means the learner used the 32 query heads
      instead of the 8 key/value heads - the single most common cache-sizing
      error, and the one that hides why GQA exists; 0.25 means they dropped the
      factor of 2 for storing both K and V; 16.0 means they used d_model = 4096
      in place of d_head = 128, cached at full residual width per head.

  - id: u6-q5
    concept: c-kv-cache
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: warmup
    check: choice
    prompt: >
      Mid-conversation, your serving process evicts the entire KV cache and
      recomputes it from the same token sequence. What happens to the next
      token's logits?
    options:
      - text: >
          They are bit-identical to what they would have been. The eviction cost
          time and nothing else.
        correct: true
        explain: >
          Correct, and this is the decisive test. The cache holds key and value
          projections, each a pure function of the tokens up to that position -
          guaranteed by the causal mask. Recomputing from the same tokens
          reproduces them exactly.
      - text: >
          They shift slightly, because the model loses some of the accumulated
          context state it had built up over the conversation.
        misconception: M17
        explain: >
          This treats the cache as semantic memory. If it held state that the
          tokens did not, recomputation could not reproduce it - but it does,
          exactly. The conversation's state lives in the token sequence; the
          cache is recomputation avoidance over that sequence.
      - text: >
          They change substantially, because the model must re-derive the
          conversation's meaning from scratch and may interpret it differently.
        misconception: M17
        explain: >
          The stronger form of the same error. The forward pass is deterministic:
          the same weights on the same tokens give the same activations every
          time. There is no re-interpretation step.
      - text: >
          They are identical, but only because the harness re-sends the full
          message history; if it had sent only the newest message the cache
          would have held the earlier turns.
        misconception: M13
        explain: >
          The first clause is right and the reasoning is wrong. The harness does
          re-send the full history, but that is not what makes the cache exact -
          the cache is keyed to a token prefix and cannot survive without those
          tokens in the first place. This conflates the harness's assembly job
          (u8) with the cache's memoization job.

  - id: u6-q6
    concept: c-kv-cache
    kind: mcq
    congruent: true
    callback_eligible: false
    difficulty: stretch
    prompt: >
      A model with L = 64 layers and d_head = 128 is offered in two variants:
      full multi-head attention with H_q = 64 query heads and H_kv = 64 key/value
      heads, and grouped-query attention with H_q = 64 and H_kv = 8. Which
      statement about the two variants is correct?
    options:
      - text: >
          The GQA variant's KV cache is 8x smaller - exactly H_q / H_kv, since
          bytes = 2 * L * H_kv * d_head * b * n does not contain H_q - while
          attention FLOPs are unchanged, because all 64 query heads still dot
          against a full set of keys and sum over values, with each key/value head
          shared by 8 of them. The saving grows with n and the quality cost does
          not, so GQA is closest to free exactly where memory binds.
        correct: true
        explain: >
          Storage and arithmetic come apart here. Fewer distinct K/V tensors are
          stored and read; the same number of dot products is computed. Because
          the benefit scales with context length and the cost does not, GQA is
          hardest to justify at short context and unavoidable at long context,
          which is why every recent model ships it.
      - text: >
          The cache is 8x smaller and attention FLOPs fall by 8x with it, since
          there are 8x fewer key and value vectors to dot against.
        misconception: M10
        explain: >
          This conflates what is stored with what is computed. All 64 query heads
          still run: each dots its query against a full set of keys and takes a
          weighted sum over values, reading a shared K/V head 8 times over. The
          arithmetic per decoded token, 4 * n * d_head * H_q * L, contains H_q and
          not H_kv.
      - text: >
          The cache ratio is 8:1, and GQA is primarily a quality improvement:
          sharing keys and values lets the heads agree on what to attend to
          instead of each one deciding separately.
        misconception: M1
        explain: >
          No head decides anything - each computes a similarity-weighted average
          of value vectors, and sharing K/V strictly reduces the diversity
          available to them, a small quality cost rather than a gain. GQA is a
          memory and bandwidth optimization that is paid for in quality, not the
          other way round.
      - text: >
          The ratio is 8:1, but it matters least at long context: the cache is a
          fixed allocation made at load time, so once it is warm the extra tokens
          are free and the MHA variant's larger cache costs nothing per token.
        misconception: U6-3
        explain: >
          The cache is not fixed - it grows linearly in n, and every decoded token
          attends over all of it, so cached context costs memory linearly and
          compute on every subsequent token. That is precisely why the 8x saving
          matters most at long context, not least.
    check: choice

  - id: u6-q7
    concept: c-kv-cache
    kind: mcq
    congruent: true
    callback_eligible: true
    difficulty: core
    prompt: >
      Submitting a 4,000-token prompt returns the first token in about a second,
      but generating the 400 tokens after it takes eight seconds: prefill did ten
      times the position-processing and finished eight times faster. Which account
      of the two phases is correct?
    options:
      - text: >
          Prefill is one forward pass with all 4,000 positions computed
          simultaneously, multiplying a 4000-row activation matrix by each weight
          matrix, so every weight is read once and reused across 4,000 rows -
          compute-bound. Decode is 400 separate passes, serial because pass t+1
          needs the token pass t sampled, each multiplying a single row by every
          weight matrix, so every weight is read and used once - bandwidth-bound.
        correct: true
        explain: >
          Arithmetic intensity is the whole story. Order inside a forward pass is
          carried by positional information and the causal mask, not by sequential
          execution, so prefill parallelizes fully; the decode rate is bandwidth
          divided by active-weight bytes, 153 / 1.80 = about 85 tokens/sec on this
          machine, with the arithmetic units idle.
      - text: >
          Prefill is faster because the prompt tokens are already known, so the
          model can run through them left to right without stopping to sample,
          while decode must re-run the sequence from the start for each new token.
        misconception: M9
        explain: >
          Prefill is not a fast left-to-right walk - it is a single pass in which
          every position is computed at once. And decode does not re-run the
          sequence: the KV cache means each pass processes exactly one new
          position and reads the stored K and V for the rest.
      - text: >
          Decode is slower because attention over the growing KV cache dominates
          at every context length; the weight matmuls cost the same in both
          phases, so the whole difference is the quadratic term.
        misconception: M10
        explain: >
          The quadratic term is real but has not arrived yet. On this model
          attention costs 4 * n * d_head * H_q * L per decoded token and overtakes
          the 6.66 GFLOPs of weight matmuls only around n = 8,469; at 4,000 tokens
          the weights still dominate, and the phase gap is bandwidth, not
          asymptotics.
      - text: >
          Decode is slower because each new token must recompute the key and value
          vectors of all preceding positions, which prefill did once in bulk - the
          cache holds conversation state and has to be refreshed each step.
        misconception: M17
        explain: >
          The causal mask makes earlier positions' K and V immutable, so they are
          computed once and never refreshed; that is the entire point of the
          cache. Decode is slow despite recomputing nothing, because a one-row
          matmul reads every active weight to produce a single token.
      - text: >
          Both phases are bandwidth-bound and read the same active weights per
          forward pass; prefill just gets 4,000 tokens out of one pass while
          decode needs 400 passes, so the ratio is simply the pass count.
        misconception: U6-4
        explain: >
          If both phases were bandwidth-bound, quantization would speed them up
          equally - instead 4-bit decoding runs about 3.7x faster while prompt
          processing barely moves. Prefill reuses each loaded weight across
          thousands of rows and saturates the arithmetic units; only decode is
          limited by bytes moved.
    check: choice

  - id: u6-q8
    concept: c-quant
    kind: constructed
    congruent: true
    callback_eligible: false
    difficulty: core
    prompt: >
      Quantize this group of 8 weights to 4 bits with affine group quantization
      (16 levels, scale s = (max - min)/15, zero-point z = round(-min/s), codes
      q = round(w/s + z), reconstruction w_hat = s * (q - z)):

      w = [0.12, -0.03, 0.045, -0.18, 0.09, 0.00, 0.06, -0.09]

      Give the reconstructed value of the third weight, 0.045. Answer as a bare
      decimal.
    answer: "0.04"
    check: numeric(0.0005)
    rubric: >
      Expected work: max 0.12, min -0.18, range 0.30, s = 0.02,
      z = round(0.18/0.02) = 9. 0.045/0.02 = 2.25, plus z = 11.25, rounds to
      code 11. w_hat = 0.02 * (11 - 9) = 0.04. Error -0.005, within s/2 = 0.01.
      Diagnostic wrong answers: 0.045 means the learner did not round to the
      grid at all; 0.06 means they rounded 11.25 up to 12; 0.0375 means they
      used s = (max - min)/16 = 0.01875 rather than /15, forgetting that 16
      levels give 15 intervals.

  - id: u6-q9
    concept: c-quant
    kind: mcq
    congruent: false
    callback_eligible: true
    difficulty: core
    check: choice
    prompt: >
      Model A is a 35B-parameter model quantized to 4 bits (about 19 GB).
      Model B is a 9B-parameter model in fp16 (about 18 GB). Same architecture
      family, same training recipe. What should you expect on benchmarks?
    options:
      - text: >
          Model A substantially outperforms Model B, landing within a few points
          of its own fp16 version.
        correct: true
        explain: >
          Correct, and it is the result that breaks bit-counting. Quantization
          perturbs each weight by about 9% of the weights' standard deviation -
          it does not delete content. Parameter count buys feature composition
          that no amount of per-weight precision recovers.
      - text: >
          They perform about the same, since they hold roughly the same total
          number of bits.
        misconception: M16
        explain: >
          This is exactly the prediction bit-counting makes, and it is wrong by
          a wide margin. Total bits is not the quantity that determines
          capability. If it were, the 4-bit 35B would be interchangeable with an
          fp16 9B, and it is not close.
      - text: >
          Model B outperforms Model A, because Model A has had 3/4 of its stored
          facts truncated away.
        misconception: M16
        explain: >
          The strong form of the lossy-compression model. No facts were
          truncated - every weight is still present, stored as one of 16 levels
          within its group's range. Nothing was dropped; precision was spent.
      - text: >
          Model A wins on recall-style benchmarks but loses on reasoning
          benchmarks, because 4-bit keeps the lookup table intact and damages
          the computation.
        misconception: M4
        explain: >
          The directional claim about reasoning degrading first is actually
          right, and that is what makes this distractor dangerous. The reasoning
          is wrong: there is no lookup table. Reasoning degrades first because
          small perturbations compound over long dependent chains, not because
          quantization spares stored rows and harms computation.

  - id: u6-q10
    concept: c-quant
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: >
      Round-to-nearest 4-bit quantization costs a trained model a couple of
      points on benchmarks; the same method at 2 bits collapses it. Reconstruction
      error std as a fraction of the weights' own std runs about 0.5% at 8 bits,
      9% at 4, 19% at 3, 45% at 2. Which statement best accounts for the shape of
      the degradation curve - a plateau followed by a cliff rather than a straight
      line - and names a cause of the cliff that is not about bit width?
    options:
      - text: >
          Each bit removed roughly doubles the perturbation (step = range/(2^b - 1),
          error std = step/sqrt(12)), but the model's response to perturbation is
          not linear: SGD converges to wide, flat basins, so loss damage goes like
          noise variance times the trace of the loss Hessian and stays negligible
          while the quadratic approximation holds - the plateau - and past that
          size distinct features collapse into the same level, which no downstream
          computation can undo. Independent of bit width, activation outliers -
          a few residual-stream channels 10-100x the rest - stretch a group's
          range and triple the step for the other 63 weights.
        correct: true
        explain: >
          This is the argument: error is exponential in bit width, the loss
          response is flat-then-steep, and outliers (with group size and which
          tensors are left in higher precision) produce cliff behaviour at a fixed
          bit width. It is why AWQ and GPTQ stay on the plateau where
          round-to-nearest does not.
      - text: >
          Each weight stores a fixed share of the model's facts, so halving the bit
          width halves the facts each weight can hold; the curve looks flat at
          first only because benchmarks are coarse, and 2 bits is simply where the
          fact budget finally falls below what the benchmarks probe.
        misconception: M16
        explain: >
          Bit-counting predicts a straight line, not a cliff, which is exactly what
          the question asks you to account for. Weights are not per-fact storage:
          4 bits is a ~9% perturbation of each weight, not an 87.5% deletion, and
          the 4-bit 35B model beats an fp16 9B with the same total bits.
      - text: >
          Below 4 bits the quantized values can no longer represent the largest
          weights, so entries clamp to the top code and rows of the weight matrix
          are effectively dropped; the cliff is where the number of surviving rows
          falls below what the network needs.
        misconception: M4
        explain: >
          Affine quantization sets s from the group's own max and min, so nothing
          clamps and no row is dropped - every weight is still present and moved by
          at most s/2. Treating the cliff as rows disappearing is the lookup-table
          model of parameters; the function is perturbed, not truncated.
      - text: >
          The cliff is a floating-point range problem: at 2 bits the scales and
          partial sums overflow fp16 accumulators, so activations blow up to NaN in
          the deeper layers. Keeping the norm layers in higher precision fixes it
          because they bound the activation magnitudes numerically.
        misconception: M7
        explain: >
          Nothing overflows: the dequantized weights span the same range as the
          originals whatever b is, and 2-bit models degrade smoothly into nonsense
          rather than producing NaNs. Norm layers matter for conditioning and for
          absorbing scale error, not as numerical guards.
      - text: >
          Low-bit models lose their post-training behaviour first, so the cliff is
          where the RLHF-installed knowledge is destroyed while the pretrained
          knowledge underneath survives; that is why the drop is sudden rather than
          gradual.
        misconception: M15
        explain: >
          Post-training shapes behaviour rather than storing a separable body of
          knowledge, and quantization damage does not partition that way. The
          observed signature is the opposite of a knowledge story: long multi-step
          outputs degrade first, short factual recall last.
    check: choice
    difficulty: stretch
    band: 5

  - id: u6-q11
    concept: c-specdec
    kind: constructed
    congruent: true
    callback_eligible: false
    difficulty: core
    prompt: >
      A speculative decoding setup drafts k = 6 tokens per step with a measured
      per-token acceptance rate alpha = 0.7. Expected tokens emitted per target
      forward pass is (1 - alpha^(k+1)) / (1 - alpha). Compute it. Answer as a
      bare decimal to two places.
    answer: "3.06"
    check: numeric(0.02)
    rubric: >
      Expected work: 0.7^7 = 0.08235; (1 - 0.08235)/0.3 = 3.0588.
      Diagnostic wrong answers: 2.94 means the learner used alpha^k rather than
      alpha^(k+1), dropping the bonus token the target's own forward pass
      provides at position k+1; 3.33 means they computed 1/(1-alpha) and ignored
      that k caps the run; 4.2 means they computed alpha*k, treating acceptances
      as independent draws rather than a run terminated by the first rejection.

  - id: u6-q12
    concept: c-specdec
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: >
      Target p = [0.5, 0.3, 0.2]; draft q = [0.6, 0.2, 0.2]. The draft samples x
      from q; x is accepted with probability min(1, p(x)/q(x)); on rejection a
      replacement is drawn from the normalized residual max(0, p - q). Suppose the
      draft is then swapped for a far worse one, q' = [0.05, 0.05, 0.90]. Which
      statement gives the emission probabilities under q and the correct account of
      what the swap changes?
    options:
      - text: >
          Acceptance is [0.8333, 1, 1], so drafted-and-accepted mass is
          [0.50, 0.20, 0.20] (total 0.90, rejection 0.10); the residual
          max(0, p - q) = [0, 0.1, 0] normalizes to [0, 1, 0], giving emissions
          [0.50, 0.30, 0.20] = p exactly. Under q' the accepted mass falls to
          sum min(p, q') = 0.05 + 0.05 + 0.20 = 0.30, so throughput drops toward
          one token per target pass, while the same cancellation makes the emission
          distribution exactly p again - exactness holds for any q.
        correct: true
        explain: >
          The two terms q(x)*min(1, p(x)/q(x)) and the residual sum to p(x) for
          every token, and the normalizing constant cancels, so the output is the
          target's distribution unconditionally. A bad draft costs acceptance rate,
          and therefore speed, and nothing else.
      - text: >
          Emissions under q are [0.53, 0.27, 0.20] - close to p but pulled toward
          the draft's over-weighting of token 1 - and under q' the pull becomes
          severe, so output quality degrades noticeably along with throughput.
        misconception: U6-1
        explain: >
          This is the central misreading. Compute it: 0.6 * 0.8333 = 0.50 exactly,
          and the residual contributes 0.10 * 1 = 0.10 to token 2, giving
          [0.50, 0.30, 0.20]. There is no blend and no residual bias to accumulate.
      - text: >
          Emissions are exactly p under q, because the rule keeps a drafted token
          only when the target model's argmax agrees with it and otherwise emits
          the target's argmax; under q' the argmax agrees far less often, so
          throughput falls but correctness is preserved.
        misconception: U6-5
        explain: >
          Argmax agreement is the obvious rule and it is not the one used, because
          it biases toward whichever model wins ties on near-flat distributions and
          emits the mode rather than a sample. The actual rule is stochastic:
          accept with probability min(1, p/q), else draw from the residual.
      - text: >
          Under q the emissions are p, but the guarantee depends on q being a
          reasonable approximation of p; with q' the acceptance probability
          min(1, p/q') exceeds 1 for tokens 1 and 2, the residual no longer
          normalizes, and the sampler falls back to emitting from q', so the output
          follows the draft.
        misconception: U6-1
        explain: >
          min(1, p/q') is capped at 1 by construction, so it never exceeds 1, and
          max(0, p - q') = [0, 0.25, 0] normalizes fine. The correctness proof uses
          no assumption about q at all - a uniform or adversarial draft still emits
          from p.
      - text: >
          Speculative decoding samples several tokens per pass, so it behaves like
          raising the temperature: emissions under q are p flattened toward
          uniform, and the worse draft q' flattens it further, which is why
          providers disable it when determinism matters.
        misconception: M6
        explain: >
          Nothing in the scheme rescales logits; the target's p is used as-is
          inside the acceptance test. Speculation changes how many tokens a forward
          pass yields, not the distribution each one is drawn from, which is why a
          provider can enable it without telling you.
    check: choice
    difficulty: stretch
    band: 5

  - id: u6-q13
    concept: c-specdec
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: warmup
    check: choice
    prompt: >
      Under what condition does speculative decoding stop being a win?
    options:
      - text: >
          When the machine is already compute-saturated, as under heavy batched
          serving, because there is no idle arithmetic capacity to reclaim.
        correct: true
        explain: >
          Correct. The technique converts spare compute into tokens by verifying
          k drafted positions in one pass. If the arithmetic units are already
          busy with other users' tokens, there is nothing spare to convert, and
          the draft model's cost is pure overhead. This is why providers run it
          for low-latency single-stream and disable it under load.
      - text: >
          When the draft model is poor, because the output quality degrades
          toward the draft model's quality.
        misconception: U6-1
        explain: >
          Output quality never degrades. The modified rejection sampling rule
          emits from the target's exact distribution for any draft whatsoever.
          A poor draft lowers the acceptance rate and therefore the speedup - it
          can make the technique a net loss on throughput, but the tokens it
          emits are the same tokens. This option is on the right track about
          poor drafts and wrong about what they cost you.
      - text: >
          When the context is long, because the draft model cannot maintain the
          full KV cache.
        misconception: M17
        explain: >
          The draft model maintains its own KV cache over the same tokens, and
          cache size is a memory cost, not a correctness or capability limit.
          The premise that a cache must be "maintained" as accumulated state
          rather than recomputed from tokens is the KV-cache-as-memory error.
      - text: >
          When temperature is above zero, because sampling randomness makes the
          drafted tokens impossible to verify.
        misconception: M6
        explain: >
          Backwards. The verification rule is defined in terms of the two
          distributions p and q, so it works at any temperature; greedy
          decoding is the degenerate case. Temperature is applied to both models
          before the acceptance test, and the exactness guarantee holds
          throughout.
