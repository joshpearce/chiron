# u2 math-floor: item bank.
# Pretest items are EXPECTED to fail - they are calibration plus pretesting
# effect, not assessment. Check items feed both this unit's terminal check and
# later units' cumulative checks (callback_eligible).

pretest:
  - id: u2-p1
    concept: c-softmax
    kind: mcq
    prompt: |
      A language model's output layer produces a value of 0.87 for one token.

      Which statement describes most precisely what that 0.87 is?
    options:
      - text: "The weight that token receives in a sampling distribution over the vocabulary, obtained by exponentiating and normalizing the logits, calibrated only against how often that token followed similar contexts in training data."
        correct: true
        explain: "Right. Softmax is a normalized exponential weighting of logits. In an output layer it parameterizes a sampling distribution over the vocabulary, and whatever calibration it has is to training-corpus frequencies, not to truth."
      - text: "The probability that this token is the correct continuation - the model is 87 percent likely to be right here."
        misconception: M2
        explain: "Attractive because the numbers are non-negative and sum to 1, and every library calls them probabilities. But a correctness probability cannot be moved by a knob applied after the forward pass; a temperature setting reshapes this number with no new evidence anywhere in the system."
      - text: "The model's internal confidence that it knows the answer, measured on its own belief scale."
        misconception: M2
        explain: "Attractive because a spread-out distribution looks like hedging. But the number is a frequency-shaped weighting over the vocabulary; nothing in the computation measures the model's belief about being right."
      - text: "The fraction of training documents in which this exact token followed this exact context."
        misconception: M4
        explain: "Attractive because it makes the number auditable, like a row count in a store. But parameters define a function, not a table of counts; the model assigns weight to continuations that appear nowhere in the data at all."
      - text: "The value that the model would report at temperature 0, since temperature 0 shows what it really believes."
        misconception: M6
        explain: "Attractive because temperature visibly changes behaviour. But temperature rescales fixed logits before sampling: at $T = 0$ the top option takes all the mass, so 0.87 is not what $T = 0$ reports, and no temperature reveals a hidden belief."
    check: choice

  - id: u2-p2
    concept: c-gradient
    prompt: |
      A tiny network computes $z = wx + b$, then $h = z^2$, then a loss
      $L = (h - y)^2$.

      With $x = 2$, $w = 1.5$, $b = -1$, and target $y = 5$, compute
      $\partial L / \partial w$.
    answer: -16
    check: numeric(0.001)

  - id: u2-p3
    concept: c-loss-surface
    kind: mcq
    prompt: |
      Two engineers train an identical architecture on identical data, changing
      only the random seed. The resulting weight tensors have essentially nothing
      in common, yet the two models score within noise of each other on every
      benchmark.

      Which run got closer to the minimum of the loss?
    options:
      - text: "The question has no answer: there is no single minimum being approached. The seed selects which of an enormous number of comparable low-loss regions the trajectory reaches, and matching held-out scores say the two regions are of comparable quality."
        correct: true
        explain: "Right. In a parameter space of $10^9$ to $10^{12}$ dimensions there are astronomically many good-enough low-loss regions. Neither run is 'closer' to anything; comparable performance is the only property that matters."
      - text: "Whichever run reached the lower final training loss - that one descended further toward the minimum."
        misconception: M5
        explain: "Attractive because school calculus was about convex bowls with one bottom, and 'optimization' implies an optimum. But if training converged on the global minimum, two seeds would land at matching weights; they never do, and both models work."
      - text: "The one with the smoother loss curve - it avoided getting trapped in local minima, which the other one fell into."
        misconception: U2-M4
        explain: "Attractive by extrapolation from the 2D picture, where a crater traps a downhill walker. But being trapped requires the surface to curve upward along all $d$ directions at once; with $d$ in the billions, almost every critical point is a saddle and minibatch noise walks off it."
      - text: "Neither, because both runs stopped early - given enough steps they would converge to the same weights."
        misconception: M5
        explain: "Attractive because it preserves the single-minimum frame by blaming the budget. But runs trained to convergence still end at wildly different weights, not close under any permutation, and both perform equally well."
      - text: "Whichever has the larger weights, since larger weights mean the model stored more of the training data."
        misconception: M11
        explain: "Attractive on a storage intuition: more capacity used, more learned. But capacity buys richer feature composition, not stored rows, and weight magnitude does not track held-out performance."
    check: choice

check:
  - id: u2-q1
    concept: c-matrix-transform
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A weight matrix $W$ has shape $512 \times 2048$, and it is applied as $Wx$
      with $x$ a column vector. During training a scalar loss $L$ is used.

      Which line is correct on all three counts - the input dimension, whether two
      distinct inputs can produce the same output, and the shape of
      $\partial L / \partial W$?
    options:
      - text: "Consumes $\\mathbb{R}^{2048}$, produces $\\mathbb{R}^{512}$; two distinct inputs must collide, because a 2048-dimensional space cannot map one-to-one into a 512-dimensional one; $\\partial L / \\partial W$ is $512 \\times 2048$."
        correct: true
        explain: "Right. Columns tell you what the map eats, rows what it emits. The output space is smaller, so the map cannot be injective - a 1536-dimensional family of inputs shares each output. And the gradient of a scalar with respect to a tensor has that tensor's shape."
      - text: "Consumes $\\mathbb{R}^{512}$, produces $\\mathbb{R}^{2048}$; distinct inputs must collide; $\\partial L / \\partial W$ is $512 \\times 2048$."
        misconception: U2-M6
        explain: "Attractive because the first number in a shape reads like 'the input size'. But $(Wx)_i = \\sum_{j=1}^{n} W_{ij} x_j$ runs $j$ over the columns, so the column count is the input dimension. Reading the type signature backwards is the wiring error shape-checking exists to catch."
      - text: "Consumes $\\mathbb{R}^{2048}$, produces $\\mathbb{R}^{512}$; distinct inputs collide only if the learned weights happen to be degenerate; $\\partial L / \\partial W$ is $512 \\times 2048$."
        misconception: U2-M6
        explain: "Attractive because degeneracy is the usual cause of collisions among square matrices. But here the shapes alone force it: no map into a 512-dimensional space can be injective on a 2048-dimensional one, whatever the entries are."
      - text: "Consumes $\\mathbb{R}^{2048}$, produces $\\mathbb{R}^{512}$; distinct inputs must collide; $\\partial L / \\partial W$ is a scalar, since $L$ is a scalar."
        misconception: U2-M5
        explain: "Attractive because one-variable calculus gives a derivative as a single number - a slope. But then the update $W \\leftarrow W - \\eta\\, \\partial L / \\partial W$ would subtract a scalar from a matrix, moving every weight identically forever. Each entry $(i,j)$ carries its own sensitivity."
      - text: "Consumes $\\mathbb{R}^{2048}$, produces $\\mathbb{R}^{512}$; distinct inputs must collide; $\\partial L / \\partial W$ is $2048 \\times 512$."
        misconception: U2-M6
        explain: "Attractive because gradients feel like they should transpose, the way a backward pass transposes weights. But frameworks use denominator layout precisely so the entrywise update is shape-correct: the gradient is $512 \\times 2048$, entry for entry with $W$."
    difficulty: core
    check: choice

  - id: u2-q2
    concept: c-matmul
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: warmup
    prompt: |
      In a forward pass you replace $W_2 W_1 x$ with $W_1 W_2 x$. Both matrices are
      square and the same size, so nothing raises a shape error. What have you
      done to the function the network computes?
    check: choice
    options:
      - text: "Changed it. Matrix multiplication does not commute, so $W_1 W_2$ and $W_2 W_1$ are different matrices and therefore different functions."
        correct: true
        explain: "Correct. Composition order is semantic. The two products differ in general, and only in special cases - both diagonal, one a scalar multiple of the identity, or the two matrices sharing a full set of eigenvectors - do they coincide. Learned weight matrices satisfy none of these."
      - text: "Nothing. Matrix multiplication is associative, so the order of the factors is flexible."
        misconception: U2-M3
        explain: "This conflates associativity with commutativity. Associativity says $(AB)C = A(BC)$ - you may regroup the parentheses freely, and that regrouping is a genuine and important optimization. It says nothing about swapping factors. $AB \\neq BA$ in general, and the swap here is a swap, not a regrouping."
      - text: "Nothing meaningful. Both are linear maps from $\\mathbb{R}^n$ to $\\mathbb{R}^n$, so they have the same type and compute the same kind of thing."
        misconception: U2-M6
        explain: "Same type signature, different implementation. This is the type-signature framing applied past its limit: shapes tell you the interface and nothing about behavior. `func(int) int` describes both increment and negate."
      - text: "Changed it, but the difference washes out during training because the weights are learned to compensate."
        misconception: U2-M3
        explain: "The question is about the function computed by a fixed set of weights, and that function changed. Retraining from scratch under the new ordering would indeed find some other set of weights, but that is a different network being trained, not the original network being unaffected - and it does not help you if you made this swap to an already-trained model."

  - id: u2-q3
    concept: c-dotprod
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A query $q = \begin{bmatrix} 2 \\ 1\end{bmatrix}$ is scored against three
      keys:

      $$k_1 = \begin{bmatrix} 3 \\ 0\end{bmatrix} \quad
      k_2 = \begin{bmatrix} 1 \\ 1\end{bmatrix} \quad
      k_3 = \begin{bmatrix} -1 \\ 2\end{bmatrix}$$

      The cosine similarities are 0.894, 0.949 and 0.000 respectively, so a
      different key wins on cosine than on raw dot product.

      Which line gives the three dot products and the right reason for the
      disagreement?
    options:
      - text: "$6$, $3$, $0$. $k_1$ wins on raw score because $\\lVert k_1\\rVert = 3$ against $\\lVert k_2 \\rVert = \\sqrt{2}$: the dot product is $\\lVert q\\rVert \\lVert k\\rVert \\cos\\theta$, so it confounds magnitude with alignment, and cosine divides the magnitudes out."
        correct: true
        explain: "Right. $k_2$ points more nearly along $q$ (0.949 against 0.894) but is shorter, so it loses the raw comparison on length alone. $k_3$ scores exactly 0 because it is perpendicular to $q$."
      - text: "$6$, $3$, $0$. $k_1$ wins on raw score because it is the most similar key to $q$; cosine similarity is a cruder approximation that has thrown away information."
        misconception: U0-M2
        explain: "Attractive because embedding databases store unit-length vectors, where the dot product and the cosine are literally the same number. That is a property of the normalization, not of the dot product: nothing here is normalized, so the score rewards $k_1$ for being long."
      - text: "$6$, $3$, $0$. $k_3$ scores zero because it has a negative component, and a negative entry cancels a positive one; nothing about direction is involved."
        misconception: U0-M2
        explain: "Attractive because the arithmetic does show $-2 + 2$. But the zero is geometric: $a \\cdot b = \\lVert a\\rVert \\lVert b\\rVert \\cos\\theta$ vanishes exactly when $\\theta = 90^\\circ$, and it stays zero however long $k_3$ is made."
      - text: "$6$, $3$, $0$. $k_1$ wins on raw score because it is closest to $q$ in the plane, and the dot product falls off with distance."
        misconception: U0-M6
        explain: "Attractive because 'nearest neighbour' is the operation you actually run in a vector store. But $\\lVert q - k_1 \\rVert = \\sqrt{2}$ while $\\lVert q - k_2 \\rVert = \\sqrt{1} = 1$, so $k_2$ is the nearer key and still scores lower. The dot product is not a distance."
      - text: "$5$, $3$, $0$. The disagreement is a rounding artefact in the quoted cosine values; on exact arithmetic the two rankings agree."
        misconception: U0-M2
        explain: "The first product is $q \\cdot k_1 = (2)(3) + (1)(0) = 6$, not 5. And the disagreement is real, not rounding: raw score ranks $k_1$ first, cosine ranks $k_2$ first, because only one of the two divides out the norms."
    difficulty: core
    check: choice

  - id: u2-q4
    concept: c-softmax
    kind: constructed
    congruent: true
    callback_eligible: true
    difficulty: core
    prompt: |
      Compute $\mathrm{softmax}(z)$ for $z = (1, 1, 0)$ by hand.

      Useful values: $e^{1} = 2.718$, $e^{0} = 1.000$.

      Report the smallest of the three probabilities, to three decimal places.
    answer: 0.155
    check: numeric(0.005)

  - id: u2-q5
    concept: c-softmax
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: warmup
    prompt: |
      A model assigns 0.62 to token A and 0.31 to token B at the next position.
      Which statement is defensible?
    check: choice
    options:
      - text: "Weighted by the training distribution, continuations like A were roughly twice as frequent as continuations like B in contexts resembling this one. Both numbers depend on a temperature setting applied after the model finished computing."
        correct: true
        explain: "Correct. Softmax output is a normalized exponential weighting of logits, and what it tracks is corpus frequency in similar contexts. The ratio 0.62/0.31 = 2 corresponds to a logit gap of $\\ln 2 \\approx 0.69$ at $T = 1$, and a different temperature would give a different ratio from the same logits."
      - text: "The model is 62 percent confident that A is the correct continuation and 31 percent confident that B is."
        misconception: M2
        explain: "This reads the numbers as correctness probabilities. The failing prediction: a correctness probability cannot be moved without new evidence, yet setting temperature to 0.5 changes 0.62 to roughly 0.80 with the model's computation bit-identical. A quantity a config flag can move is not measuring correctness."
      - text: "A is twice as likely to be correct as B, since 0.62 is about twice 0.31."
        misconception: M2
        explain: "The ratio is real and it does equal $e^{\\Delta z}$ for the logit gap, so the arithmetic is sound. The word 'correct' is the error - the ratio is a ratio of sampling weights, not of correctness odds, and it too moves with temperature."
      - text: "There is a 7 percent chance the model does not know the answer, since 0.62 + 0.31 = 0.93."
        misconception: M2
        explain: "The remaining 0.07 is spread across every other token in a vocabulary of 100k or more. There is no 'does not know' bucket - softmax always produces a full distribution over the entire vocabulary, and every token gets strictly positive mass because $e^{z} > 0$ for all real $z$."

  - id: u2-q6
    concept: c-softmax
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Someone proposes replacing softmax with "square each logit and divide by the
      sum of squares", on the grounds that it is cheaper and still produces
      non-negative numbers summing to 1.

      Which line pairs a counterexample that kills the proposal with the
      requirement that forces an exponential specifically?
    options:
      - text: "$z = (2, 1, 0)$ and $z = (-2, 1, 0)$ both give $(0.8, 0.2, 0.0)$, so the lowest-scored option takes the most weight. The forcing requirement is that only score differences may matter - $f(z_i)/f(z_j) = g(z_i - z_j)$, reducing to $g(s+t) = g(s)g(t)$, whose only continuous positive solutions are $g(s) = e^{\\beta s}$."
        correct: true
        explain: "Right. Squaring is not monotone on the reals: it folds the negative half onto the positive half and discards sign. And shift-invariance is what singles out the exponential, because logits come from an unconstrained linear layer and have no absolute zero - nothing distinguishes $z$ from $z + c\\mathbf{1}$, and $e^{c}$ cancels between numerator and denominator."
      - text: "$z = (2, 1, 0)$ and $z = (-2, 1, 0)$ both give $(0.8, 0.2, 0.0)$, so the lowest-scored option takes the most weight. The forcing requirement is that the weights be non-negative, which $e^{z} > 0$ guarantees for every real $z$."
        misconception: U2-M1
        explain: "The counterexample is right, but positivity does not discriminate: $|z_i| / \\sum_j |z_j|$ is also non-negative and also sums to 1, and it is also wrong. Positivity is satisfied by many maps; turning differences into ratios is satisfied by exactly one family."
      - text: "Squaring is fine on monotonicity but overflows on large logits. The exponential is chosen because $e^{z}$ with the max subtracted is the numerically stable way to normalize scores."
        misconception: M7
        explain: "This inverts cause and effect. Exponentiating is what creates the overflow risk; subtracting $\\max_j z_j$ is free repair, provably leaving the output unchanged. And squaring does fail monotonicity - $(2,1,0)$ and $(-2,1,0)$ give identical weights."
      - text: "No counterexample exists for three logits; the proposal only breaks once the vocabulary is large. Softmax is preferred because its outputs are genuine probabilities of correctness and squared weights are not."
        misconception: M2
        explain: "Three logits are enough: $(2,1,0)$ and $(-2,1,0)$ both give $(0.8, 0.2, 0.0)$. And softmax outputs are not correctness probabilities either - a temperature knob reshapes them with no new evidence, which is exactly what a correctness probability could not do."
      - text: "$z = (2, 1, 0)$ and $z = (-2, 1, 0)$ both give $(0.8, 0.2, 0.0)$. The forcing requirement is that the map be differentiable everywhere, which squaring fails at zero."
        misconception: U2-M1
        explain: "The counterexample is right, but the diagnosis is not: $z^2$ is differentiable everywhere, including at zero - it is $|z|$ that has the kink. Differentiability is a requirement softmax must meet, but it is shift-invariance that picks out the exponential uniquely."
    difficulty: stretch
    check: choice

  - id: u2-q7
    concept: c-softmax
    kind: constructed
    congruent: true
    callback_eligible: false
    difficulty: core
    prompt: |
      Logits $z = (4, 2, 0)$ are softmaxed at temperature $T = 2$.

      Divide by $T$ first, then exponentiate. Useful values: $e^{2} = 7.389$,
      $e^{1} = 2.718$, $e^{0} = 1.000$.

      Report the largest of the three probabilities, to three decimal places.
    answer: 0.665
    check: numeric(0.005)

  - id: u2-q8
    concept: c-gradient
    kind: constructed
    congruent: true
    callback_eligible: true
    difficulty: core
    prompt: |
      Let $f(a, b) = a^2 b + 2b^2$.

      Compute $\nabla f$ at $(a, b) = (3, 1)$. Take the partial with respect to $a$
      holding $b$ fixed, then the partial with respect to $b$ holding $a$ fixed.

      Answer in the form `[df/da, df/db]`.
    answer: "[6, 13]"
    check: exact

  - id: u2-q9
    concept: c-gradient
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A network computes $z = wx + b$, then $h = z^2$, then $L = (h - y)^2$.

      With $x = 4$, $w = 1$, $b = -2$, $y = 1$, the forward pass gives $z = 2$,
      $h = 4$, $L = 9$.

      Which line gives $\partial L / \partial w$ and $\partial L / \partial b$
      together with the right reading of the sign?
    options:
      - text: "$\\partial L/\\partial w = 96$ and $\\partial L/\\partial b = 24$, from local factors $\\partial L/\\partial h = 6$, $\\partial h/\\partial z = 4$, and $\\partial z/\\partial w = 4$ or $\\partial z/\\partial b = 1$. Positive means the update $w \\leftarrow w - \\eta\\,\\partial L/\\partial w$ decreases $w$, which agrees with $h = 4$ overshooting $y = 1$."
        correct: true
        explain: "Right. $\\partial L/\\partial h = 2(4-1) = 6$, $\\partial h/\\partial z = 2z = 4$, and the two paths differ only in the last factor. Since $h$ is above the target, we want $z$ smaller, hence $w$ smaller - the sign agrees with the forward values."
      - text: "$\\partial L/\\partial w = -96$ and $\\partial L/\\partial b = -24$. Negative means increasing $w$ reduces the loss, so the update raises $w$ toward the target."
        misconception: U2-M2
        explain: "Attractive because the worked example came out negative and the shape of the computation looks the same. But there $h = 4$ was below $y = 5$; here $h = 4$ is above $y = 1$, so $\\partial L/\\partial h = 2(h-y) = +6$ and the whole chain is positive. Sign-checking against the forward values catches this in ten seconds."
      - text: "$\\partial L/\\partial w = 96$ and $\\partial L/\\partial b = 96$. Both parameters feed the same node $z$, so they inherit the same sensitivity; positive means the update decreases both."
        misconception: U2-M5
        explain: "Attractive because $w$ and $b$ do share the upstream factors $\\partial L/\\partial h$ and $\\partial h/\\partial z$. But the last factor differs: $\\partial z/\\partial w = x = 4$ while $\\partial z/\\partial b = 1$, giving 96 against 24. The bias is not multiplied by the input."
      - text: "$\\partial L/\\partial w = 96$ and $\\partial L/\\partial b = 24$. The large gradient on $w$ shows $w$ is the more important parameter of the two, and the sign says the loss is currently heading upward."
        misconception: U2-M5
        explain: "The numbers are right and the sign reading is not. A partial derivative is a local sensitivity at this exact point, not an attribution of importance - $w$'s factor is larger only because it multiplies $x = 4$. And the sign says increasing $w$ would increase $L$, so the update moves $w$ down; the loss under the update falls."
      - text: "$\\partial L/\\partial w = 24$ and $\\partial L/\\partial b = 96$, since $\\partial z/\\partial b$ carries the input $x = 4$ and $\\partial z/\\partial w$ is 1. Positive means the update decreases both."
        misconception: U2-M6
        explain: "The two paths have been swapped. In $z = wx + b$, differentiating with respect to $w$ leaves $x = 4$ and differentiating with respect to $b$ leaves 1, so the weight gets 96 and the bias 24 - which is most of why input normalization matters."
    difficulty: core
    check: choice

  - id: u2-q10
    concept: c-gradient
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: warmup
    prompt: |
      You are at a point on a loss surface and you compute the gradient. What does
      it tell you?
    check: choice
    options:
      - text: "The direction of steepest increase at this exact point, and the rate of increase in that direction. Both are local and change as soon as you move."
        correct: true
        explain: "Correct. The gradient is the vector representing the local linear approximation. Its direction maximizes the directional derivative and its length is that maximum rate. One step later, both differ."
      - text: "The direction from here to the nearest minimum, so you can head straight for it."
        misconception: U2-M2
        explain: "The gradient carries no information about where any minimum is - it is computed entirely from the surface at your current point. In a long narrow valley the negative gradient points across the valley toward the opposite wall rather than along it toward the bottom, which is precisely why gradient descent zigzags and why momentum exists."
      - text: "How much each parameter contributes to the current loss, so the largest components identify the parameters that matter most."
        misconception: U2-M5
        explain: "A partial derivative is a sensitivity, not an attribution: it says how much the loss would move per unit change in that parameter right now. A parameter can have a large gradient and a negligible role - a large gradient most often means the parameter is badly set. Attribution and sensitivity are different questions."
      - text: "The distance remaining to convergence, since the gradient magnitude shrinks as you approach the optimum."
        misconception: U2-M2
        explain: "The gradient does vanish at critical points, but small gradients also occur on plateaus and at saddles, which dominate high-dimensional surfaces. Gradient magnitude is a poor convergence signal and no framework uses it as one."

  - id: u2-q11
    concept: c-loss-surface
    kind: mcq
    congruent: true
    callback_eligible: true
    difficulty: core
    prompt: |
      A colleague proposes: "Let us run 50 seeds and keep the model with the lowest
      final training loss, since that one got closest to the true minimum."

      Which response is correct on both counts - the framing and the selection
      procedure?
    options:
      - text: "Both halves are wrong: there is no single true minimum being approached (the surface has astronomically many distinct low-loss regions and the seed selects among them), and selecting on training loss selects for memorization - select on validation or benchmark performance instead."
        correct: true
        explain: "Both errors named. 'Closest to the minimum' is not a quantity any run has: permutation symmetry alone means functionally identical networks can have completely different weights. And the run that fit its training set hardest is anticorrelated with held-out performance past a point, so held-out loss is the criterion. A small spread across seeds is expected; a large one is a finding about the setup, not a seed to cherry-pick."
      - text: "The framing is fine - runs do approach the minimum at different rates - but the selection should use validation loss rather than training loss."
        misconception: M5
        explain: "Attractive because the practical instinct is sound: validation loss is indeed the right criterion. But it keeps the single-minimum frame. SGD finds one of astronomically many good-enough low-loss regions; two seeds land in different ones and both work, so no run is 'closer' to anything."
      - text: "The proposal is sound: lower final training loss means the run found a deeper basin, so it is the better model."
        misconception: M18
        explain: "Treats loss as monotonically better all the way down, with no floor and no overfitting regime. Cross-entropy has an irreducible floor set by the entropy of the data; a training loss driven unusually low is a symptom of memorization, not depth of basin."
      - text: "Running many seeds is pointless: with enough parameters every seed converges to the same function, so the 50 runs will have near-identical training loss anyway."
        misconception: U2-M4
        explain: "Inverts the dimensionality argument. High dimension does not funnel every trajectory to one answer; it makes distinct low-loss regions abundant. Seeds land in different regions with different weights, and scores agree only within noise."
      - text: "The framing is wrong because more parameters means more local minima, so with 50 seeds most runs are trapped - keep the lowest-loss one as the only escapee."
        misconception: U2-M4
        explain: "Extrapolates the 2D crater picture. Entrapment requires upward curvature along all $d$ directions at once, so it gets rarer with scale, not commoner; nearly every critical point is a saddle and minibatch noise walks off it."
    check: choice

  - id: u2-q12
    concept: c-loss-surface
    kind: mcq
    congruent: true
    callback_eligible: true
    difficulty: stretch
    prompt: |
      At a critical point of the loss, the surface curves either up or down along
      each of the $d$ parameter directions. The point is a local minimum only if it
      curves up along all $d$ of them.

      Treat the $d$ directions as independent fair coin flips, and take
      $d = 10^{9}$. Which statement gets all three of these right: the probability
      that a given critical point is a local minimum, what that implies about the
      folk claim that more parameters means more traps, and what training actually
      struggles with once the false independence assumption is dropped?
    options:
      - text: "$2^{-10^{9}} \\approx 10^{-301029996}$; the folk claim is backwards, since entrapment is a conjunction over all $d$ directions and each added dimension roughly halves its probability; real curvature is strongly correlated (a few large Hessian eigenvalues, a long near-zero tail), so the difficulty is plateaus and ill-conditioning rather than traps."
        correct: true
        explain: "All three. The probability is zero for every practical purpose, so local minima are vanishingly rare above the very bottom of the loss range and nearly every critical point is a saddle with an escape direction that minibatch noise finds. Dropping independence does not restore traps: it gives vast low-gradient plateaus and valleys whose largest-to-smallest curvature ratio is enormous, which is what momentum and adaptive per-parameter step sizes exist for - not 'escaping local minima'."
      - text: "$2^{-10^{9}}$, so traps are rare in the idealized model - but real curvature is correlated, which restores the folk claim: correlated directions curve up together, so large models are riddled with local minima and momentum exists to escape them."
        misconception: U2-M4
        explain: "Gets the arithmetic and then smuggles the trap story back in through correlation. Correlated curvature produces a few large eigenvalues and a long near-zero tail - flat and ill-conditioned, not walled in. Momentum and Adam address conditioning and plateaus; escaping minima is not their job."
      - text: "About $1/(2 \\times 10^{9})$; the probability shrinks only linearly in $d$, so a billion-parameter model still meets many local minima, and training struggles mainly with getting trapped in them."
        misconception: U2-M4
        explain: "Reads the conjunction as if the chances added rather than multiplied. All $d$ directions must curve up simultaneously, giving $2^{-d}$, not $1/(2d)$ - the difference is the whole argument."
      - text: "$2^{-10^{9}}$, so essentially every critical point is a saddle and gradient descent stalls on them; with local minima ruled out, what training struggles with is that descent halts at saddles and needs random restarts to continue."
        misconception: M5
        explain: "Right on (a) and (b), wrong on what remains. A saddle stalls descent only if you land exactly on it; minibatch gradient noise walks off it, and restarts are unnecessary. The residual difficulty is plateaus and ill-conditioning."
      - text: "The probability cannot be stated, because a billion-parameter loss surface has a single global minimum that SGD converges to; the coin-flip model applies only to toy problems."
        misconception: M5
        explain: "Keeps 'the minimum' as a real destination. Different seeds end at wildly different weights that no permutation matches, and both models work - evidence that SGD finds one of many good-enough regions rather than converging on one point."
    check: choice

  - id: u2-q13
    concept: c-loss-surface
    kind: mcq
    congruent: false
    callback_eligible: false
    difficulty: core
    prompt: |
      A pretraining run's loss has flattened out well above zero and will not go
      lower with more compute. What is the most likely reading?
    check: choice
    options:
      - text: "It is approaching the irreducible entropy of the data, which is the floor for this objective. The meaningful question is how large the gap to that floor is, not the gap to zero."
        correct: true
        explain: "Correct. Cross-entropy decomposes into the data's own entropy plus a divergence term. Training can drive the divergence toward zero and can never touch the entropy. Scaling laws encode this as an explicit fitted irreducible term."
      - text: "The model has hit its capacity ceiling. Adding parameters would push the loss toward zero."
        misconception: M18
        explain: "Capacity is a real constraint and more parameters do lower the loss, but toward the floor rather than toward zero. Scaling laws show loss approaching an irreducible constant asymptotically; no parameter count crosses it, because the remaining loss is a property of language, not of the model."
      - text: "Something is wrong with the optimizer - it is stuck in a local minimum, which is why the loss will not fall further."
        misconception: M5
        explain: "Local minima are vanishingly rare in high dimension, and a plateau at a sensible loss value looks nothing like entrapment. This reads a normal approach to the floor as an optimization failure."
      - text: "The remaining loss is the model's error rate. A loss of 2.0 means it gets the next token wrong most of the time."
        misconception: M18
        explain: "Loss is not an error rate; it is average negative log probability assigned to the observed token, in nats. A loss of 2.0 means the model puts roughly $e^{-2} \\approx 0.135$ on the actual next token on average, which for a vocabulary of 100k is very good. And even a perfect model has nonzero loss, because multiple continuations are genuinely valid."
