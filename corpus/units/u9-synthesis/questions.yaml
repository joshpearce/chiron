  - id: u9-q13
    concept: c-full-trace
    kind: constructed
    congruent: true
    callback_eligible: true
    transfer: true
    spans: [u5, u6, u8]
    difficulty: stretch
    prompt: |
      A team needs to convert messy free-text incident reports into a strict JSON
      schema, at high volume. They benchmark two options:

      - A 70B general model, prompted with the schema plus 12 few-shot examples
        (~4,000 tokens of instruction per call).
      - A 7B model fine-tuned on 40,000 of their own (report, JSON) pairs,
        prompted with just the report.

      The 7B beats the 70B on schema validity and field accuracy, and costs
      dramatically less per call.

      Explain why, using the trace. Address: what fine-tuning changed and what it
      did not, why the prompt-length difference matters in two separate ways, and
      what task property makes this result NOT generalize to, say, debugging an
      unfamiliar distributed system.
    answer: |
      What fine-tuning changed: the task is format conformance, which is exactly
      what post-training shapes. Forty thousand in-domain examples make the exact
      token sequences of their schema overwhelmingly likely continuations of a
      report - it is reshaping the conditional distribution over output tokens,
      not installing new capability. The 7B already had the linguistic competence
      to read an incident report; what it lacked was the prior that THIS output
      shape follows THAT input shape. That is cheap to install and it is where
      post-training's leverage lives.

      What fine-tuning did not change: the 7B's underlying reasoning and world
      knowledge, which remain far below the 70B's. Pretraining set that and 40k
      examples cannot move it.

      Why prompt length matters twice: (1) prefill cost is roughly proportional to
      2 x active params x tokens, so 4,000 instruction tokens against a 70B is
      about 5.6e14 FLOPs before any output, versus a few hundred tokens against a
      7B - two orders of magnitude apart, and it recurs on every single call.
      (2) The 12 few-shot examples must be attended to from the output positions
      every step; the fine-tuned model has the same information baked into weights
      that are read as part of the fixed 3.5 GB (at 4-bit) weight stream it was
      going to read anyway. In-context instruction is paid per call; in-weight
      instruction is free at inference.

      The task property: narrow, high-volume, stable output distribution, with the
      difficulty concentrated in FORM rather than in reasoning depth. Reverse each
      of those and the result inverts. Debugging an unfamiliar distributed system
      is open-ended, low-volume, has no stable output distribution to learn, and
      the difficulty is entirely in reasoning over novel combinations - which is
      pretraining-scale capability, exactly the thing the 7B does not have and
      fine-tuning cannot supply.
    check: llm
    rubric: |
      MUST contain: (1) the task is format/behavior shaping, which is what
      post-training does well, versus capability, which comes from pretraining
      (M15 applied correctly and in the direction that is genuinely true);
      (2) the prefill cost of long instruction prompts is paid on every call and
      scales with active params x tokens; (3) an explicit statement of the
      boundary condition - narrow, stable, form-dominated tasks only.
      Pass = (1) and (3). Full = all three, ideally with the in-context vs
      in-weight cost framing.
      Characteristic errors: "the 7B knows their domain better" as an unqualified
      knowledge claim = M15 inverted; the 7B does not know more, it is shaped
      better. "Smaller models are more accurate" = overgeneralizing the result,
      which the third part of the question exists to catch. An answer that gets
      the cost argument but not the boundary condition is exactly the answer that
      leads a team to fine-tune a 7B for their agent framework and fail.
  - id: u9-q14
    concept: c-full-trace
    kind: constructed
    congruent: true
    callback_eligible: true
    transfer: true
    spans: [u6, u7]
    difficulty: stretch
    prompt: |
      A team deploys speculative decoding: a 1B draft model proposes 4 tokens,
      the 200B MoE target verifies all 5 positions in one pass. They measure a
      2.8x speedup on customer-support chat.

      They then apply the identical setup to two new workloads and are surprised
      both times:

      (a) Bulk document summarization, where prompts average 60,000 tokens and
          outputs average 200 tokens. End-to-end throughput improves by under 5%.
      (b) Highly technical code generation in an unusual internal DSL. Speedup
          drops to 1.1x, and per-token latency during rejection-heavy stretches is
          slightly WORSE than without speculation.

      Explain both, mechanistically. For (b), state the quantity that collapsed
      and why this workload collapses it.
    answer: |
      (a) Speculative decoding only accelerates decode. On this workload, 60,000
      tokens of prefill dominate end-to-end time: prefill is compute-bound and
      costs on the order of 2 x active params x 60,000 FLOPs plus a quadratic
      attention term, while decode is only 200 tokens. Speeding up a phase that
      was already a small fraction of wall clock yields a small fraction of a
      speedup - Amdahl, with the twist that the two phases are limited by
      different resources. There is nothing to amortize in prefill: it is already
      compute-saturated, which is precisely the condition under which verifying
      extra tokens is NOT free.

      (b) The quantity that collapsed is the acceptance rate. Expected tokens per
      target pass is $(1 - \alpha^{\gamma+1})/(1 - \alpha)$; at $\alpha = 0.8,
      \gamma = 4$ that is 3.36, at $\alpha = 0.3$ it is about 1.43. An unusual
      internal DSL is exactly the distribution where a 1B general draft model
      disagrees with a 200B target most: the target's next-token distribution is
      shaped by subtle in-context conventions the draft has neither the capacity
      nor the exposure to reproduce. Every rejected token still cost draft-model
      compute, so at low acceptance you pay the draft's latency for almost no
      extra accepted tokens - hence slightly worse than baseline.

      Fixes worth naming: for (b), fine-tune the draft on the DSL, or use
      self-speculation (early-exit layers of the target) so draft and target
      distributions are correlated by construction; also reduce $\gamma$, since
      long speculative runs waste more on rejection. For (a), speculative decoding
      is simply the wrong tool - attack prefill with prefix caching, chunked
      prefill, or a cheaper attention kernel.
    check: llm
    rubric: |
      MUST contain: (a) speculative decoding helps only decode, and prefill
      dominates a 60k-token/200-token workload; bonus for noting prefill is
      already compute-bound so extra verified positions are not free there.
      (b) acceptance rate is the collapsed quantity, with the reason being
      distributional mismatch between a small general draft and the target on an
      unusual distribution; and the observation that rejected drafts still cost
      draft compute, so low acceptance can go below baseline.
      Pass = correct mechanism for both, even without the formula. Full = includes
      the acceptance-rate reasoning quantitatively or names a concrete remedy.
      Characteristic errors: "the target model is slower on hard tokens" - the
      target's per-token cost is fixed by weight bytes, not by difficulty; this is
      U9-M3 wearing a disguise. "Speculation loses accuracy on hard tasks" -
      standard speculative decoding is distribution-preserving; quality is
      unchanged, only speed varies. Marking that correct would install a serious
      false belief.
  - id: u9-q15
    concept: c-full-trace
    kind: constructed
    congruent: true
    callback_eligible: true
    transfer: true
    spans: [u3, u6, u7]
    difficulty: stretch
    prompt: |
      You are sizing a serving cluster. A colleague argues: "Decode is
      memory-bound at batch size 1, so just raise the batch size. Batching
      amortizes the weight read across requests, so with batch 64 we get 64x the
      throughput at the same latency. Memory bandwidth stops being the
      bottleneck."

      Assume the model is the one from the unit: 22B active of 235B total, 4-bit
      weights (11 GB active read per token), KV cache of 256 KB per token per
      request, 2 TB/s bandwidth, 450 TFLOP/s.

      Evaluate the argument. Identify the batch size at which the reasoning stops
      holding for 8,192-token contexts, show the arithmetic, and name one MoE
      specific effect that batching introduces which a dense model would not have.
    answer: |
      The premise is right and the conclusion overreaches in three ways.

      Right: the weight read is shared across the batch, so bytes per token fall
      from 11 GB to 11 GB / b, and arithmetic intensity rises roughly linearly
      with b. Throughput does climb steeply at small b.

      Where it stops. Per decode step, bytes read = 11 GB (weights, shared) +
      b x 8,192 x 256 KB (KV cache, NOT shared - every request has its own).
      Per request the KV is 8,192 x 262,144 = 2.15 GB. Setting the KV term equal
      to the weight term: b x 2.15 GB = 11 GB, so b is about 5. Past roughly
      batch 5 at this context length, the KV cache is the majority of the bytes
      moved, and since it scales WITH the batch it does not amortize at all.
      Beyond that point throughput gains flatten hard - you are back to
      bandwidth-bound, just against a different array.

      Second limit: latency is not preserved. Batched requests share a forward
      pass, so per-token latency for any individual user is set by the whole
      batch's step time, and queueing to assemble batches adds more. Throughput
      and latency are being traded, not both won.

      Third limit: HBM capacity. At batch 64 and 8k context the KV cache alone is
      64 x 2.15 GB = 138 GB, on top of ~118 GB of weights. That does not fit on a
      single accelerator, which is why paged attention and KV quantization exist.

      MoE-specific effect: with batch 1, one token selects 8 of 128 experts and
      only those weights are read. As the batch grows, the union of experts
      selected across the batch approaches all 128, so the effective weights read
      per step climbs from 11 GB toward 118 GB. MoE's decode advantage erodes with
      batch size - a dense model has no such term. It also creates load imbalance:
      the step waits on whichever expert received the most tokens, and when
      experts are sharded across devices it adds an all-to-all exchange per layer.
    check: llm
    rubric: |
      MUST contain: (1) the weight read amortizes across the batch but the KV
      cache does not, because each request owns its own; (2) the crossover
      arithmetic - per-request KV of ~2.15 GB at 8k context against 11 GB of
      weights gives b of about 5 (accept 4-6, or any correct derivation with
      stated assumptions); (3) the MoE-specific effect that the union of selected
      experts grows with batch size, eroding the active-parameter advantage.
      Pass = (1) and (2). Full = all three; extra credit for latency-vs-throughput
      and for HBM capacity.
      Characteristic errors: "batching makes it compute-bound so bandwidth stops
      mattering" without the KV term = the exact error the item targets.
      "Each request in the batch uses different experts so they can be routed to
      different GPUs cleanly" = M12, treating routing as stable per request rather
      than per token.
  - id: u9-q16
    concept: c-full-trace
    kind: mcq
    congruent: false
    callback_eligible: true
    spans: [u1, u3]
    difficulty: warmup
    prompt: |
      Asked how many times the letter "r" appears in "strawberry", a strong model
      often answers 2. What is the best mechanistic account?
    options:
      - text: |
          The word arrives as a small number of subword tokens, so the individual
          characters are never separate objects in the computation; the model must
          infer spelling from statistical associations attached to whole-token
          embeddings.
        correct: true
        explain: |
          Correct. Tokenization happens before anything else in the trace and is
          irreversible from the model's side. Counting characters requires
          information the input representation does not expose per-position, so
          the model approximates from co-occurrence rather than counting.
      - text: |
          The embedding for "strawberry" encodes the concept of the fruit but not
          its spelling, because embeddings store meaning rather than surface form.
        misconception: M3
        explain: |
          Gets the outcome right by way of a wrong model. Embeddings do not store
          meaning OR spelling - they are positions in a learned geometry. Spelling
          information is in fact partially recoverable from embeddings; the
          limitation is that characters are not separately addressable positions,
          not that the vector "contains meaning."
      - text: |
          The model has not memorized this particular word's letter counts;
          a larger model with more parameters would have the count stored.
        misconception: M4
        explain: |
          The lookup-table model. Scale does improve this behavior somewhat, but
          not by storing more counts - by better inferring structure. A model that
          had memorized the answer for "strawberry" would still fail on a novel
          string, which is the actual test and which memorization cannot pass.
      - text: |
          Attention cannot look at individual characters because the causal mask
          restricts each position to seeing earlier positions only.
        misconception: M9
        explain: |
          Conflates two unrelated things. The causal mask restricts which
          POSITIONS attend to which, and the whole word is available in the prompt
          anyway. The obstacle is that characters were never assigned separate
          positions, which happened at tokenization, long before any masking.
  - id: u9-q17
    concept: c-full-trace
    kind: constructed
    congruent: true
    callback_eligible: true
    transfer: true
    spans: [u3, u6, u8]
    difficulty: stretch
    prompt: |
      Your team's agent sends this prompt structure on every turn:

        1. Timestamp and session ID (20 tokens, changes every turn)
        2. Tool schemas (3,000 tokens, static for months)
        3. CLAUDE.md project instructions (2,000 tokens, static for days)
        4. Conversation history (grows, append-only)
        5. Current user message

      The bill is dominated by input tokens and time-to-first-token is bad.
      Someone proposes moving the tool schemas to position 5, "since they are
      rarely relevant and the model reads the recent stuff more carefully."

      Evaluate the proposal, and give the change that would actually help most.
      Quantify the current waste.
    answer: |
      The proposal is wrong on the stated reason and wrong on the effect, but it
      accidentally points near the real bug.

      Current waste: the timestamp at position 1 changes every single turn. Prefix
      cache validity requires an unbroken identical prefix from token 0, so a
      change at position 20 invalidates every cached KV entry from position 20
      onward - which is the entire prompt. Every turn re-prefills all 5,000+
      tokens of static content plus the whole history at full price, and bills them
      as fresh input tokens. Twenty volatile tokens are destroying the cacheability
      of thousands of static ones, and the cost is paid per turn for the life of
      the session. Providers also block-align cache boundaries (commonly 128 or
      256 tokens), so in practice the invalidation starts at the enclosing block.

      Why the proposal fails: moving the schemas to the end does not help
      cacheability at all - the timestamp still sits at position 1 and still
      invalidates everything. It also makes things worse structurally, because
      static content moved later can be invalidated by anything volatile placed
      before it. And the premise is confused: "reads the recent stuff more
      carefully" is a recency bias in learned behavior, not an architectural
      property, and every position in the prompt is attended to by every output
      position regardless of order.

      The change that helps most: move the timestamp and session ID to the END,
      immediately before the user message, and order everything by mutation
      frequency ascending - tool schemas, then CLAUDE.md, then history, then
      volatile metadata, then the user turn. That makes the first ~5,000 tokens a
      stable prefix that survives across every turn of every session, and turns
      most turns into an incremental prefill of only the newly appended tokens.
      Rough effect: at 5,000 static tokens against 22B active params, each turn
      currently burns about 2 x 22e9 x 5,000 = 2.2e14 FLOPs (~0.5 s) reproducing
      identical keys and values, plus billing those tokens at the uncached rate,
      typically ~10x the cached rate.
    check: llm
    rubric: |
      MUST contain: (1) identification of the volatile timestamp at position 1 as
      the actual defect, because prefix cache validity requires an identical
      prefix from token 0; (2) rejection of the proposal - reordering the schemas
      does nothing while the timestamp leads, and the "reads recent stuff more
      carefully" premise is a learned bias, not an architectural fact about
      attention; (3) the correct fix - order by mutation frequency ascending,
      volatile content last.
      Pass = (1) and (3). Full = all three with a quantified estimate.
      Characteristic errors: accepting the proposal's premise that later content is
      attended to more strongly as an architectural claim = confuses learned
      behavior with mechanism. Proposing to shorten the schemas as the primary fix
      = treats the symptom (token count) rather than the cause (cache
      invalidation); shortening helps linearly, fixing the prefix helps by an
      order of magnitude. Claiming the cache survives because the timestamp is
      "semantically unimportant" = M17, the cache is keyed on tokens and
      positions, not meaning.
