# The source index: open material the book builder may adapt, with the
# licence each was read under and how to fetch it. Drawn from OPEN-SOURCES.md;
# every A entry with a fetch recipe is reachable by server-go/sources.
# Verdict: A adaptable, Q quotation only, R restricted (never fetched).
sources:
- id: d2l
  title: Dive into Deep Learning
  authors:
  - Aston Zhang
  - Zachary Lipton
  - Mu Li
  - Alexander Smola
  subjects:
  - deep-learning
  - machine-learning
  - neural-networks
  - transformers
  - attention
  - optimization
  - python
  verdict: A
  licence:
    name: CC BY-SA 4.0
    url: https://github.com/d2l-ai/d2l-en/blob/master/LICENSE
    checked: '2026-09-05'
  voice: Direct, code-first, every idea followed by a runnable example; a real authorial voice.
  format: Markdown with code cells on GitHub
  exercises: Exercises at the end of every section, no official solutions.
  fetch:
    kind: github
    repo: d2l-ai/d2l-en
    ref: master
    path: '{locator}'
  contents:
  - locator: chapter_introduction/index.md
    title: Introduction
  - locator: chapter_preliminaries/ndarray.md
    title: Data Manipulation
  - locator: chapter_preliminaries/linear-algebra.md
    title: Linear Algebra
  - locator: chapter_preliminaries/calculus.md
    title: Calculus
  - locator: chapter_preliminaries/autograd.md
    title: Automatic Differentiation
  - locator: chapter_preliminaries/probability.md
    title: Probability and Statistics
  - locator: chapter_linear-regression/linear-regression.md
    title: Linear Regression
  - locator: chapter_linear-regression/linear-regression-scratch.md
    title: Linear Regression Implementation from Scratch
  - locator: chapter_linear-regression/softmax-regression.md
    title: Softmax Regression
  - locator: chapter_multilayer-perceptrons/mlp.md
    title: Multilayer Perceptrons
  - locator: chapter_multilayer-perceptrons/backprop.md
    title: Forward and Backward Propagation
  - locator: chapter_attention-mechanisms-and-transformers/attention-scoring-functions.md
    title: Attention Scoring Functions
  - locator: chapter_attention-mechanisms-and-transformers/multihead-attention.md
    title: Multi-Head Attention
  - locator: chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.md
    title: Self-Attention and Positional Encoding
  - locator: chapter_attention-mechanisms-and-transformers/transformer.md
    title: The Transformer Architecture
- id: think-bayes
  title: Think Bayes 2e
  authors:
  - Allen B. Downey
  subjects:
  - bayesian
  - statistics
  - probability
  - python
  verdict: A
  licence:
    name: CC BY-NC-SA 4.0
    url: https://allendowney.github.io/ThinkBayes2/
    checked: '2026-09-05'
  voice: 'Conversational and computational: one idea per chapter, built up in code before any formula.'
  format: Jupyter notebooks, one per chapter, on GitHub
  exercises: Exercises with solutions in the same notebook; the cleanest worked constructed-response items
    in the statistics group.
