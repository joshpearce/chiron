name: Chiron
options:
  bundleIdPrefix: ${CHIRON_BUNDLE_ID}
  deploymentTarget:
    iOS: "26.0"          # the reading iPad runs current iPadOS with a Pencil Pro
packages:
  # The shell: SwiftTerm draws the terminal, Citadel speaks SSH (pure Swift,
  # on SwiftNIO) through the gate's tunnel.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1
  # 1.7.0 emits Swift 6.4 borrowing runtime calls that are unavailable on
  # macOS 26 when the app is built with Xcode 27.
  Collections:
    url: https://github.com/apple/swift-collections.git
    exactVersion: 1.6.0
targets:
  Chiron:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - target: ChironShare
    entitlements:
      path: Chiron/Chiron.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.security.application-groups:
          - $(CHIRON_APP_GROUP)
    sources:
      # KaTeX must keep its directory structure: chapter.html and MathText.swift
      # reference "katex/katex.min.css" and "katex/contrib/auto-render.min.js".
      # As a normal group Xcode flattens every file to the bundle root, those
      # paths 404, and no math renders anywhere in the app.
      - path: Chiron
        excludes: ["Resources/katex/**"]
      - path: Chiron/Resources/katex
        type: folder
      # The book's faces, shared with the e-ink client (assets/fonts); a
      # folder reference so book.css can @font-face them as fonts/<file>.
      - path: ../assets/fonts
        name: fonts
        type: folder
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"        # the iPad reads; the phone captures and reads along
        SUPPORTS_MACCATALYST: YES            # and the Mac reads and sends passages from other apps
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Automatic
        # Supplied by the ignored signing/local.config via scripts/xcodegen.sh.
        # Xcode owns certificate/profile selection for this team and platform.
        DEVELOPMENT_TEAM: ${CHIRON_TEAM_ID}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: ${CHIRON_BUNDLE_ID}
        CHIRON_APP_GROUP: ${CHIRON_APP_GROUP}
        # The Mac loads an extension only when its version matches the app's.
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    info:
      path: Chiron/Info.plist
      properties:
        ChironKeychainAccessGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        ChironAppGroup: $(CHIRON_APP_GROUP)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Chiron connects to the tutor server running on your Mac to grade answers and generate chapters."
        NSCameraUsageDescription: "Chiron reads the setup code shown on your other device, so you do not have to type the server's address and key."
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # chiron://capture/<id>: the share extension's and intents' way in.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [chiron]
        # "Send to Chiron" in every Mac app's Services menu (MacServices.swift).
        NSServices:
          - NSMenuItem: {default: "Send to Chiron"}
            NSMessage: sendToChiron
            NSPortName: Chiron
            NSSendTypes: [public.utf8-plain-text]
            NSRequiredContext: {}
        UIAppFonts:
          - fonts/SourceSerif4-Regular.ttf
          - fonts/SourceSerif4-It.ttf
          - fonts/SourceSerif4-Semibold.ttf
          - fonts/SourceSerif4-Bold.ttf
          - fonts/SourceSans3-Regular.ttf
          - fonts/SourceSans3-Medium.ttf
          - fonts/SourceSans3-Semibold.ttf
          - fonts/SourceSans3-Bold.ttf
  # The share sheet's "Chiron": text, a URL, an image or a PDF from any app
  # lands in the shared inbox and the app opens on the question.
  ChironShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ChironShare
      - path: Chiron/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CHIRON_BUNDLE_ID}.share
        DEVELOPMENT_TEAM: ${CHIRON_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        CHIRON_APP_GROUP: ${CHIRON_APP_GROUP}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chiron
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    info:
      path: ChironShare/Info.plist
      properties:
        ChironAppGroup: $(CHIRON_APP_GROUP)
        # The Simulator refuses an extension whose plist has no version.
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ChironShare/ChironShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(CHIRON_APP_GROUP)
  # Tap-level checks against the running app, read back through the harness.
  ChironUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChironUITests
    dependencies:
      - target: Chiron
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DEVELOPMENT_TEAM: ${CHIRON_TEAM_ID}       # the Mac signs test bundles too
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: ${CHIRON_BUNDLE_ID}.uitests
        TEST_TARGET_NAME: Chiron
  ChironTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChironTests
      # Real server responses, captured by scripts/capture-fixtures.py. A
      # folder reference keeps them under fixtures/ inside the test bundle.
      - path: fixtures
        type: folder
    dependencies:
      - target: Chiron
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DEVELOPMENT_TEAM: ${CHIRON_TEAM_ID}       # the Mac signs test bundles too
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: ${CHIRON_BUNDLE_ID}.tests
schemes:
  Chiron:
    build:
      targets:
        Chiron: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ChironTests, ChironUITests]
