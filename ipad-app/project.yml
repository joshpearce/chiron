name: Chiron
options:
  bundleIdPrefix: com.mjbraun
  deploymentTarget:
    iOS: "15.0"          # iPad mini 4 (iPad5,1) tops out at iPadOS 15.8
targets:
  Chiron:
    type: application
    platform: iOS
    sources:
      - Chiron
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"          # iPad only
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM set by Xcode after Apple ID sign-in (free personal team)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mjbraun.chiron
    info:
      path: Chiron/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Chiron connects to the tutor server running on your Mac to grade answers and generate chapters."
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
