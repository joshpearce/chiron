# v3 training-runs: pretest + terminal check bank.
# Solo fade items: v3-q3 (v3-compute-budget), v3-q7 (v3-epoch-arithmetic),
# v3-q9 (v3-bpb-conversion), v3-q10 (v3-seed-noise-check). Each is the third
# appearance of a procedure worked in canon prose and drilled as a completion
# beat.

pretest:
  - id: v3-p1
    concept: d-compute-budget
    prompt: |
      A single engineer, working alone in 2026, pretrains a 561-million-parameter
      chat model from scratch on a rented 8xH100 node - tokenizer, pretraining,
      fine-tuning, a working chat interface, the whole thing, on 11.2 billion
      tokens.

      Which figure is right, and by which route? Choose one.
    options:
      - text: "About $50,000 - a model that holds a conversation is not a hundred-dollar artifact, and the price of a run is a price for what comes out of it."
        misconception: V3-M1
        explain: "Appealing because frontier runs cost hundreds of millions and produce the best models, so cost and quality look perfectly correlated. But C ~= 6ND has no term for the corpus, the recipe or the outcome: the same 561M configuration on unfiltered scrape produces gibberish for the same $92, to the cent, finishing at the same minute."
      - text: "About $92, from 6ND = 3.77e19 FLOPs at the 3.2e15 FLOP/s the node sustains - 3.27 hours of pretraining, 3.85 hours for the whole pipeline, at about $24/hour."
        correct: true
        explain: "Correct, and it is the measured receipt: $92 for 3h51m. 6 x 5.61e8 x 1.12e10 = 3.77e19 FLOPs; 3.77e19 / 3.2e15 = 11,780 s = 3.27 h, which is 85% of the wall clock, the rest being tokenizer training, midtraining, SFT and eval. Four inputs and only four: parameters, tokens, sustained throughput, hourly price."
      - text: "About $32 - 6ND divided by the node's 7.9 PFLOP/s peak is 4,770 seconds, 1.33 hours at $24/hour."
        misconception: V3-M3
        explain: "The arithmetic is right and the divisor is wrong. Peak is a spec sheet; a well-tuned run sustains about 40% of it, and that Model FLOPs Utilization is the exchange rate between FLOPs and hours. Treating it as a slide metric rather than a budget term underprices this run by a factor of nearly three."
      - text: "It cannot be computed in advance - the cost depends on the corpus, the recipe, and how many restarts convergence takes."
        misconception: V3-M1
        explain: "Appealing because in most engineering the bill depends on how the work goes. Here the two integers that fix the cost - parameter count and token count - are chosen before the run starts, multiplied by a hardware constant and a market price. A data-loader bug that feeds one shard 400 times costs exactly what the correct run costs."
    check: choice

  - id: v3-p2
    concept: d-data-constrained
    prompt: |
      You have a tagged corpus of 500 million unique tokens and you want to
      train a model on 2 billion tokens, so you plan to pass over the corpus
      four times.

      Which verdict is right? Choose one.
    options:
      - text: "Not legitimate: only unique tokens carry information, so this is a 500M-token run wearing a 2B-token label."
        misconception: D17
        explain: "If repeated tokens were worthless, 4 epochs over 500M would land at the loss of a 500M-token run. Measured directly in the data-constrained scaling work, it lands near the loss of a 2B fresh-token run instead - up to about 4 epochs a repeated token is worth very nearly as much as a fresh one."
      - text: "Not legitimate: four passes over one corpus overfits, and held-out loss will turn upward before the end."
        misconception: D17
        explain: "That is supervised-learning folklore, where a small labeled set and a large model really do turn validation loss upward after a few epochs. Language modeling on hundreds of millions of tokens with tens of millions of parameters is nowhere near that capacity ratio; the measured returns diminish out to ~16 epochs and vanish past ~40, without the classical turn."
      - text: "Legitimate: 4 epochs sits at the edge of the zone where a repeated token is worth nearly as much as a fresh one."
        correct: true
        explain: "Correct, and by measurement rather than hope. 2e9 / 5e8 = 4 epochs, the boundary of the nearly-free zone; returns diminish steadily to about 16 epochs and are gone past about 40. One thing to set deliberately: repetition is also the primary driver of memorization, so the same dial that buys capability from a small corpus controls how extractable that corpus is later."
      - text: "Not legitimate: run quality is set by corpus SIZE, so repetition cannot substitute for tokens - get to 2 billion unique first."
        misconception: D8
        explain: "Scaling-law headlines are about size, so more tokens sounds strictly better. But past a floor it is quality that dominates - a 1.3T-token filtered corpus beats its own 15T-token superset - and at 30M parameters a 400-500M-token corpus already supports runs well past the compute-optimal 20 tokens per parameter. The corpus here is ample, not the binding constraint."
    check: choice

  - id: v3-p3
    concept: d-eval-noise
    prompt: |
      Two models, same architecture, same hyperparameters, same token count, one
      run each. Model A trained on the full corpus and scores 0.7420 bits per
      byte on held-out text. Model B trained on the corpus with one source
      removed and scores 0.7455.

      What can you conclude about that source's contribution? Choose one.
    options:
      - text: "That the source contributes 0.0035 bpb - that difference is what a leave-one-out measurement means."
        misconception: D16
        explain: "This treats contribution as a fixed property you measure once. Retrain with a different seed, changing nothing but initialization and shuffle order, and a single source's marginal contribution can swing by more than its own magnitude; of everything that perturbs these measurements, data order introduces the largest variation."
      - text: "Nothing yet: without sigma, the spread of held-out bpb across seeds of an identical configuration, 0.0035 has no scale."
        correct: true
        explain: "Correct. For a 30M-parameter setup sigma runs around 0.004 bpb, larger than the gap itself; with n seeds per condition the standard error of a difference is sigma x sqrt(2/n), so z = 0.0035 / 0.0040 = 0.88 at n = 2 - under one standard error. The remedy at this scale is more seeds (8 sigma^2 / delta^2 of them), not more confidence."
      - text: "That the gap is small because the estimator is crude; a better attribution method would resolve the same source sharply."
        misconception: D20
        explain: "This is the builder's optimism: noise as a temporary methods problem. The quantity here is a difference between two noisy random variables, and no estimator removes that - only more signal (more seeds, larger effects) does. Below a signal-to-noise threshold the welfare-optimal contract is provably a flat fee, and measuring which side you are on is the result."
      - text: "Compare the two training loss curves; if the removed-source run sits higher throughout, the contribution is real."
        misconception: V3-M2
        explain: "A training curve compares a model to its own past on data it trained on, and it is schedule-shaped - under cosine the loss drops in the last 10% of every run, including deliberately sabotaged ones. It is a diagnostic for optimizer health. Every claim in this book compares one model to a different model, which needs held-out bpb across seeds."
    check: choice

check:
  - id: v3-q1
    concept: d-compute-budget
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      The compute budget for a training run is $C = 6ND$.

      Which statement about that formula - the constant, the symbols, and where
      it breaks - is correct? Choose one.
    options:
      - text: "The 6 is 2 FLOPs forward (one multiply-accumulate per parameter per token) plus 4 backward (a multiply-accumulate for the gradient with respect to the parameter and another for the gradient with respect to the incoming activation); for a mixture-of-experts model substitute active parameters for N."
        correct: true
        explain: "Correct, and rebuildable in ten seconds rather than memorized. N is parameters, D is training tokens counting repeats, C is total floating-point operations. MoE routes each token to a fraction of the network, so total parameters overstates the compute badly - active parameters is the right N there."
      - text: "N is the parameter count and D is the number of UNIQUE tokens in the corpus; repeated passes reuse data already paid for and do not add to C."
        misconception: D17
        explain: "Repeats are free in information, not in arithmetic. Every token that passes through the loop costs its 6N FLOPs whether the model has seen it before or not, so 4 epochs over 500M unique tokens is D = 2e9 in the budget. The epoch count is exactly how you turn a small corpus into a large D."
      - text: "The 6 is a clean-corpus constant: a noisier corpus needs more steps to reach the same loss, so quality raises the effective constant, and epochs enter as a separate multiplier on top of D."
        misconception: V3-M1
        explain: "Two errors from the same belief. Epochs are already inside D. And C = 6ND has no term for data quality at all: the filtered and the unfiltered run of identical N and D finish at the same minute for the same money, which is precisely why quality is free at fixed compute and why a filtering classifier outvalues any architecture change."
      - text: "The 6 already contains attention's sequence-length term, so dividing 6ND by the hardware's peak FLOP/s gives an honest wall clock."
        misconception: V3-M3
        explain: "Both halves are wrong. 6ND counts only parameter-proportional work and genuinely undercounts attention - by roughly sequence length over twelve times model width, closer to 15% for the narrow models here. The budget stays honest only because you divide by an EFFECTIVE throughput fitted against 6ND, about 40% of peak, which absorbs that term. Peak would underprice the run by more than half."
    check: choice
    difficulty: core

  - id: v3-q2
    concept: d-compute-budget
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      You are asked to produce a cost estimate for a pretraining run before any
      code is written. Which set of inputs is sufficient?
    check: choice
    options:
      - text: "Parameter count, token count, the throughput the hardware actually sustains on training work, and the hourly rental price."
        correct: true
        explain: "Correct, and it is a complete list. C ~= 6ND gives operations; sustained throughput converts operations to seconds; the hourly rate converts seconds to dollars. Every published cost in the small-scale training literature reconstructs from these four numbers to within about 15%, and the residual is non-pretraining stages like tokenizer training and fine-tuning."
      - text: "Parameter count, token count, the target quality level, and the architecture, since a better result and a more sophisticated model both cost more to reach."
        misconception: V3-M1
        explain: "Attractive because frontier runs are both the most expensive and the best, so cost and quality look coupled. They are not. Two runs at the same N and D on corpora of wildly different quality cost the same to the cent and finish at the same minute. Quality is free at fixed compute, which is exactly why data filtering is the highest-leverage work in the pipeline."
      - text: "Parameter count, token count, the hardware's peak FLOP/s from the spec sheet, and the hourly price. Sustained throughput is an implementation detail that does not belong in a budget."
        misconception: V3-M3
        explain: "This is MFU treated as a vanity metric, and it produces an estimate roughly 2.5x too low. A well-tuned 8xH100 run sustains about 3.2 PFLOP/s against a dense BF16 peak near 7.9, an MFU of about 40%. Utilization is the exchange rate between operations and hours - halve it and the invoice doubles for a bit-identical model."
      - text: "The size of the corpus in tokens and the hourly price. Model size follows from the corpus size, and the corpus is what you are paying to process."
        misconception: D8
        explain: "This makes corpus size the sole driver and treats model size as a consequence of it. Both halves fail: N and D are independent choices (the same corpus supports a 10M or a 500M model, and the same model can be trained on 4 epochs or 40), and C is their product, so dropping N loses the larger of the two levers. It is also the size-over-quality instinct in disguise - a filtered corpus a tenth the size routinely beats its own superset."
    difficulty: warmup

  - id: v3-q3
    concept: d-compute-budget
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Budget a run: 561 million parameters, 8 billion tokens, on a single H100
      sustaining $4 \times 10^{14}$ FLOP/s.

      How many hours of wall clock? Give one number to one decimal place.
    answer: 18.7
    check: numeric(0.1)
    difficulty: core

  - id: v3-q4
    concept: d-training-recipes
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Your central experiment is a leave-one-source-out sweep over 20 tagged
      sources. A colleague proposes: train one model with warmup-stable-decay,
      keep a checkpoint from the middle of the stable phase, branch 20 times -
      one per removed source - and run only the 15% decay tail on each.

      Which assessment is right? Choose one.
    options:
      - text: "Sound and cheap - about 4 run-equivalents against 21 - and the branched numbers stand in for from-scratch leave-one-out, since the method that scales to 20 conditions is the one to trust."
        misconception: D6
        explain: "The economics are right and the substitution is not. Every branch trained on its own removed source for the first 85% of the run, so what that source taught the trunk is baked into all 20 variants. Cheap-and-scalable is not the same as correlated with counterfactual ground truth; that gap is the whole reason v4 pays for from-scratch runs."
      - text: "Possible because the stable phase holds the learning rate constant, costs about 4 run-equivalents against 21, but measures contribution over the decay tail only and is biased toward zero - use it for screening."
        correct: true
        explain: "Correct on all three. Constant learning rate makes a mid-run checkpoint a legitimate starting state; a cosine run has no such checkpoint, since every one is mid-decay. Cost: trunk plus 20 x 0.15 = 3 run-equivalents, about 4 total, five times cheaper. And the branch answers 'what does this source contribute over the last 15%', not 'what if it had never existed' - the bias is roughly shared across conditions, so the ranking is informative even when the magnitudes are not."
      - text: "The schedule is beside the point - branch from a cosine run just as well, and confirm each branch by checking that its loss curve descends normally."
        misconception: V3-M2
        explain: "Every cosine checkpoint is partway through a decay headed to zero, so a branch inherits a learning rate that was on its way somewhere and is not comparable to a completed run. The curve will not tell you: under cosine the loss drops in the last 10% of every run, including one trained on worthless data, because the rate is going to zero and the model is settling."
      - text: "Reject it - a 15%-tail run is a cheap run and therefore a worse model, and a worse model cannot support a defensible contribution number."
        misconception: V3-M1
        explain: "Cost does not price the artifact, so 'cheaper' is not an argument about quality; and refusing branching outright forfeits a legitimate screening tool that costs real money. The reason to distrust a branched number is the counterfactual it answers, not its price."
    check: choice
    difficulty: core

  - id: v3-q5
    concept: d-training-recipes
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A teammate shows you the training loss curve from an overnight run. It is
      smooth, monotone, and ends lower than any previous run's. What does that
      establish?
    check: choice
    options:
      - text: "That the optimizer did not blow up. Nothing about data quality, model quality, or how this run compares to any other."
        correct: true
        explain: "Correct. The curve is a health monitor: spikes, plateaus at initialization value, divergence and NaNs are all real signals. But it compares the model to its own past on data it trained on, and it is shaped by the learning-rate schedule - under cosine, loss drops in the last 10% of every run including sabotaged ones. Comparisons between runs require held-out bits-per-byte across multiple seeds."
      - text: "That the run is working: the data is sound, the configuration is right, and this run is better than the previous ones."
        misconception: V3-M2
        explain: "The curve is the only thing that updates in real time and it looks like a progress bar, which is why this is the default read. It fails hard: a data-loader bug that feeds one shard four hundred times produces a SMOOTHER and LOWER curve than the correct run, because the model is faithfully learning boilerplate and being scored on more of the same. The prettiest curve in the logbook can belong to the most broken run."
      - text: "That this configuration is better than the previous ones, provided both runs used the same tokenizer and the same number of steps."
        misconception: D16
        explain: "Closer, because it recognizes that a comparison needs matched conditions. It still fails on the load-bearing point: a single run per condition makes seed variation structurally invisible. Final loss moves across seeds with nothing else changed, and the differences between conditions are frequently smaller than that movement. Matched conditions plus one run each is still no measurement."
      - text: "That the corpus is large enough - a curve that is still descending at the end means the model has not exhausted the data."
        misconception: D8
        explain: "A descending curve at the end is a statement about the learning-rate schedule and the step budget, not about the corpus. Under WSD the curve descends right up to the decay tail regardless of how many epochs the data has been through, and a model deep in the 40-epoch dead zone still shows a descending training curve while learning nothing new. Data sufficiency is a held-out question."
    difficulty: warmup

  - id: v3-q6
    concept: d-training-recipes
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      You are moving a recipe from a batch of 262,144 tokens per step to 524,288
      tokens per step, using AdamW.

      Which is the right move on the learning rate, and the right use of the run
      budget? Choose one.
    options:
      - text: "Leave it where it is and sweep 10 candidate rates; a better-optimized run tightens the contribution error bars later."
        misconception: D20
        explain: "Optimization quality and estimator noise are different quantities: a source's contribution is a random variable, and the width of that distribution comes down with seeds, not with a tuned learning rate. Ten runs spent on rate candidates are ten seeds not bought, and seeds are what every claim from v4 onward rests on."
      - text: "Double it (linear scaling), then run both settings and keep whichever training loss curve descends faster."
        misconception: V3-M2
        explain: "Linear scaling is the plain-SGD heuristic and overshoots for Adam-family optimizers, which already divide the gradient by a running estimate of its own magnitude. And the tiebreak is worse than the error: a training curve is an optimizer health monitor, and the smoother, lower curve can belong to the more broken run."
      - text: "Multiply it by sqrt(2), about 1.41, and take the value from a published recipe at a similar batch size rather than tuning it."
        correct: true
        explain: "Correct. Doubling the batch halves the noise in the gradient estimate, so a larger step is affordable; square-root scaling is the Adam-family rule, linear scaling the SGD one. The rule stops holding past the critical batch size, where the gradient is already about as accurate as it will get, and during warmup, where AdamW's running estimates are built from almost no data. Learning-rate search is the least profitable hyperparameter search available here, because the currency is runs."
      - text: "Halve it - each step now passes over twice as much data, so a smaller step keeps the model from overfitting the larger batch."
        misconception: D17
        explain: "This imports overfitting folklore into a place it does not apply. A larger batch gives a less noisy gradient, which licenses a bigger step, not a smaller one; and at these token-to-parameter ratios the classical overfitting regime is not what is happening at all."
    check: choice
    difficulty: core

  - id: v3-q7
    concept: d-data-constrained
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      You have 800 million unique tagged tokens. You will not exceed 4 epochs,
      and you want the run to be compute-optimal at 20 tokens per parameter.

      What is the largest model this corpus supports? Answer with the exact
      integer number of parameters, digits only, no separators.
    answer: "160000000"
    check: exact
    difficulty: core

  - id: v3-q8
    concept: d-data-constrained
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Your tagged corpus has 400 million unique tokens and your planned run is
      1.6 billion tokens. Which statement is correct?
    check: choice
    options:
      - text: "Four epochs sits at the edge of the zone where repeated tokens are worth nearly as much as fresh ones, so the run is legitimate; returns diminish out to about 16 epochs and vanish past about 40."
        correct: true
        explain: "Correct, and measured rather than assumed. This is the specific finding that lets a small specialist corpus support a real training run: the free zone multiplies the effective token budget by 4, which multiplies the supportable model size by 4. It also sets the boundary - a plan calling for 60 epochs is buying nothing with the last 20."
      - text: "The run is invalid. Only unique tokens carry information, so the effective training set is 400 million tokens no matter how many passes you make, and the extra three passes teach the model to memorize."
        misconception: D17
        explain: "This is overfitting folklore imported from small-scale supervised learning, where validation loss really does turn upward after a few epochs. That regime is real and this is not it: tens of millions of parameters on hundreds of millions of tokens is nowhere near the capacity ratio where classical overfitting bites. Measured directly, four epochs costs almost nothing against four times the fresh tokens."
      - text: "The run is legitimate as long as you verify afterward that the model cannot reproduce any training document verbatim; verbatim reproduction is what distinguishes learning from memorizing."
        misconception: D3
        explain: "Two errors welded together. The epoch question is settled by measured scaling behavior, not by a post-hoc extraction test. And verbatim reproduction is a lower bound on memorization, not a definition of it - a model can be thoroughly shaped by a document it shares no n-grams with. Repetition genuinely does increase extractability, which is a v6 concern to set deliberately, not a pass/fail gate on a training plan."
      - text: "Repeating is a workaround for a corpus that is too small. Obtain more unique tokens instead - a 1.6-billion-token corpus will always produce a better model than four passes over 400 million."
        misconception: D8
        explain: "The size-over-quality instinct. It is not always true and often false: a filtered corpus can beat its own much larger superset, and 1.6B tokens of scrape can lose to 400M tokens of tagged, filtered domain text repeated four times. It also ignores the constraint that matters here - the corpus is tagged with provenance, and untagged tokens are worthless for attribution regardless of how many there are."
    difficulty: warmup

  - id: v3-q9
    concept: d-eval-noise
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A model scores a mean loss of 1.75 nats per token on held-out papers. Its
      tokenizer averages 4.2 bytes per token on that text.

      Compute its bits per byte. Give one number to two decimal places.
    answer: 0.60
    check: numeric(0.01)
    difficulty: core

  - id: v3-q10
    concept: d-eval-noise
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Your setup's seed noise is $\sigma = 0.0050$ bits per byte. You want to
      establish that a source whose true effect is $\Delta = 0.0030$ bpb is
      real, at a bar of $z \geq 2$, running the same number of seeds for each
      of the two conditions.

      How many seeds per condition do you need? Answer with the exact integer,
      digits only.
    answer: "23"
    check: exact
    difficulty: core

  - id: v3-q11
    concept: d-eval-noise
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Two models are evaluated on the identical held-out file.

        Model A: 2.30 nats per token, tokenizer averages 4.8 bytes per token.
        Model B: 1.60 nats per token, tokenizer averages 3.2 bytes per token.

      A colleague reports that B is roughly twice as good as A. Which
      comparison is the honest one?

      ($\ln 2 = 0.6931$)
    options:
      - text: |
          A is better: 0.691 bpb against B's 0.721 bpb, from
          $2.30/(0.6931 \times 4.8)$ and $1.60/(0.6931 \times 3.2)$.
        correct: true
        explain: |
          Bits per byte divides total surprise by the held-out text's length in
          UTF-8 bytes, a denominator fixed before any tokenizer existed and
          identical for every model scored on that file. A = 2.30/3.327 = 0.691,
          B = 1.60/2.218 = 0.721, so the verdict reverses: A is better. Any
          metric whose denominator is chosen by the model under test can be
          moved by that choice; bpb cannot, which is why it is the only safe
          metric across a tokenizer boundary - and every comparison against a
          published baseline crosses one.
      - text: |
          B is better, and by about a factor of two: perplexity $e^{1.60} = 4.95$
          against $e^{2.30} = 9.97$.
        misconception: V3-M2
        explain: |
          The arithmetic is right and the conclusion is backwards. Perplexity is
          $e^{\mathcal{L}}$ and $\mathcal{L}$ is nats per TOKEN, so perplexity
          inherits the tokenizer's denominator and then exponentiates it. B's
          3.2-byte tokens chop the text into more, shorter pieces, and predicting
          a shorter piece is an easier problem - B's per-token loss falls without
          B knowing the text better. This is the number-on-the-screen read as a
          quality verdict, the same habit that trusts a descending loss curve.
      - text: |
          B is better: 1.60 nats per token against 2.30. Bytes per token is a
          property of the tokenizer, not of the model, so it does not enter the
          comparison.
        misconception: V3-M2
        explain: |
          Bytes per token is exactly what must enter, because it is the exchange
          rate between the model's denominator and the text's. Raw loss is nats
          per token and a token is whatever this model's tokenizer says it is, so
          two models with different tokenizers are reporting surprise per
          different-sized unit. Comparing those numbers directly is unsafe in
          both directions: here it flips the ordering.
      - text: |
          B is better: converting to bits per token, $1.60/0.6931 = 2.31$ against
          A's $2.30/0.6931 = 3.32$, and bits are the tokenizer-invariant unit.
        misconception: V3-M2
        explain: |
          Converting nats to bits changes the unit of surprise, not the unit of
          text. Bits per token still counts per token, so it is exactly as
          tokenizer-dependent as the raw loss was, and it produces the same wrong
          ordering. The invariance comes from the second division - by bytes per
          token - which is the step this option stops short of.
      - text: |
          B is better: at 3.2 bytes per token its tokenizer emits more tokens for
          the same text, so B was trained on more tokens and got more out of the
          same run.
        misconception: V3-M1
        explain: |
          This confuses what a run buys with what a metric measures. Both models
          are being scored on one fixed held-out file; nothing here is a claim
          about their training budgets, and $C \approx 6ND$ has no term that
          would make a finer tokenizer a better model. Re-slicing the same text
          into more pieces adds no information - it only makes each prediction
          easier, which is precisely the artifact bpb removes.
    check: choice
    difficulty: stretch

  - id: v3-q12
    concept: d-eval-noise
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      You run two conditions with two seeds each and get a difference of 0.0035
      bpb. Your measured seed noise is $\sigma = 0.0040$ bpb. What do you
      report?
    check: choice
    options:
      - text: "That the difference is under the noise floor: the standard error of the difference is sigma x sqrt(2/2) = 0.0040, so z = 0.88, and roughly 11 seeds per condition would be needed to resolve an effect this size."
        correct: true
        explain: "Correct, including the part most people skip. With n = 2 per condition the standard error of a difference is exactly one single-run standard deviation - two seeds buys the ability to ESTIMATE sigma, not precision. And n >= 8 sigma^2 / delta^2 = 10.4 rounds to 11, which at a few minutes per run is about $5 of compute. At this model scale the answer to an underpowered result is more seeds."
      - text: "That the source contributes 0.0035 bpb, noting that the measurement should be repeated when time permits."
        misconception: D16
        explain: "This treats contribution as a fixed property measured with some imprecision, so a single number plus a caveat feels adequate. It is not: a source's marginal contribution can swing by more than its own magnitude across seeds, and data ordering alone introduces the largest variation in influence measurements. Reporting the point estimate as the finding, with noise as a footnote, inverts which of the two is established."
      - text: "That the effect is too small to matter and contribution-based attribution is not workable on this corpus."
        misconception: D20
        explain: "Right that the result is unimpressive, wrong that it settles anything. You have measured that ONE source's effect is under a noise floor you have not yet tried to lower - with 11 seeds per condition, at about $5, the same effect may be clearly resolvable. Whether contribution-proportional payment beats a flat fee is an empirical question about your corpus, your scale, and your measured signal-to-noise, and you have not measured it yet. Concede the threshold only after you have found where it is."
      - text: "That the result is inconclusive, and re-run both conditions with a longer schedule so the models are better converged and the measurement is cleaner."
        misconception: V3-M2
        explain: "This treats noise as under-training - as if the run were not finished and a cleaner curve would produce a cleaner difference. Seed variation is not a convergence artifact; it is variation across the distribution of training runs, and it does not shrink because each individual run went further. What shrinks the error bar is more independent runs, by sqrt(n)."
    difficulty: core

  - id: v3-q13
    concept: d-eval-noise
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Your 30-million-parameter model scores 26.3% on a 4-choice benchmark of
      about 14,000 items. The previous configuration scored 25.1%. Your
      collaborator wants to put "+1.2 points" in the writeup.

      Which assessment is correct?
    options:
      - text: |
          Both scores sit on the 25% chance floor, where sampling alone gives
          $\sqrt{0.25 \times 0.75 / 14{,}000} = 0.37$ percentage points and seed
          variation is larger still; drop the benchmark and report held-out bits
          per byte over at least two seeds per condition.
        correct: true
        explain: |
          A benchmark the model answers at chance measures nothing, so the move
          is noise on top of noise: about three sampling standard deviations of
          an unmeasured and larger seed term, on a metric neither configuration
          clears. Below roughly 1B parameters the rule is to drop reasoning
          benchmarks entirely and report held-out bpb on domain text reserved
          before training - tokenizer-invariant, monotone, low seed variance,
          two seeds minimum.
      - text: |
          Report it: 1.2 points is more than three sampling standard deviations
          (0.37 pp), so the improvement is significant at better than $p < 0.01$.
        misconception: D19
        explain: |
          The arithmetic on the sampling term is right and the inference is not.
          A significance calculation is only as good as its null, and this null
          omits the larger term - retraining the identical configuration with a
          different seed moves the score by more than sampling does. It also
          ignores that the threshold was chosen after seeing the number, and that
          both scores sit at chance, where the metric is not measuring the model
          at all. A small $p$ against the wrong null is not evidence.
      - text: |
          The measurement is weak because the model is weak; move the program to
          at least 1B parameters, where benchmark scores clear chance, before
          making any claim.
        misconception: V3-M1
        explain: |
          This inverts the trade the whole book rests on. Model weakness and
          measurement weakness are unrelated properties: held-out bpb is
          precisely measurable on a 10M-parameter model, and attribution asks
          which data moved held-out loss. Since cost is linear in $N$, scaling up
          by 20x scales the 550-run counterfactual sweep by 20x and destroys the
          ground truth the small scale exists to buy. The benchmark is what to
          drop, not the scale.
      - text: |
          Corroborate it: the training loss also fell across the same change, so
          report the 1.2 points with the loss curve as supporting evidence.
        misconception: V3-M2
        explain: |
          A training loss curve compares a model to its own past on data it
          trained on, under a schedule that drops the loss in the last 10% of
          every run including sabotaged ones. It cannot corroborate a comparison
          between two different models - a repeated-shard bug produces a smoother,
          lower curve than the correct run. Two uninformative numbers agreeing is
          not evidence.
      - text: |
          Get an error bar first: re-run the benchmark on the same two
          checkpoints several times, and if the 1.2 points survives that spread,
          report it.
        misconception: D16
        explain: |
          Re-scoring a fixed checkpoint only resamples the benchmark; the
          checkpoint itself is one draw from a distribution over training runs,
          and that is where the larger variance lives. The error bar that matters
          comes from retraining each condition with different seeds, giving
          $\text{SE}_{\text{diff}} = \sigma\sqrt{2/n}$. Treating a single
          checkpoint as the model - measure once, report forever - is what makes
          seed noise structurally invisible.
    check: choice
    difficulty: stretch
