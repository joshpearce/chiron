# v6 model-memory: pretest + terminal check bank.
# Solo fade items: v6-q1 (v6-capacity-budget), v6-q4 (v6-multiplicity-
# arithmetic), v6-q5 (v6-tpr-at-fpr). Each is the third appearance of a
# procedure worked in canon prose and drilled as a completion beat.
#
# Constants used across several items, all defined in canon section 3 and the
# notation section:
#   memorization capacity  = N x 3.6 bits
#   English text           ~ 4 bytes per token, ~1 bit of information per byte
#   collection-level z     = d x sqrt(n), n = INDEPENDENT units
#   Bonferroni             = alpha / n ; E[false positives] = n x alpha
#   one-sided z <-> p: 1.64/0.05, 2.33/0.01, 3.09/1e-3, 3.72/1e-4,
#                      4.27/1e-5, 4.75/1e-6, 5.20/1e-7

pretest:
  - id: v6-p1
    concept: d-memorization
    prompt: |
      You prompt an open model with the first fifty words of your own book,
      several times, at several prompt lengths, with greedy and sampled
      decoding. Nothing recognizable comes back at any setting.

      Which statement is the most defensible conclusion about whether your book
      was in the training corpus?
    check: choice
    options:
      - text: 'Essentially nothing follows. Extractable content is roughly a tenth of a percent to one percent of a corpus and is concentrated on heavily duplicated text and short high-entropy strings, so an ordinary book gives this result whether or not it was trained on.'
        correct: true
        explain: 'The test has almost no power for a typical document, and a negative result from a powerless test is exactly what membership would also produce. What you have learned is that the extraction route is closed for this engagement - a fact about the method, not about the corpus.'
      - text: 'The book was probably not in the training corpus, since a model that had seen it would return at least a recognizable span at some prompt length.'
        misconception: D3
        explain: 'This is verbatim-is-the-test. Most of a training corpus leaves no extractable residue at all - the 2016 workshop paper in this unit was demonstrably in the corpus and returned nothing under exactly this battery.'
      - text: 'The book may have been in the corpus, but a document that cannot be extracted at any prompt length did not measurably influence the model.'
        misconception: D3
        explain: 'Extractability and influence are close to disjoint at the ends that matter. Extraction recovers boilerplate and rare high-entropy strings, while models are measurably shaped by documents that share no n-grams with the outputs they influence.'
      - text: 'It establishes that the weights do not contain a copy of the book, though the model may have trained on it and generalized the content away.'
        misconception: D4
        explain: 'Extraction failure bounds nothing about what is stored. Decoding strategy and alignment both suppress emission without touching the weights, and the capacity argument constrains the corpus total rather than any individual document.'

  - id: v6-p2
    concept: d-mia-limits
    prompt: |
      You compute a model loss on your document and find it sits in the bottom
      1% - the model is unusually unsurprised by your text - compared with a set
      of 5,000 other documents you collected.

      Which statement correctly describes what you may conclude and what a
      false-positive rate would require?
    check: choice
    options:
      - text: 'The finding is relative to the set you collected. It becomes a membership claim only if those 5,000 documents match yours in every respect that moves loss except membership, and attaching an FPR would require sampling the null over models retrained without your document - which needs the corpus, the recipe, the compute and several seeds.'
        correct: true
        explain: 'An FPR is defined against the distribution of the statistic in the world where the effect is absent, and here that world is a set of models, not a set of documents. Loss is lower on familiar topics, entities and writing conventions, so a comparison set differing in date alone reproduces this result with no membership at all.'
      - text: 'You may conclude the model was trained on the document with roughly 99% confidence, since the document sits in the bottom 1% of the reference distribution.'
        misconception: D2
        explain: 'A tail position under a comparison set is not a probability that the claim is true - that would need a prior the test never asked for - and the comparison set is not a sample of the null in any case.'
      - text: 'The conclusion is sound provided the 5,000 documents were genuinely never trained on. Confirmed non-members are a valid null by definition.'
        misconception: V6-M3
        explain: 'Held out does not mean exchangeable. A control is valid only if it matches on everything that moves the statistic - date, topic, register, formatting, source, length - and it was precisely the date confound that let a blind classifier beat published attacks across eight datasets.'
      - text: 'Compute the AUC of this statistic against the 5,000 documents; an AUC above 0.7 supplies the false-positive rate the claim needs.'
        misconception: V6-M1
        explain: 'AUC is the probability a random member outscores a random non-member, averaged over every threshold including ones nobody would operate at. It is not an FPR, and detectors near AUC 0.7 commonly deliver a true positive rate in the low single digits once the FPR is held to 1%.'

  - id: v6-p3
    concept: d-memorization
    prompt: |
      A 1-billion-parameter model was trained on 300 gigabytes of text. Take
      memorization capacity at 3.6 bits per parameter and the information
      content of this text at about 1 bit per byte.

      Which conclusion does that arithmetic support?
    check: choice
    options:
      - text: 'Capacity is $10^9 \times 3.6 = 3.6 \times 10^9$ bits against $3 \times 10^{11}$ bits of corpus, a ratio of about 83, so the corpus as a whole cannot be recovered - but the bound constrains the total, not the distribution, so individual heavily duplicated documents may still be stored nearly completely.'
        correct: true
        explain: 'The counting argument is decisive in one direction only: with $2^{Nb}$ distinguishable weight settings, corpora carrying more than $Nb$ bits must collide. It rules storage of the whole corpus out and never rules any document in.'
      - text: 'Yes - a model compresses its training data, and 3.6 bits per parameter is what each parameter holds of it, so the weights are an archive from which a clever query recovers arbitrary documents.'
        misconception: D4
        explain: 'The archive position dies on the ratio. At 83 to 1 here, and worse at frontier scale, most of the corpus must map to identical weights and is unrecoverable in principle - before any capacity is spent on being able to speak English.'
      - text: 'No - the ratio of 83 shows the weights store none of the corpus. They hold only statistics about it, so no document is recoverable.'
        misconception: D4
        explain: 'The opposite extreme, and one screenshot refutes it: some heavily duplicated books come out of open models essentially complete. An aggregate bound is not a per-document guarantee.'
      - text: 'About one part in 83 of every document, roughly 1.2% of each, is retained, so each document is partially recoverable.'
        misconception: D4
        explain: 'Capacity is not allocated evenly. The surviving budget is concentrated on duplicated and high-entropy content while the ordinary once-seen document leaves no trace, so a uniform share per document is exactly the wrong picture.'

check:
  - id: v6-q1
    concept: d-memorization
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A 500-million-parameter model is trained on a corpus of 250 million
      tokens. Use 3.6 bits of memorization capacity per parameter, 4 bytes per
      token, and 1 bit of information per byte.

      Compute the ratio of corpus information to model capacity - that is,
      corpus bits divided by capacity bits.

      Answer with a single number to two decimal places.
    answer: "0.56"
    check: numeric(0.01)
    difficulty: core

  - id: v6-q2
    concept: d-memorization
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      One run: 500 million parameters on 250 million tokens, where the corpus
      carries less information than the model memorization capacity - a ratio
      below 1. The other: the 30-million-parameter run on 400 million tokens
      worked in this unit, ratio about 15.

      A colleague concludes from the first that the model definitely memorized
      its corpus, and from the second that the other model definitely memorized
      none of its own. Which statement correctly describes what a capacity ratio
      establishes?
    options:
      - text: 'Both conclusions fail. A ratio above 1 forbids storing the whole corpus but says nothing about which documents get the surviving budget; a ratio below 1 shows only that counting does not forbid storage, since capacity is a ceiling rather than a floor and is shared with everything the model must generalize. The arithmetic can rule storage out and never rule it in.'
        correct: true
        explain: 'That asymmetry is the whole value of the argument. A ratio of 15 is entirely consistent with a handful of heavily duplicated documents being stored near-completely, which is what the 200-book study observed.'
      - text: 'The first colleague is right: a ratio below 1 means the corpus fits inside the capacity, so it was stored.'
        misconception: D4
        explain: 'Fitting is permission, not evidence. Most of $C_\text{mem}$ is spent on generalizable structure - spelling, syntax, world regularities - and whether anything was memorized is settled by extraction, not by division.'
      - text: 'The second colleague is right: a ratio of 15 means at most one fifteenth survives, which is too little for any document to be recoverable.'
        misconception: D4
        explain: 'This is the just-statistics form of the error. The bound is on the total, and an unevenly allocated one fifteenth is more than enough for specific high-duplication documents to come back whole.'
      - text: 'Neither ratio is informative. Whether a model memorized its corpus is settled by testing verbatim reproduction, and the capacity arithmetic adds nothing.'
        misconception: D3
        explain: 'Verbatim reproduction is a lower bound that an adversary controls, and a large share of what it flags is templatic text a model without the document would emit anyway. The capacity ratio is the one part of this subject that is not contestable.'
      - text: 'Both conclusions fail because 3.6 bits per parameter is a rough heuristic that shifts with precision and seed, so neither ratio can be evaluated.'
        misconception: D16
        explain: 'Right verdict, wrong reason, and it gives away the strongest tool you have. The figure is measured directly by training on random strings until absorption stops, and the counting argument it feeds is valid whatever seed produced the weights.'
    check: choice
    difficulty: core

  - id: v6-q3
    concept: d-mia-limits
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A proof is a claim plus a false-positive rate; an FPR is defined against
      the null distribution of the test statistic in the world where the effect
      is absent; here that null is the spread of the statistic across models
      that did not train on your document.

      Which single change would let a post-hoc membership-inference attack state
      a defensible FPR for the claim that a particular model trained on your
      document?
    options:
      - text: 'Access to the counterfactual model - the same training run with your document removed, repeated over several seeds - which requires the corpus, the recipe, the compute and lab cooperation or a reproducible run.'
        correct: true
        explain: 'The missing object is a model, not a method or a dataset. Nothing computed against an unavailable null changes status, which is why the sound routes are aggregating to a collection with a matched held-out set, or planting keyed content so the null is yours by construction.'
      - text: 'A far better attack statistic, refined until it beats prior work by a wide margin on the standard benchmarks.'
        misconception: D2
        explain: 'A better statistic computed against a null you do not have is a better number with the same status. The relative gains in that literature were measured against confounded labels.'
      - text: 'A much larger and cleaner benchmark of confirmed non-members, collected from sources published after the model cutoff.'
        misconception: V6-M3
        explain: 'That is the substitution that broke the field: post-cutoff non-members confound membership with date, and a blind classifier that never queries the model beat published attacks across eight datasets. Documents are not a sample of a null over models.'
      - text: 'An AUC above 0.95, validated on held-out data, since AUC at that level pins the error rate tightly enough to accuse.'
        misconception: V6-M1
        explain: 'AUC is an average over all thresholds, including every one nobody would operate at, and it describes separation on a benchmark rather than the FPR on the target model. The reportable quantity is TPR at a fixed low FPR.'
    check: choice
    difficulty: core

  - id: v6-q4
    concept: d-evidence-discipline
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      An audit tests 10,000 documents from one catalogue against one model.
      You want the probability of ANY false positive across the whole report
      held to 0.01, using a Bonferroni correction.

      One-sided z-to-p correspondence:
        p = 0.05 -> z = 1.64;  p = 0.01 -> z = 2.33;  p = 0.001 -> z = 3.09;
        p = 1e-4 -> z = 3.72;  p = 1e-5 -> z = 4.27;  p = 1e-6 -> z = 4.75;
        p = 1e-7 -> z = 5.20

      What one-sided z must a single document reach to be reportable?

      Answer with a single number to two decimal places.
    answer: "4.75"
    check: numeric(0.05)
    difficulty: core

  - id: v6-q5
    concept: d-evidence-discipline
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A detector was run on 1,500 documents known to be members of a training
      corpus and 1,500 known to be non-members. Each row is one threshold.

      | Threshold    | Members flagged (of 1500) | Non-members flagged (of 1500) |
      | ---          | ---                       | ---                           |
      | very loose   | 1200                      | 1050                          |
      | loose        | 450                       | 300                           |
      | strict       | 60                        | 45                            |
      | very strict  | 21                        | 15                            |

      Report the true positive rate at a 1% false positive rate, as a
      percentage to one decimal place.
    answer: "1.4"
    check: numeric(0.05)
    difficulty: core

  - id: v6-q6
    concept: d-mia-limits
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A published membership-inference attack reports an AUC of 0.70 on its
      benchmark. What does that number tell you about using the attack to
      accuse a lab of training on a specific document?
    check: choice
    options:
      - text: "Very little on its own. AUC averages over every threshold, including ones nobody would operate at; the number that matters for an accusation is the true positive rate at a low fixed false positive rate, which for detectors in this range is often in the low single digits."
        correct: true
        explain: "Correct. AUC is the probability that a random member outscores a random non-member - a summary of the whole ROC curve. An accusation is made at one strict threshold, and detectors at AUC 0.70 commonly deliver a TPR of one or two percent when FPR is held at 1%, barely above flagging at random. Report the operating point, not the average over operating points."
      - text: "It is right about 70% of the time, so roughly 3 accusations in 10 would be wrong - imperfect but usable with corroboration."
        misconception: V6-M1
        explain: "The natural reading, and it is not what AUC measures. AUC is not accuracy and does not correspond to an error rate at any particular threshold. A detector can post 0.70 while being useless everywhere you would actually operate it, because the area was accumulated at permissive thresholds where it flags half of everything."
      - text: "It means the attack detects membership 70% of the time, so with a large enough catalogue the evidence accumulates to certainty."
        misconception: D2
        explain: "Two errors stacked. AUC is not a detection rate, and accumulation does not manufacture a false-positive rate: aggregating over documents raises the signal-to-noise of a collection-level statistic, but only against a null you actually have. Without a valid null, more documents give you a larger number with the same status as the small one."
      - text: "It means there is a 70% probability that the documents it flags really were in the training set."
        misconception: V0-M1
        explain: "This reads a number computed under the null as a probability about the world. Like a p-value, AUC conditions on the labels being known and describes the detector's ranking behaviour; converting it into the probability that a flagged document is a member additionally requires the base rate of members among the flagged population, which nobody has here."
    difficulty: warmup

  - id: v6-q7
    concept: d-memorization
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      A rightsholder gives you 300 documents and asks whether a particular open
      model was trained on them. You run a complete extraction battery: greedy
      and sampled decoding, prompt lengths from 20 to 500 tokens, a divergence
      attack, and probabilistic extraction over 100 samples per document.
      Nothing comes back on any of the 300.

      Which sentence belongs in the report?
    options:
      - text: 'Extraction did not fire on any of the 300 documents under the attacks and prompt lengths listed; since extractable content is under roughly one percent of a corpus and is concentrated on heavily duplicated and short high-entropy material, this result carries essentially no information about membership.'
        correct: true
        explain: 'It states the outcome as a property of the method and supplies the base rate that makes it uninformative. Without that base rate the report asserts a limitation it cannot justify, and the limitation is the first thing an opposing expert probes.'
      - text: 'The model does not appear to have been trained on this material.'
        misconception: D3
        explain: 'This converts a property of the method into a finding about the corpus. The battery has almost no power for typical documents, so its negative is equally likely either way - and this is the sentence that gets quoted back at you.'
      - text: 'The 300 documents may have been in the corpus, but they demonstrably contributed nothing the model retained.'
        misconception: D3
        explain: 'Retention and extractability are different quantities. Influence at scale is largely semantic and never resurfaces verbatim, so a silent battery says nothing about contribution.'
      - text: 'Extraction found nothing, so the next step is a per-document loss attack whose p-value will settle membership for each of the 300.'
        misconception: D2
        explain: 'A per-document membership p-value has no valid null and flips with the training seed, and 300 tests would need a Bonferroni correction on top. The escalation that works is changing the unit of evidence to the collection.'
      - text: 'The model refused several of the continuation prompts, which confirms the content is not present in the weights.'
        misconception: V6-M2
        explain: 'A refusal is evidence about the safety layer and nothing else. A divergence attack raised emission of training data by two orders of magnitude, and on one heavily memorized novel three models showed three refusal behaviours that predicted nothing about the weights.'
    check: choice
    difficulty: core

  - id: v6-q8
    concept: d-memorization
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      You prompt a deployed chat model with the opening of a well-known novel.
      It refuses, citing copyright. What does the refusal establish?
    check: choice
    options:
      - text: "That the model's safety layer declines this prompt. Nothing about what is in the weights - a divergence attack or a different framing may still recover the text."
        correct: true
        explain: "Correct. Alignment reshapes the output distribution over anticipated prompts; it does not edit weights toward forgetting. Divergence attacks that push a model back toward raw continuation have raised training-data emission by two orders of magnitude, and on one heavily memorized novel three frontier models gave three different refusal behaviours while the underlying memorization told a different story."
      - text: "That the memorized content was removed from the model during alignment training, which is what the copyright safeguards are for."
        misconception: V6-M2
        explain: "The refusal looks like the fix working, and it is the mechanism labs shipped for exactly this problem. But post-training changes behaviour, not storage. Accepting a refusal as a negative result in an audit means the first competent adversary produces a transcript that contradicts your report."
      - text: "That the model cannot reproduce the text, so this novel was either not in the training corpus or had no influence on the model."
        misconception: D3
        explain: "Two separate errors. The refusal is not a failure to reproduce, it is a decision not to; and even a genuine failure to reproduce would say nothing about membership or influence, since the extractable fraction of any corpus is under about one percent and is not a sample of what influenced the model."
      - text: "That the model has been fine-tuned to unlearn this work, which can be confirmed by testing whether its loss on the text is now high."
        misconception: D2
        explain: "The proposed confirmation is the problem. A loss measurement on one document, with no matched control and no null distribution over models trained without the work, is not a test of anything - and the per-document verdict flips with the training seed alone. There is also no evidence that any deployed unlearning procedure removes memorized content rather than suppressing its emission."
    difficulty: warmup

  - id: v6-q9
    concept: d-memorization
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      In a from-scratch training run you confirmed that a marked document
      becomes reliably detectable at 120 occurrences in a 50-billion-token
      corpus. Memorization risk depends on frequency relative to corpus size.

      The model you want to test was trained on 900 billion tokens. How many
      occurrences would you need to reach the same relative frequency?

      Answer with a single number.
    answer: "2160"
    check: numeric(1)
    difficulty: core

  - id: v6-q10
    concept: d-dataset-inference
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A per-document membership statistic carries an effect size of d = 0.05
      standard deviations. At the collection level the test statistic is
      z = d x sqrt(n) for n independent documents. At n = 10,000 this gives
      z = 0.05 x 100 = 5.0, a one-sided p of roughly 3 in ten million.

      Which statement about that result is correct?
    options:
      - text: "It supports the claim that this collection as a whole scores differently from a matched held-out collection, and no claim about any individual document in it; and it depends on the held-out set being matched to the members on everything except membership, since sqrt(n) amplifies a confound exactly as efficiently as it amplifies signal."
        correct: true
        explain: "Both halves are right. The mean shift stays at d while the noise in an average shrinks by sqrt(n), so aggregation buys real power - but the statistic is a property of the aggregate, so it identifies no document. And the null is still borrowed from a held-out set: a control mismatched on date, topic, register, source or length gets amplified by the same sqrt(n), producing a very significant wrong answer."
      - text: "With z = 5.0 the collection-level p-value is small enough to support the claim that a named book from the collection was in the training data."
        misconception: D2
        explain: "This is the per-document claim in aggregate disguise. The statistic was computed on the average over 10,000 documents; nothing in it identifies which documents drove the shift. A collection-level p-value supports no sentence of the form 'your book was used' - the unit of evidence is a corpus, not a sentence."
      - text: "At n = 10,000 the size of the sample makes the choice of held-out comparison set unimportant, because idiosyncrasies of any particular control document average away."
        misconception: V6-M3
        explain: "Per-document idiosyncrasies do average away; a systematic difference between the two sets does not. If the held-out set differs in date or topic, that difference sits in the mean shift and sqrt(n) multiplies it. More data amplifies a confound rather than diluting it - which is how a large n applied to a bad control produces a very significant wrong answer."
      - text: "Because the per-document effect size is only d = 0.05, the collection-level z of 5.0 is an artifact of aggregation and carries no more evidential weight than the single-document z of 0.05."
        misconception: D19
        explain: "The reverse error: aggregation is not a trick, it is the square root applied to a collection. The published method separates trained-on splits from held-out splits with no false positives at exactly this kind of effect size. What is illegitimate is counting dependent units as independent ones, not aggregating independent ones."
    check: choice
    difficulty: core

  - id: v6-q11
    concept: d-evidence-discipline
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A detection report states: "z = -4.3, p = 1e-5." What does the p-value
      mean here?
    check: choice
    options:
      - text: "If the model had not been trained on this material, a result at least this extreme would occur by chance about once in 100,000 runs of this procedure."
        correct: true
        explain: "Correct. A p-value conditions entirely on the null - the world where the effect is absent - and describes how often chance alone would produce data this extreme. It licenses rejecting the null; it says nothing directly about how likely your preferred explanation is."
      - text: "There is a 99.999% probability that the model was trained on this material."
        misconception: V0-M1
        explain: "This is the single most common statistical error in this field. Computing the probability that a hypothesis is true requires a prior over hypotheses, and the test never asked for one - it was computed entirely from the null. p is P(data this extreme | no effect), not P(effect | data)."
      - text: "The detection procedure has a 1-in-100,000 error rate overall, so at most one document in 100,000 will be wrongly flagged regardless of how many are tested."
        misconception: D19
        explain: "The per-test rate is correct and the conclusion does not follow. Test 100,000 documents at this threshold against a model trained on none of them and you expect one false positive; test a million and you expect ten. The family-wise error rate depends on how many tests you ran, which is why a report has to state its correction."
      - text: "The result is 4.3 standard deviations from the mean, so the effect is 4.3 times larger than the noise and therefore practically significant."
        misconception: D16
        explain: "z does measure standard deviations from the null's mean, but 'the noise' here is the noise of the null distribution, which is not the same as the run-to-run variability of the underlying quantity. A measurement can be many sigma from a null while the quantity itself swings by more than its own magnitude across training seeds - which is exactly the situation for per-document membership decisions."
    difficulty: warmup

  - id: v6-q12
    concept: d-evidence-discipline
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      You are reviewing a competitor's audit report before a rightsholder
      relies on it. The report says:

        "We tested all 8,400 documents in the client's catalogue against the
        model. We used the membership statistic that gave the clearest
        separation on this data. 412 documents scored at p < 0.05, which is
        far above the 5% we would expect by chance. Detector AUC was 0.71. We
        conclude the catalogue was used in training."

      Which review finding is correct?
    options:
      - text: "8400 x 0.05 = 420 expected false positives under the null, so 412 is slightly BELOW chance, not above it; the statistic was also chosen after seeing the data, the 8,400 documents from one catalogue are nowhere near independent, and AUC 0.71 is an average over thresholds rather than TPR at a fixed low FPR. The report is entitled to claim nothing about training."
        correct: true
        explain: "One failure per sentence. The headline count is at or below the chance expectation; the post-hoc choice of statistic is an unstated family of tests that invalidates the stated p-values rather than merely weakening them; a single catalogue shares author, publisher, format, topic and period, so the effective sample size is closer to the number of works or sources; and the operating point an accusation requires is TPR at 1% FPR, which for detectors near AUC 0.71 is commonly in the low single digits."
      - text: "The 412 detections are a real finding that a Bonferroni correction would trim to a smaller but defensible list; the report should apply 0.05 / 8400 = 6e-6 and re-report the survivors."
        misconception: D19
        explain: "There is nothing to trim. The expected count under the null is 420 and they found 412, so the whole list is consistent with noise before any correction is applied. Treating an uncorrected count as a finding awaiting cleanup is the error the correction exists to prevent - and it leaves the post-hoc statistic choice untouched, which invalidates every p-value in the family regardless of threshold."
      - text: "The core problem is the AUC of 0.71 being too low for an accusation; with a stronger membership statistic pushing AUC to 0.95 the same procedure would support the conclusion."
        misconception: D2
        explain: "A better statistic computed against a null you do not have is a better number with the same status. The report never says what set of non-members its p-values were computed against or why that set is matched on everything except membership - and no improvement in attack quality supplies a null over models trained without these documents."
      - text: "Choosing the statistic that gave the clearest separation is standard practice and harmless, since the same p-value formula was applied either way; the substantive failures are the missing correction and the AUC."
        misconception: D19
        explain: "Selecting the statistic after seeing which one separates the data is an enormous implicit family of tests, and the stated p-value describes none of them. Nothing in the arithmetic detects it and nothing in the report reveals it - the number looks identical either way, which is exactly why the only fix is pre-registration."
      - text: "Dependence between documents is a technicality here: the documents come from one catalogue but each was scored separately, so each score is its own independent observation."
        misconception: V6-M3
        explain: "Scoring documents separately does not make them independent draws. Shared author, publisher, format, topic and period are exactly the things that move a membership statistic, so the effective sample size is closer to the number of distinct works or sources - and the gap between nominal and effective n is the cheapest place for an opposing expert to find a factor of six in z."
    check: choice
    difficulty: stretch

  - id: v6-q13
    concept: d-mia-limits
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      The retrospective/prospective split is about WHEN you act. Which row of
      the method table below is stated correctly - side, source of the null,
      and what it supports?
    options:
      - text: "Extraction is retrospective and needs no null at all, because it is a demonstration rather than an inference; it is the strongest evidence available and fires only on a tiny high-duplication subset, so it is an exhibit and never an audit."
        correct: true
        explain: "Right on all three. You put a prefix in and a page comes out, so there is no probability being estimated and nothing to be uncertain about - which is why no null is required. Courts credit it second only to documentary proof of acquisition, and it is silent on over 99% of any corpus, so it is budgeted as the exhibit that occasionally fires."
      - text: "Post-hoc membership inference is retrospective and borrows its null from documents believed not to have been crawled; with a large enough set of those it supports a defensible false-positive rate."
        misconception: V6-M3
        explain: "Documents you believe were not crawled are an assumption, not a sample of the null. The null here is over MODELS trained without the document, and sampling it requires the corpus, the recipe, the compute and several seeds. Substituting documents for models is precisely the move that let a blind classifier - which never queries the model - beat published attacks across eight datasets."
      - text: "Keyed canaries are prospective, and because the null is constructed by design they close the gap for models already trained, since the key can be committed at any point before the audit."
        misconception: D14
        explain: "The null construction is right and the timing is wrong. The siblings are valid controls only because they were generated under a key committed BEFORE the scrape. Prospective evidence protects only data published after the evidence was embedded; the models people most want to sue trained on data collected years ago, when no key existed, and that gap never closes."
      - text: "Dataset inference is retrospective and its collection-level p-value, once below the corrected threshold, supports the claim that a specific named document in the collection was trained on."
        misconception: D2
        explain: "Dataset inference is retrospective and does borrow its null from a matched private held-out set, but the test was never about a document. The statistic is a property of the aggregate, so the claim is about the collection and is exactly as good as the match between the two sets - it identifies nothing about which documents drove the result."
      - text: "Extraction is prospective, since running the battery plants the prefixes that later serve as its own controls, and a negative result therefore establishes that the documents were not in the corpus."
        misconception: D3
        explain: "Two errors. Prompting a finished model plants nothing and changes no weights, so extraction cannot be prospective. And a negative is expected for almost every document in any corpus - the extractable fraction is under one percent of tokens, skewed to duplicated and high-entropy material - so failure to extract carries essentially no information about membership."
    check: choice
    difficulty: stretch

  - id: v6-q14
    concept: d-memorization
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      Counterfactual memorization of a document x is

        cm(x) = E_{runs with x}[r(x)] - E_{runs without x}[r(x)]

      the difference in recall between models trained with x and models trained
      without it, averaged over runs.

      A model reproduces a 500-token open-source licence header verbatim from a
      file in a publisher's catalogue, and separately reproduces a 20-token
      high-entropy string that appears only in one document of that catalogue.
      Which reading is correct?
    options:
      - text: "The licence header has cm ~ 0 - a model that never saw this file emits it anyway, having seen a hundred thousand other copies - while the 20-token string has large cm, because a model lacking the document had no route to producing it; the operational test is whether a model that never saw this document could have produced this output."
        correct: true
        explain: "Exactly the with-versus-without comparison. For the header, recall with the file equals recall without it, so the counterfactual difference is zero while the verbatim match is total - the match is a fact about the template, not the file. For the high-entropy string, recall without the document is near zero, so the difference is large. Length is a proxy that fails exactly where boilerplate lives."
      - text: "The 500-token match is the stronger evidence, since a longer verbatim span is harder to produce by chance than a 20-token one."
        misconception: D3
        explain: "Length is orthogonal to the counterfactual, and a longer boilerplate match is still zero evidence. The 500 tokens are reconstructible from a hundred thousand other copies of the same licence, so their emission does not depend on this file having been present at all. An audit counting them generates false positives by construction."
      - text: "The fix for the header is to raise the minimum match length above 500 tokens, so that only spans too long to be templatic are counted."
        misconception: D3
        explain: "No threshold on length separates templatic from document-specific text. Licence headers, bibliographic formatting, HTML skeletons and legal boilerplate run to arbitrary length, and each has cm = 0 however long the match. The filter has to be on the counterfactual, not on the span."
      - text: "Neither match is evidence, because the model's weights cannot hold copies of documents - capacity is only about 3.6 bits per parameter, far too little for the corpus."
        misconception: D4
        explain: "The capacity bound is an aggregate constraint and says nothing about how the surviving budget is allocated. It is entirely consistent with a small number of documents being stored nearly completely - the 200-book study found exactly that - so 'the weights contain nothing' is empirically wrong, and the high-entropy string is a live exhibit."
    check: choice
    difficulty: core
