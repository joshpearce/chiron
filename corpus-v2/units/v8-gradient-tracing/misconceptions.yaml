# Unit-local misconception additions for v8 (gradient-tracing).
# Same schema as corpus-v2/misconception-bank.yaml. IDs are namespaced V8-M*
# so they never collide with the global D* bank or with vol-1's M* namespace.
# Referenced by distractors in v8/questions.yaml and by refutation blocks in
# v8/canon.md.

misconceptions:
  - id: V8-M1
    name: gradient-similarity-is-content-similarity
    wrong_model: "A positive gradient dot product means two examples are about the same thing - gradient similarity is semantic similarity computed with better math, so attribution is retrieval with a causal veneer."
    why_appealing: "It is nearly right at small scale, where models are shaped heavily by surface tokens and the influential examples really do look lexically like the output - which is the regime every attribution demo screenshot is drawn from. It also matches the intuition an engineer already carries from embedding search, where similarity of representation is the entire game, and it lets one mental model cover both the retrieval surface and the gradient surface."
    failing_prediction: "If alignment tracked content, rewriting a training document as a close paraphrase - same facts, same entities, different word order - would leave its influence roughly unchanged. At 52-billion-parameter scale, flipping the word order of a key phrase collapses influence to near zero. Identical content, no influence. It runs the other way too: two documents on unrelated subjects score as strong allies when both push the same low-level machinery, such as a numeral format or a citation convention."
    correction: "The dot product measures whether two examples push the PARAMETERS the same way - a statement about the model's current mechanism, not about the examples' meaning. It sometimes coincides with semantic similarity and is not a measurement of it. The coincidence also weakens with scale in a specific direction: larger models show more abstract influence, matching concepts rather than tokens and generalizing across languages, so a small-scale demo where the influential documents look obviously relevant is not evidence about the frontier-scale case."
    units: [v8]

  - id: V8-M2
    name: more-checkpoints-is-better
    wrong_model: "The checkpoint sum approximates a sum over steps, so a finer grid is a better approximation - checkpoint count is a cost-versus-accuracy dial and using few is a budget compromise."
    why_appealing: "It is the correct instinct for numerical integration, where a finer grid genuinely converges, and the TracIn formula does look like a Riemann sum over the trajectory. The original work also reports results with only a handful of checkpoints, which reads like a concession to compute rather than a design choice."
    failing_prediction: "If checkpoints were independent samples of the trajectory, doubling them would cut estimator error the way averaging independent measurements does. They are nowhere near independent: two checkpoints a few hundred steps apart in a stable phase have nearly identical parameters, hence nearly identical gradients and nearly identical dot products, so you paid twice the storage and twice the gradient compute to add the same number twice. And a checkpoint from the first few hundred steps contributes large-magnitude gradients whose alignments say almost nothing about the trained model - variance, not signal."
    correction: "What a checkpoint buys is coverage of a DISTINCT phase of training, because an example's relationship to a query changes as the model moves - which is why signs flip across checkpoints. Spacing matters, count barely does. Choose checkpoints spanning the trajectory after the early chaos, and note that storage and gradient compute are both linear in the count. A warmup-stable-decay schedule makes this a clean design variable, because every checkpoint in the constant-learning-rate phase carries the same weight in the sum; under cosine decay every checkpoint sits at a different point in the schedule and the weights are all different."
    units: [v8]

  - id: V8-M3
    name: influence-scores-are-portable
    wrong_model: "An influence score is a quantity: 0.42 for one source means something comparable to 0.42 for another source, another query, another projection, or another model."
    why_appealing: "The scores come out of a formula, carry decimal places, and land in a table, so they present exactly like a measurement. Everything else in the engineer's world that looks like that IS a measurement with units. And the whole point of computing them is to compare, so the comparison feels licensed by the act."
    failing_prediction: "If scores were quantities, none of the free parameters could move them. All of them do. Change the model and the score is a sum of dot products in a different parameter space of a different dimension. Change the learning-rate schedule and every term in the sum rescales. Change the projection seed and the number moves inside the same model, on the same corpus, for the same query. A quantity that four unrelated implementation choices rescale arbitrarily has no units and no shared zero."
    correction: "What is comparable is the RANKING within one model for one query, and only after that ranking has been graded against ground truth. Across queries even the ranking needs care, because a query with a large-norm gradient inflates every source's score - normalize by the query gradient's length if you need cross-query comparability, which is what the production-scale systems in this literature do under various names. Report rankings and correlations, never raw scores, and never a raw score from one model beside a raw score from another. In a pitch this is the difference between a number a reviewer can check and a number that dissolves under the first question about how it was computed."
    units: [v8, v9]

  - id: V8-M4
    name: inrun-shapley-is-the-counterfactual
    wrong_model: "In-Run Data Shapley is a Shapley value, so it inherits the fairness argument from the coalition units - it is the retraining sweep's answer computed cheaply, during the run."
    why_appealing: "The name is the same, the paper is a Shapley paper, the axioms genuinely do apply to the game as constructed, and the first-order derivation is correct - nothing was misrepresented anywhere. The subtlety is entirely in WHICH game, and 'Shapley value' is carried in the head as a property of the split rather than as a function of a specific value function. It is also the single most attractive line in a pitch: a provably fair royalty ledger for 7.5% overhead."
    failing_prediction: "If the in-run ledger computed the coalition sweep's values, the two would agree on the case the coalition sweep exists to handle: two sources holding near-identical content. The sweep gets it right by construction - remove either alone and the model barely notices, remove both and the loss jumps, and the axioms split the shared value. The in-run ledger cannot see it. Each duplicate's gradient is dotted against the validation gradient independently, at steps that mostly do not contain the other, and each is credited in full for material only one of them needed to supply. The additive game the derivation assumes is exactly what redundancy violates."
    correction: "Two different games with two different value functions; the axioms hold separately in each. The in-run value is the Shapley value of a per-step, first-order, single-trajectory game - it cannot answer 'what if this source had never been in the corpus,' because that is a question about a different trajectory and nothing computed along this one can observe it. Stated that way it is a strong result: a defensible per-source allocation for 7.5% overhead at a scale nobody else has instrumented. Stated as the counterfactual, the first person across the table who has read the coalition literature asks about duplicate sources and there is no answer. What settles it either way is the rank correlation between the ledger and the coalition split on your own corpus."
    units: [v8, v9]
