  - id: v8-q12
    concept: d-tracin
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      You currently sum TracIn over 4 checkpoints spread across the
      constant-learning-rate phase of training. You have budget to save 16
      instead, evenly spaced across the same phase. What should you expect?
    check: choice
    options:
      - text: "Little change in the scores for four times the storage and four times the gradient compute, because checkpoints close together in a stable phase have nearly identical parameters and contribute nearly the same dot product repeatedly."
        correct: true
        explain: "Correct. What a checkpoint buys is coverage of a distinct phase of training, since an example's relationship to a query changes as the model moves - which is why signs flip across widely separated checkpoints. Sixteen samples of one phase is one sample, paid for sixteen times. Spacing across the trajectory is the knob; count is not."
      - text: "A materially better estimate, since the sum over checkpoints approximates a sum over steps and a finer grid converges to it."
        misconception: V8-M2
        explain: "The Riemann-sum intuition is the right instinct for numerical integration and the wrong one here, because it assumes the samples are informative independently. Consecutive checkpoints in a stable phase are near-duplicates; averaging near-duplicates reduces no error. The original TracIn work uses a handful of checkpoints by design, not by budget."
      - text: "Better resolution of which training documents most resemble the query, since more checkpoints means more chances to catch the lexical match."
        misconception: V8-M1
        explain: "Two errors stacked. Checkpoint count does not change what the dot product measures, and what it measures is not resemblance - it is whether two examples push the parameters the same way. At scale, identical content with flipped word order collapses influence to near zero, which is not a resolution problem."
      - text: "Reduced sensitivity to the training seed, since averaging over more checkpoints averages away the stochasticity in any single one."
        misconception: D16
        explain: "Seed sensitivity is real and it is the right thing to worry about, but the wrong lever is being pulled. All 16 checkpoints come from ONE training run and therefore one seed; they share every random choice that run made. Averaging within a trajectory cannot average across trajectories. Reducing seed sensitivity requires more runs, not more checkpoints."
    difficulty: warmup
