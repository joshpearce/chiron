# v8 gradient-tracing: pretest + terminal check bank.
# Solo fade items: v8-q2 (v8-gradient-dotproduct), v8-q3
# (v8-tracin-checkpoints). Each is the third appearance of a procedure that was
# worked in canon prose and drilled as a completion beat.

pretest:
  - id: v8-p1
    concept: d-tracin
    prompt: |
      You have a trained language model, every checkpoint saved from its
      training run, and the tagged corpus it was trained on. A user asks why
      the model produced a particular sentence.

      Which account of what you can produce without training anything new, and
      of what that product is worth to a skeptic, is right?
    options:
      - text: |
          You can produce an estimate, not an answer. From the saved
          checkpoints, compute for each source a learning-rate-weighted dot
          product between its gradient and the gradient of the sentence in
          question, sum over checkpoints, and rank the sources - cheap, one
          backward pass per query after a one-time indexing sweep. What it is
          worth to a skeptic is a separate empirical number: the rank
          correlation between that ranking and an actual counterfactual,
          measured on a corpus small enough to retrain. Without that number the
          ranking is unfalsifiable.
        correct: true
        explain: |
          Right on both halves. The gradients and checkpoints are already paid
          for, so an estimate is computable with no new training; and the
          estimate's warrant is a measured correlation against retraining, not
          the plausibility of the derivation. The published measurements are
          unkind - against retraining ground truth on a 2-billion-parameter
          model the methods that scale come out no better than random guessing,
          while the method reaching $\rho = 0.97$ costs three to five training
          runs per query.
      - text: |
          Yes - run a gradient influence method over the saved checkpoints and
          it answers the question directly. What it is worth to a skeptic is
          the strength of its warrant: the summand follows from a first-order
          expansion, and the approach has been demonstrated at 52 billion
          parameters, so the remaining work is engineering rather than
          validation.
        misconception: D6
        explain: |
          A demonstration that a method *runs* at 52B looks exactly like a
          demonstration that it *works* there, and it is not one. Measured
          against actual retraining on a 2B model, the scalable methods perform
          no better than random guessing, and correcting a single assumption in
          the derivation - SGD versus AdamW - moved published results by 10 to
          300%. The expansion is exact only to first order along the trajectory
          that happened; the counterfactual is about a trajectory that did not.
      - text: |
          Yes - rank the corpus by gradient influence and the top-ranked source
          is the document the sentence came from. What it is worth to a skeptic
          is that you can put that document on screen beside the output and let
          them compare the two.
        misconception: D5
        explain: |
          Two different targets. Influence is what moved the loss; entailment
          is what contains the claim, and the rankings systematically disagree.
          Run at 8 billion parameters over a full 160-billion-token corpus,
          BM25 - a term-overlap function from the 1990s with no idea a model
          exists - beats gradient influence at finding the document containing
          the fact. A document you can show a skeptic is corroborative
          evidence, not the causal answer the gradient method was computing.
      - text: |
          Yes - you can produce a score per source, say 0.42 for source 7. What
          it is worth to a skeptic is that it is a number rather than an
          opinion: they can weigh it against the scores this system reports for
          other queries, and against scores published for other models.
        misconception: V8-M3
        explain: |
          A TracIn score is a sum of learning-rate-weighted dot products in one
          model's parameter space - no units, no shared zero. Change the
          learning-rate schedule and every term rescales; change the projection
          seed and the number moves inside the same model on the same corpus
          for the same query; change the model and it is a different space of a
          different dimension. What is comparable is the ranking within one
          model for one query, and only after it has been graded.
    check: choice

  - id: v8-p2
    concept: d-gradient-similarity
    prompt: |
      Two training documents are compared by taking the dot product of their
      gradients - each document's gradient being the direction in parameter
      space that most reduces that document's loss. The dot product comes out
      near zero at every checkpoint.

      Which conclusion about the two documents' content does that license?
    options:
      - text: |
          Nothing reliable. The dot product says whether the two documents push
          the *parameters* the same way, which is a fact about the model's
          current mechanism rather than about what the documents say. Two
          documents stating identical facts can be near-orthogonal, because one
          is phrased in a construction the model has already mastered so its
          gradient is small and points elsewhere; two documents on unrelated
          subjects can be strongly aligned because both push the same low-level
          machinery, such as a numeral format or a citation convention.
        correct: true
        explain: |
          Right, and the sharpest evidence is the 52-billion-parameter study:
          flipping the word order of a key phrase collapses measured influence
          to near zero with the content untouched. The estimator was tracking
          token-order-sensitive gradient alignment, not meaning.
      - text: |
          That the two documents are about different things. Gradient alignment
          is semantic similarity computed in the model's own representation
          rather than in token space, so a persistent zero across every
          checkpoint means the documents share no subject matter.
        misconception: V8-M1
        explain: |
          This is nearly right at small scale, where models are shaped heavily
          by surface tokens and the influential examples do look lexically like
          the output - which is the regime every demo screenshot is drawn from.
          It fails where it matters: identical content with reordered words
          scores near zero at 52B, and unrelated subjects score as strong
          allies when both push the same low-level habit.
      - text: |
          That the documents share no wording. A near-zero dot product at every
          checkpoint is the gradient-space version of no n-gram overlap, so
          neither document can be carrying content the other one carries.
        misconception: D3
        explain: |
          Verbatim overlap is a different measurement, taken on the finished
          weights rather than on gradients, and it is a lower bound in any
          case: most of what training data contributes is semantic and never
          resurfaces verbatim. Documents can share content and share no n-grams
          - and can share n-grams while their gradients point in unrelated
          directions, because the gradient depends on what the model already
          knows.
      - text: |
          That the documents are unrelated, and unusually firmly so. Zero is
          the one value on this scale that is not arbitrary - a shared zero
          point means "no relationship" reads the same across checkpoints,
          across queries and across models, so a consistent zero is a portable
          finding.
        misconception: V8-M3
        explain: |
          There is no shared zero. The score is a sum of dot products in one
          model's parameter space; change the projection seed, the schedule or
          the model and the number moves, and near-orthogonal pairs are exactly
          where projection error can exceed the signal entirely. Projected
          scores resolve the strongly aligned pairs reliably and the long tail
          badly, so a small number is the least trustworthy region of the
          estimator, not the most.
    check: choice

  - id: v8-p3
    concept: d-influence-vs-entailment
    prompt: |
      A model states a fact. You want to find the training document that
      contains that fact. Two tools are available: a production-grade gradient
      influence method run properly at 8-billion-parameter scale over the full
      160-billion-token training corpus, and BM25, a term-overlap retrieval
      score from the 1990s that has no idea a model exists.

      Which finds the fact-containing document more reliably, and why?
    options:
      - text: |
          BM25, because the two tools answer different questions. BM25 scores
          lexical overlap, which is directly a proxy for "this document
          contains this claim". The gradient method scores which training data
          moved the loss on that output - a causal claim about the model, which
          systematically surfaces different documents: the ones that shaped
          format, register and reasoning step, and little for a document
          stating the fact in a phrasing the model had already mastered.
        correct: true
        explain: |
          Right, and this is the measured result from a full-corpus run at that
          scale. It recurs across the benchmark suites: cheap lexical and
          embedding baselines match or beat expensive gradient attribution on
          fact-finding, and the earlier benchmarks saying otherwise turned out
          to be lexically biased in the gradient methods' favour. Influence is
          contributive; entailment is corroborative.
      - text: |
          The gradient method, because both tools answer the same question -
          which training data is responsible for this output - and the gradient
          method answers it from the model's actual causal structure while BM25
          can only guess from word overlap. Where the two disagree, the
          gradient ranking is the one to trust.
        misconception: D5
        explain: |
          "Responsible" covers two different targets in English, and the
          methods are each good at one. Influence is what moved the loss;
          entailment is what contains the claim. On the fact-finding task BM25
          wins, and not narrowly - which is only surprising if you think there
          was one question. A royalty design has to pick a target and defend
          the choice, expecting the cheap lexical method to win at the other.
      - text: |
          The gradient method, because scale settles it: a method run properly
          at 8 billion parameters over the full 160-billion-token corpus is
          working with vastly more information than a term-overlap score, and
          any gap that remains is an implementation detail rather than a
          finding about the method.
        misconception: D6
        explain: |
          Running at scale is not working at scale. That comparison is exactly
          the one that was made, with the compute, and BM25 won. The same
          pattern shows elsewhere: measured against actual retraining on a 2B
          model, the scalable gradient methods come out no better than random
          guessing. Correctness here is defined by an experiment, not by the
          size of the run.
      - text: |
          BM25, but only for now: gradient attribution is a young field, and a
          term-overlap score from the 1990s beating it is a sign the estimators
          need refinement rather than a durable fact. Expect better gradient
          methods to overtake it on this task.
        misconception: D20
        explain: |
          Right prediction, wrong mechanism, and the mechanism is what you will
          carry into a payment rule. No refinement of an influence estimator
          makes it good at entailment, because entailment is not what it
          measures - the two rankings disagree by construction, and neither is
          wrong. Treating the gap as a maturity problem is how a corroborative
          system ends up shipped under a contributive claim.
    check: choice

check:
  - id: v8-q1
    concept: d-gradient-similarity
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A training example $z$ and a query point $z_q$ have gradients $g_z$ and
      $g_{z_q}$ at the current parameters. The optimizer takes one
      gradient-descent step on $z$ alone with learning rate $\eta$.

      Which statement of the first-order prediction for the change in the
      query's loss - together with its sign convention and what governs its
      accuracy - is correct?
    options:
      - text: |
          $\Delta \ell(z_q) \approx -\eta\,(g_{z_q} \cdot g_z)$, since the step
          moves the parameters by $\Delta\theta = -\eta\,g_z$ and the loss
          moves by $g_{z_q} \cdot \Delta\theta$. Both gradients have the same
          shape as the parameters and the dot product multiplies matching
          components and sums. A positive dot product means the query's loss
          went DOWN - allies; negative means rivals; zero means untouched to
          first order. Accuracy is governed by the step size: the error is
          second order in $\eta$, so halving the learning rate cuts it by
          roughly a factor of four.
        correct: true
        explain: |
          Right, and every piece is load-bearing. The chapter's worked check:
          at $\eta = 0.1$ the prediction is $-0.8$ against an actual $-0.64$;
          at $\eta = 0.01$ it is $-0.08$ against $-0.0784$. Everything built on
          this - the checkpoint sum, the in-run ledger - inherits that
          dependence on step size.
      - text: |
          $\Delta \ell(z_q) \approx -(g_{z_q} \cdot g_z)$. The learning rate is
          a property of the training schedule rather than of the alignment
          being measured, so it drops out; positive dot product means the
          query's loss fell. Accuracy is governed by how well the two gradients
          are estimated, not by the step size.
        misconception: V8-M3
        explain: |
          Dropping $\eta$ is one of the two standard implementation bugs and it
          changes rankings: a step under a large learning rate moves the
          weights further, so each unit of alignment matters more. In the
          chapter's worked pair, raw dot products of 6 and 2 become weighted
          contributions of 0.30 and 0.02 - a 3x ratio becoming 15x. The
          schedule is inside the number, which is also why a raw score is not a
          portable quantity.
      - text: |
          $\Delta \ell(z_q) \approx -\eta\,(g_{z_q} \cdot g_z)$, where the dot
          product measures how similar the two examples' content is - large and
          positive when $z$ and $z_q$ are about the same subject matter. Sign:
          positive means the query's loss fell. Accuracy is governed by how
          closely the two examples' topics match, since unrelated examples give
          an uninformative near-zero value.
        misconception: V8-M1
        explain: |
          The formula is right and the reading of it is not, which is worse
          than an arithmetic slip. The dot product says whether two examples
          push the *parameters* the same way - a fact about the model's current
          mechanism. At 52B scale, flipping the word order of a key phrase
          collapses influence to near zero with the content unchanged, and two
          documents on unrelated subjects can be strong allies when both push
          the same numeral format. Accuracy is set by the step size, not by
          topical relatedness.
      - text: |
          $\Delta \ell(z_q) = -\eta\,(g_{z_q} \cdot g_z)$, exactly rather than
          approximately: it follows from the chain rule applied to the update
          $\Delta\theta = -\eta\,g_z$, so there is no approximation to bound.
          Positive dot product means the query's loss fell, and the only limit
          on accuracy is floating-point precision.
        misconception: D6
        explain: |
          The expansion is first order - a straight-line prediction on a curved
          loss surface - and the discarded term is the curvature. Its error is
          second order in $\eta$, which is exactly why the chapter's check
          improves tenfold when the step shrinks tenfold. Treating the
          derivation as an exact identity is how a cheap estimator gets shipped
          as a counterfactual without ever being graded against one.
    check: choice
    difficulty: core

  - id: v8-q2
    concept: d-gradient-similarity
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A two-parameter model predicts $\hat y = w_1 x_1 + w_2 x_2$ and is scored
      by $\ell = (\hat y - y)^2$, so a single example's gradient is
      $g = 2(\hat y - y)\,(x_1, x_2)$.

      Parameters are $w = (1, 2)$. Two examples:

        U: x = (2, 1), y = 5
        V: x = (1, 1), y = 1

      Compute $g_U \cdot g_V$.

      Answer with the single integer, digits and sign only.
    answer: "-24"
    check: exact
    difficulty: core

  - id: v8-q3
    concept: d-tracin
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Compute a TracIn score over two checkpoints. At each checkpoint the
      contribution is the learning rate times the dot product of the query
      gradient with the training example's gradient; the score is the sum.

        Checkpoint 1, eta = 0.2
          g_q = (1, -1, 2)
          g_S = (3,  1, 0)

        Checkpoint 2, eta = 0.05
          g_q = (2,  0, 1)
          g_S = (1,  4, 2)

      Answer with the single number, to two decimal places.
    answer: 0.60
    check: numeric(0.005)
    difficulty: core

  - id: v8-q4
    concept: d-tracin
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      TracIn is described in this unit as the honest baseline of the gradient
      attribution family. Which statement gives the correct reason?
    check: choice
    options:
      - text: "Its assumptions are checkable and boundable: it needs the training trajectory, which you have, and a first-order step approximation whose error shrinks with the learning rate. It requires no convexity, no converged optimum, and no second-derivative matrix."
        correct: true
        explain: "Correct, and the emphasis belongs on 'checkable'. TracIn can be wrong - it is a first-order approximation along one trajectory - but every source of its error is something you can name and, in the case of the step approximation, shrink. That is what makes a negative result about TracIn informative rather than mysterious."
      - text: "It is the most accurate gradient method available, which is why the Hessian-corrected alternatives have not displaced it."
        misconception: D6
        explain: "Accuracy is not what earns TracIn the label, and no gradient method in this family has demonstrated accuracy against ground truth at scale - the scalable ones measure at chance. TracIn is honest because its failure modes are legible, not because it wins. Assuming a method is good because it is the standard one is exactly the inference this unit's reckoning section exists to break."
      - text: "It produces scores on an absolute scale, so a score from one model can be compared directly against a score from another."
        misconception: V8-M3
        explain: "The opposite is true. A TracIn score is a sum of learning-rate-weighted dot products in one model's parameter space; change the model, the schedule, or the projection seed and the number moves. There is no shared zero and no units. Only rankings within one model, graded against ground truth, carry information."
      - text: "Because it dots gradients directly, it finds the training documents that most closely resemble the output, which is what attribution means."
        misconception: V8-M1
        explain: "This conflates gradient alignment with content similarity. Gradient alignment is about whether two examples push the parameters the same way; at 52B scale, flipping the word order of a key phrase collapses influence to near zero while the content is unchanged. It also conflates influence with entailment - resemblance is the question BM25 answers, and answers better."
    difficulty: core

  - id: v8-q5
    concept: d-tracin
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Your gradient index projects every 561-million-component gradient down to
      $d = 4{,}096$ components with a random matrix $P$ before storing it.

      Which account of why that is safe, of the one condition that must hold
      across every vector in the index, and of what happens when it is
      violated, is correct?
    options:
      - text: |
          Safe because you never need the gradients, only their dot products:
          for $P$ with Gaussian rows scaled by $1/\sqrt{d}$,
          $(Pu) \cdot (Pv) \approx u \cdot v$, with the required $d$ depending
          on how MANY vectors are preserved and not on how long they are - the
          parameter count does not appear - and error falling like
          $1/\sqrt{d}$. The condition: every vector ever dotted against another
          must pass through the SAME projection, in practice the same seed. If
          it is violated the dot products approximate nothing, and the failure
          is silent - finite, well-ordered numbers that produce a
          plausible-looking ranking with no error raised anywhere.
        correct: true
        explain: |
          Right, and the silence is the operationally important half: that is
          why the seed is a load-bearing manifest entry rather than a comment.
          The matrix is larger than the model, so it is regenerated from the
          seed rather than stored. Note also what the projection does cost -
          the $1/\sqrt{d}$ error is relative to $\lVert u\rVert\lVert v\rVert$,
          so near-orthogonal pairs are resolved badly and the top contributors
          well.
      - text: |
          Safe because the Johnson-Lindenstrauss property preserves dot
          products. The condition is that $d$ be large enough for the parameter
          count being compressed - at 561 million components, $4{,}096$ is the
          aggressive end, and a mismatch shows up immediately as scores that
          are obviously out of range, so the failure mode is loud and
          self-announcing. The projection seed is an implementation detail.
        misconception: D6
        explain: |
          The required dimension depends on the number of vectors preserved,
          not on their length - $N$ does not appear, which is the whole reason
          the technique works at 561 million parameters. And the failure is the
          opposite of loud: two different draws of $P$ are two different random
          maps, so the dot products are inner products of unrelated random
          shadows that still sort into a confident ranking. Nothing errors.
      - text: |
          Safe because dot products survive projection with error falling like
          $1/\sqrt{d}$. The condition is that $d$ be fixed across the index. The
          seed affects only the exact decimals - a different draw perturbs each
          score slightly, so the numbers stay comparable across checkpoints,
          across queries and against scores published for other models.
        misconception: V8-M3
        explain: |
          A different seed does not perturb decimals, it severs the
          relationship between the two vectors entirely: the query gradient and
          the source accumulators end up in different random spaces. And even
          with the seed fixed, the score is a sum of learning-rate-weighted dot
          products in one model's parameter space - no units, no shared zero,
          nothing comparable to another model's number.
      - text: |
          Safe because dot products survive projection with error falling like
          $1/\sqrt{d}$, independently of the parameter count. The condition is
          the same seed throughout, and recording it is good reproducibility
          hygiene - it makes the index easier to rebuild and easier to defend
          if anyone later asks how the numbers were produced. The numbers
          themselves are already computed and are what they are.
        misconception: D19
        explain: |
          The facts are right and their status is wrong, which is the whole
          point. Without the seed the stored numbers are not "already computed
          and correct", they are noise wearing a ranking - a pipeline that
          regenerates a fresh matrix each run is reproducibly wrong. The seed
          is a precondition for the numbers meaning anything, in the same way a
          threshold committed before seeing the model is what turns a statistic
          into an exhibit.
    check: choice
    difficulty: core

  - id: v8-q6
    concept: d-tracin
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A 2026 result found that the dominant error in trajectory-based
      attribution methods was that the literature assumed SGD while the models
      were trained with AdamW, and that correcting it moved published results
      by 10 to 300%.

      Which account locates the assumption in the TracIn derivation, states the
      corrected summand, and explains why the correction reorders rather than
      rescales?
    options:
      - text: |
          It enters at the substitution $\Delta\theta = -\eta\,g_z$ - the SGD
          update rule - not at the first-order expansion
          $\Delta\ell(z_q) \approx g_{z_q} \cdot \Delta\theta$, which holds for
          any optimizer. AdamW steps
          $\Delta\theta_j = -\eta\,g_{z,j}/(\sqrt{v_j} + \epsilon)$, so the
          honest summand is the weighted dot product
          $\sum_j g_{z_q,j}\,g_{z,j}/(\sqrt{v_j} + \epsilon)$. It reorders
          because $v_j$ spans orders of magnitude across a transformer's
          parameters: an example whose gradient mass sits in low-variance
          coordinates is promoted relative to one whose mass sits in
          high-variance coordinates. A uniform weight would be a scalar
          multiple and would preserve the order.
        correct: true
        explain: |
          Right, and the fix is cheap: save the optimizer's second-moment state
          alongside each checkpoint and use the weighted form. Without it you
          have implemented TracIn's derivation for an optimizer nobody used.
      - text: |
          It enters at the first-order expansion itself. A straight-line
          prediction on a curved loss surface is adequate for the small models
          the derivation was written for and degrades badly at frontier scale,
          where AdamW's adaptive steps are large; the correction is to carry
          second-order terms, and the summand becomes a curvature-weighted dot
          product. Rankings change because the curvature differs between
          examples.
        misconception: D6
        explain: |
          The expansion is optimizer-agnostic and correct - the error is one
          line later, in substituting the SGD update rule for the update the
          model actually took. Reading the problem as a scaling issue awaiting
          better math is how a wrong update rule survives in an implementation:
          the fix is four lines using state you already saved, not a
          second-order method.
      - text: |
          It enters at the substitution $\Delta\theta = -\eta\,g_z$, and the
          corrected summand divides by AdamW's second-moment estimate. Since
          that division scales the whole score, the 10 to 300% figure is about
          magnitudes, and magnitudes were never comparable anyway - so a system
          that reports rankings rather than raw scores is unaffected by the
          correction.
        misconception: V8-M3
        explain: |
          Reporting rankings is the right habit and it does not rescue you
          here. The division is per coordinate, not a scalar: $v_j$ spans
          orders of magnitude, so the weighting systematically promotes
          examples whose gradient mass sits in low-variance coordinates and
          demotes the others. The ranking itself moves, which is exactly what
          the 10 to 300% is measuring.
      - text: |
          It enters wherever the derivation assumes a single deterministic
          step. AdamW's update depends on running moment estimates that carry
          the history of the batch order and the seed, so the mismatch shows up
          as run-to-run variance in the scores; the correction is to average
          the summand over several seeds, which is what moved the published
          numbers by 10 to 300%.
        misconception: D16
        explain: |
          Seed and order noise are real and matter elsewhere - a source's
          marginal contribution can swing by more than its own magnitude across
          seeds - but this is not that. The AdamW mismatch is a systematic
          derivation error, deterministic given the saved optimizer state:
          substituting the SGD rule for the rule the optimizer used. Averaging
          over seeds averages a formula that is still wrong.
    check: choice
    difficulty: stretch

  - id: v8-q7
    concept: d-tracin
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A colleague reports: "Source 7 scores 0.42 on our 10M-parameter model and
      0.31 on the 561M model, so its influence dropped by about a quarter as we
      scaled."

      What can you conclude?
    check: choice
    options:
      - text: "Nothing. The two numbers are sums of learning-rate-weighted dot products in different parameter spaces under different schedules and different projections; they have no shared units and no shared zero. Only rankings within one model, graded against ground truth, carry information."
        correct: true
        explain: "Correct. Four independent choices - model, learning-rate schedule, projection seed, and whether the dot product is optimizer-preconditioned - each rescale the number arbitrarily. Comparing them is like comparing two voltages with no stated reference. The comparable object is the ranking, and even that needs the query gradient's norm divided out before it travels across queries."
      - text: "Source 7's influence genuinely fell by about 26%, which is worth reporting as a scaling trend."
        misconception: V8-M3
        explain: "This treats the score as a measured quantity with units. It is not. The 561M model's parameter space has a different dimension, its schedule sets different eta_c weights, and if the projection seed differs the two numbers are shadows of different random maps. A 'trend' assembled from two incomparable numbers is an artifact of the reporting, not a finding."
      - text: "Influence is known to become more abstract with scale, so the drop confirms that the larger model relies less on any single source."
        misconception: V8-M1
        explain: "The abstraction finding is real - larger models match concepts rather than surface tokens - but it is a claim about WHAT influence attaches to, not about the magnitude of a raw score. Invoking it here dresses an incomparable pair of numbers in a real result, which is more dangerous than an obvious error because it survives a first round of questions."
      - text: "The drop is within the expected variation from training stochasticity, so both numbers should be reported with seed error bars and then compared."
        misconception: D16
        explain: "Seed noise is real and error bars are right, but adding them does not make these two numbers comparable - it makes two incomparable numbers each carry an interval. The problem is not precision, it is that there is no common scale. Error bars fix the question 'is this number stable'; they cannot fix 'is this number the same kind of thing as that one'."
    difficulty: core

  - id: v8-q8
    concept: d-influence-vs-entailment
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      You are designing the payment rule for a royalty system and must choose
      what it pays for: influence or entailment.

      Which account gets all of it right - what each target measures, which
      tool answers each and roughly what it costs, the specific way EACH choice
      misallocates money, and a defensible decision?
    options:
      - text: |
          Influence is which training data moved the loss on this output:
          defined by leave-one-out retraining, approximated by
          learning-rate-weighted gradient dot products over checkpoints - a
          training run per question for the exact version, tens of dollars once
          plus milliseconds per query for the approximation. Entailment is
          which document contains or supports the claim: BM25, suffix arrays,
          embedding search, milliseconds and no GPU, and at 8-billion-parameter
          scale BM25 beats gradient influence at that task. Paying for
          entailment pays for lexical resemblance and so underpays the hidden
          influencers - the sources that shaped format, register and reasoning
          without resembling any output - while calling a corroborative system
          contributive. Paying for influence pays a defensible but unintuitive
          quantity, worth only its measured rank correlation against
          retraining, which can only be measured below the scale the product
          runs at. I would pay for influence, because contribution is what a
          royalty is for, and ship the lexical surface beside it labelled as
          corroboration.
        correct: true
        explain: |
          Right, and the last clause is the product: two targets, two tools,
          both displayed, each labelled with which question it answers and the
          influence column carrying its correlation.
      - text: |
          The two targets are two names for one question, and the good methods
          converge on it. Pay on a blended score - gradient influence where it
          is confident, lexical match elsewhere - and the single ranking is
          both the causal answer and the evidentiary one, so neither
          misallocation arises and no labelling problem remains.
        misconception: D5
        explain: |
          The two rankings systematically disagree, and that is a measured
          result rather than an implementation gap: run properly at 8 billion
          parameters over a 160-billion-token corpus, BM25 - a term-overlap
          function from the 1990s that has no idea a model exists - beats
          gradient influence at finding the document containing the fact.
          Influence measures what moved the loss; entailment measures what
          contains the claim. Blending them produces a number that answers
          neither.
      - text: |
          Pay for entailment, and describe the payments as compensation for
          training contribution: a suffix-array or BM25 match shows the source
          the answer came from, it costs milliseconds, and a rightsholder can
          check it by eye. Paying for influence misallocates because the scores
          are unintuitive; entailment has no misallocation to name, since a
          document that matches the output is by definition the one that
          produced it.
        misconception: D1
        explain: |
          A lexical match is corroborative - this source supports the claim -
          not contributive. The same passage may sit in four sources, so a
          match establishes correspondence, not causation, and paying on it
          underpays every source that shaped the model without resembling its
          outputs. Choosing entailment and saying so is a defensible product
          decision; choosing it while calling it contribution is the citation
          -is-attribution error that a compensation scheme cannot survive.
      - text: |
          Pay for entailment measured by verbatim overlap, because it is the
          only target with a checkable ground truth: if no passage of a source
          matches the output, that source did not shape it and there is nothing
          to pay for. Influence misallocates by paying for documents with no
          demonstrable relationship to the output; entailment cannot
          misallocate, because absence of a match is proof of absence of use.
        misconception: D3
        explain: |
          Verbatim match is a lower bound and a measurement artifact. Most of
          what training data contributes is semantic and never resurfaces
          verbatim - the documents that taught format, register and reasoning
          step share no n-grams with the outputs they shaped - and asking for
          the same content in a different style defeats any n-gram filter while
          the knowledge stays intact. Absence of a match is not absence of use.
    check: choice
    difficulty: core

  - id: v8-q9
    concept: d-inrun-shapley
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Your in-run ledger accumulates, per source, the learning-rate-weighted
      dot product of each example's gradient with the validation gradient, at
      every training step. Two of your twelve sources hold near-identical
      content.

      What does the ledger report for those two, and what does that tell you?
    check: choice
    options:
      - text: "It credits each of them in full for material only one of them needed to supply, because the per-step game is additive by construction and cannot see redundancy. The ledger is a Shapley value of a per-step, first-order, single-trajectory game - not of the coalition game."
        correct: true
        explain: "Correct, and the distinction is the whole content of the method's honest claim. The first-order derivation makes each example's contribution its own term with no dependence on any other player, which is what makes the Shapley value trivial to compute - and is exactly the additivity that redundancy violates. The coalition sweep handles duplicates by construction; the in-run ledger structurally cannot."
      - text: "It splits the shared value between them, because Shapley values satisfy the symmetry axiom and interchangeable players are paid equally."
        misconception: V8-M4
        explain: "Symmetry does hold - in the game the ledger actually plays, where players are examples in one batch and value is that step's validation-loss reduction. That game says nothing about what would happen if a source were absent from the corpus, which is a different trajectory. Two duplicates appear in mostly different batches and are each credited independently; nothing splits anything."
      - text: "It reports both at approximately zero, since each is individually replaceable and the model loses nothing when either is removed."
        misconception: V5-M4
        explain: "That is the leave-one-out failure mode, imported into a method that does not compute leave-one-out. The ledger never removes anything - it accumulates gradient alignment along the trajectory that happened, and both duplicates were present and contributing on that trajectory. Two different rules, two different pathologies, and confusing them means predicting the wrong bug."
      - text: "The ledger is unreliable here, which is why source-level Shapley over coalitions is infeasible past a handful of sources and flat fees are the only defensible option."
        misconception: D7
        explain: "The first clause is right and the rest does not follow. Source-level coalition Shapley is feasible precisely because the unit is the source: 12 sources means 4,096 cached coalitions, not 2^n over millions of documents. The cliff is around n=15. A limitation of the cheap in-run method is an argument for grading it against the coalition sweep, not for abandoning both."
    difficulty: core

  - id: v8-q10
    concept: d-inrun-shapley
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Someone argues that nobody should ship gradient-based attribution for
      royalty payments at all, using the actual evidence rather than generic
      caution.

      Which response states the case against at full strength, answers or
      concedes it correctly, and names both the measurement that would settle
      it and the result that would change the position?
    options:
      - text: |
          The case against is real: the methods that scale measured no better
          than random guessing against retraining ground truth on a 2B model,
          the one method reaching $\rho = 0.97$ costs three to five training
          runs per test sample, the field's derivations assumed SGD while the
          models trained with AdamW and correcting it moved published results
          by 10 to 300%, and BM25 beats gradient influence at finding the
          document containing the fact. Those are arguments against shipping an
          UNGRADED method, not against shipping a graded one. The response is
          to measure the rank correlation and the Linear Datamodeling Score of
          the cheap method against the leave-one-source-out table, publish them
          with the design, and let the number set the claim - a high
          correlation gives a cheap instrument with a stated warrant, a low one
          is a real negative result and you ship the coalition split instead.
          What would change the position: a correlation near zero on this
          corpus at the scale where it can be measured, which strips the
          gradient layer out rather than relabelling it.
        correct: true
        explain: |
          Right, and the graded-versus-ungraded distinction is the load-bearing
          one: every negative result cited is about methods nobody checked
          against a counterfactual, so the correlation with its design is both
          the answer to the objection and the falsifier.
      - text: |
          The case against overstates it. The methods are published by the same
          community that publishes the critiques, influence functions run at 52
          billion parameters, and libraries ship 8B examples - a technique
          correct at small scale and running at large scale is correct at large
          scale, so scaling it is engineering. Ship it, and settle any
          remaining doubt by demonstrating the pipeline at a larger parameter
          count; a run that completes at frontier scale is the result that
          would change minds.
        misconception: D6
        explain: |
          A demonstration that a method RUNS at 52 billion parameters is not a
          demonstration that it works there, and the 52B study was published as
          a study of generalization rather than as an attribution product.
          Correctness here is defined by an experiment - retraining - that
          nobody runs at large scale, which is why the settling measurement is
          a correlation against a counterfactual table where retraining is
          affordable, not a bigger run.
      - text: |
          The case against is decisive and the concession should be total.
          Given the near-random results, the AdamW mismatch and BM25 winning at
          fact-finding, contribution-proportional payment cannot be defended,
          so drop the gradient layer, pay a flat fee, and stop measuring - the
          threshold argument already tells you which side you are on, and
          spending model budget to confirm it is spending money to learn
          nothing.
        misconception: D20
        explain: |
          The threshold result says the welfare-optimal contract collapses to a
          flat fee when the estimator's signal-to-noise is BELOW it - which is
          an empirical question about this corpus, this model scale and this
          noise floor. Conceding without measuring throws away the result:
          either side of the threshold is a publishable finding, and the
          industry's convergence on flat fees is consistent with the bar not
          being cleared, not with it being unmeasurable.
      - text: |
          The case against is strong, and the answer is that the published
          overhead figure settles it: In-Run Data Shapley computes a genuine
          Shapley value during the run for about 7.5%, and the axioms give it
          the fairness guarantee the coalition sweep has. Since it is the
          retraining counterfactual computed cheaply, it sidesteps every
          criticism aimed at post-hoc gradient methods, and the result that
          would change the position is a failure to reproduce the 7.5%
          overhead.
        misconception: V8-M4
        explain: |
          The axioms hold, but for a different game: the in-run value is the
          Shapley value of a per-step, first-order, single-trajectory game, and
          nothing computed along the trajectory that happened can observe one
          that did not. Two sources holding near-identical content expose it -
          the coalition sweep splits the shared value by construction, while
          the in-run ledger credits each duplicate in full. The settling number
          is the rank correlation between the ledger and the coalition split,
          not the overhead.
    check: choice
    difficulty: stretch

  - id: v8-q11
    concept: d-tracin
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Size a gradient index. The corpus has $4 \times 10^6$ training sequences
      tagged into $K = 8$ sources. Gradients are projected to $d = 2{,}048$
      components stored as 16-bit floats (2 bytes each), and you save 3
      checkpoints.

      Compute (a) the storage in GB if you kept one projected gradient per
      SEQUENCE at a single checkpoint, and (b) the storage in KB if you keep
      one accumulated vector per SOURCE at every one of the 3 checkpoints.

      Use 1 GB $= 10^9$ bytes and 1 KB $= 10^3$ bytes. Answer as two numbers,
      comma-separated: the GB figure to one decimal place, then the KB figure
      to the nearest whole number. Format like `12.3, 456`.
    answer: "16.4, 98"
    check: exact
    difficulty: warmup

  - id: v8-q12
    concept: d-tracin
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      You currently sum TracIn over 4 checkpoints spread across the
      constant-learning-rate phase of training. You have budget to save 16
      instead, evenly spaced across the same phase. What should you expect?
    check: choice
    options:
      - text: "Little change in the scores for four times the storage and four times the gradient compute, because checkpoints close together in a stable phase have nearly identical parameters and contribute nearly the same dot product repeatedly."
        correct: true
        explain: "Correct. What a checkpoint buys is coverage of a distinct phase of training, since an example's relationship to a query changes as the model moves - which is why signs flip across widely separated checkpoints. Sixteen samples of one phase is one sample, paid for sixteen times. Spacing across the trajectory is the knob; count is not."
      - text: "A materially better estimate, since the sum over checkpoints approximates a sum over steps and a finer grid converges to it."
        misconception: V8-M2
        explain: "The Riemann-sum intuition is the right instinct for numerical integration and the wrong one here, because it assumes the samples are informative independently. Consecutive checkpoints in a stable phase are near-duplicates; averaging near-duplicates reduces no error. The original TracIn work uses a handful of checkpoints by design, not by budget."
      - text: "Better resolution of which training documents most resemble the query, since more checkpoints means more chances to catch the lexical match."
        misconception: V8-M1
        explain: "Two errors stacked. Checkpoint count does not change what the dot product measures, and what it measures is not resemblance - it is whether two examples push the parameters the same way. At scale, identical content with flipped word order collapses influence to near zero, which is not a resolution problem."
      - text: "Reduced sensitivity to the training seed, since averaging over more checkpoints averages away the stochasticity in any single one."
        misconception: D16
        explain: "Seed sensitivity is real and it is the right thing to worry about, but the wrong lever is being pulled. All 16 checkpoints come from ONE training run and therefore one seed; they share every random choice that run made. Averaging within a trajectory cannot average across trajectories. Reducing seed sensitivity requires more runs, not more checkpoints."
    difficulty: warmup
