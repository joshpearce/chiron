# v2 corpus-pipeline: pretest + terminal check bank.
# Solo fade items: v2-q4 (v2-minhash-by-hand), v2-q7 (v2-bpe-compression),
# v2-q9 (v2-shard-offset). Each is the third appearance of a procedure that was
# worked in canon prose and drilled as a completion beat.

pretest:
  - id: v2-p1
    concept: d-extraction-filtering
    kind: mcq
    prompt: |
      You have a 15-trillion-token web corpus and a 1.3-trillion-token subset
      of it produced by a quality filter. You are training a 30-million
      parameter model on a fixed compute budget.

      Which corpus produces the better model on knowledge benchmarks, and for
      what reason?
    options:
      - text: "The 1.3T subset - a model stores a bounded amount (roughly 3.6 bits per parameter), so low-value text evicts capacity rather than diluting an average, and the effect is sharpest at small scale."
        correct: true
        explain: "This is the FineWeb-Edu versus FineWeb result: the filtered subset beats its own superset, decisively for small models. The mechanism is allocation against a fixed capacity budget, not information volume."
      - text: "The 15T corpus - it is a strict superset, so it contains everything the subset contains plus more, and more information cannot hurt."
        misconception: D8
        explain: "The appealing part is real: scaling-law headlines are all about size. But a superset does not dominate, because training does not choose what to spend capacity on - it minimizes loss over whatever it is given, so the discarded 92% was carrying negative marginal value."
      - text: "The 15T corpus, because at 30M parameters the model is data-starved and every extra token helps."
        misconception: D8
        explain: "There is a real floor effect below which more data helps, but 1.3 trillion tokens is enormously past it for a 30M-parameter model. The binding constraint here is model capacity, not token supply."
      - text: "The 1.3T subset, but only because it is cheaper to train on - at equal token counts the two corpora are equivalent."
        misconception: D8
        explain: "The comparison is at a fixed compute budget, so token cost is already held equal; the subset wins on benchmark scores, not on price. Treating filtering as a cost knob rather than a distribution knob is the same error one step back."
      - text: "Neither reliably - corpus composition is noise at this scale, and the outcome is decided by seed and architecture."
        misconception: D16
        explain: "Training noise is real and matters for per-source contribution measurement, but the FineWeb-Edu gap (MMLU 33 to 37, ARC 46 to 57) is far outside seed variation. Filtering was the single biggest factor in the leading data benchmark."
    check: choice

  - id: v2-p2
    concept: d-dedup-provenance
    kind: mcq
    prompt: |
      Your deduplication pass finds that a 4,000-word methods section appears
      in two documents from two different sources. Standard practice keeps one
      copy and drops the other; which copy survives is determined by whichever
      document the pipeline encountered first in shard order.

      What of consequence did this step just decide?
    options:
      - text: "Which source gets credited - and paid - for everything that passage teaches the model, since every later measurement (v4 leave-one-out, v5 Shapley, v8 influence) is computed against the corpus in which only the survivor contains it."
        correct: true
        explain: "Correct, and the deciding factor was shard iteration order. Reverse the order and the money moves. The decision also leaves no trace in the shards or the weights, so it cannot be audited without rerunning dedup."
      - text: "Nothing of consequence - the content is byte-identical either way, so the corpus and the trained model are the same."
        misconception: D9
        explain: "True everywhere except here: duplicate warehouse rows and log lines have no owner. What changed is not the algorithm but the existence of a claimant, and the survivor's source_id is what every attribution method will read."
      - text: "Only the corpus size - one document's worth of tokens was removed, so the training run is marginally cheaper."
        misconception: D9
        explain: "True and beside the point. The removal is a credit-assignment step wearing a maintenance step's clothes; counting only the tokens is exactly the accounting that misses the payout."
      - text: "Only the passage's effective training weight - the model now sees it once instead of twice, so it is less likely to be memorized."
        misconception: D9
        explain: "The memorization effect is real (v6), but it is a property of the surviving single copy, not of which copy survived. The choice between two identical copies changes nothing about the model and everything about who is credited."
      - text: "Nothing yet - the credit question is settled later by the attribution method, which can recover both sources from the model's behaviour."
        misconception: D5
        explain: "No later method can recover it: in the corpus that trained the model, the dropped source does not contain the passage, so there is nothing for influence or entailment search to find. The information was destroyed before any measurement existed."
    check: choice

  - id: v2-p3
    concept: d-mixing-packing
    kind: mcq
    prompt: |
      A trainer wants fixed-length sequences of 2,048 tokens. Documents are
      variable length, so the standard move is to concatenate every document
      end to end with an end-of-sequence separator token between them, then
      slice the stream every 2,048 tokens.

      You intend to measure, later, how much each source contributed to the
      trained model. Which statement about this packing scheme is correct?
    options:
      - text: "It is fatal at the input: the causal mask ignores the separator, so tokens of document 2 attend to all of document 1 and the per-sequence gradient is a blend of two sources that no later decomposition can split. Intra-document causal masking is the fix."
        correct: true
        explain: "Correct. The two contributions are summed inside a nonlinear function of shared parameters before any loggable quantity exists, and every gradient-based method in v8 treats the sequence as the training example."
      - text: "No problem: the separator token marks the boundary and attention learns to reset there, so a packed sequence is equivalent to the documents it contains."
        misconception: V2-M4
        explain: "The separator is right there and looks semantically sufficient, and the loss cost really is mild - which is why people have shipped it for years. But the causal mask is a function of position, not of token identity; it forbids nothing at the separator."
      - text: "No problem, provided the manifest records which documents are in each sequence - composition data is enough to decompose the gradient afterwards."
        misconception: V2-M4
        explain: "Recording composition is necessary and you should do it, but it does not undo the contaminated gradient: knowing a sum has two terms does not give you the terms."
      - text: "A quality problem only: cross-document attention slightly raises loss, and the attribution unit is the document regardless of how sequences are packed."
        misconception: V2-M4
        explain: "The attribution unit is whatever the gradient is computed over, and that is the sequence. Calling it the document is an assumption the packer just falsified."
      - text: "A problem, but one that shuffling with a recorded seed removes, since random pairing makes the cross-document contamination average out across sources."
        misconception: D16
        explain: "Seed recording matters for replay, and data order is the largest source of variation in influence measurements - but averaging over pairings does not recover a per-source split from a blended gradient; it only makes the blend unbiased in expectation, not decomposable on the run you did."
    check: choice

check:
  - id: v2-q1
    concept: d-extraction-filtering
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      For a corpus of arXiv papers, a colleague proposes running olmOCR 2 over
      every PDF, on the grounds that it is the strongest OCR system available
      as of mid-2026 and human raters prefer it to marker 61.3% of the time.

      Which option names the better move for a large fraction of these papers,
      together with the obligations it carries?
    options:
      - text: "Read the submitted LaTeX source from arXiv's S3 src/ bucket - structure, equations and \\cite{} keys come free with no reading-order inference - but filter to the CC/public-domain subset first, and record extraction method per document because source coverage is biased and correlates with source identity."
        correct: true
        explain: "Correct on all three counts: the extraction problem stops existing rather than being solved; the default arXiv licence blocks redistribution, so the metadata filter runs before extraction; and mixing LaTeX-derived with OCR-derived text confounds v4's per-source retraining unless the method is an attribute."
      - text: "Read the LaTeX source from the arXiv bulk bucket for every paper that has it. It is strictly better output than any OCR, so there is nothing further to decide."
        misconception: V2-M1
        explain: "The move is right and the output claim is right, which is what makes this attractive. But it skips the two obligations: the bulk bucket contains papers you may not redistribute, and the available subset is biased in a way that confounds later per-source measurement."
      - text: "Stay with olmOCR 2 across the board. It is the mid-2026 ceiling for papers, so extractor choice is settled and uniform treatment avoids introducing a second pipeline."
        misconception: V2-M1
        explain: "Uniformity is a genuine virtue, but this treats extraction as a solved commodity where only the best library matters. Where the structure still exists upstream, reconstructing it by vision model is strictly worse than reading it."
      - text: "Use either - extractor choice is a wash. Downstream quality filtering and dedup clean up whatever any reasonable extractor produces."
        misconception: V2-M1
        explain: "This is the prediction that fails: the two leading HTML extractors differ by 5 points of content recall and 3x in retained boilerplate, and swapping extraction quality alone moved a 13-benchmark average by 1.08 points at 62B tokens. Interleaving is fluent enough to survive every quality heuristic."
      - text: "Read the LaTeX source and drop the OCR path entirely, so extraction quality is uniform and no extraction attribute needs recording."
        misconception: V2-M1
        explain: "Uniform quality would indeed remove the confound, but source is available only for a biased subset - newer papers, TeX-submitting communities, arXiv only - so dropping the OCR path silently drops sources rather than equalising them."
    check: choice
    difficulty: core

  - id: v2-q2
    concept: d-extraction-filtering
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Across DCLM's own benchmark ablations, one pipeline factor moved results
      more than any other they tested. Which?
    check: choice
    options:
      - text: "The model-based quality filter - a fastText classifier trained on instruction-style positives against random web negatives, keeping the top 10% by score. Filtering alone was worth +6.6 MMLU, more than any architecture change they tested."
        correct: true
        explain: "Correct, and the shape of it matters as much as the fact. The classifier is unremarkable - fastText, one threshold - and it beat every architecture variant. The leverage comes from position in the pipeline, not sophistication: the filter decides what the expensive training run spends its finite capacity on."
      - text: "The size of the token pool. DCLM's advantage came from assembling a larger candidate pool than competing corpora before any filtering ran."
        misconception: D8
        explain: "Attractive because the pool size is the headline number of every corpus release and scaling laws are written in tokens. But DCLM's own result is that the top-10% cut - which discards 90% of the pool - improved the model. If pool size were the driver, throwing away nine tokens in ten could not help. The pool is a prerequisite; the filter is the lever."
      - text: "The HTML extractor. Once you choose resiliparse for its higher recall, the downstream stages have little left to contribute."
        misconception: V2-M1
        explain: "Half right in a way that inverts the conclusion. Extraction genuinely matters - swapping extraction quality alone moved a 13-benchmark average by 1.08 points at 62B tokens. But DCLM chose the HIGH-boilerplate extractor (22.8% retained, against trafilatura's 6.6%) precisely because a strong classifier follows it. Extractor aggressiveness and filter aggressiveness are substitutes; quoting either in isolation is meaningless."
      - text: "The deduplication configuration. More aggressive global deduplication produced the cleanest pool and drove the gains."
        misconception: V2-M5
        explain: "This assumes dedup aggressiveness is a direction to push. FineWeb's controlled comparison found the opposite: per-snapshot dedup beat global dedup, because global dedup preferentially removes the material that got re-crawled repeatedly, and persistence correlates with quality. Dedup scope has an interior optimum, and in these benchmarks it is not where the large effects are."
    difficulty: warmup

  - id: v2-q3
    concept: d-extraction-filtering
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A 1.3-trillion-token corpus produced by filtering a 15-trillion-token
      corpus outperforms its own superset on knowledge benchmarks.

      Which account both resolves the apparent paradox and predicts that the
      effect is LARGER for a 30-million parameter model than for a
      70-billion parameter one?
    options:
      - text: "A model stores a bounded number of bits (roughly 3.6 per parameter), so low-value text evicts regularities rather than diluting them; the tighter the budget, the more severe the eviction - hence the effect is largest at 30M, and the highest-leverage pipeline component is the filtering classifier, which is a labeling job plus a regression head."
        correct: true
        explain: "Correct. Capacity is the fixed budget being allocated, small models feel the competition hardest, and FineWeb-Edu's lever was 6,000 H100-hours of annotation feeding an 82%-F1 classifier - engineering, not new math."
      - text: "Filtering raises the average quality of the corpus, so the model's expected per-token learning signal rises; small models train on fewer tokens, so each token matters more."
        misconception: D8
        explain: "Averaging is the wrong picture: bad documents do not lower a mean the model is sampling from, they consume capacity that could have held something else. The scale prediction here also comes out backwards under a fixed compute budget, where token count is held equal."
      - text: "The 15T corpus is better and the reported result is a measurement artifact - benchmark contamination in the filtered subset, or too few seeds."
        misconception: D8
        explain: "This is the superset intuition defending itself. The gap (MMLU 33 to 37, ARC 46 to 57) is far outside seed noise, and filtering was the single largest factor in the leading data benchmark, larger than any architecture change tested."
      - text: "Corpus size does not determine model quality at all; only the filter does, at every scale equally, which is why the subset wins."
        misconception: D8
        explain: "An overcorrection. There is a real floor below which you are data-starved and every token helps - v3's data-constrained scaling depends on size mattering a great deal - and a scale-independent claim predicts no difference between 30M and 70B."
      - text: "Smaller corpora can be repeated for more epochs within the same budget, and repetition is what produces the gain; at 70B the budget covers fresh tokens, so no gain appears."
        misconception: D17
        explain: "Repetition up to about 4 epochs really is nearly free, which makes this plausible, but it is not the mechanism here: FineWeb-Edu wins at matched token budgets, and the effect is about which regularities occupy capacity, not how many times they were seen."
    check: choice
    difficulty: core

  - id: v2-q4
    concept: d-dedup-provenance
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Two documents have shingle sets

        D = {1, 4, 11}
        E = {1, 4, 25}

      Compute 3-position MinHash signatures using, in order,

        h1(x) = (3x + 1) mod 37
        h2(x) = (5x + 2) mod 37
        h3(x) = (7x + 3) mod 37

      Report, pipe-separated with no spaces:
      sig(D) as three comma-separated values, then sig(E) the same way, then
      the number of signature positions that agree, then the size of the
      intersection of D and E, then the size of their union.

      Example format: `1,2,3|4,5,6|0|1|5`
    answer: "4,7,6|2,7,10|1|2|4"
    check: exact
    difficulty: core

  - id: v2-q5
    concept: d-dedup-provenance
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Your dedup pass must emit a cluster table such that the credit policy for
      duplicated content can be changed later WITHOUT retraining the model.

      Which specification does that, and for the right reason?
    options:
      - text: "cluster_id; representative doc_id with its (shard_id, offset, length); a members list of {doc_id, source_id, publication_date, jaccard_to_representative}; and the policy in force. It works by separability: the weights are a function of the representative tokens alone, the payout a function of the table and policy alone."
        correct: true
        explain: "Correct. source_id on every member is load-bearing because the payment unit is the source and one source can appear twice in a cluster; date and similarity are there because candidate policies are functions of them. Three policies can be shown to a rightsholder without touching a GPU."
      - text: "cluster_id, representative doc_id and its span, and the count of members. The count is what a per-cluster split needs, and doc_ids can be recovered later by rerunning the similarity search."
        misconception: D9
        explain: "A count supports exactly one policy and identifies no claimant. Rerunning the search over a corpus that no longer contains the dropped documents cannot recover who held a copy - the merge left no trace."
      - text: "cluster_id, representative doc_id and its span, and each member's doc_id. Document identity is the finest granularity available, and source can always be looked up from doc_id later."
        misconception: D7
        explain: "Close, and the lookup argument is often fine in practice - but the whole design exists to match the attribution unit to the payment unit. Recording at document granularity and deferring the source join is how a source that appears twice in one cluster gets double-counted under an equal split."
      - text: "Whatever fields the chosen policy needs - fix earliest-publication-date credit up front, then store cluster_id, representative, and each member's date. Minimal and sufficient."
        misconception: D9
        explain: "Sufficient for one policy and no other, which welds the policy into the corpus - precisely the failure the design prevents. Changing your mind then costs a dedup rerun and everything downstream."
      - text: "No cluster table: keep every duplicate copy in the corpus so each source's contribution is present in the training data and the split falls out of measurement."
        misconception: D9
        explain: "This sidesteps the bookkeeping by changing the model. Training on n copies multiplies the passage's effective weight and makes it extractable (v6), so it is a different and worse corpus - and a worse attribution substrate."
    check: choice
    difficulty: core

  - id: v2-q6
    concept: d-dedup-provenance
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      FineWeb compared deduplicating each Common Crawl snapshot independently
      against deduplicating globally across all snapshots at once. The
      per-snapshot version produced the better model. What is the best
      explanation?
    check: choice
    options:
      - text: "Global dedup preferentially removes material that was re-crawled month after month, and material that is durable and widely re-hosted is disproportionately good. The multiplicity across snapshots was carrying a quality signal, and collapsing it deleted the signal."
        correct: true
        explain: "Correct. Junk pages appear once and survive both configurations untouched; durable pages appear many times and are collapsed to one copy only by the global pass, which raises junk's share of the corpus. The general lesson is worth keeping: before collapsing a multiplicity, check whether the multiplicity was information."
      - text: "Global dedup is strictly more thorough, so the per-snapshot result must be inside the noise band of the ablation."
        misconception: V2-M5
        explain: "This is the belief the experiment was designed to test, and it lost. 'More thorough' is doing unexamined work here - more thorough at removing what? FineWeb's ablation methodology uses two seeds per condition on low-variance metrics specifically so that a result of this size is not dismissible as noise."
      - text: "Per-snapshot dedup leaves more tokens in the corpus, and more tokens produce a better model."
        misconception: D8
        explain: "It does leave more tokens, and the conclusion still does not follow - it is the same reasoning that predicts FineWeb's 15T corpus should beat its own 1.3T filtered subset, which it does not. The extra tokens help here because of WHICH tokens they are (repeatedly re-crawled, hence durable), not because there are more of them."
      - text: "Dedup scope is hygiene either way. The gap comes from the two configurations happening to keep different survivor documents, which is arbitrary run-to-run variation."
        misconception: D9
        explain: "It correctly notices that survivor selection differs between the two runs, then draws exactly the wrong conclusion by calling that variation arbitrary. Which copy survives is a consequential choice - in a royalty setting it is a payment - and here it is systematically, not arbitrarily, different: the global pass systematically collapses the high-multiplicity documents."
    difficulty: core

  - id: v2-q7
    concept: d-tokenizer-training
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Your corpus is 5,400,000,000 characters of paper text. You measure two
      tokenizers on held-out domain text:

        A: an off-the-shelf web vocabulary, 3.6 characters per token
        B: a domain-trained vocabulary,     4.5 characters per token

      Report, pipe-separated with no spaces: the token count under A, the
      token count under B, and the percentage reduction from A to B as a whole
      number with no percent sign.

      Example format: `900000000|800000000|11`
    answer: "1500000000|1200000000|20"
    check: exact
    difficulty: core

  - id: v2-q8
    concept: d-tokenizer-training
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      You are training a 30,000,000-parameter model with an internal width of
      $d_{model} = 384$ on 500 million tokens of a single domain. A colleague
      proposes reusing Llama-3's 128,256-entry vocabulary, since it compresses
      text better than any 16K vocabulary could.

      The compression claim is true. Which single statement is the correct
      objection to the proposal?
    options:
      - text: |
          The embedding table is $V \times d_{model} = 128{,}256 \times 384 =
          49{,}250{,}304$ parameters, 1.64 times the whole model; and with
          $D = 5 \times 10^{8}$ tokens the rarest rows see on the order of
          $D / (V \ln V) \approx 330$ updates from random initialization
          (about 3,100 at $V = 16{,}384$). Compression gain grows only
          logarithmically in $V$ while both costs grow linearly in it.
        correct: true
        explain: |
          Both arguments are independent and both are arithmetic: the table
          alone exceeds the model's whole parameter budget, and a fixed number
          of token occurrences spread over more rows leaves the tail of the
          vocabulary effectively untrained. Logarithmic benefit against linear
          cost has an interior optimum, and the vocabulary scaling law (Tao et
          al., NeurIPS 2024) says that optimum SHRINKS when the run is
          data-bottlenecked - which is exactly this run.
      - text: |
          There is no valid objection: characters per token is the whole value
          of a tokenizer, the 128,256-entry vocabulary wins on that metric, and
          its extra embedding parameters are a small fixed overhead of the kind
          frontier models absorb routinely.
        misconception: V2-M3
        explain: |
          Attractive because compression really does improve monotonically with
          $V$ and the parameter cost is invisible in a 70B model, where the
          table is a couple of percent. Here it is 1.64x the entire model, so
          the "small fixed overhead" is the model. Copying a frontier number is
          importing a decision made under a completely different budget.
      - text: |
          The objection is corpus size, not vocabulary size: 500 million tokens
          is too few for any model, so keep the 128,256-entry vocabulary and
          raise the token count until the rare rows are adequately updated.
        misconception: D8
        explain: |
          This reads every data decision as a size knob. It also gets the law
          backwards: optimal vocabulary size shrinks when you are
          data-bottlenecked, so the response to a fixed 500M-token corpus is a
          smaller $V$, not more tokens. And the 49,250,304-parameter table
          exceeds the model at any corpus size.
      - text: |
          Vocabulary size should simply be minimized: a 1,024-entry byte-level
          vocabulary costs only $1{,}024 \times 384 = 393{,}216$ embedding
          parameters and every row is updated constantly, so it is the right
          choice at this scale.
        misconception: V2-M3
        explain: |
          This takes an optimum for a direction. Characters per token collapses
          toward 1, so the same text becomes several times more tokens, and
          training cost is proportional to token count - the compute bill rises
          by far more than the table saves. The defensible range for a 10-30M
          parameter model on 300M-1B domain tokens is 16K to 32K.
    check: choice
    difficulty: core

  - id: v2-q9
    concept: d-mixing-packing
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A document occupies shard 1 at offset 0 with length 19,900 tokens. The
      trainer reads fixed-length sequences of L = 2,048 tokens, so sequence s
      covers shard positions [2048*s, 2048*(s+1)).

      Report, pipe-separated with no spaces: the (sequence index, position
      within sequence) of the document's FIRST token as `s,p`, then the same
      for its LAST token, then the number of sequences the document spans.

      Example format: `2,100|7,50|6`
    answer: "0,0|9,1467|10"
    check: exact
    difficulty: core

  - id: v2-q10
    concept: d-mixing-packing
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Packing concatenates documents end to end with a separator token between
      them and slices the stream every $L$ tokens. Intra-document causal masking
      (arXiv:2402.13991) forbids attention across document boundaries inside a
      packed sequence. The literature reports it as a small quality improvement;
      for this book it is close to mandatory.

      Which single statement about what masking fixes, and what it leaves
      unfixed, is correct?
    options:
      - text: |
          The causal mask is a function of position, not content, so without
          masking a token in document 2 attends to all of document 1 - about
          $L^2/4$ cross-document pairs when the first document fills half the
          sequence. Masking zeroes those weights and their gradients, so the
          packed sequence behaves as the concatenation of independent shorter
          ones. It does not control WHICH documents get co-packed, so the
          manifest must still record each sequence's ordered
          (doc_id, source_id, start, length) spans.
        correct: true
        explain: |
          The right split: masking fixes the input, not the sampling. For
          language modelling the unmasked version costs a modest loss penalty;
          for attribution it destroys the definition, because every
          gradient-based method in v8 treats a per-sequence gradient as "what
          this training example did" and a mixed sequence yields a sum formed
          inside a nonlinear function of shared parameters, before any loggable
          quantity exists.
      - text: |
          The separator token already marks the boundary and attention learns to
          respect it, so masking is a small language-modelling quality tweak
          with no attribution consequence either way.
        misconception: V2-M4
        explain: |
          Appealing because the separator is right there and looks semantically
          sufficient, and because people shipped unmasked packing for years with
          only a mild loss cost. But the mask is positional: it never consults
          the separator, so gradients from document 2's loss flow through
          attention placed on document 1's tokens regardless of what the model
          "learns to respect".
      - text: |
          With masking on, a packed sequence behaves exactly as independent
          documents, so packing order and per-sequence composition no longer
          carry information worth recording in the manifest.
        misconception: V2-M4
        explain: |
          The subtler form of the same error. Masking isolates attention within
          a sequence; it says nothing about which documents share one. If
          anything in the packing order correlates with source - length-sorted
          bin packing, shard order, an unshuffled corpus - every per-sequence
          statistic computed later carries a source-correlated confound that is
          unmeasurable unless composition was recorded.
      - text: |
          Masking is optional, because a per-sequence gradient from a mixed
          sequence can be decomposed into per-document terms after training,
          given the document-boundary array and the sequence's token spans.
        misconception: D6
        explain: |
          The contributions were summed inside a nonlinear function of shared
          parameters during the forward and backward pass; the boundary array
          tells you where the tokens were, not how to split a gradient that no
          longer has separable parts. This is the general optimism that
          scalable attribution is solved engineering - which measured against
          retraining ground truth is exactly what fails.
    check: choice
    difficulty: core

  - id: v2-q11
    concept: d-extraction-filtering
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Your pipeline runs a regex pass that replaces every email address, phone
      number, and IP address in the corpus with a typed placeholder. What can
      you claim about the resulting corpus?
    check: choice
    options:
      - text: "That formatted identifiers have been removed with high precision. Nothing follows about quasi-identifiers, so the defensible public claim is a scope statement - 'formatted identifiers removed; this is public scholarly text whose authors are named by design' - rather than 'PII scrubbed.'"
        correct: true
        explain: "Correct, and the scope statement is the deliverable. Identifiability comes from combinations of individually ordinary attributes - institution, subfield, year, career stage - and combinations exhaust a population quickly. A pattern matcher examines fields one at a time and cannot see combinations by construction."
      - text: "That the corpus contains no personal information."
        misconception: V2-M2
        explain: "The claim the pass feels like it earned, and the one an opposing expert most enjoys. Counterexample in one sentence: 'we thank the third-year PhD student in the Northlake speech group who ran the 2019 pilot.' No regex matches, and exactly one person fits."
      - text: "That it contains no personal information beyond what the extraction stage garbled; tighten the extractor and the residual goes to zero."
        misconception: V2-M1
        explain: "This locates the residual in extraction quality, where it is not. Perfect extraction would preserve the acknowledgements section exactly, quasi-identifiers and all - in fact better extraction produces MORE readable quasi-identifying prose, not less. Extraction quality and identifiability are orthogonal axes."
      - text: "That any identifying text still present is boilerplate repeated across many documents, so the deduplication pass has already removed it as a duplicate cluster."
        misconception: D9
        explain: "Two errors stacked. Quasi-identifying text is specific to one document, which is exactly why it identifies someone - it is the opposite of boilerplate. And dedup does not remove things: it selects a representative and, in this design, records the cluster. Treating dedup as a general-purpose cleanup step that quietly handles leftovers is the hygiene framing this unit dismantles."
    difficulty: warmup

  - id: v2-q12
    concept: d-dedup-provenance
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A duplicate cluster contains doc_417 (source: Northlake Preprints) and
      doc_101 (source: Journal of Text Systems). The pipeline kept doc_101's
      tokens as the representative. In v4 you will retrain with Northlake
      Preprints removed and measure the change in held-out loss.

      Which single statement about that experiment is correct?
    options:
      - text: |
          "Remove source k" is ambiguous: experiment A drops only the manifest
          rows tagged Northlake, leaving doc_101 and so the shared passage, and
          measures the source's EXCLUSIVE content; experiment B additionally
          drops the representatives of every cluster in which Northlake is a
          member, and measures its TOTAL content. They give different numbers,
          and a cluster table that records only the representative makes B
          uncomputable while silently reporting A.
        correct: true
        explain: |
          doc_101's tokens ARE the content doc_417 contributed, sitting under
          another owner's label, so filtering on source_id does not determine
          the removal set. Both experiments are legitimate and they answer
          different questions; the delta between them is precisely the value of
          the duplicated passage, which is the quantity the credit policy is
          arguing about. With members and their source_ids recorded, the choice
          is deliberate and auditable.
      - text: |
          The experiment is unambiguous: the removal set is every manifest row
          with source_id = Northlake Preprints. Dedup is upstream hygiene and
          does not enter the definition of a leave-one-source-out measurement.
        misconception: D9
        explain: |
          Correct in every pipeline where duplicate rows have no owner, and
          wrong here for one reason: a claimant exists. The passage Northlake
          contributed is still in the training corpus under the Journal's tag,
          so this "unambiguous" filter has quietly chosen one of two
          experiments and named it the contribution of Northlake Preprints.
      - text: |
          Recording only the representative is sufficient, because the tokens
          that trained the model are the Journal's document; whichever copy
          survived dedup is by definition the one that contributed, so no
          member list is needed.
        misconception: D9
        explain: |
          This makes survivorship into ownership, and the survivor was chosen by
          shard iteration order. The consequence is undetectable after the fact:
          neither the shards nor the weights carry a trace of the merge, so the
          only remedy is rerunning dedup and everything downstream of it.
      - text: |
          Either definition is fine, since a source's marginal contribution to
          held-out loss is a stable property of the corpus: run it once, and the
          two variants agree to within measurement error.
        misconception: D16
        explain: |
          Two errors at once. The two variants differ by the entire value of the
          shared passage, not by measurement error; and a leave-one-out delta is
          not a stable property anyway - retrain with another seed and a single
          source's marginal contribution can swing by more than its own
          magnitude, which is why v4 reports seed error bars.
    check: choice
    difficulty: stretch

  - id: v2-q13
    concept: d-mixing-packing
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      RegMix (arXiv:2407.01492) trains hundreds of small models on random
      mixtures of the sources, fits

      $$\text{loss}_j = b_0 + \sum_k b_k\, p_{kj}$$

      where $p_{kj}$ is source $k$'s proportion in the mixture used for run $j$,
      and picks the minimizing mixture.

      Which single statement about reading this fit as per-source attribution is
      correct?
    options:
      - text: |
          $-b_k$ is source $k$'s estimated marginal value in loss units, from the
          same runs that produced the mixing weights - the same estimator as the
          datamodels design in v4, differing only in that RegMix samples
          continuous proportions rather than binary inclusion. Two limits: the
          additive form cannot express interactions (pairwise terms cost on the
          order of $\binom{K}{2}$ more coefficients and runs), and seed-to-seed
          spread in the outcome sets a floor that more runs do not cross.
        correct: true
        explain: |
          The recognition is the whole point: the mixing literature already
          computes a per-source value and labels it a mixing coefficient. Both
          limits matter downstream - v5 exists because cooperative game theory
          handles value functions with arbitrary interactions, and a linear
          coefficient is what a Shapley value collapses to when interactions
          vanish.
      - text: |
          $-b_k$ is source $k$'s marginal value in loss units, and because the
          regression is fit over hundreds of runs the coefficient is a stable
          property of the corpus: measure it once and bill against it.
        misconception: D16
        explain: |
          The first half is right and the second is the expensive error. Two
          identical mixtures trained with different seeds give different losses;
          data order alone is the largest source of variation in influence
          measurements. A billing-grade number needs seeds averaged and a
          reported noise floor.
      - text: |
          The coefficients are usable but noise-limited today; with enough runs
          and a better-specified regression, arbitrarily small per-source
          effects become resolvable, so the noise is a methods problem rather
          than a property of the measurement.
        misconception: D20
        explain: |
          More runs shrink the sampling error around the estimate, not the noise
          in the outcome being measured - the opposite of the A/B-testing
          situation where more traffic always buys resolution. Below a
          signal-to-noise threshold the welfare-optimal contract is a flat fee,
          and no better estimator changes that; only more signal does.
      - text: |
          The coefficients cannot be read as per-source value at all: they
          measure what moved the loss, whereas a source's value is which of its
          documents contain the facts the model emits, so a lexical search over
          the corpus is the correct attribution method here.
        misconception: D5
        explain: |
          This is right that influence and entailment are different targets -
          and BM25 really does beat gradient methods at finding the document
          that CONTAINS a fact. But it draws the wrong conclusion: a royalty
          system picks a target and defends it, and "what changed the model" is
          a legitimate one. The coefficient is a value estimate for that target,
          not a broken estimate of the other.
    check: choice
    difficulty: stretch
