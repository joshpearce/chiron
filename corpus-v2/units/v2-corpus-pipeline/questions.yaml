# v2 corpus-pipeline: pretest + terminal check bank.
# Solo fade items: v2-q4 (v2-minhash-by-hand), v2-q7 (v2-bpe-compression),
# v2-q9 (v2-shard-offset). Each is the third appearance of a procedure that was
# worked in canon prose and drilled as a completion beat.

pretest:
  - id: v2-p1
    concept: d-extraction-filtering
    prompt: |
      You have a 15-trillion-token web corpus and a 1.3-trillion-token subset
      of it produced by a quality filter. You are training a 30-million
      parameter model on a fixed compute budget.

      Which corpus produces the better model on knowledge benchmarks, and by
      what reasoning? Answer before you consider that this is a trick
      question.
    answer: |
      The 1.3T subset, and for small models decisively. This is the
      FineWeb-Edu versus FineWeb comparison: the filtered subset beats its own
      superset.

      The reasoning is a capacity argument rather than a data argument. A
      model has a bounded number of bits it can store (roughly 3.6 per
      parameter, which v6 makes exact). Every regularity it learns from
      low-value text consumes capacity that could have held something else.
      Adding documents with negative value does not dilute an average, it
      evicts. So the question "is more data better" is really "is this
      marginal document worth the capacity it will occupy," and past a floor
      the answer for raw web text is frequently no.

      The effect is strongest for small models, because the capacity budget is
      tightest exactly where you are working.
    check: llm
    rubric: |
      Pass requires: (1) the subset wins, and (2) a reason grounded in a fixed
      budget being allocated - capacity, or "the model has limited room and
      bad tokens take up room" in any wording.
      (1) with a vague "quality matters" and no budget argument = partial;
      the learner has the answer without the mechanism.
      Answering "the 15T corpus, since it is a superset and contains strictly
      more information" = fail, diagnosing D8 (more-data-beats-better-data).
      This is the primary calibration item for the filtering half of the unit
      and is expected to fail.

  - id: v2-p2
    concept: d-dedup-provenance
    prompt: |
      Your deduplication pass finds that a 4,000-word methods section appears
      in two documents from two different sources. Standard practice keeps one
      copy and drops the other; which copy survives is determined by whichever
      document the pipeline encountered first in shard order.

      Name everything of consequence that this step just decided.
    answer: |
      It decided which source gets paid for everything that passage teaches
      the model.

      In the corpus that trains the model, the surviving source contains the
      passage and the other does not. Every attribution measurement made later
      is computed against that corpus: the leave-one-source-out delta in v4,
      the Shapley value in v5, the gradient influence in v8. All of them will
      credit the passage's effect entirely to the survivor, because that is
      what the training data says. Reverse the shard order and the money moves.

      Two further consequences. The decision is undetectable after the fact -
      nothing in the shards or in the trained weights records that a merge
      happened - so it cannot be audited or corrected without rerunning dedup
      and everything downstream. And there is no policy anywhere; the credit
      rule is "whatever the iterator saw first," which in expectation over
      shuffles is an equal split but on the single run you actually did is a
      winner-take-all draw.
    check: llm
    rubric: |
      Pass requires an explicit statement that a credit or payment allocation
      was made, not just that a document was removed.
      Answering "nothing of consequence - it is deduplication, the content is
      identical either way" = fail, diagnosing D9 (dedup-is-hygiene). This is
      the primary calibration item for the unit and is expected to fail.
      Answering only "the corpus got smaller" or "the model sees the passage
      once instead of twice" = fail; both are true and both miss the point.
      Naming the payout consequence but not the undetectability = pass.

  - id: v2-p3
    concept: d-mixing-packing
    prompt: |
      A trainer wants fixed-length sequences of 2,048 tokens. Documents are
      variable length, so the standard move is to concatenate every document
      end to end with an end-of-sequence separator token between them, then
      slice the stream every 2,048 tokens.

      You intend to measure, later, how much each source contributed to the
      trained model. Does this packing scheme cause you a problem? If so,
      state it precisely; if not, say why the separator is sufficient.
    answer: |
      Yes, and it is fatal at the input rather than fixable downstream.

      The causal mask does not know about the separator token. A token in the
      second document attends to every position before it in the sequence,
      which includes all of the first document. Gradients from the second
      document's loss flow through attention weights placed on the first
      document's tokens, so the model is trained to use one source's text as
      context for predicting another's - in a pairing determined by shard
      order.

      The attribution consequence: every gradient-based method computes a
      per-sequence gradient and treats it as "what this training example did
      to the model." If the sequence blends two sources, that gradient is a
      sum over both, and the two contributions were added inside a nonlinear
      function of shared parameters before any quantity you could log existed.
      There is no post-hoc decomposition.

      The fix is intra-document causal masking: forbid attention across
      document boundaries within a packed sequence.
    check: llm
    rubric: |
      Pass requires: (1) recognition that the separator token does not stop
      attention crossing the boundary, and (2) some statement that the
      training example, and therefore the attribution unit, becomes a blend.
      (1) alone = partial.
      Answering "no problem, the separator marks the boundary and the model
      learns to reset there" = fail, diagnosing V2-M4
      (packing-is-just-batching). Expected to fail at pretest.
      Answering "no problem, I will just record which documents are in each
      sequence" = partial and worth flagging: recording composition is
      necessary but does not undo the contaminated gradient.

check:
  - id: v2-q1
    concept: d-extraction-filtering
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      For a corpus of arXiv papers, a colleague proposes running olmOCR 2 over
      every PDF, on the grounds that it is the strongest OCR system available
      as of mid-2026 and human raters prefer it to marker 61.3% of the time.

      There is a better move for a large fraction of these papers. Name it,
      state what it buys, and state the two caveats that make it a
      recording requirement rather than a free win.
    answer: |
      The better move: read the LaTeX source. arXiv publishes submitted source
      in an S3 bucket (the src/ prefix, roughly 9.2 TB, requester-pays). For
      any paper submitted as TeX rather than as a camera-ready PDF, you skip
      OCR entirely.

      What it buys: the document's actual structure rather than an inference
      about it. Section hierarchy, equations as LaTeX, citations as \cite{}
      keys, captions attached to their figures. No reading-order inference, no
      ligature loss, no math rubble. The extraction problem does not get
      solved, it stops existing.

      Caveat one, licensing: the default arXiv licence does not permit
      redistribution. The bulk bucket contains everything, but a
      redistributable corpus can only be built from the subset whose per-paper
      licence is Creative Commons or public domain. That is a metadata filter
      applied before extraction, not after, because a document you cannot
      redistribute is a document you cannot put in an auditable manifest.

      Caveat two, coverage bias: source is available for a biased subset -
      newer papers, TeX-submitting communities, arXiv only. Mixing
      LaTeX-derived and OCR-derived text means the corpus has two extraction
      qualities that correlate with source identity. When v4 measures
      per-source contribution by retraining, a source's advantage could be its
      content or could be its cleaner extraction, and the two are
      indistinguishable unless the extraction method is recorded per document
      as an attribute.
    check: llm
    rubric: |
      Must contain: (1) use the LaTeX/TeX source instead of OCR, (2) the
      licence caveat - the default arXiv licence blocks redistribution, so
      filter to the CC/public-domain subset, (3) the coverage-bias caveat AND
      the consequence that extraction method must be recorded per document
      because it confounds later per-source measurement.
      (1) plus either caveat = pass. All three = full credit.
      (1) alone = fail; the point of the item is that the good move carries
      obligations.
      An answer that says OCR is fine and the choice does not matter much =
      fail, diagnosing V2-M1 (extraction-is-a-commodity).
    difficulty: core

  - id: v2-q2
    concept: d-extraction-filtering
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Across DCLM's own benchmark ablations, one pipeline factor moved results
      more than any other they tested. Which?
    check: choice
    options:
      - text: "The model-based quality filter - a fastText classifier trained on instruction-style positives against random web negatives, keeping the top 10% by score. Filtering alone was worth +6.6 MMLU, more than any architecture change they tested."
        correct: true
        explain: "Correct, and the shape of it matters as much as the fact. The classifier is unremarkable - fastText, one threshold - and it beat every architecture variant. The leverage comes from position in the pipeline, not sophistication: the filter decides what the expensive training run spends its finite capacity on."
      - text: "The size of the token pool. DCLM's advantage came from assembling a larger candidate pool than competing corpora before any filtering ran."
        misconception: D8
        explain: "Attractive because the pool size is the headline number of every corpus release and scaling laws are written in tokens. But DCLM's own result is that the top-10% cut - which discards 90% of the pool - improved the model. If pool size were the driver, throwing away nine tokens in ten could not help. The pool is a prerequisite; the filter is the lever."
      - text: "The HTML extractor. Once you choose resiliparse for its higher recall, the downstream stages have little left to contribute."
        misconception: V2-M1
        explain: "Half right in a way that inverts the conclusion. Extraction genuinely matters - swapping extraction quality alone moved a 13-benchmark average by 1.08 points at 62B tokens. But DCLM chose the HIGH-boilerplate extractor (22.8% retained, against trafilatura's 6.6%) precisely because a strong classifier follows it. Extractor aggressiveness and filter aggressiveness are substitutes; quoting either in isolation is meaningless."
      - text: "The deduplication configuration. More aggressive global deduplication produced the cleanest pool and drove the gains."
        misconception: V2-M5
        explain: "This assumes dedup aggressiveness is a direction to push. FineWeb's controlled comparison found the opposite: per-snapshot dedup beat global dedup, because global dedup preferentially removes the material that got re-crawled repeatedly, and persistence correlates with quality. Dedup scope has an interior optimum, and in these benchmarks it is not where the large effects are."
    difficulty: warmup

  - id: v2-q3
    concept: d-extraction-filtering
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A 1.3-trillion-token corpus produced by filtering a 15-trillion-token
      corpus outperforms its own superset on knowledge benchmarks.

      Explain why this is not a paradox, using an argument that predicts the
      effect should be LARGER for a 30-million parameter model than for a
      70-billion parameter one. Then state what this implies about where
      engineering effort in the pipeline should go.
    answer: |
      Not a paradox once you stop treating data as fuel and start treating it
      as an allocation against a fixed budget.

      A model of N parameters can store a bounded amount of information -
      roughly 3.6 bits per parameter, which v6 makes exact. Training does not
      choose which regularities to spend that capacity on; it minimizes loss
      over whatever corpus it is given, so a corpus that is 90% low-value text
      spends capacity representing the regularities of low-value text.
      Removing that text does not remove information the model wanted; it
      frees capacity. So a subset can beat its superset whenever the removed
      material had negative marginal value at the margin of the budget.

      Why the effect is larger for the small model: the budget is tighter.
      At 30M parameters there is on the order of 10^8 bits to allocate and the
      competition between regularities is fierce, so eviction is severe. At
      70B the capacity is roughly three orders of magnitude larger, the
      pressure is lower, and a marginal bad document costs proportionally
      less. This is the same reason cache-sizing effects are dramatic on small
      caches and mild on large ones.

      What it implies about effort: the filter is the highest-leverage
      component in the pipeline and it is not a machine-learning problem. In
      FineWeb-Edu the expensive part was 6,000 H100-hours of Llama-3-70B
      writing educational-value labels for 460,000 documents; the model fit to
      those labels is a regression head on frozen embeddings reaching 82% F1.
      A filter that disagrees with its own annotator one time in five moved
      MMLU from 33 to 37 and ARC from 46 to 57. The leverage is taste applied
      at scale and then cheaply imitated - a labeling job and a classifier -
      not an architecture idea.
    check: llm
    rubric: |
      Must contain: (1) a fixed-capacity or fixed-budget argument in which
      low-value tokens displace rather than dilute, (2) the explicit link from
      tighter budget to larger effect at small scale, (3) the conclusion that
      the classifier is the lever and that it is engineering rather than
      novel math.
      (1) and (2) = pass. (3) upgrades to full credit.
      An answer that only says "quality matters more than quantity" with no
      mechanism = fail; the item is testing the mechanism, and without it the
      learner cannot predict the scale dependence.
      An answer arguing that the 15T corpus is better and the result must be a
      measurement artifact = fail, diagnosing D8.
      An answer that overcorrects to "corpus size does not matter" = partial;
      flag it, since v3's data-constrained scaling depends on size mattering
      a great deal below the floor.
    difficulty: core

  - id: v2-q4
    concept: d-dedup-provenance
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Two documents have shingle sets

        D = {1, 4, 11}
        E = {1, 4, 25}

      Compute 3-position MinHash signatures using, in order,

        h1(x) = (3x + 1) mod 37
        h2(x) = (5x + 2) mod 37
        h3(x) = (7x + 3) mod 37

      Report, pipe-separated with no spaces:
      sig(D) as three comma-separated values, then sig(E) the same way, then
      the number of signature positions that agree, then the size of the
      intersection of D and E, then the size of their union.

      Example format: `1,2,3|4,5,6|0|1|5`
    answer: "4,7,6|2,7,10|1|2|4"
    check: exact
    difficulty: core

  - id: v2-q5
    concept: d-dedup-provenance
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Specify the cluster table your dedup pass must emit so that the credit
      policy for duplicated content can be changed later without retraining
      the model. List the fields, and for each one say which question it
      answers.

      Then state the property of the design that makes "change the policy
      without retraining" true, rather than merely convenient.
    answer: |
      Fields, one row per duplicate cluster:

      - cluster_id: the join key, assigned by union-find over the LSH
        candidate graph. Answers "which merge event is this."
      - representative: the doc_id whose tokens actually entered the corpus.
        Answers "which text did the model see," and lets an auditor reproduce
        the corpus.
      - the representative's (shard_id, offset, length): answers "where are
        those tokens," joining the cluster to the training data.
      - members: a list of {doc_id, source_id, publication_date,
        jaccard_to_representative}. Answers "who held a copy" - and it must
        carry source_id, because the credit unit is the source, not the
        document, and one source can appear more than once in a cluster.
        Publication date is there because one candidate policy is a function
        of it; the similarity is there because a 1.0 exact duplicate and a
        0.76 near-match support different policy arguments.
      - policy: the credit rule in force, recorded so that the number can be
        reproduced and so that changing it is a visible act.

      The property that makes policy changes free: separability. The trained
      weights are a function of the representative tokens alone. The payout is
      a function of the cluster table and the policy alone. Those two
      functions share no arguments except cluster identity, so the model is
      invariant to the policy and the policy can be recomputed at any time
      from a table whose size is proportional to the number of clusters rather
      than to the corpus.

      That separation is what converts an irreversible pipeline decision into
      a negotiable one. Three policies can be run and shown to a rightsholder
      side by side without touching a GPU.
    check: llm
    rubric: |
      Must contain: (1) member list carrying source_id, with the explicit
      reason that the payment unit is the source and a source can appear
      multiple times in one cluster, (2) the representative identified and its
      span recorded, (3) the separability argument - weights depend on the
      representative tokens, payout depends on the cluster table, so the
      policy is not baked into the corpus.
      (1) and (3) = pass. (3) is the load-bearing one.
      An answer listing fields sufficient for one chosen policy and no others
      = fail; that welds the policy into the corpus, which is the exact
      failure the design exists to prevent.
      An answer that proposes keeping all duplicate copies in the corpus to
      avoid the problem = fail, diagnosing D9 from the other side: training on
      n copies multiplies the passage's effective weight and makes it
      extractable (v6), so it is a different and worse corpus.
    difficulty: core

  - id: v2-q6
    concept: d-dedup-provenance
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      FineWeb compared deduplicating each Common Crawl snapshot independently
      against deduplicating globally across all snapshots at once. The
      per-snapshot version produced the better model. What is the best
      explanation?
    check: choice
    options:
      - text: "Global dedup preferentially removes material that was re-crawled month after month, and material that is durable and widely re-hosted is disproportionately good. The multiplicity across snapshots was carrying a quality signal, and collapsing it deleted the signal."
        correct: true
        explain: "Correct. Junk pages appear once and survive both configurations untouched; durable pages appear many times and are collapsed to one copy only by the global pass, which raises junk's share of the corpus. The general lesson is worth keeping: before collapsing a multiplicity, check whether the multiplicity was information."
      - text: "Global dedup is strictly more thorough, so the per-snapshot result must be inside the noise band of the ablation."
        misconception: V2-M5
        explain: "This is the belief the experiment was designed to test, and it lost. 'More thorough' is doing unexamined work here - more thorough at removing what? FineWeb's ablation methodology uses two seeds per condition on low-variance metrics specifically so that a result of this size is not dismissible as noise."
      - text: "Per-snapshot dedup leaves more tokens in the corpus, and more tokens produce a better model."
        misconception: D8
        explain: "It does leave more tokens, and the conclusion still does not follow - it is the same reasoning that predicts FineWeb's 15T corpus should beat its own 1.3T filtered subset, which it does not. The extra tokens help here because of WHICH tokens they are (repeatedly re-crawled, hence durable), not because there are more of them."
      - text: "Dedup scope is hygiene either way. The gap comes from the two configurations happening to keep different survivor documents, which is arbitrary run-to-run variation."
        misconception: D9
        explain: "It correctly notices that survivor selection differs between the two runs, then draws exactly the wrong conclusion by calling that variation arbitrary. Which copy survives is a consequential choice - in a royalty setting it is a payment - and here it is systematically, not arbitrarily, different: the global pass systematically collapses the high-multiplicity documents."
    difficulty: core

  - id: v2-q7
    concept: d-tokenizer-training
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Your corpus is 5,400,000,000 characters of paper text. You measure two
      tokenizers on held-out domain text:

        A: an off-the-shelf web vocabulary, 3.6 characters per token
        B: a domain-trained vocabulary,     4.5 characters per token

      Report, pipe-separated with no spaces: the token count under A, the
      token count under B, and the percentage reduction from A to B as a whole
      number with no percent sign.

      Example format: `900000000|800000000|11`
    answer: "1500000000|1200000000|20"
    check: exact
    difficulty: core

  - id: v2-q8
    concept: d-tokenizer-training
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      You are training a 30-million parameter model with an internal width of
      384 on 500 million tokens of a single domain. A colleague proposes
      reusing Llama-3's 128,256-entry vocabulary, since it compresses text
      better than any 16K vocabulary could.

      The compression claim is true. Give two independent quantitative
      arguments against the proposal, and state the general law that both
      arguments are instances of.
    answer: |
      Argument one, parameter cost. The input embedding table holds
      V x d_model parameters. At V = 128,256 and d_model = 384 that is
      49,250,304 parameters, which is 1.64 times the size of the entire
      30-million-parameter model. The proposal is not an improvement with a
      cost attached; it is a different model in which the great majority of
      capacity is a lookup table of starting positions. At V = 16,384 the
      table is 6,291,456 parameters, about 21% of the model, which is already
      substantial.

      Argument two, update frequency. Each embedding row is updated only when
      its token appears in a batch. Token frequencies are approximately
      Zipfian, so the expected number of updates to the rarest row is roughly
      D / (V ln V). At D = 5x10^8 and V = 128,256 that is about 330 updates;
      at V = 16,384 it is about 3,100. A row with a few hundred updates from
      random initialization has not been trained - it is noise the model has
      been instructed to treat as a symbol. Larger V spreads a fixed number of
      token occurrences over more rows, so raising V actively degrades the
      rare end of the vocabulary.

      The general law both instantiate: compression gain grows logarithmically
      in V, because BPE merges in frequency order and each doubling of the
      vocabulary buys a thinner slice of the frequency tail, while cost -
      parameters, and the dilution of updates per row - grows linearly in V.
      Logarithmic benefit against linear cost has an interior optimum, and
      where that optimum sits depends on the compute and data budget. The
      formal statement is the vocabulary scaling law (Tao et al., NeurIPS
      2024): optimal vocabulary size grows with compute but SHRINKS when the
      run is data-bottlenecked. Copying a frontier vocabulary is importing a
      decision made under a different budget.
    check: llm
    rubric: |
      Must contain: (1) the parameter cost V x d_model computed, with the
      recognition that 49.25M exceeds the whole 30M model, (2) a second
      independent argument - update frequency per row, or equivalently that
      rare rows finish near initialization, (3) the general form: compression
      gain is sublinear/logarithmic in V while cost is linear, so there is an
      interior optimum, and it moves with the data budget.
      (1) and (2) = pass. (3) upgrades to full credit.
      (1) alone = partial; the parameter count is the easy half and does not
      by itself explain why a 100K vocabulary is bad even in a model with room
      for it.
      An answer that the larger vocabulary is fine because it compresses
      better and compression is what matters = fail, diagnosing V2-M3.
      An answer that argues for a very small vocabulary (say 1K) on the same
      reasoning = flag: the argument is an optimum, not a direction, and the
      learner has taken it as a direction.
    difficulty: core

  - id: v2-q9
    concept: d-mixing-packing
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A document occupies shard 1 at offset 0 with length 19,900 tokens. The
      trainer reads fixed-length sequences of L = 2,048 tokens, so sequence s
      covers shard positions [2048*s, 2048*(s+1)).

      Report, pipe-separated with no spaces: the (sequence index, position
      within sequence) of the document's FIRST token as `s,p`, then the same
      for its LAST token, then the number of sequences the document spans.

      Example format: `2,100|7,50|6`
    answer: "0,0|9,1467|10"
    check: exact
    difficulty: core

  - id: v2-q10
    concept: d-mixing-packing
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Intra-document causal masking is described in the literature as a small
      quality improvement. For this book it is close to mandatory.

      Explain the mechanism it fixes, then explain why the consequence is
      categorically different for attribution than for language modelling
      quality. Finally, name one thing masking does NOT fix that still has to
      be recorded.
    answer: |
      The mechanism. Packing concatenates documents into fixed-length
      sequences with a separator token between them. The causal mask is a
      function of position, not of content, so it does not know the separator
      exists: a token in the second document attends to every earlier position
      in the sequence, including all of the first document. With the first
      document filling half a sequence of length L, that is L^2/4
      cross-document attention pairs. Intra-document masking sets exactly
      those entries to negative infinity before the softmax, so their
      attention weights and their gradients are zero, and the packed sequence
      behaves as the concatenation of independent shorter ones.

      Why the consequence differs in kind. For language modelling this is a
      small quality cost, because the model mostly learns to ignore
      irrelevant preceding context and the loss penalty is modest - people
      shipped it this way for years. For attribution it is not a cost, it is a
      loss of definition. Every gradient-based method computes a per-sequence
      gradient and calls it "what this training example did to the model." If
      the sequence spans two sources, that gradient is the sum of two
      contributions that were added inside a nonlinear function of shared
      parameters during the forward and backward pass, before any quantity you
      could log existed. There is no decomposition afterwards. A quality cost
      is a number that gets worse; this is a question that stops having an
      answer.

      What masking does not fix: which documents get co-packed. Masking
      isolates attention within a sequence; it says nothing about sequence
      composition, and composition is not random if anything about the packing
      order correlates with source - length-sorted bin packing, shard order,
      an unshuffled corpus. Any per-sequence statistic computed later
      therefore carries a source-correlated confound. The manifest must record
      the ordered (doc_id, source_id, start, length) spans of each training
      sequence, which makes the confound measurable and conditionable rather
      than invisible.
    check: llm
    rubric: |
      Must contain: (1) the causal mask is positional and ignores the
      separator, so attention crosses document boundaries, (2) the categorical
      difference - for quality it is a small loss penalty, for attribution the
      per-sequence gradient becomes an unsplittable sum, (3) that masking does
      not control which documents share a sequence, and that per-sequence
      composition must be recorded.
      (1) and (2) = pass. (3) upgrades to full credit and is the part most
      answers miss.
      An answer claiming masking makes packing order irrelevant = fail,
      diagnosing V2-M4 in its subtler form.
      An answer that proposes one document per sequence instead of masking =
      partial; it is correct and it wastes a large fraction of the token
      budget on padding for a corpus of short papers, which should be stated.
    difficulty: core

  - id: v2-q11
    concept: d-extraction-filtering
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Your pipeline runs a regex pass that replaces every email address, phone
      number, and IP address in the corpus with a typed placeholder. What can
      you claim about the resulting corpus?
    check: choice
    options:
      - text: "That formatted identifiers have been removed with high precision. Nothing follows about quasi-identifiers, so the defensible public claim is a scope statement - 'formatted identifiers removed; this is public scholarly text whose authors are named by design' - rather than 'PII scrubbed.'"
        correct: true
        explain: "Correct, and the scope statement is the deliverable. Identifiability comes from combinations of individually ordinary attributes - institution, subfield, year, career stage - and combinations exhaust a population quickly. A pattern matcher examines fields one at a time and cannot see combinations by construction."
      - text: "That the corpus contains no personal information."
        misconception: V2-M2
        explain: "The claim the pass feels like it earned, and the one an opposing expert most enjoys. Counterexample in one sentence: 'we thank the third-year PhD student in the Northlake speech group who ran the 2019 pilot.' No regex matches, and exactly one person fits."
      - text: "That it contains no personal information beyond what the extraction stage garbled; tighten the extractor and the residual goes to zero."
        misconception: V2-M1
        explain: "This locates the residual in extraction quality, where it is not. Perfect extraction would preserve the acknowledgements section exactly, quasi-identifiers and all - in fact better extraction produces MORE readable quasi-identifying prose, not less. Extraction quality and identifiability are orthogonal axes."
      - text: "That any identifying text still present is boilerplate repeated across many documents, so the deduplication pass has already removed it as a duplicate cluster."
        misconception: D9
        explain: "Two errors stacked. Quasi-identifying text is specific to one document, which is exactly why it identifies someone - it is the opposite of boilerplate. And dedup does not remove things: it selects a representative and, in this design, records the cluster. Treating dedup as a general-purpose cleanup step that quietly handles leftovers is the hygiene framing this unit dismantles."
    difficulty: warmup

  - id: v2-q12
    concept: d-dedup-provenance
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A duplicate cluster contains doc_417 (source: Northlake Preprints) and
      doc_101 (source: Journal of Text Systems). The pipeline kept doc_101's
      tokens as the representative.

      In v4 you will retrain with Northlake Preprints removed and measure the
      change in held-out loss.

      Show that "remove source k" is ambiguous, define the two experiments
      precisely, say which question each answers, and state what goes wrong if
      the cluster table records only the representative.
    answer: |
      The ambiguity. Removing a source means removing what that source
      contributed. doc_101's tokens ARE the content doc_417 contributed, sitting
      in the corpus under a different owner's label. So the removal set is not
      determined by filtering on source_id.

      Experiment A - exclusive content. Drop every manifest row whose
      source_id is Northlake Preprints. doc_101 stays, so the shared passage
      stays. This measures: what does this source's EXCLUSIVE content add,
      given that anything it shares with others is available anyway. It is the
      right experiment if the question is "what would we lose by not licensing
      Northlake, holding our other licences fixed."

      Experiment B - total content. Additionally drop the representatives of
      every cluster in which Northlake is a member. The shared passage leaves
      too. This measures: what does this source's TOTAL content add, including
      what somebody else also happens to hold. It is the right experiment if
      the question is "what is this material worth," independent of who else
      has it.

      Both are legitimate and they give different numbers. The leave-one-out
      delta is only well defined once you say which one you ran, and the
      difference between them is exactly the value of the duplicated content -
      which, notice, is the quantity the credit policy is arguing about. The
      two experiments are the counterfactual form of the same disagreement.

      What goes wrong with a representative-only cluster table: Experiment B
      becomes uncomputable, because nothing anywhere records that Northlake
      ever held that passage. The measurement silently becomes Experiment A
      while being reported as "the contribution of Northlake Preprints." It is
      undetectable after the fact - the corpus contains no trace of the merge,
      and neither do the trained weights - so no audit of the model or the
      shards recovers it. The only remedy is rerunning dedup, which means
      rerunning every training run downstream of it.
    check: llm
    rubric: |
      Must contain: (1) the ambiguity stated - the representative's tokens are
      also the other source's content, so filtering on source_id does not
      define the removal set, (2) both experiments defined concretely, (3)
      that they answer different questions and yield different numbers, (4)
      that a representative-only table makes one of them uncomputable and
      resolves the ambiguity silently.
      (1), (2), (4) = pass. (1) is the load-bearing one.
      An answer treating leave-one-source-out as unambiguous = fail,
      diagnosing D9: the learner still sees dedup as hygiene, so removing a
      source looks like a filter predicate.
      An answer that picks one experiment and defends it without acknowledging
      the other = partial; the skill being tested is noticing that a
      definition is required, not choosing well.
      Note for the grader: an answer that also observes the difference between
      the two experiments IS the value of the shared passage, and connects it
      to the credit policy, is above the bar for this item.
    difficulty: stretch

  - id: v2-q13
    concept: d-mixing-packing
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      RegMix chooses a data mixture by training hundreds of small models on
      random mixtures of the sources, regressing final loss on the mixture
      proportions, and picking the minimizing mixture.

      Explain why this methodology is already a per-source attribution method,
      what the estimated per-source value is in terms of the fitted
      regression, and name the two limits that stop it from being the whole
      answer.
    answer: |
      Why it is already attribution. The fit is

        loss_j = b_0 + sum over k of b_k * p_kj

      where p_kj is source k's proportion in the mixture used for run j. The
      fitted coefficient b_k is the estimated change in loss per unit increase
      in source k's share, holding the others fixed. Negate it and -b_k is
      source k's marginal value in loss units, estimated from the same runs
      that produced the mixing weights. The mixing literature computes a
      per-source value and calls it a mixing coefficient.

      This is the same construction as the datamodels approach v4 builds
      ground truth from. The only difference is the design matrix: RegMix
      samples continuous proportions, datamodels sample binary inclusion
      vectors. Same estimator, two literatures, and the second one is where
      this book uses it.

      Limit one, linearity. The additive form cannot represent interactions -
      "source A only helps when source B is present" - because each source
      contributes a term that does not depend on the others. Capturing
      interactions means adding pairwise terms, which costs on the order of
      K-choose-2 more coefficients and correspondingly more runs. Cooperative
      game theory (v5) exists precisely to handle value functions with
      arbitrary interactions, and the Shapley value is what a linear
      coefficient collapses to when interactions vanish.

      Limit two, the noise floor. Two identical mixtures trained with
      different random seeds produce different losses. Any coefficient smaller
      than that seed-to-seed spread is unmeasurable regardless of how many
      runs you do - more runs shrink the sampling error around the estimate,
      not the noise in the outcome being measured. This is the opposite of the
      usual A/B testing situation where more traffic always buys resolution,
      and it is why every measurement in v3 and v4 is reported with seed error
      bars rather than a point value.
    check: llm
    rubric: |
      Must contain: (1) the regression coefficient on a source's proportion IS
      the per-source value estimate, (2) at least one of the two limits stated
      correctly - linearity cannot express interactions, or seed noise sets a
      floor no amount of extra runs crosses.
      (1) and one limit = pass. Both limits = full credit.
      An answer that describes RegMix's mixing use without recognizing the
      attribution reading = fail; the whole item is the recognition.
      An answer claiming more runs eventually resolve arbitrarily small
      effects = fail on the noise-floor half, and diagnose it: this is the
      belief that attribution noise is a methods problem rather than a
      property of the measurement (D20 territory, which v5 and v9 return to).
    difficulty: stretch
