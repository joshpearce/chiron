# v9 artifact: pretest + terminal check bank.
#
# This is the synthesis unit, so it introduces no new mathematical procedure
# and therefore adds no new fade sequence. The two arithmetic items below
# (v9-q4, v9-q7) are third appearances of procedures faded in earlier units:
# the pro-rata-versus-Shapley split (v5-shapley-by-hand) and the SNR verdict
# (v5-snr-threshold). Everything else tests claim discipline, assembly order,
# and the argument.
#
# Running numbers used across several items, all carried from earlier units so
# nothing here requires a fresh computation the learner has not already seen:
#   Three-source value table: v(none)=0, v(A)=50, v(B)=50, v(C)=20,
#     v(AB)=70, v(AC)=90, v(BC)=90, v(ABC)=100.
#     Shapley 35 / 35 / 30. Pro-rata by solo value 41.67 / 41.67 / 16.67.
#   Shares spread across sources 2.36; SD(phi_i) at 3 seeds 1.72; SNR 1.37.
#   Gradient tracer against counterfactual table: rho = 0.61, 12 sources,
#     3 seeds.
#   Notary footnote: z = 4.5, one-sided p = 3.4e-6, family size m = 25,
#     corrected p = 8.5e-5.
#
# The four claim types, which most rubrics below key against:
#   corroborative (changed by rebuilding the index)
#   contributive  (changed by retraining the model)
#   allocation    (changed by changing the value function)
#   proof         (changed by nothing after the commitment)

pretest:
  - id: v9-p1
    concept: d-demo-assembly
    kind: mcq
    prompt: |
      You have a small language model you trained yourself, and the corpus it was
      trained on, tagged into twelve named sources. You are designing the screen a
      person types a question into to see where the answer came from.

      Which screen licenses the most claims correctly?
    options:
      - text: "A verbatim-span panel headed 'these documents contain this text; they are not claimed to have caused it'; an influence panel printing the rank correlation against a leave-one-source-out table with its seed and source count; an allocation panel printing the measured SNR and its verdict; and a footnote reporting a pre-committed watermark test with its corrected p-value."
        correct: true
        explain: "Four elements, four structurally different claim types - corroborative, contributive with measured trust, allocation, proof - each labeled with what it licenses and each carrying its own uncertainty figure. That labeling is the whole content of the screen."
      - text: "A single panel of verbatim spans from the corpus, ranked by rarity and linked to documents and sources, headed 'sources this answer came from'."
        misconception: D1
        explain: "Attractive because the panel is exact, cheap and legible, and the visual grammar is the grammar of a footnote. But rebuild the index over a different corpus with the weights untouched and the panel changes completely - it is a fact about the index, so 'came from' is a causal claim the panel cannot make."
      - text: "An influence-score panel ranking all twelve sources for the query, plus per-source links to the documents that scored highest."
        misconception: D6
        explain: "It shows a contributive quantity, which is the right target, but with no correlation against counterfactual truth the ranking is a demo rather than a result. The trust number is the deliverable; without it nothing on the screen says how much the ranking can be believed on this corpus at this scale."
      - text: "A pie chart of each source's share of a fixed pool, computed by the Shapley rule over the value table, with the fairness axioms listed beside it."
        misconception: D20
        explain: "The rule is the right rule and the axioms are the right justification, but with no SNR and no verdict the chart presents a split as definite when the differences between sources may be smaller than seed noise - below the threshold the welfare-optimal contract is a flat fee."
    answer: "A verbatim-span panel headed 'these documents contain this text; they are not claimed to have caused it'; an influence panel printing the rank correlation against a leave-one-source-out table with its seed and source count; an allocation panel printing the measured SNR and its verdict; and a footnote reporting a pre-committed watermark test with its corrected p-value."
    check: choice

  - id: v9-p2
    concept: d-pitch-economics
    kind: mcq
    prompt: |
      As of mid-2026, which statement about who pays money for training data is
      correct?
    options:
      - text: "Expert and labeled data is by far the largest flow - one vendor at roughly $2B annualized, ~90% from labs, and $14.3B paid for 49% of another - while content licensing is bilateral lump sums totalling an estimated $75 to 100M a year, and nobody pays for measured training contribution."
        correct: true
        explain: "The labeled-data market dwarfs all disclosed content licensing combined, the content deals are lump-sum and comparatively small, and no deployed system documents an attribution algorithm - so a training-attribution product sits in no existing flow."
      - text: "Training-rights licensing is the main paid market: nearly all of the ~91 announced deals since 2023 buy the right to train, and that is where a training-attribution product plugs in."
        misconception: D12
        explain: "The headline phrase is 'training data licensing', so this feels like the market. But only about 40% of recent deals include training rights, down from near-universal, while inference-time and retrieval access deals grew several-fold - the money moved to delivering answers, not to building models."
      - text: "The dominant flow is court-ordered: the $1.5B settlement established that labs owe rightsholders for training use, so litigation is creating the payment stream a training-attribution product would meter."
        misconception: D13
        explain: "That settlement priced one-time acquisition of pirated copies at roughly $3,000 per work, after the same court held training on lawfully acquired copies is fair use. It tells a lab to buy one clean copy, not to enter a royalty relationship."
      - text: "Answer engines and publisher pools already pay per use, distributing a pool pro-rata across cited sources, so the paying market for measured contribution exists and just needs better measurement."
        misconception: D10
        explain: "Those pools are real money, but they pay on citations, visits and grounding events - Panel 1's corroborative question with a payment attached - and pro-rata distributes by platform-wide share rather than by anyone's own usage."
    answer: "Expert and labeled data is by far the largest flow - one vendor at roughly $2B annualized, ~90% from labs, and $14.3B paid for 49% of another - while content licensing is bilateral lump sums totalling an estimated $75 to 100M a year, and nobody pays for measured training contribution."
    check: choice

  - id: v9-p3
    concept: d-pitch-economics
    kind: mcq
    prompt: |
      Which pairing states the strongest case against building anything in this
      space together with the response the unit actually gives?
    options:
      - text: "Case: no lab pays into any marketplace anywhere, the largest settlement priced one-time acquisition after three jurisdictions held training on lawful copies is fair use, and the gatekeeper owns the chokepoint, the standards and a marketplace. Response: concede all three - the measurement layer is needed under every branch, verification has a regulatory deadline rather than a voluntary buyer, and the artifact is publishable whatever labs decide."
        correct: true
        explain: "All three objections are true and the response disputes none of them; it runs the branches instead. Clean-copy purchasing needs provenance, an output-substitution ruling needs an auditable allocation, and the status quo leaves mandatory disclosure that is explicitly unverified."
      - text: "Case: no lab pays into any marketplace and the gatekeeper owns the pipe. Response: the pending output-substitution litigation will overturn the fair-use holding and force ongoing royalties, so the marketplace gets its buyer."
        misconception: D13
        explain: "It states two objections accurately and then answers with a prediction the record does not support - three jurisdictions have converged on the fair-use line. Betting the response on one unresolved branch is the answer that loses a room where the objector already knows the settlement's terms."
      - text: "Case: attribution estimates are still too noisy to bill on. Response: the noise is a young-field methods problem, so better estimators will cross the bar and the marketplace becomes viable."
        misconception: D20
        explain: "It substitutes a methods worry for the three structural objections, and its response is refuted by the threshold result: below a certain SNR the welfare-optimal contract is a flat fee, and no estimator improvement crosses that - only more signal does."
      - text: "Case: gradient attribution has not been shown to work at frontier scale. Response: the scale gap is engineering, and the same methods will show degraded but positive correlation as they scale up."
        misconception: D6
        explain: "One real objection, understated, with a response the measurements contradict: against actual retraining on a 2B-parameter model the scalable methods performed no better than random guessing, and influence changes shape with scale rather than merely getting noisier."
    answer: "Case: no lab pays into any marketplace anywhere, the largest settlement priced one-time acquisition after three jurisdictions held training on lawful copies is fair use, and the gatekeeper owns the chokepoint, the standards and a marketplace. Response: concede all three - the measurement layer is needed under every branch, verification has a regulatory deadline rather than a voluntary buyer, and the artifact is publishable whatever labs decide."
    check: choice

check:
  - id: v9-q1
    concept: d-retrieval-attribution
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      Panel 1 shows maximal verbatim spans of the model's answer, found in the
      training corpus by suffix-array lookup and ranked by rarity.

      Which statement correctly gives the experiment that establishes the panel's
      claim type and the status of rarity ranking?
    options:
      - text: "Hold the weights fixed and rebuild the index over a different corpus: the panel changes completely, so it is corroborative. Rarity is the right ranking for information - a nine-token span occurring once distinguishes a document where a 3,140-occurrence span does not - and the wrong payment basis, because rare-but-plausible text is the cheapest thing to manufacture."
        correct: true
        explain: "A quantity that moves when only the index moves is a property of the index, which fixes the claim type as containment rather than causation. And rarity converts 'nobody else wrote this' into money, which needs no consumer, only a place in an index."
      - text: "Inspect which retrieved documents the model attended to while generating: the attention weights show which sources caused the answer, which is why the panel is contributive."
        misconception: D1
        explain: "It reads a retrieval panel as tracing causation. Attention over a context window says which retrieved text the model looked at seconds ago; it says nothing about which training documents shaped the weights, and swapping the index changes it while the model stays identical."
      - text: "Ask the model for the same content in a different style: if no verbatim span survives, the sources scored zero really did not contribute, so the panel is a complete contribution measure that just needs rarity ranking for precision."
        misconception: D3
        explain: "The paraphrase test is the right experiment for the wrong conclusion. Knowledge survives with the surface form changed, and influence becomes more abstract with scale - a document sharing no n-grams can be a strong contributor, so the panel is a lower bound, not a complete measure."
      - text: "Rank by span length instead: length is the honest measure of overlap, and the panel then licenses the claim that the longest-matching document is the one the answer came from."
        misconception: D1
        explain: "Length surfaces boilerplate first - a twenty-token methods phrase occurring 3,000 times beats a nine-token span occurring once - and the concluding clause still attaches a causal claim to a containment observation."
    answer: "Hold the weights fixed and rebuild the index over a different corpus: the panel changes completely, so it is corroborative. Rarity is the right ranking for information - a nine-token span occurring once distinguishes a document where a 3,140-occurrence span does not - and the wrong payment basis, because rare-but-plausible text is the cheapest thing to manufacture."
    check: choice
    difficulty: core

  - id: v9-q2
    concept: d-retrieval-attribution
    kind: mcq
    check: choice
    congruent: false
    callback_eligible: false
    prompt: |
      You leave the model's weights completely untouched and rebuild the
      suffix-array index over a different corpus. Which panels of the demo can
      change?
    options:
      - text: "Only the corroborative verbatim-span panel."
        correct: true
        explain: "Right. The span panel is a function of the output string and the indexed corpus; you changed the corpus. The influence scores come from gradients of weights that did not move, the allocation comes from a ledger accumulated during a training run that did not happen again, and the watermark test queries the same model. This is the cheapest discriminator between corroborative and contributive evidence, and it is the experiment a skeptic proposes first."
      - text: "The verbatim-span panel and the influence ranking, since both describe where the answer came from."
        misconception: D1
        explain: "This is citation-is-attribution in its most durable form. The two panels do not describe the same thing: one describes what strings live in an index, the other describes what moved a set of weights. If rebuilding an index could change an influence score, the influence score would not be a claim about training at all."
      - text: "All three panels, because the retrieval index is what the model was trained on."
        misconception: D1
        explain: "The index and the training corpus are separate objects that happen to have been built from the same text here. Nothing about training reads the index, and nothing about the index is consulted during a forward pass. Conflating them is precisely the error a retrieval-augmented product invites."
      - text: "None of them, because verbatim matching is a lexical artifact that carries no real information."
        misconception: D3
        explain: "Overcorrection. Verbatim matching is a lower bound and a measurement artifact, and it is also exact for what it claims and the only panel with no noise of its own. The correct move is to label it, not to disbelieve it."
    difficulty: warmup

  - id: v9-q3
    concept: d-demo-assembly
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      The chain is: corpus pipeline, training run, counterfactual sweep, notary
      run. Two decisions in it cannot be repaired by re-running anything.

      Which option names those two, with correct reasons?
    options:
      - text: "The pre-commitment - the key and protocol hash must be timestamped before the model is trained, and committing afterwards is no commitment at all - and the source partition with duplicate-cluster membership recorded, because once duplicates are collapsed without recording which sources were in the cluster the credit decision has been made and the information to revisit it is gone."
        correct: true
        explain: "Both are decisions whose evidentiary value comes from their ordering, not from their contents. A post-hoc commitment describes a procedure nobody ran, and a collapsed cluster cannot be un-collapsed from the shards that remain."
      - text: "The trained model and its checkpoints, because a run with a different seed produces different influence scores and a different allocation, so the original numbers can never be reproduced."
        misconception: D16
        explain: "Seed variation is real - shares and per-source contributions swing under it - but retraining is exactly what the program budgets for, and sigma exists to quantify that swing. Irreproducible-by-seed is not the same as unrepairable-by-re-running."
      - text: "The counterfactual table, because the leave-one-source-out sweep is the only ground truth in the chain, and the sigma from the training run, because held-out bits per byte cannot be recomputed once the checkpoints are superseded."
        misconception: D16
        explain: "Both are expensive to recompute and both are re-runnable: the sweep is retraining and sigma is a fresh pair of seeds. Cost is not irreversibility, and treating the table as a one-shot measurement is the same 'measure once, bill forever' instinct the noise unit refutes."
      - text: "The verbatim index and the influence scores, because the suffix array is built over a corpus that changes and the gradient traces are only valid for the query that produced them."
        misconception: D1
        explain: "The index is the cheapest artifact in the chain to rebuild - that rebuild is the discriminating experiment - and per-query traces are recomputable from stored checkpoints. Neither is a decision that ordering destroys."
    answer: "The pre-commitment - the key and protocol hash must be timestamped before the model is trained, and committing afterwards is no commitment at all - and the source partition with duplicate-cluster membership recorded, because once duplicates are collapsed without recording which sources were in the cluster the credit decision has been made and the information to revisit it is gone."
    check: choice
    difficulty: core

  - id: v9-q4
    concept: d-pitch-economics
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Value table over three sources, in thousandths of a bit per byte of
      held-out improvement:

      | S    | none | A  | B  | C  | AB | AC | BC | ABC |
      | v(S) | 0    | 50 | 50 | 20 | 70 | 90 | 90 | 100 |

      A $1.00 pool is split two ways: pro-rata by each source's solo value
      v({i}), and by Shapley. How many cents does the pro-rata split underpay
      source C relative to its Shapley share? Give the answer in cents to two
      decimal places.
    answer: 13.33
    check: numeric(0.01)
    difficulty: core

  - id: v9-q5
    concept: d-demo-assembly
    kind: mcq
    check: choice
    congruent: false
    callback_eligible: false
    prompt: |
      Your influence panel correlates with the counterfactual table at
      Spearman rho = 0.61, measured over 12 sources at 3 seeds on a
      561-million-parameter model. Which statement is defensible in a pitch?
    options:
      - text: "On this corpus at this scale, the cheap tracer's ranking tracks retrained truth at rho = 0.61 over 12 sources at 3 seeds; nothing here licenses the same figure at another scale."
        correct: true
        explain: "Right, and it is stronger than a larger claim with no number, because nobody else in this market publishes a correlation against counterfactual truth at all - at frontier scale it is not computable and at small scale nobody bothered. The scope conditions are the credential."
      - text: "The tracer is 61% accurate, and scaling to a frontier model is an engineering problem."
        misconception: D6
        explain: "Two errors. A rank correlation is not an accuracy percentage. And the scale claim fails on measurement: against actual retraining on a 2-billion-parameter model, the scalable gradient methods came out no better than random guessing, while the method that correlates costs several full training runs per query."
      - text: "Rho = 0.61 is too low to report; wait until the method improves before showing a number."
        misconception: V9-M2
        explain: "The comparison is not against somebody's better number, because there is no better number in this market. A measured 0.61 with its seed and source counts beats an unmeasured assertion, and withholding it discards the one credential the build produced."
      - text: "Since the panel's top-ranked source also appears in the verbatim-span panel, the 0.61 understates it."
        misconception: D3
        explain: "Agreement with a verbatim panel is not evidence about a contributive ranking; it is agreement with a lexical lower bound that is blind to semantic contribution by construction. Using it to adjust a measured correlation replaces the measurement with the thing the measurement was checking."
    difficulty: core

  - id: v9-q6
    concept: d-pitch-economics
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      The unit names three commercially open slots: independent verification and
      audit, leakage and syndication tracking, and buy-side data procurement.

      Which statement about those slots and about the artifact built in this book
      is correct?
    options:
      - text: "Verification's buyer is the buy side and its forcing function is regulatory - disclosure is mandatory with enforcement from 2026-08-02, refreshes every six months, and the regulator has said in writing it will not check whether specific content was used; the artifact is a working instance of that slot and is only adjacent to the other two."
        correct: true
        explain: "The slot is open because the regime is compulsory, recurring, coarse and explicitly unverified. The signed report with its committed key, corrected p-value and negative control is exactly that slot's deliverable; leakage tracking needs web-scale near-duplicate infrastructure the build never touched and procurement is a sales and indemnification business, so both are adjacent through the fingerprinting layer and unbuilt."
      - text: "The artifact is a working instance of all three slots, since the corpus pipeline's fingerprinting layer is the shared substrate for leakage tracking and procurement as well as for verification."
        misconception: D6
        explain: "Fingerprinting is common ground, not coverage. Overclaiming here is exactly how a good demo becomes a bad pitch: 'adjacent, not built' is the stronger sentence, and a diligence process will find the difference."
      - text: "Answer-engine citation revenue sharing - publisher pools paying on visits, citations and agent actions - is the third open slot, and the artifact's verbatim-span panel is a working instance of it."
        misconception: D1
        explain: "That lane is crowded and funded ($42.5M publisher pools, platform marketplaces, ad-revenue splitters), so it is not open. It is also corroborative attribution with a payment attached, which is precisely the containment-for-causation slide the unit exists to close."
      - text: "Verification's buyer is publishers, because they are the party harmed by unverified disclosures, and the forcing function is the pending output-substitution litigation."
        misconception: D13
        explain: "Verification sells to the buy side - developers and the parties who must rely on their claims - which is the side with money. And its forcing function is a live statutory deadline with fines to EUR 15M or 3% of global revenue, not an unresolved theory in ongoing litigation."
      - text: "Training-rights licensing is the open slot, since content deals are where labs concentrate their data spending and no independent party prices those deals."
        misconception: D12
        explain: "Only about 40% of recent deals include training rights, down from near-universal, while inference-time access deals roughly double year over year and the expert-labeled-data market dwarfs all disclosed content licensing. That slot is neither open nor where the money flows."
    check: choice
    difficulty: core

  - id: v9-q7
    concept: d-pitch-economics
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Your allocation across sources has a spread of 2.36 units, and one share has
      a standard deviation of 1.72 units from seed noise at three seeds. The bar
      is an SNR of 2.

      Which headline belongs at the top of the memo?
    options:
      - text: "SNR = 2.36 / 1.72 = 1.37, below the bar, so the correct contract for this corpus at this scale is a flat fee - and reaching an SNR of 2 requires a stated seed count at a stated cost."
        correct: true
        explain: "The arithmetic is 1.37, the verdict is flat fee, and stating the cost to move it converts a negative result into a priced decision. Had the per-share SD been 1.10 the SNR would be 2.36 / 1.10 = 2.15, above the bar, and the headline would become the split reported with its error bars - but in both directions the headline is the measured SNR, not the pie chart."
      - text: "SNR = 1.37; report the per-source split as the headline with the SNR as a caveat underneath, since the shares are the deliverable the audience came for."
        misconception: V9-M2
        explain: "A caveat under a pie chart is not the same claim as a flat-fee recommendation, and the difference is what an opposing expert or a diligence process finds first. The measurement is the asset - lead with it whichever way it lands."
      - text: "SNR = 1.37, which is a methods limitation: hold the headline until a better attribution estimator raises it above the bar."
        misconception: D20
        explain: "The threshold is about how much signal exists in the measurement, not how cleverly it is processed. Below it the welfare-optimal contract collapses to a flat fee and no estimator improvement crosses it - only more seeds, larger effects, or sources that actually differ."
      - text: "SNR = 1.72 / 2.36 = 0.73, far below the bar, so no allocation claim of any kind can be made from this build."
        misconception: D20
        explain: "The ratio is inverted: SNR is the spread of shares across sources divided by the noise on one share, so 2.36 / 1.72 = 1.37. The verdict also overreaches - the rule's unique split is still a defensible allocation claim, displayed as an illustration rather than a schedule."
    check: choice
    difficulty: core

  - id: v9-q8
    concept: d-demo-assembly
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      Where noise enters each element of the screen, and what reports it. Which
      statement is correct?
    options:
      - text: "The span panel introduces no noise of its own; the influence panel carries noise twice - the model's training seed, and the seed noise in the counterfactual table its correlation was measured against - so $\\rho$ is attenuated and part of the gap to 1.0 is a fuzzy target rather than a wrong method."
        correct: true
        explain: "Given the corpus and the output string the spans are a deterministic function, and the span panel is the only one about which that can be said. The influence panel's trust number was graded against entries each carrying $\\text{SE}_\\Delta = \\sigma\\sqrt{2/n}$, so sources below the noise floor contribute rank information that is itself noise - which is why $\\rho$ must be quoted with its seed count and source count."
      - text: "The span panel is itself noisy because the model is stochastic, so it needs an error bar exactly as the influence panel does."
        misconception: D3
        explain: "The model's noise reaches the panel only through the output string; given that string the spans are deterministic, and the panel adds nothing. Treating verbatim containment as a noisy measurement of contribution mistakes a lower bound on surface form for a measurement of the model."
      - text: "The footnote's $z = 4.5$ is the noisiest number on the screen, since a different training seed would move it and therefore invalidate the stated false-positive rate."
        misconception: D19
        explain: "The $z$ does move with the seed, but the false-positive rate comes from the never-published control set, which can be sampled as often as you like. That constructed null is what makes the footnote the only line entitled to the word 'proven'."
      - text: "The allocation panel's shares are noisier than the leave-one-out numbers underneath them, because the Shapley sum accumulates seed noise over all arrival orders."
        misconception: D16
        explain: "Averaging over arrival orders averages over noise too, so the shares carry roughly $0.745\\,\\sigma$ - less noise than leave-one-out, not more. Less noise is not no noise, which is why $\\text{SD}(\\phi_i)$ and the SNR are printed beneath the chart."
      - text: "The influence panel's noise enters once, at the model's training seed; $\\rho$ is then a clean measurement of the method's accuracy against truth."
        misconception: D6
        explain: "It enters twice. The target is a counterfactual table with its own standard errors, so a correlation measured against it is attenuated - calling $\\rho$ 'the method's accuracy' hides that the ground truth was itself estimated at a stated seed count."
    check: choice
    difficulty: core

  - id: v9-q9
    concept: d-pitch-economics
    kind: mcq
    check: choice
    congruent: false
    callback_eligible: false
    prompt: |
      A $1.5B settlement in this space received final approval in mid-2026, at
      roughly $3,000 per work across about 500,000 works. What did it price, and
      what does that imply for a royalty product?
    options:
      - text: "It priced one-time acquisition of pirated copies, after the same court held that training on lawfully acquired copies is fair use - so the rational lab response is to buy one clean copy, not to enter a royalty relationship."
        correct: true
        explain: "Right, and three jurisdictions have converged on that line. This is why a measurement layer needed under every legal outcome is a better bet than a royalty layer needed under one - and why the unresolved output-substitution theories are the thing to watch, since they are what would reprice the space."
      - text: "It priced ongoing use of the works in training, so it establishes a per-work royalty rate the market can build on."
        misconception: D13
        explain: "It priced acquisition, once. Reading a one-time settlement as a rate schedule is the error that makes a pitch fall apart in the room, because the person across the table has usually read the terms."
      - text: "It shows training rights are where the money is, since this dwarfs the disclosed licensing deals."
        misconception: D12
        explain: "A settlement is not a market. Only about 40% of recent deals include training rights, down from near-universal, while inference-time access deals grow several-fold; and the expert-labeled-data market, where labs actually spend billions, is larger than all disclosed content licensing combined."
      - text: "It shows that pooled pro-rata distribution is now the settled mechanism for compensating authors."
        misconception: D10
        explain: "The settlement's distribution mechanics are not a design endorsement, and pro-rata pooling carries its own pathologies - cross-subsidy, winner-take-most concentration, and farming incentives - which are the reason the incumbent template transfers badly here."
    difficulty: warmup

  - id: v9-q10
    concept: d-pitch-economics
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      An investor says: "Verification is a services business with a small ceiling.
      The royalty exchange is the venture-scale idea. Lead with that."

      Which reply argues the opposite ordering in the terms this unit supplies?
    options:
      - text: "Verification needs nobody's permission, has a live statutory deadline rather than a hope, ships a document a stranger can check, and is needed under every branch of the legal and market outcome while the exchange is needed under one - and yes, a single audit engagement has a bounded ceiling, so the split stays on the slide as the vision with its measured SNR underneath."
        correct: true
        explain: "Four reasons plus a genuine concession. The exchange requires a frontier lab to agree to pay into a marketplace and none has anywhere; verification requires only a regulated party with a recurring deadline and fines to 3% of global revenue. Retaining the split as the vision keeps the fairness argument a non-technical counterparty can agree to in four sentences."
      - text: "Lead with verification and drop the royalty split entirely: an allocation whose SNR is below the bar is not something to put in front of an investor at all."
        misconception: V9-M2
        explain: "The measured SNR is the asset in either direction and the split is the part with a fairness argument no gradient method supplies. Abandoning it treats a self-measured negative as a wound rather than as a priced decision on the roadmap."
      - text: "Agree that the exchange leads, because the pending output-substitution litigation will force labs into ongoing royalty payments and the counterparty problem solves itself on that timeline."
        misconception: D13
        explain: "The largest settlement priced one-time acquisition of pirated copies at roughly $3,000 per work after the same court held training on lawfully acquired copies is fair use, and three jurisdictions have converged. The rational lab response is to buy a clean copy, not to enter a royalty relationship."
      - text: "Lead with verification because its rankings are more accurate than the exchange's, and the accuracy gap will close as attribution estimators improve."
        misconception: D20
        explain: "Verification leads because its deliverable is a committed test with a constructed null and a regulatory buyer, not because it ranks better. And below the threshold no estimator improvement changes the optimal contract - only more signal does."
    check: choice
    difficulty: stretch

  - id: v9-q11
    concept: d-retrieval-attribution
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      A competitor demo shows, beside every generated sentence, a ranked list of
      source documents with percentage weights summing to 100%, labeled "training
      data attribution," and pays publishers monthly in proportion to those
      percentages.

      Which audit of that demo is correct?
    options:
      - text: "Almost certainly corroborative: hold the weights fixed and rebuild the index, or turn retrieval off and ask something the model knows anyway - and the clean 100% sum over a handful of documents already says the denominator is the retrieved set. The honest change is the label and header, not the code."
        correct: true
        explain: "Two independent experiments settle it, and either one moves the percentages without a weight moving. Contributive contributions over a full corpus are defined against thousands of sources, do not sum to a tidy total, and some fall below the noise floor. Metering surfaced use is a real product with real buyers; the failure is the word 'attribution' on it."
      - text: "The percentages are contributive if the vendor confirms they are computed from gradient dot products, since that is the mechanism the unit's own influence panel uses."
        misconception: D1
        explain: "The test is the experiment, not the method name. If rebuilding the index while the weights sit still changes the numbers, they were about the index whatever they were computed with."
      - text: "The percentages are contributive as long as the highlighted spans really do appear verbatim in the cited documents, since a source the model cannot reproduce did not contribute much."
        misconception: D3
        explain: "Verbatim match is a lower bound on surface form. Ask for the same content in a different style and the spans vanish while the knowledge is intact; influence at scale becomes more abstract, so documents sharing no n-grams with an output can be among its strongest contributors."
      - text: "The product should not exist: paying publishers from a normalized score over retrieved documents is indefensible regardless of what it is called."
        misconception: D10
        explain: "Metering is honest when labeled - the diagnosis this unit teaches is of claims rather than of businesses. The payment rule does have a real defect worth naming (pro-rata over surfaced use invites manufacturing rare-but-plausible text), but that is an argument for fixing the rule and the label, not for rejecting metering outright."
      - text: "The 100% sum is neutral bookkeeping: any allocation rule normalizes to a pool, so it carries no information about what is being measured."
        misconception: D1
        explain: "An allocation over a fixed pool does normalize, but this panel is claiming per-sentence attribution over a training corpus. A tidy split across a handful of documents per sentence is strong evidence the denominator is the retrieved set rather than the corpus."
    check: choice
    difficulty: stretch

  - id: v9-q12
    concept: d-demo-assembly
    kind: mcq
    check: choice
    congruent: false
    callback_eligible: false
    prompt: |
      The demo's footnote reads: "Source 7 membership: proven. z = 4.5,
      one-sided p = 3.4e-6; family-corrected p = 8.5e-5 at family size m = 25.
      Key commitment sha256:9c41...e07a, timestamped before this model was
      trained."

      What does that footnote license?
    options:
      - text: "That a test fixed before the model existed fired at a stated false-positive rate, for this source, on this model."
        correct: true
        explain: "Right, and every clause of the footnote is doing work: the family correction answers the multiple-testing objection, and the pre-model timestamp answers the only question an opposing expert needs to ask, which is when each element of the protocol came into existence."
      - text: "That p is small, so the result is proven regardless of when the test was designed."
        misconception: D19
        explain: "A p-value only means anything if the test, threshold, family size and key were fixed before anyone saw the model. Chosen afterwards, the stated false-positive rate describes a procedure nobody ran - and the correction matters too: 25 tests at a 0.05 threshold produce false positives by construction."
      - text: "That the model's loss on source 7 is anomalously low, which is what membership evidence means."
        misconception: D2
        explain: "That is post-hoc membership inference, and its null - models that did not train on this data - cannot be sampled. The footnote's strength comes from the opposite construction: a control set generated under the same key and never published, which can be sampled as often as you like."
      - text: "That the detection method used here is stronger than the alternatives, since z = 4.5 is a large value."
        misconception: V7-M2
        explain: "Detection power and validity are independent properties. A larger z from a design with no constructible null is power at a confidence of unknown. What licenses the word proven here is the null and the commitment, not the magnitude."
    difficulty: core
