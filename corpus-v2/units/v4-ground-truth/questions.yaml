# v4 ground-truth: pretest + terminal check bank.
# Solo fade items: v4-q3 (v4-loo-contribution), v4-q6 (v4-subset-regression),
# v4-q7 (v4-lds-spearman). Each is the third appearance of a procedure that was
# worked in canon prose and drilled as a completion beat.
#
# All bits-per-byte figures are illustrative, matching canon's convention.

pretest:
  - id: v4-p1
    concept: d-counterfactual
    prompt: |
      A publisher asks you to prove that their catalogue contributed to a
      language model you trained, and to say by how much.

      Which experiment settles it?
    answer: "Train with and without the catalogue, compare held-out bits per byte"
    check: choice
    options:
      - text: |
          Train the model twice - once on the full corpus, once on the
          identical corpus with the catalogue removed and the token budget
          backfilled by repeating what remains - evaluate both on the same
          held-out text reserved before either run, and take the difference
          in held-out bits per byte, averaged over several seeds per
          condition.
        correct: true
        explain: |
          This is the definition rather than a proxy for it:
          Delta_i = v(all except i) - v(all), where v(S) is held-out bits per
          byte for a model trained on S. The question is causal, and only two
          worlds answer a causal question. Seeds and the error bar
          sigma*sqrt(2/n) are what turn the pair of runs into a measurement.
      - text: |
          Prompt the finished model with openings from the catalogue and
          measure what fraction of the text it reproduces verbatim; that
          fraction is the catalogue's contribution.
        misconception: D3
        explain: |
          Attractive because verbatim regurgitation is the visible,
          screenshot-able evidence. But it is a lower bound and a measurement
          artifact: most of what training data contributes is semantic and
          never resurfaces verbatim, and a model that reproduces nothing can
          still have been shaped heavily by the catalogue.
      - text: |
          Run a membership-inference attack on the finished model: the
          catalogue's documents will show a suspiciously low loss compared
          with typical text, which proves they were trained on.
        misconception: D2
        explain: |
          A test statistic without a null is not a proof. To attach a
          false-positive rate you need the distribution of that loss under
          "the model was NOT trained on this", which you cannot sample
          without retraining - so the second run reappears anyway, and
          post-hoc MIA gives no magnitude at all.
      - text: |
          Compute gradient-based influence scores for every document in the
          catalogue against the finished model and sum them; the total is the
          catalogue's contribution.
        misconception: D6
        explain: |
          This is the method the field builds precisely to AVOID the second
          training run, and its worth is exactly the correlation with
          retraining that accompanies it. Measured against actual retraining,
          the versions that scale have come out at chance - so a sum of
          influence scores with no counterfactual behind it settles nothing.
      - text: |
          Query the deployed system on topics the catalogue covers and count
          how often it cites the catalogue's works as sources.
        misconception: D1
        explain: |
          Citation is corroborative (this source supports the claim), not
          contributive (this data caused the capability). Swap the retrieval
          index and the citations change while the model, and everything it
          learned in training, stays identical.

  - id: v4-p2
    concept: d-noise-floor
    prompt: |
      Two models, same configuration, trained on corpora differing only in
      whether source 7 was present. Held-out bits per byte: 1.043 with source
      7, 1.061 without it.

      Is 0.018 source 7's contribution?
    answer: "Cannot tell without the run-to-run spread sigma"
    check: choice
    options:
      - text: |
          Cannot tell - each figure is a single draw from a stochastic
          training process, so without knowing the run-to-run spread sigma at
          this configuration there is no way to say whether 0.018 is a
          contribution or ordinary variation between two runs.
        correct: true
        explain: |
          Right. v(S) is a random variable: retrain either condition with a
          different seed and both numbers move. Settling it takes several
          seeds per condition, averaged within condition, compared against
          SE = sigma*sqrt(2/n).
      - text: |
          Yes - 0.018 is what contribution means: the difference in held-out
          bits per byte between training with the source and training without
          it.
        misconception: D16
        explain: |
          The trap works because the definition really does give 0.018. The
          definition is exact; the MEASUREMENT is an experiment with error
          bars. Reseeded, the same pair of conditions came back at 0.012 and
          0.015 - the largest gap is 50% bigger than the smallest, with
          nothing changed but a random number generator's starting value.
      - text: |
          Yes - both runs used the same seed, so training randomness is held
          fixed and the whole 0.018 is attributable to the corpus.
        misconception: D16
        explain: |
          Fixing the seed makes the pair reproducible, not stable. A
          different seed gives a different gap, so what you have is one draw
          from the distribution of gaps and no idea of its width. Common
          randomness reduces nothing you can report without repeats.
      - text: |
          No - at 10 million parameters the model is too small for a
          contribution measured on it to mean anything.
        misconception: V4-M4
        explain: |
          Scale is a scope statement, not a validity problem: the
          counterfactual is exact at any scale, and the open question is what
          it is exact ABOUT. Small scale is what makes the second run
          affordable at all. What makes 0.018 unreliable here is seed noise,
          which a bigger model does not remove.
      - text: |
          Yes, provided the corpus was deduplicated first, since dedup
          removes the overlap that would otherwise let another source cover
          for source 7.
        misconception: D9
        explain: |
          Dedup does not neutralise the redundancy question, it decides it:
          whichever source keeps the shared copies absorbs the contribution
          of everything they teach. And even a perfectly deduplicated corpus
          leaves 0.018 as a single noisy draw.

  - id: v4-p3
    concept: d-subset-regression
    prompt: |
      You have 12 sources and want a per-source value for each. Exhaustively
      training a model on every possible combination is 4,096 runs, which you
      cannot afford. You can afford about 300.

      Which design gets all 12 numbers out of 300 runs?
    answer: "Random-subset runs, then regress held-out bpb on the inclusion indicators"
    check: choice
    options:
      - text: |
          Train 300 models, each on a random subset of the 12 sources,
          recording for each run which sources were in and the held-out bits
          per byte that came out; then fit v(S) = beta_0 + sum_i beta_i x_i
          over the inclusion indicators, and read each source's value off its
          coefficient as c_i = -beta_i.
        correct: true
        explain: |
          Every run informs every coefficient, which is why the design is
          roughly six times more run-efficient than leave-one-out per unit of
          precision: SE_beta = 2*sigma/sqrt(M). With a balanced design no
          solver is needed - average the runs with source i in, average those
          with it out, subtract, and every other source cancels.
      - text: |
          You cannot: 300 runs cover only 7% of the 4,096 possible
          combinations, so nine tenths of the coalitions are unobserved and
          the per-source values are undetermined.
        misconception: D7
        explain: |
          The combinatorial count is not what sets the run budget. You are
          estimating 12 numbers plus an intercept, and the runs needed follow
          from that count and the seed noise, not from 2^K. This is the
          infeasibility argument in the wrong place - it bites at per-document
          granularity, not at 12 payable sources.
      - text: |
          Train 13 models: one on the full corpus and 12 each on a single
          source alone. Each single-source model's held-out bits per byte is
          that source's value, and the values divide the total between them.
        misconception: V4-M1
        explain: |
          A source measured alone is measured in a corpus that is not the one
          being billed for, and the resulting numbers are assumed to divide a
          total. They do not: marginal contributions fail to sum whenever
          sources interact - two near-duplicate sources each score near 0.002
          while removing both costs 0.020.
      - text: |
          Skip the extra training entirely: train once on the full corpus and
          compute per-source gradient influence on that single model, which
          gives 12 numbers for the price of one run.
        misconception: D6
        explain: |
          Cheap, and untested. An influence implementation yields a
          plausible-looking ranking whether or not it is correct, and it is
          worth the correlation with retraining that accompanies it - which
          is a number only the subset runs can produce.

check:
  - id: v4-q1
    concept: d-counterfactual
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Which statement gives this unit's definition of a source's contribution
      and a correct account of what it does and does not license?
    check: choice
    difficulty: core
    options:
      - text: |
          Delta_i = v(all except i) - v(all), where v(S) is the held-out bits
          per byte of a model trained on the source set S and lower is
          better, so the removal goes first and positive means helpful. It is
          exact for the two runs performed and needs no theory of the loss
          surface - but v(S) is a random variable across seeds, so it ships
          with n, sigma and SE = sigma*sqrt(2/n), and with the leave-one-out
          protocol recorded beside it.
        correct: true
        explain: |
          The definition is exact and the measurement is not, and the
          protocol - fixed corpus versus fixed token budget - has to be
          recorded because the two do not differ by a constant: fixed corpus
          systematically favours large sources and so reorders the table
          rather than rescaling it.
      - text: |
          Delta_i = v(all except i) - v(all), with v(S) the held-out bits per
          byte of a model trained on S. Because it is computed by doing the
          experiment rather than estimated, it is exact full stop; the seed
          variation is a defect in the training setup and an error bar is a
          scientific courtesy the invoice can drop.
        misconception: D16
        explain: |
          The first sentence is right and the second is the failure this unit
          exists to prevent. Reseeded, source 7's gap ran 0.018, 0.012, 0.015
          with nothing changed but an RNG's starting value. Contribution is a
          random variable at every scale, and a table without its sigma
          cannot be read.
      - text: |
          Delta_i = v(all except i) - v(all), with v(S) the held-out bits per
          byte for source set S. It is a counterfactual measured by actually
          retraining, so it is the true contribution of the source; the model
          scale, token budget and held-out set are implementation details of
          how the number was obtained rather than part of what it means.
        misconception: V4-M4
        explain: |
          The counterfactual is exact for the configuration that produced it -
          this architecture, parameter count, token budget, protocol,
          held-out set and source list - and nothing more. Influence patterns
          change with scale: a 10M-parameter result is evidence about
          10M-parameter models and a hypothesis about anything larger.
      - text: |
          Delta_i = v(all except i) - v(all), with v(S) the held-out bits per
          byte for source set S. Since the twelve Delta_i are each a source's
          contribution to the model, they sum to the model's total value, and
          each source's share is Delta_i divided by that sum.
        misconception: V4-M1
        explain: |
          The formula is right, the ledger arithmetic is not. Delta_i is a
          marginal contribution to the FULL corpus, and marginals do not sum
          to the total whenever sources interact: two near-duplicate sources
          each measure 0.002 while removing both costs 0.020, five times
          their sum. Proportional-to-delta payout is a choice needing a
          defence, which is what v5 is for.

  - id: v4-q2
    concept: d-counterfactual
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Your corpus is 200 million tokens across 12 sources. A mid-sized source
      is about 8% of it and measured Delta = 0.015 bits per byte. A single
      paper is about 0.004% of it. Seed noise at this configuration is
      sigma = 0.003 bpb.

      Assume the effect on held-out bpb of deleting content is proportional
      to the fraction of the corpus deleted, so one paper's contribution is
      0.015 x (0.004 / 8). Using n >= 8 sigma^2 / Delta^2, how many seeds per
      condition would be needed to resolve one paper's contribution at
      z >= 2?

      Give the answer in millions of seeds, to two decimal places.
    answer: "1.28"
    check: numeric(0.05)
    difficulty: core

  - id: v4-q3
    concept: d-noise-floor
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Seed noise for this configuration is sigma = 0.003 bits per byte,
      pooled across conditions.

      Held-out bits per byte, three seeds per condition:

        full corpus:        1.021, 1.024, 1.018
        without source 5:   1.032, 1.026, 1.029

      Average within each condition, subtract to get the contribution, and
      divide by the standard error of the difference to get z.

      Answer with z only, to two decimal places.
    answer: 3.27
    check: numeric(0.05)
    difficulty: core

  - id: v4-q4
    concept: d-noise-floor
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A source in your finished table has Delta = 0.001 bpb against a standard
      error of 0.0025, giving z = 0.4. What belongs in the table?
    check: choice
    options:
      - text: "A statement that this source's contribution is not distinguishable from zero at this configuration and seed count, together with the smallest contribution the sweep could have resolved."
        correct: true
        explain: "Correct, and the second half is what makes it useful. 'Not distinguishable from zero' with no resolution stated leaves a reader unable to tell whether your instrument was capable of finding a small contribution. Quoting the minimum resolvable effect - 2*sigma*sqrt(2/n), about 0.005 here - converts a non-result into a bounded claim, and a bounded claim is something a rightsholder can respond to."
      - text: "0.001, with a footnote that the number is uncertain. The ordering of the sources is probably right even where the magnitudes are not, and dropping the row loses information."
        misconception: D16
        explain: "The smuggled claim is that ordering survives where magnitude does not, and below the floor ordering is exactly what does not survive - the relative positions of the sub-floor sources are set by noise, so a reseeded sweep permutes them. A footnote does not fix this, because the reader will use the printed order. This is the failure mode that ends a pitch in front of anyone who has run these experiments."
      - text: "0.001, with a note that the sweep will be rerun on a larger model where the measurement is more stable."
        misconception: V4-M4
        explain: "Two errors compounded. Seed noise is not a small-model artifact that anneals with scale - contribution is a random variable at every size and a larger model has its own sigma. And because run cost is linear in parameter count, a larger model buys you proportionally fewer seeds, and seeds are the only thing that shrinks the error bar. Scaling up is the most expensive available way to make this row worse."
      - text: "0.001, since it will be tightened later by the subset-regression runs, which average over hundreds of models and therefore reduce the noise on every number in the table."
        misconception: V4-M2
        explain: "The regression genuinely does have a tighter error bar, 2*sigma/sqrt(M), and that is what makes this attractive. But it is a different estimator of a different quantity - an average marginal effect at the subset density you sampled, not the leave-one-out effect at full density - and no term in sigma*sqrt(2/n) mentions M. Subset runs cannot tighten a leave-one-out number; they can only sit beside it."
    difficulty: warmup

  - id: v4-q5
    concept: d-noise-floor
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Your sweep leaves eight of twelve sources below the noise floor, at
      K = 12, n = 3 seeds per condition, sigma = 0.003 bpb and M = 300
      random-subset runs. Your cofounder proposes keeping the same total
      compute but spending it on 600 subset runs instead of 300, since more
      runs means more averaging and the whole table gets tighter.

      Which assessment is correct?
    check: choice
    difficulty: core
    options:
      - text: |
          It tightens the subset regression - SE_beta = 2*sigma/sqrt(M) falls
          from about 0.00035 to 0.00025 bpb - and does nothing whatever for
          the leave-one-out table, since SE_delta = sigma*sqrt(2/n) contains
          no M. Spend the compute on seeds instead: resolving 0.002 bpb needs
          n >= 8(9e-6)/(4e-6) = 18 seeds per condition, about 135 extra runs
          and under 9 GPU-hours.
        correct: true
        explain: |
          Averaging shrinks the error of the estimator that does the
          averaging. Delta_i reads exactly two condition means, so only n
          moves its error bar; the regression pools across all M runs, so M
          moves its. The remedy for the floor is purchasable, and it is
          seeds.
      - text: |
          It works: 600 runs is twice the averaging of 300, so every number
          in the sweep - the regression coefficients and the leave-one-out
          deltas alike - tightens by sqrt(2), and several of the eight
          sub-floor sources clear z = 2.
        misconception: V4-M2
        explain: |
          Write down SE_delta = sigma*sqrt(2/n) and look for M in it. There
          is none. Delta_i is a difference between two condition means of n
          runs each; train ten thousand subset models and the eight sub-floor
          sources are still sub-floor, to the last digit.
      - text: |
          Neither plan helps, because seed noise is a small-model artifact.
          Train at 300M parameters instead: larger models train more stably,
          their sigma is smaller, and the sub-floor sources resolve without
          extra runs.
        misconception: D16
        explain: |
          Noise is not a defect that scale anneals away - a 300M model has
          its own sigma. And cost is linear in N, so a 30x larger model buys
          30x fewer seeds; since seeds are the only thing that shrinks
          SE_delta, this is the most expensive available way to make the
          problem worse.
      - text: |
          Better: drop the leave-one-out deltas and report the regression
          coefficients c_i in their place. They estimate the same quantity
          with a tighter error bar, so 600 subset runs resolve all eight
          sources directly.
        misconception: V4-M1
        explain: |
          c_i is an average marginal effect at the subset density you
          sampled - mostly half-size coalitions - while Delta_i is the
          marginal effect with all eleven other sources present. They
          coincide only under additivity, which fails exactly where sources
          overlap. Report both; the disagreement is an interaction
          diagnostic, not a swap.

  - id: v4-q6
    concept: d-subset-regression
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Eight models, each trained on a subset of four sources. The design is
      balanced: each source appears in exactly four of the eight runs, and for
      any pair of sources all four in/out combinations appear twice.

        run  A  B  C  D   held-out bpb
         1   0  0  0  1      1.295
         2   1  0  0  0      1.250
         3   0  1  0  0      1.275
         4   1  1  0  1      1.220
         5   0  0  1  0      1.285
         6   1  0  1  1      1.230
         7   0  1  1  1      1.255
         8   1  1  1  0      1.210

      Compute source B's contribution, using the unit's sign convention in
      which a positive contribution means the source helped.

      Answer with the number only, in bits per byte.
    answer: 0.025
    check: numeric(0.001)
    difficulty: core

  - id: v4-q7
    concept: d-subset-regression
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      Six held-out subsets, never used to fit the method under test. Predicted
      and actual held-out bits per byte:

        subset   predicted   actual
          S1       1.040      1.043
          S2       1.052      1.058
          S3       1.061      1.055
          S4       1.068      1.071
          S5       1.075      1.088
          S6       1.090      1.079

      Compute the Linear Datamodeling Score: Spearman's rank correlation
      between the predicted and actual columns, using
      rho = 1 - 6*sum(d^2) / (J*(J^2-1)).

      Answer with rho only, to three decimal places.
    answer: 0.886
    check: numeric(0.005)
    difficulty: core

  - id: v4-q8
    concept: d-subset-regression
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A cheap attribution method - no retraining, seconds per query - scores an
      LDS of 0.90 against your ground truth, measured on 50 held-out subsets
      each containing about half your sources. What does that license?
    check: choice
    options:
      - text: "That the method predicts the aggregate held-out score of half-size subsets it has not seen, on this corpus at this model scale. It does not establish that the method is right about any individual source, nor that it holds for near-full subsets."
        correct: true
        explain: "Correct on all three limits. Many different per-source vectors produce nearly identical subset sums - two sources that co-occur in most of the design can trade value freely without changing a single prediction - so aggregate accuracy does not certify the parts. And an LDS measured at half density is evidence about half density; the leave-one-out regime lives at density one, which the design barely sampled."
      - text: "That the method is a validated substitute for retraining, so the expensive sweep can be retired and the method applied at frontier scale."
        misconception: D6
        explain: "This is the inference the field's own measurements refute. Methods that scale have been checked against retraining ground truth on a 2B model and came out no better than random guessing, while the one method that does correlate costs several full training runs per query. An LDS of 0.90 at 10M parameters is evidence about 10M-parameter models; carrying it to frontier scale is the assumption that has repeatedly failed when anyone bothered to test it."
      - text: "That the method's per-source numbers can be used directly as payout shares, since they reproduce the ground truth's predictions to within a rank correlation of 0.9."
        misconception: V4-M1
        explain: "Two separate errors. Rank correlation on subset outcomes says nothing about the magnitudes, and payout needs magnitudes. More fundamentally, going from per-source numbers to shares requires them to sum to the total, which requires additivity - and additivity fails precisely for overlapping sources, where individual deltas can sum to a fifth of the joint effect. LDS certifies prediction; it does not certify a division."
      - text: "That the method has been validated as an attribution method, so its ranking can be published as the contribution ordering for this corpus at any scale."
        misconception: V4-M4
        explain: "The scale clause is the problem. Influence is known to change character with scale - crisp and top-heavy on small models, a long tail at frontier scale, and more abstract as models grow. A ranking validated at one configuration is a fact about that configuration. It is a scope statement, not a defect, and stating it is what distinguishes this table from the ones it competes with."
    difficulty: warmup

  - id: v4-q9
    concept: d-counterfactual
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Two sources in your corpus, A and B, substantially overlap - much of A's
      material also appears in B. Your sweep returns Delta_A = 0.002 and
      Delta_B = 0.002, both below the noise floor. Out of curiosity you run one
      more condition with BOTH removed, and get a joint effect of 0.020, far
      above the floor.

      Which statement accounts for the pattern, gives the right verdict on a
      payout table built by dividing each Delta_i by the sum of all deltas, and
      names a check available from runs you have already performed?
    options:
      - text: >-
          Each source is individually redundant and jointly essential: Delta_i is
          a marginal contribution at FULL corpus density, where the partner still
          covers the shared material, so the two deltas sum to 0.004 against a
          joint effect of 0.020. A proportional-to-delta table pays the pair a
          fifth of what their material was worth, and possibly nothing at all
          since both sit below the floor. The warning is free: fit the subset
          regression on runs already trained and compare each c_i against
          Delta_i, since the two disagree sharply for a redundant pair.
        correct: true
        explain: >-
          Right. The leave-one-out delta answers "what if this source alone is
          missing", so redundancy suppresses it while the joint effect exposes
          it. Marginal contributions do not sum to the total, which is why a
          proportional split is a choice needing a defence (v5's axioms) rather
          than a definition, and why Delta_i - c_i is a readout of interaction at
          zero extra training cost.
      - text: >-
          The joint number cannot be right: per-source contributions add up, so
          0.002 + 0.002 must equal the joint effect. Treat 0.020 as a measurement
          error, rerun the joint condition with more seeds until it reconciles
          with 0.004, and keep the proportional table as it stands.
        misconception: V4-M1
        explain: >-
          The pie-chart instinct - slices must sum to the pie - is exactly the
          assumption the experiment refutes. Marginal contributions sum to the
          total only when sources do not interact, and two overlapping sources
          are the most common case in which they do. No quantity of seeds will
          reconcile 0.004 with 0.020, because the gap is structural rather than
          noise.
      - text: >-
          Both deltas are below the noise floor, so this is a precision problem
          rather than a structural one: spend the budget on a few hundred
          random-subset runs, which average across many more models than three
          seeds can, and the deltas will resolve to roughly 0.010 each and sum to
          the joint 0.020.
        misconception: V4-M2
        explain: >-
          Averaging shrinks the error of the estimator doing the averaging.
          SE_delta = sigma*sqrt(2/n) contains no M, so subset runs leave the
          leave-one-out error bar untouched to the last digit. And the two
          estimators do not target the same quantity: c_i is an average marginal
          effect at the sampled subset density, Delta_i is the effect at full
          density, so making them agree is not something more runs can force.
      - text: >-
          Two sources carrying the same material means one of them is dead weight
          in the corpus. Drop the redundant one; the survivor's delta then rises
          to about 0.020, the table sums correctly, and the payout goes to the
          source that actually taught the model.
        misconception: V4-M3
        explain: >-
          A small or negative delta under redundancy is a statement about the
          marginal token in this corpus, not a quality verdict on the source -
          which is visible in the fact that the sign and size flip depending on
          which OTHER source is present. Dropping one source does not measure
          anything; it decides, silently, which rightsholder receives the value of
          material both supplied. That is a credit-assignment question, and v5
          answers it with coalitions rather than deletion.
    check: choice
    difficulty: stretch

  - id: v4-q10
    concept: d-counterfactual
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Your pipeline's deduplication stage found a cluster of near-identical
      passages appearing in both source 4 and source 9, recorded the cluster and
      its source membership in the manifest, and kept source 4's copies.

      Your finished table reads Delta_4 = 0.028 and Delta_9 = -0.006, both
      clearing the noise floor.

      Which statement gives the correct causal path from the dedup decision to
      those two numbers, and the correct consequence for shipping the table?
    options:
      - text: >-
          Dedup decided which source's tokens the model would actually see for
          the shared passages, so source 4 absorbed the whole value of that
          material while source 9 was left with unique tokens that, at a fixed
          token budget, displaced more useful ones. Had the pipeline kept source
          9's copies the two deltas would largely swap with nothing about the
          corpus, sources, model, eval set or protocol having changed - so the
          dedup policy and the cluster record must ship alongside the table.
        correct: true
        explain: >-
          Right. The pipeline already records the clusters, so this is a
          reporting obligation rather than new work, and it is what keeps Delta_4
          readable as "source 4's contribution UNDER this dedup policy" instead
          of as a measured property of the source.
      - text: >-
          Delta_9 = -0.006 clears the floor with a negative sign, which is the
          table telling you source 9 is low-quality or corrupted content. Inspect
          it, drop it from the corpus, and report the remaining eleven sources.
        misconception: V4-M3
        explain: >-
          Source 9 here is a clean journal mirror; reading a hundred of its
          documents will find nothing wrong. The negative sign was manufactured
          by a pipeline decision - flip which copies dedup kept and the sign
          flips with it - and a property of the data cannot depend on which other
          source is present.
      - text: >-
          Deduplication only removes redundant copies of text the corpus already
          contains, so it cannot move value between sources. The two deltas
          measure the sources' own content, and keeping source 9's copies instead
          would have produced the same table.
        misconception: D9
        explain: >-
          This is the hygiene reading of dedup, and it is what makes the decision
          invisible. Keeping one copy of a shared passage assigns credit for
          everything that passage teaches to whichever source survived; at web
          scale that choice is made silently millions of times, and in a royalty
          system it moves money.
      - text: >-
          Delta_4 + Delta_9 = 0.022 is the pair's joint contribution, so the
          shared material is correctly accounted for in aggregate. How the dedup
          stage split it between the two rows is an internal accounting detail
          that does not need to ship with the table.
        misconception: V4-M1
        explain: >-
          Two errors at once. Leave-one-out deltas do not sum to a joint effect
          whenever sources interact, so 0.022 is not the pair's joint
          contribution; and the split between the rows is precisely what a
          rightsholder is paid on, so calling it an internal detail is calling
          the invoice an internal detail.
    check: choice
    difficulty: core

  - id: v4-q11
    concept: d-counterfactual
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A source in your table has Delta = -0.007 bpb with a standard error of
      0.0025, so |z| = 2.8. The sweep used the fixed-token-budget protocol.
      What is the correct reading?
    check: choice
    options:
      - text: "At this budget, on this evaluation, this source's tokens were worth less than the tokens that replaced them. The leading candidates are redundancy with another source and content that is off-distribution for the held-out set, and the duplicate-cluster record distinguishes them."
        correct: true
        explain: "Correct, and note what makes the sign informative rather than alarming: under a fixed token budget, including a source displaces other tokens, so a negative delta is a statement about the marginal token rather than about the source's quality. The diagnostic is cheap - check whether the source shares a duplicate cluster with a large neighbour, and check whether its subject matter appears in the held-out set at all."
      - text: "The source contains low-quality or corrupted data and should be inspected and probably dropped from the corpus."
        misconception: V4-M3
        explain: "The sign reads as a verdict and it is not one. Test the belief directly: remove the source's duplicate partner as well and re-measure, and the sign can flip positive. A property of the data cannot depend on which other source is present, so the negative sign was never a property of the data. Quality filtering is genuinely the highest-leverage knob in a pipeline, which is exactly what makes this misreading attractive."
      - text: "The measurement has a sign error, since removing training data cannot make a model better."
        misconception: D8
        explain: "This is the more-data-always-helps prior, and it is false in a way that is well established: a quality-filtered corpus beats its own much larger superset on knowledge benchmarks. At a fixed compute budget, tokens compete, so adding data that is redundant or off-distribution genuinely costs you. Negative contributions are ordinary and any table that cannot express them is hiding something."
      - text: "The magnitude is small enough that it is probably noise, and the row should be reported as below the noise floor."
        misconception: D16
        explain: "The right instinct applied without the arithmetic. |z| = 2.8 clears the z >= 2 bar, so this row is one of the resolved ones. The noise floor is not a magnitude threshold you eyeball - it is Delta compared against sigma*sqrt(2/n), and 0.007 against 0.0025 is a result. Judging significance by whether a number looks small is how real effects get discarded and large noise gets kept."
    difficulty: core

  - id: v4-q12
    concept: d-subset-regression
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      An investor asks why you are training ten-million-parameter models when the
      interesting models have three orders of magnitude more parameters, and
      points out that influence functions have been run at 52 billion parameters
      by a frontier lab.

      Which reply is both the strongest and the most honest?
    options:
      - text: >-
          The 52B result shows the method RUNS at that size, which is not the
          same as being correct: measured against actual retraining on a
          2B-parameter model, the methods that scale came out no better than
          random, while the near-optimal method reached rho = 0.97 and cost three
          to five training runs per query. Small scale is the only regime where
          that check is affordable, so the sweep is the calibration standard, not
          a prototype - and the resulting table is exact for 10M parameters and a
          hypothesis about anything larger, testable by repeating one scale up.
        correct: true
        explain: >-
          Right, and the concession is what makes the rest credible. It states
          the central dilemma (what scales does not demonstrably correlate, what
          correlates does not scale), quotes the measurement rather than
          asserting a preference for small models, and attaches a price to the
          open question instead of leaving it as opinion.
      - text: >-
          Concede the point: the 52B work shows gradient attribution is
          essentially solved and taking it to frontier scale is engineering. The
          small runs are a prototype whose methods get applied unchanged once
          there is budget for real hardware.
        misconception: D6
        explain: >-
          This is the headline reading of the scaling demonstrations. The
          measurements published by the same community say otherwise: scalable
          methods at chance against retraining ground truth, and a single
          corrected assumption (SGD where the models trained with AdamW) moving
          published results by 10 to 300%. Numbers that move by 300% when one
          line is fixed were not measuring what their authors thought.
      - text: >-
          Answer that ground truth is ground truth: the 10M table was computed by
          doing the experiment rather than estimated, so it is the true
          contribution, full stop. Its ranking of sources therefore transfers to
          any model trained on this corpus, and no scale caveat is needed.
        misconception: V4-M4
        explain: >-
          The counterfactual is exact for the configuration that produced it -
          this architecture, parameter count, token budget, protocol, held-out
          set and source list - and nothing more. Influence is crisp and top-heavy
          at small scale and a long tail at frontier scale, and it becomes more
          abstract as models grow, so rankings can genuinely reorder between the
          two. Dropping the scope statement is what loses the room to the first
          person who has read the literature.
      - text: >-
          Explain that the frontier methods only look bad because they are noisy,
          and that attribution noise is a temporary methods problem: average more
          seeds at 52B and the scalable methods will come into agreement with
          retraining, so small-scale work is a stopgap until the estimators
          improve.
        misconception: D20
        explain: >-
          Two problems. The scalable methods scored at chance against ground
          truth, which is a correlation failure and not a variance one, and there
          is no seed budget at 52B in any case. More broadly, whether
          contribution-proportional payment beats a flat fee is decided by
          measured signal-to-noise on your corpus at your scale - a better
          estimator does not move the threshold, only more signal does, which is
          why measuring your own floor IS the result.
    check: choice
    difficulty: stretch

  - id: v4-q13
    concept: d-counterfactual
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Budget a complete ground-truth sweep on one rented H100 sustaining
      4e14 FLOP/s.

      Corpus: K = 15 sources. Design: n = 3 seeds on each of the K + 1
