# v5 fair-split: pretest + terminal check bank.
# Solo fade items: v5-q3 (v5-shapley-by-hand), v5-q9 (v5-shell-recompute).
# Each is the third appearance of a procedure that was worked in canon prose
# and drilled as a completion beat.
#
# Running table used across several items (thousandths of a bit per byte of
# held-out text, relative to a model trained on none of the sources):
#   none 0; A 50; B 50; C 20; A+B 70; A+C 90; B+C 90; A+B+C 100
#   Shapley 35 / 35 / 30. Banzhaf 37.5 / 37.5 / 32.5 (sums to 107.5).
#   Leave-one-out 10 / 10 / 30 (sums to 50).

pretest:
  - id: v5-p1
    concept: d-coop-game
    kind: mcq
    prompt: |
      Three data sources were licensed together for $100. Somebody trained a
      model on every combination and measured how much better each one got at
      predicting a fixed held-out set. Bigger is better; the units do not
      matter.

        none 0 | A 50 | B 50 | C 20
        A+B 70 | A+C 90 | B+C 90 | A+B+C 100

      Which split of the $100 among A, B and C is defensible, and by which rule?
    options:
      - text: "$41.67, $41.67, $16.66 - in proportion to what each source is worth alone (50, 50, 20)."
        misconception: D9
        explain: "A and B share 30 units of content, so this bills A for all 30 and bills B for the same 30 again: the solo values sum to 120 against a corpus worth 100, and the rule hides the double-count by scaling everything down by 100/120. C, which overlaps nobody and unlocks 40 units in company, is cut to $16.66 for being small."
      - text: "$20, $20, $60 - in proportion to what is lost when each source is removed (10, 10, 30), renormalized."
        misconception: V5-M4
        explain: "This is the most common answer from anyone who has computed counterfactuals. Leave-one-out values are 10, 10 and 30, summing to 50 against a pool of 100, and the renormalization that patches the shortfall doubles C's measured 30 into a paid 60 for reasons found nowhere in the data. Leave-one-out measures replaceability, not share."
      - text: "$33.33, $33.33, $33.34 - an equal split, since all three were licensed together."
        misconception: D9
        explain: "This is not a function of the table at all. Add a fourth source of press-release boilerplate that changes no coalition's value and equal split hands it $25; the measurements did no work."
      - text: "$35, $35, $30 - averaging each source's marginal contribution over every order in which the sources could have arrived."
        correct: true
        explain: "Over the six arrival orders A averages 35, B averages 35 and C averages 30. This is the only rule satisfying efficiency, symmetry, the null player condition and additivity, and the three shares sum to 100 by construction."
    check: choice
    answer: "$35, $35, $30 - averaging each source's marginal contribution over every order in which the sources could have arrived."

  - id: v5-p2
    concept: d-shapley-axioms
    kind: mcq
    prompt: |
      Two rightsholders, P and Q, license byte-identical corpora - the same
      catalogue through two channels. Training on either alone reaches the same
      held-out score; training on both reaches that same score again:

        none 0 | P alone 100 | Q alone 100 | P and Q 100

      Using leave-one-out - retrain without a source and see what is lost -
      what is each one's measured contribution, and is that a defensible basis
      for splitting a payment between them?
    options:
      - text: "Each is 0, and that is correct: neither source is necessary, so neither has demonstrated a claim on the pool."
        misconception: V5-M4
        explain: "The arithmetic is right and the conclusion is the confusion the item exists to catch. Two sources that between them carry the entire corpus cannot both be owed nothing; leave-one-out is measuring replaceability, and in a redundant corpus everyone is replaceable while the corpus is not."
      - text: "Each is 0, and it is not a basis for an allocation: the two values sum to 0 against a nonzero pool, so the renormalization that patches a shortfall divides by zero and the rule stops being defined."
        correct: true
        explain: "Removing P leaves the model unchanged because Q supplies the same text, and symmetrically, so both counterfactuals are exactly zero. The rule does not give a severe answer here - it gives none, which is the sharpest possible demonstration that leave-one-out is not an allocation rule."
      - text: "Each is 100, since either one alone is sufficient to reach the full score, so the pool is split evenly."
        misconception: V5-M4
        explain: "That is the solo value v({P}) = 100, not the leave-one-out value. Leave-one-out is v(PQ) - v(Q) = 100 - 100 = 0. Reading a source's contribution off what it achieves alone ignores the company it is measured in, which is the whole reason the coalition table has eight rows rather than three."
      - text: "Each is 50, because the measured 100 is split between the two identical sources."
        misconception: D9
        explain: "The final answer of an equal split is defensible here by symmetry, but this is not what leave-one-out computes - it computes 0 for each. Reaching the right allocation by dividing the total sidesteps the mechanism, and the mechanism is what fails on this table."
    check: choice
    answer: "Each is 0, and it is not a basis for an allocation: the two values sum to 0 against a nonzero pool, so the renormalization that patches a shortfall divides by zero and the rule stops being defined."

  - id: v5-p3
    concept: d-semivalue-family
    kind: mcq
    prompt: |
      You want an exact fair split across 12 data sources, computed by
      averaging each source's marginal contribution over every possible order
      in which the 12 could have arrived.

      How many models do you have to train, and what determines that count?
    options:
      - text: "479,001,600 - one per arrival order, since the rule is an average over all 12! permutations."
        misconception: V5-M1
        explain: "The permutation form is the one that makes the rule comprehensible, so it is the one everybody carries, and it has n! written into it. But the orders 'B, C, A' and 'C, B, A' hand A the identical quantity v(ABC) - v(BC), because A walks into a room containing exactly {B,C} both times. Orders share coalitions."
      - text: "Effectively unbounded - this is the exponential blow-up the data valuation literature already showed to be infeasible, so no exact computation is available."
        misconception: D7
        explain: "The infeasibility result is real at per-document granularity, where n is in the millions. It is being imported into a source-level setting where n is 12: a royalty system pays a publisher, a catalogue or a feed, and there is no cheque made out to a document."
      - text: "4,096 - that is 2^12, one per distinct combination of sources, because a source's marginal contribution depends only on WHICH sources preceded it, not the order they arrived in."
        correct: true
        explain: "Every term in the formula is a difference of two entries in a table with 2^n rows. Train each coalition once, cache the number, and all 479 million orders are answered by lookup. At about a minute per run for a 20M-parameter model on 200M tokens, that is roughly 68 GPU-hours - a few hundred dollars as of mid-2026."
      - text: "12 - one run per source, each trained on everything except that source, since the marginal contribution is what is lost by removing it."
        misconception: V5-M4
        explain: "That is the leave-one-out sweep, and it answers a different question: it gives replaceability, not the average marginal contribution over arrival orders. Its outputs also do not sum to the pool, which is why it cannot be the allocation."
    check: choice
    answer: "4,096 - that is 2^12, one per distinct combination of sources, because a source's marginal contribution depends only on WHICH sources preceded it, not the order they arrived in."

check:
  - id: v5-q1
    concept: d-coop-game
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A colleague proposes paying each data source in proportion to its
      leave-one-out contribution - retrain without that source, measure how much
      worse the model gets, and divide the pool in those proportions. On the
      running table (none 0; A 50; B 50; C 20; A+B 70; A+C 90; B+C 90;
      A+B+C 100) those values are 10, 10 and 30.

      Which statement correctly identifies how this fails as an allocation rule,
      and what leave-one-out remains good for?
    options:
      - text: "It fails only on scale: 10, 10 and 30 sum to 50 against a pool of 100, and renormalizing by 100/50 fixes it, so the rule is sound once the shares are scaled to the pool."
        misconception: V5-M4
        explain: "Renormalization is a second, unstated rule doing undisclosed work: it turns C's measured 30 into a paid 60, changing one party's money for a reason found nowhere in the measurements. And it does not survive the substitutes case, where the sum is 0 and the scaling divides by zero."
      - text: "It fails because leave-one-out is only an estimate of the true counterfactual, so with enough seeds and a better estimator the values would sum to the pool."
        misconception: D20
        explain: "Noise is not the defect here. The shortfall is structural and survives perfect measurement: content that two sources both supply is credited to neither, so the sum falls short of the whole in any corpus with redundancy, however precisely each retraining is measured."
      - text: "It fails twice - the values do not sum to the pool (10 + 10 + 30 = 50 against 100, since shared content is credited to neither supplier), and perfect substitutes each score 0 so the renormalization divides by zero - while leave-one-out remains valid as a renewal-decision counterfactual and as the ground truth cheaper methods are scored against."
        correct: true
        explain: "Both failures are about allocation, not measurement. The shortfall is guaranteed whenever any content is supplied by more than one source, and two sources holding byte-identical corpora each have leave-one-out 0 while jointly carrying everything. It still answers 'what happens to this model if this source disappears', which is what a licensee needs at renewal and what v8 ranks the gradient methods against."
      - text: "It fails because leave-one-out is not a legible fairness argument a counterparty can audit, so it should be replaced by an equal split, which anyone can verify."
        misconception: D9
        explain: "Legibility is not the problem - leave-one-out is perfectly legible - and an equal split is worse, since it is not a function of the measurements at all and pays a source of pure boilerplate a full share."
    check: choice
    answer: "It fails twice - the values do not sum to the pool (10 + 10 + 30 = 50 against 100, since shared content is credited to neither supplier), and perfect substitutes each score 0 so the renormalization divides by zero - while leave-one-out remains valid as a renewal-decision counterfactual and as the ground truth cheaper methods are scored against."
    difficulty: core

  - id: v5-q2
    concept: d-coop-game
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A split satisfies the efficiency axiom. What does that guarantee?
    check: choice
    options:
      - text: "That the shares sum to exactly the value of the full corpus - nothing more. It is an accounting constraint with no fairness content."
        correct: true
        explain: "Correct, and the 'nothing more' is the load-bearing half. Efficiency does real work - it is what makes the output an allocation rather than a set of scores, which is something no gradient attribution method produces - but a split handing the entire pool to one source satisfies it exactly. The fairness comes from symmetry, the null player condition, and additivity."
      - text: "That no source is over-paid or under-paid relative to what it contributed."
        misconception: V5-M2
        explain: "The word is doing this. In ordinary use an efficient allocation is a well-distributed one, and 'efficiency' at the head of a list of fairness axioms reads like the axiom that delivers fairness. Test it: 100 to A, 0 to B, 0 to C sums to the pool and satisfies efficiency in full. The requirement has no opinion about it."
      - text: "That each source receives what would be lost if it were removed from the corpus."
        misconception: V5-M4
        explain: "This is the leave-one-out rule, and it is not efficient - it is the standard example of a rule that violates efficiency, since its values sum to less than the pool in any corpus with redundancy. Confusing the two conflates a measurement with an accounting property."
      - text: "That the computation avoids the factorial blow-up in the number of arrival orders."
        misconception: V5-M1
        explain: "This reads 'efficiency' as computational efficiency. The axiom is about arithmetic on the output, not about the cost of producing it. The cost question has a separate and better answer: you train 2^n coalitions and cache them, so the n! orders never cost anything at all."
    difficulty: warmup

  - id: v5-q3
    concept: d-shapley-axioms
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A three-source corpus with this value table:

        none 0 | A 30 | B 40 | C 25
        A+B 52 | A+C 43 | B+C 55 | A+B+C 61

      Compute the Shapley value of each source. Average each source's marginal
      contribution over all six arrival orders, or equivalently weight its four
      coalition-form terms by 1/3, 1/6, 1/6, 1/3.

      Answer with three integers, comma-separated, in the order A, B, C.
      Example format: `10,20,30`
    answer: "17,28,16"
    check: exact
    difficulty: core

  - id: v5-q4
    concept: d-shapley-axioms
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      You are drafting the schedule to a licensing agreement and must state the
      four requirements the split will satisfy, each paired with the specific
      thing that becomes possible if it is dropped.

      Which set of four is correct, with correct consequences?
    options:
      - text: "Efficiency (the shares sum to v(N); dropped, money is left unassigned and a second unstated rule finishes the job); symmetry (interchangeable sources are paid equally; dropped, the split pays for catalogue size or the name on the letterhead); null player (a source changing no coalition's value gets nothing; dropped, a source collects on half a million words of generated boilerplate); additivity (two evaluations split separately equal the same split combined; dropped, the accounting period becomes a negotiating lever)."
        correct: true
        explain: "These four admit exactly one rule, which is why they belong in a schedule: a counterparty who wants a different number has to name which of the four they are giving up. Symmetry is also what makes the split auditable from the value table alone, without access to the model or the code."
      - text: "Efficiency (the split is fair because nothing is wasted); symmetry; null player; additivity - with efficiency carrying the fairness guarantee and the other three as accounting details."
        misconception: V5-M2
        explain: "The word 'efficient' is doing work it does not have. Allocate the whole pool to A and nothing to B or C: the shares sum to v(N), efficiency is satisfied exactly, and the split is indefensible. Efficiency is the accounting constraint; every fairness claim comes from the other three."
      - text: "Efficiency; symmetry; additivity; and split-invariance (a group's total does not change when it registers as several entities) - the four that define a fair split, with the null player condition following from symmetry."
        misconception: V5-M3
        explain: "Split-invariance is exactly the fifth requirement the four do not contain - it is what the shell company attack exploits, and adding it means computing a different value than the one the four force. And the null player condition does not follow from symmetry: symmetry compares two sources to each other, so a rule paying every source an equal share of a padded pool satisfies it while paying the padding."
      - text: "Efficiency; symmetry; null player; and monotonicity (adding a source never lowers the total value) - dropping the last would allow a source's share to come out negative."
        misconception: V5-M3
        explain: "Monotonicity is deliberately not assumed: a source of machine-translated sludge can make a model worse, the arithmetic handles it unmodified, and the resulting negative share is a real finding about that source. Dropping monotonicity costs nothing, whereas dropping additivity makes the settlement calendar a negotiating lever."
    check: choice
    answer: "Efficiency (the shares sum to v(N); dropped, money is left unassigned and a second unstated rule finishes the job); symmetry (interchangeable sources are paid equally; dropped, the split pays for catalogue size or the name on the letterhead); null player (a source changing no coalition's value gets nothing; dropped, a source collects on half a million words of generated boilerplate); additivity (two evaluations split separately equal the same split combined; dropped, the accounting period becomes a negotiating lever)."
    difficulty: core

  - id: v5-q5
    concept: d-shapley-axioms
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A counterparty's counsel asks why the agreement adopts these four
      properties and not some other set. What is the correct answer?
    check: choice
    options:
      - text: "They are a choice this contract makes. Their merit is that they are legible enough to read, agree to, and be bound by - and alternatives exist that drop one (Banzhaf drops efficiency for noise robustness) or add one (fragmentation-invariance, to defeat shell entities)."
        correct: true
        explain: "Correct, and it is a stronger negotiating position than the alternative. Presenting the four as terms the parties adopt invites the counterparty into the design; presenting them as fact invites the first person who asks 'why not guaranteed minimums' to take the room."
      - text: "They are the mathematical definition of fairness, so any scheme producing a different number is incorrect."
        misconception: V5-M3
        explain: "Attractive because the uniqueness theorem is real and strong - four sentences forcing one function feels like discovery. But serious alternatives drop and add axioms on purpose: the Banzhaf value trades efficiency for robustness to training noise, and the fix for the shell-company attack requires a fifth requirement the four do not contain and cannot accommodate without weakening one of them."
      - text: "Because efficiency guarantees nobody is shortchanged, and the other three are technical refinements on top of it."
        misconception: V5-M2
        explain: "Efficiency guarantees only that the pool is fully distributed. A split of 100/0/0 satisfies it. Every fairness claim in the set comes from the other three, so this answer inverts which axiom is doing the work - and it will fall apart the moment counsel constructs exactly that 100/0/0 counterexample, which takes them about ten seconds."
      - text: "Because these are the four that remain tractable at source granularity; at document granularity a different and weaker set has to be used."
        misconception: D7
        explain: "The axioms have nothing to do with granularity - they are properties of an allocation over whatever the players are, and they hold identically for 12 sources or a million documents. What changes with granularity is the COST of computing the rule, which is 2^n and collapses when the players are sources. Conflating the fairness argument with the feasibility argument gives away the strongest part of the position."
    difficulty: core

  - id: v5-q6
    concept: d-semivalue-family
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      You have 16 tagged sources. You plan an exact enumeration - every
      coalition trained, three seeds each, averaged before any allocation
      arithmetic. One training run takes 45 seconds on one H100.

      How many GPU-hours is the sweep? Give one number to one decimal place.
    answer: 2457.6
    check: numeric(1.0)
    difficulty: core

  - id: v5-q7
    concept: d-semivalue-family
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A reviewer writes: "This method averages over n! permutations. At 12
      sources that is 479 million evaluations. The approach is infeasible and
      the paper should say so."

      Which reply is correct - giving the count actually incurred, the reason
      the permutation count is not a cost, and the standing of the reviewer's
      objection?
    options:
      - text: "Concede the count but note that sampling arrival orders rescues it: a few hundred sampled permutations give an unbiased estimate within 5 units at 95% confidence, so the exact 479 million is never incurred."
        misconception: V5-M1
        explain: "This accepts the reviewer's premise that permutations are what cost. Sampling at 12 sources trades an exact answer for an approximate one at no saving worth having, and hands a critic an approximation to attack that need not exist - the exact sweep is 4,096 runs and under $273."
      - text: "2^12 = 4,096 trained models, because a marginal contribution depends only on WHICH sources precede a source - 'B, C, A' and 'C, B, A' both give A the quantity v(ABC) - v(BC) - so coalitions are cached and every order is a lookup, about 68 GPU-hours; and the reviewer's objection is correct at per-DOCUMENT granularity, where n is in the millions, but does not apply because the attribution unit is chosen to match the payment unit and no cheque is made out to a document."
        correct: true
        explain: "Every term in the formula is a difference of two entries in a table with 2^n rows. Group-level valuation with groups as players has been in the literature since the original 2019 paper. The real cliff is the doubling in 2^n - a weekend at 12 sources, a week at 15, a research grant at 20."
      - text: "2^12 = 4,096 trained models, because coalitions are cached and reused across orders; and the reviewer's objection is simply mistaken, since the exponential-infeasibility results in the data valuation literature rest on the same permutation confusion."
        misconception: D7
        explain: "The first half is right and the dismissal is wrong. The per-document infeasibility critique is correct where it was made - at n in the millions, 2^n is beyond any caching or sampling scheme - and granting it is precisely what makes the source-level argument credible to someone who knows the literature."
      - text: "12 trained models: run leave-one-out on each source and normalize the results to the pool, which reproduces the same allocation without touching permutations or coalitions."
        misconception: V5-M4
        explain: "Leave-one-out does not reproduce the allocation - its values sum to 50 against a pool of 100 on the running table, and to 0 for perfect substitutes. Replacing the coalition sweep with n runs replaces the answer, not the method of computing it."
    check: choice
    answer: "2^12 = 4,096 trained models, because a marginal contribution depends only on WHICH sources precede a source - 'B, C, A' and 'C, B, A' both give A the quantity v(ABC) - v(BC) - so coalitions are cached and every order is a lookup, about 68 GPU-hours; and the reviewer's objection is correct at per-DOCUMENT granularity, where n is in the millions, but does not apply because the attribution unit is chosen to match the payment unit and no cheque is made out to a document."
    difficulty: core

  - id: v5-q8
    concept: d-semivalue-family
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      At 30 sources you switch from exact Shapley to Banzhaf values estimated
      by maximum sample reuse. The 30 shares sum to 1.08 times the pool. What
      is going on?
    check: choice
    options:
      - text: "Expected. Banzhaf weights every coalition equally rather than weighting cardinality classes equally, and constant weights do not make marginal contributions telescope. It is not efficient. Renormalize, and disclose in the schedule that you did."
        correct: true
        explain: "Correct. Efficiency is the one axiom Banzhaf gives up, deliberately, in exchange for equal weights that provably maximize robustness to training noise - no single unlucky run on an extreme coalition can dominate a share the way it can under Shapley's uneven weights. The gap is the defining trade, not an error."
      - text: "A bug. Any correct valuation sums to the pool by construction, so the estimator or the caching has an indexing error."
        misconception: V5-M2
        explain: "This treats efficiency as a property valuations have rather than as an axiom one particular rule satisfies. Efficiency holds identically for the Shapley value and fails by design for Banzhaf, so the sum check that correctly catches indexing bugs in an exact Shapley computation is not applicable here. Check the sum against a small exact case instead."
      - text: "Approximation error. Banzhaf is an approximation of the Shapley value, and 8% is the sampling error; more samples will drive the sum to the pool."
        misconception: V5-M3
        explain: "Banzhaf is a different rule, not an approximation of Shapley - they are two members of the semivalue family with different weight profiles. Its efficiency gap does not shrink with any sampling budget, because it is a property of the exact Banzhaf value. Sampling error affects each share; it does not cause the gap."
      - text: "Accumulated seed noise. Thousands of noisy coalition values summed with positive weights biased the total upward by 8%."
        misconception: D16
        explain: "Seed noise is real and this is not it. Seed noise is zero-mean, so it inflates the variance of each share without biasing the sum in a consistent direction, and it would not produce a stable 8% surplus that persists across reruns. Diagnosing an axiom violation as noise is how a real property of the estimator gets hidden inside an error bar."
    difficulty: warmup

  - id: v5-q9
    concept: d-split-gaming
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A two-source corpus:

        none 0 | P 60 | Q 40 | P+Q 80

      Honestly split, P receives 50 and Q receives 30.

      P now registers as two subsidiaries P1 and P2, both licensing the
      identical catalogue. The value table for the three-player game is read
      off the two-player one, since duplicate shells add no content: any
      coalition containing at least one shell has the value it had with P in
      it.

      Compute P's total take across both shells. Weight each shell's four
      coalition-form terms by 1/3, 1/6, 1/6, 1/3.

      Give one number to two decimal places.
    answer: 53.33
    check: numeric(0.05)
    difficulty: core

  - id: v5-q10
    concept: d-split-gaming
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A rightsholder inflates its payout by registering as several entities
      licensing the identical catalogue, and every share is computed correctly
      throughout. Which statement correctly accounts for why the four
      requirements do not stop this, and for who pays?
    options:
      - text: "Efficiency, symmetry, the null player condition and additivity are all statements about one game with one fixed player set, so registering shells replaces the game rather than violating a requirement; the fix is to fingerprint registrants and merge any pair above an overlap threshold into one player, and the attacker's gain is a transfer out of its closest substitutes, the sources whose content most overlaps its own."
        correct: true
        explain: "Right on both halves. The silence is structural - no requirement relates $\\phi_i$ in one game to $\\phi_i$ in a game on a different player set, so the rule is being applied correctly to a different room. And because efficiency holds throughout, the pool is fixed: A's rise from 35.00 to 41.67 came almost entirely out of B, its substitute, while the complementary source C moved only 30.00 to 30.83."
      - text: "Symmetry is what fails: the shells are interchangeable with each other, so the requirement forces them equal shares, and enforcing symmetry properly - by refusing to pay two sources that are symmetric - removes the incentive."
        misconception: V5-M3
        explain: "Symmetry is satisfied, not violated. The shells do receive equal shares, and that equality is exactly the mechanism of the attack rather than a breach of it. Treating the four as a complete defence is the error: the fix has to come from a fifth requirement or from an identity layer outside the mathematics."
      - text: "Efficiency fails, because the shells' shares no longer sum to $v(N)$; restoring efficiency by renormalizing the four shares back onto the pool returns the honest split."
        misconception: V5-M2
        explain: "Efficiency held perfectly through the attack - the four shares still sum to 100.00, which is the whole reason the attacker's raise had to come out of someone's pocket. Efficiency is an accounting constraint with no fairness content, so it cannot be the requirement that catches a fairness attack."
      - text: "Nothing is wrong: the shells are separate registered sources with genuine leave-one-out values of zero each, so the requirements are handing them the correct amount and the split needs no defence."
        misconception: V5-M4
        explain: "Leave-one-out is zero for each shell - a duplicate is fully replaceable - but leave-one-out is a replaceability measure, not an allocation, and the Shapley shares are 20.833 apiece, not zero. Reading the zero counterfactual as the correct payment is exactly the confusion the two-identical-sources table was built to break."
      - text: "The defence is to audit corporate ownership records and reject registrants under common control, which is what the fifth requirement in Faithful Group Shapley formalizes."
        misconception: V5-M3
        explain: "Ownership auditing is a real control but it fails against a determined counterparty and across jurisdictions, and it is not what the fifth requirement says - that requirement is invariance of a group's total to how the group is partitioned, and it is bought by weakening one of the original four. Content fingerprinting tests the thing that actually moves money and works on data you already hold."
    check: choice
    difficulty: stretch

  - id: v5-q11
    concept: d-semivalue-family
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Your per-run seed noise is $\sigma_{\text{run}} = 5$ units of held-out bits
      per byte (thousandths). You average $k = 4$ seeds per coalition, so
      $\sigma = \sigma_{\text{run}}/\sqrt{k}$. In a three-source game a share has
      standard deviation $0.745\,\sigma$, and a single leave-one-out difference
      from the same table has $1.414\,\sigma$.

      Give the standard deviation of one share, in units, to two decimal places.
    answer: "1.86"
    check: numeric(0.02)
    difficulty: core

  - id: v5-q12
    concept: d-split-gaming
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Your completed sweep gives a spread of shares across sources of 2.6 units
      and a per-share standard deviation of 2.0 units, so the measured
      signal-to-noise ratio is 1.3 against a customary bar of 2. What is the
      right next move?
    check: choice
    options:
      - text: "Report the measured ratio, state that at this corpus and scale the welfare-optimal contract is a flat fee, and price the seed count that would reach 2. Either side of the threshold is a publishable result."
        correct: true
        explain: "Correct. The threshold result says that below a signal-to-noise bar the optimal contract collapses to a flat fee, and that no estimator improvement crosses it - only more signal does. Leading with the measured ratio pre-empts the first question an informed counterparty asks, and quoting the seed count and its GPU-hour cost converts a negative result into a priced decision."
      - text: "Switch to a better attribution estimator; the noise is a methods problem and the field is improving quickly."
        misconception: D20
        explain: "This is the pitch-fatal one. The threshold is about how much signal exists in the measurement, not about how cleverly it is processed, so no estimator crosses it. The industry's convergence on flat fees is consistent with the bar not being cleared rather than with laziness, and the person across the table may already know the result exists."
      - text: "Train a larger model for longer; contribution estimates stabilize once the model is properly converged."
        misconception: D16
        explain: "Contribution is a random variable at every scale. Seed variation comes from initialization and data order, both intrinsic, and a source's measured marginal contribution can swing by more than its own magnitude across seeds regardless of model size. The lever is repetition, not scale - and moving to a larger model makes repetition unaffordable, which is worse on both axes."
      - text: "Drop the split and report leave-one-out instead; it is measured directly from two runs and does not accumulate noise across thousands of coalitions."
        misconception: V5-M4
        explain: "Backwards on both counts. A leave-one-out difference is noisier than a share computed from the same table - roughly twice as noisy at three sources - because it is a single difference of two noisy numbers with no averaging. And leave-one-out is not an allocation: its values do not sum to the pool. Retreating to it trades a noisy split for a noisier non-split."
    difficulty: core

  - id: v5-q13
    concept: d-coop-game
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      Which is the strongest available argument that this method is arbitrary,
      paired with the honest response to it?
    options:
      - text: "Nothing constrains the choice of $v$, and the choice moves the answer a lot - adding a second held-out domain took A from 35 to 55 by additivity alone - so whoever picks the held-out set picks the split; the response is procedural, publishing the held-out set's construction, decontamination and size before any run, which converts an unbounded degree of freedom into a disclosed one without eliminating it."
        correct: true
        explain: "This is the argument the unit makes against itself. There is no axiom about choosing $v$ and there cannot be one, because the choice is a business decision - what the licensee is buying. The rule is auditable given $v$; $v$ is not. Pre-commitment is disclosure, not objectivity, and additivity lets you publish a per-domain decomposition rather than one contested aggregate."
      - text: "The argument fails: the four requirements admit exactly one rule, so the output is forced by mathematics rather than chosen, and any charge of arbitrariness is answered by pointing at the uniqueness theorem."
        misconception: V5-M3
        explain: "The uniqueness theorem is real but it fixes the rule given a value function; it says nothing about which value function. This is the answer most likely to lose a room, because the first person to ask why efficiency and not guaranteed minimums has exposed the axioms as a menu the contract adopts."
      - text: "The method is arbitrary because averaging over $n!$ arrival orders means the answer depends on which of the 479 million orders you could afford to enumerate; the response is to sample orders uniformly so the estimate is at least unbiased."
        misconception: V5-M1
        explain: "No order is ever enumerated. A marginal contribution depends only on the set that arrived first, so all $n!$ orders are answered by lookup into a cached table of $2^n$ entries - at 12 sources, 4,096 runs for $102 to $273. The cost objection is about coalitions, and the arbitrariness objection is about $v$, not about orders."
      - text: "The method is arbitrary because the shares do not equal the measured counterfactuals: leave-one-out gives 10, 10 and 30 while the rule pays 35, 35 and 30, so the rule overrides its own measurements; the response is to renormalize leave-one-out and pay that instead."
        misconception: V5-M4
        explain: "Leave-one-out sums to 50 against a pool of 100 and the renormalization doubles C's measured 30 into a paid 60 for reasons found nowhere in the data; with two byte-identical sources it divides by zero and stops existing. It measures replaceability, which is the right input for a renewal decision and cannot be an allocation."
      - text: "The method is arbitrary today only because the estimates are noisy; the response is that better estimators are coming, and once attribution noise falls the value-function choice will stop mattering."
        misconception: D20
        explain: "Two separate problems fused into one wrong answer. Noise is not a methods problem - below the proven signal-to-noise threshold the welfare-optimal contract is a flat fee and no estimator crosses it, only more signal does - and a cleaner estimate of the wrong held-out set is still the wrong held-out set."
    check: choice
    difficulty: stretch
