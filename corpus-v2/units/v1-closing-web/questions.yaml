# v1 closing-web: pretest + terminal check bank.
# Solo fade item: v1-q3 (v1-pool-split). It is the third appearance of the
# pool-split procedure - worked in canon prose in the opening section, drilled
# as completion beat v1-b6, then solo here.
# Money figures are as of mid-2026. Figures carrying verification flags in
# corpus-v2/research (the Getty UK judgment details) appear nowhere in this file.

pretest:
  - id: v1-p1
    concept: d-contributive-corroborative
    prompt: |
      An AI answer engine responds to a question and lists three sources under
      the answer, with links. What do those three citations establish about
      which data produced the model's ability to answer?
    answer: |
      Nothing. The citations are a list of what a retriever placed in the
      context window seconds before the answer was generated, selected by
      similarity to the query over an index that was built independently of the
      model. Hold the model's weights fixed and swap the index and the
      citations change completely, while everything the model learned stays
      identical. Turn retrieval off and the model usually still answers, with no
      citations at all.

      Citations are corroborative: these sources support this claim.
      Attribution to training data is contributive: this data caused this
      capability. Only the second one is a fact about the model.
    check: llm
    rubric: |
      Pass requires: (1) the citations describe retrieved context, not training
      data, and (2) some version of the swap-the-index or retrieval-off
      argument showing the citation can change while the model does not.
      Answering that the citations show which sources the model "used" or
      "drew on" = fail, diagnosing D1. This is the primary calibration item for
      the unit and is expected to fail.
      Answering "nothing, because the model just makes things up" = fail; that
      is a different error and misses that the citations are real facts about a
      real retrieval, just not facts about training.

  - id: v1-p2
    concept: d-data-market
    prompt: |
      Roughly what share of recent AI content licensing deals include training
      rights, and is that share rising or falling? Separately: name the single
      largest category of AI data spending, and say roughly how it compares in
      size to the whole disclosed content-licensing market.
    answer: |
      About 40% of recent deals include training rights, down from
      near-universal in 2023-24 and falling. Inference-time access and
      attribution deals are the growing category, roughly doubling year over
      year.

      The largest category of AI data spending is expert-labeled data, and it
      is not close: Meta paid $14.3B for 49% of Scale AI in June 2025, and
      Mercor booked $614M in the first half of 2026, roughly $2B annualized,
      about 90% of it from labs. Disclosed content licensing is
      low-single-digit billions cumulative. One labeling vendor out-earns the
      entire disclosed content-licensing market. All figures as of mid-2026.
    check: llm
    rubric: |
      Pass requires: (1) a share well below universal - accept anything in the
      30-50% range - AND that it is falling, and (2) expert/labeled data named
      as the larger market, with any correct order-of-magnitude comparison.
      Answering that most or all deals include training rights = fail,
      diagnosing D12. Expected to fail at pretest.
      Naming content licensing as the largest category = fail, same diagnosis.
      Getting (1) right and (2) wrong = partial; the learner has the trend but
      not the scale, and the scale is the part that changes a pitch.

  - id: v1-p3
    concept: d-compensation-schemes
    prompt: |
      A marketplace collects subscription fees into a single pool and pays
      sources pro-rata by their share of platform-wide usage - the Spotify
      model.

      You subscribe and consume exactly one source all month. Where does your
      subscription money go, and what does that imply about who does well under
      this design?
    answer: |
      Not to the source you consumed, except incidentally. Your fee joins the
      pool, and the pool is divided by platform-wide share, so your money is
      distributed across every source in proportion to everyone else's usage.
      The source you actually consumed receives a share determined by the whole
      platform's behavior, not by yours. Money flows from your pocket to sources
      you never touched.

      Implication: the design cross-subsidizes from niche consumption toward
      whatever dominates the platform, and it concentrates - in music, 99.8% of
      artists receive effectively nothing. It also invites farming, because
      payout follows a countable event that can be manufactured.
    check: llm
    rubric: |
      Pass requires: (1) the money is allocated by platform-wide share rather
      than by the payer's own consumption, and (2) at least one consequence -
      cross-subsidy, concentration, or gaming.
      Answering that the source you consumed gets your money, or gets most of
      it, = fail, diagnosing D10. Expected to fail at pretest, and this one is
      pitch-fatal: it is the standard design and the standard misreading of it.

check:
  - id: v1-q1
    concept: d-contributive-corroborative
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A vendor's marketing says: "our system attributes every generated answer
      back to the training data that produced it, and pays rightsholders
      accordingly."

      State which of the two kinds of attribution the vendor is almost
      certainly doing, give the single experiment that settles it, and state
      what the vendor would have to show for the stronger claim to be true.
    answer: |
      Almost certainly corroborative. Deployed commercial systems attribute to
      the retrieved context - the documents a retriever placed in the context
      window - because that information is available at answer time at no cost.
      Contributive attribution is a claim about training data and requires
      either counterfactual retraining or a gradient-based estimator, neither of
      which runs per answer at production latency.

      The experiment: hold the model's weights fixed and change the retrieval
      index - remove a cited document, add an equivalent one, or change the
      ranking function - then re-ask the identical question. If the attributions
      change, they were computed over the retrieved set and are corroborative. A
      contributive number cannot move without retraining. The cheap variant is
      to disable retrieval: if the system answers but produces no attributions,
      the attributions were about retrieval.

      For the stronger claim the vendor would have to show attributions that are
      a function of the training corpus and not of the query-time index: a
      measured relationship to ground truth obtained by retraining without a
      source, on some corpus small enough to do it, with a reported noise floor
      across seeds. Absent that, the claim is a name, not a measurement.
    check: llm
    rubric: |
      Must contain: (1) corroborative, with the reason that the retrieved set is
      what is available at answer time; (2) the swap-the-index-with-fixed-weights
      experiment and the correct prediction under each hypothesis; (3) some form
      of "show me the correlation against counterfactual ground truth" as the
      standard for the stronger claim.
      (1) and (2) = pass. All three = full credit.
      An answer that accepts the claim because the vendor says it uses gradients
      or influence functions = fail, diagnosing D1: the method name is not the
      test, the intervention is.
      An answer that says no attribution of any kind is possible = fail; that
      overcorrects past the unit and past units v4 and v5, which measure it.
    difficulty: core

  - id: v1-q2
    concept: d-contributive-corroborative
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      An AI answer engine cites three sources beneath a correct answer. Which
      statement about those citations is correct?
    check: choice
    options:
      - text: "They identify documents a retriever placed in the context window for this query. They are evidence about the retrieval index, not about the model's training data."
        correct: true
        explain: "Correct. The retriever selects by similarity to the query over an index built independently of the model. Hold the weights fixed, swap the index, and the citations change while nothing the model learned changes - which is the whole demonstration that citation is corroborative rather than contributive."
      - text: "They identify the training documents that gave the model the ability to produce this answer."
        misconception: D1
        explain: "This is the inference every AI search interface is designed to produce, and it is the reason the whole 'attribution' product category can charge for citations. It fails the swap-the-index test: a fact about what the model learned cannot change when you replace an index seconds before the query. A compensation scheme built on this pays for retrieval placement."
      - text: "They identify the documents that contain the fact, which is the same thing as the documents that taught it to the model."
        misconception: D5
        explain: "Attractive because 'which data is responsible' sounds like one question. It is two. Influence measures what moved the loss during training; entailment measures what contains the claim. At real scale the two rankings systematically disagree - plain lexical search beats gradient-influence methods at finding the document that contains a fact, which unit v8 covers. Containing and causing are different targets."
      - text: "They are the sources the model can reproduce most closely, which is how the system knows it used them."
        misconception: D3
        explain: "The verbatim-overlap intuition: if the model can echo it, it came from there. Verbatim match is a measurement artifact and a lower bound - most of what training data contributes is semantic and never resurfaces as matching text - and in a retrieval system, closeness to the cited passage is a consequence of that passage being in the prompt right now, not evidence about training."
    difficulty: warmup

  - id: v1-q3
    concept: d-compensation-schemes
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A royalty pool of $50,000 is split among four sources in proportion to
      their measured contributions, using share = weight / total weight and
      payout = share x pool.

      Measured contributions, in nats of held-out loss reduction:
        S1 = 0.08
        S2 = 0.22
        S3 = 0.10
        S4 = 0.40

      What is S2's payout, in dollars? Answer with digits only, no currency
      symbol and no separators.
    answer: "13750"
    check: exact
    difficulty: core

  - id: v1-q4
    concept: d-compensation-schemes
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Three sources feed an AI legal-research product:

      - A: a court-reporting service that publishes opinions the day they are
        issued. Its text is the official record and is republished verbatim by
        a dozen aggregators within hours.
      - B: a treatise publisher whose commentary exists nowhere else and is
        behind a paywall the aggregators never reach.
      - C: a large open Q&A forum where practitioners discuss the same cases,
        with enormous volume and highly variable quality.

      Run the three-scheme comparison. For flat fee, citation counting, and
      causal attribution, say who does best, who does worst, and what the scheme
      is proportional to. Then name the single source most likely to be
      mispriced by every scheme, and say why.
    answer: |
      Flat fee (equal split among enrolled sources): all three receive the same.
      Proportional to enrollment. Best for whoever contributes least - here C,
      whose volume is large but whose marginal value is low because it is
      redundant with A and with itself. Worst for B, the source with unique
      content.

      Citation counting: proportional to retrieval placement. A and C do well: A
      because official text matches queries about cases directly, C because
      volume and open access mean it dominates any index. B does badly and may
      score zero, because a paywalled treatise is often not in the retrieval
      index at all. Note that the scheme is measuring index membership as much
      as it is measuring anything.

      Causal attribution: proportional to measured marginal effect on the model.
      B does best, because its commentary is the only place that content exists,
      so removing it removes capability. A does surprisingly badly despite being
      the official record, because a dozen aggregators republish it verbatim -
      remove A and the model learns the same text from the copies. C is mixed
      and probably low: high volume, high redundancy, and the measurement is
      likely inside the noise floor.

      The most mispriced source is A, and the reason is the important one. A is
      the origin of the most authoritative text in the corpus, and it scores
      well only under the scheme that measures placement rather than
      contribution. Under counterfactual measurement its own redundancy destroys
      its measured value - the more widely it is copied, the less it appears to
      be worth. Any scheme intending to pay origins needs an explicit policy for
      duplicate clusters, because no measurement of marginal effect will find
      the origin on its own.
    check: llm
    rubric: |
      Must contain: (1) the correct proportionality target for each of the three
      schemes - enrollment, retrieval placement, marginal effect; (2) B named as
      the winner under causal attribution with the uniqueness/no-substitute
      reason; (3) A's redundancy problem - widely republished content measures as
      low-contribution under counterfactual removal.
      All three = pass. (1) and (3) = pass; (3) is the load-bearing insight.
      An answer that ranks A highest under causal attribution because it is the
      authoritative original = fail, and route to the duplication argument: this
      is the most common wrong intuition about counterfactual attribution and it
      recurs in units v4 and v5.
      An answer that treats citation counting as measuring usage = fail,
      diagnosing D1.
      An answer that never mentions B being absent from the retrieval index = do
      not deduct, but note it: the learner is not yet seeing that citation
      schemes measure index membership.
    difficulty: core

  - id: v1-q5
    concept: d-compensation-schemes
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A marketplace pays sources pro-rata from a fixed pool, weighted by
      citations. What is a source's payout proportional to?
    check: choice
    options:
      - text: "Its share of platform-wide citations - so its payout falls when any other source's count rises, with no change in its own behavior."
        correct: true
        explain: "Correct, and the denominator is the part people miss. With share = w_i / sum of all w, the partial derivative of your payout with respect to any other source's weight is strictly negative. Every participant is a negative externality on every other participant. That single property produces the cross-subsidy, the concentration, and the incentive to inflate counts."
      - text: "How much the sources were actually used by the people paying into the pool."
        misconception: D10
        explain: "'Share of streams' does sound like 'share of use,' which is exactly why the Spotify model reads as fair. But a payer's fee is distributed by platform-wide share, not by that payer's own consumption: subscribe and consume one source all month and your money still goes across the whole platform in proportion to everyone else's behavior. Money flows to sources you never touched."
      - text: "The value its content contributed, which is what citation counts measure at scale even if any individual citation is noisy."
        misconception: D20
        explain: "The builder's optimism: noise averages out, so a big enough sample recovers the signal. Averaging fixes noise, not bias. Citation counts measure retrieval placement, and placement is a systematically different quantity from contribution - more data makes the estimate of placement more precise, and no amount of it turns placement into contribution."
      - text: "The negotiated worth of its catalogue, since the pool size was set by what the buyers agreed the content was worth in aggregate."
        misconception: V1-M2
        explain: "This treats a headline pool figure as a valuation of content. Pool sizes are negotiated bundles - content, product placement, exclusivity, litigation peace - and across 73 public deals the majority of value accrues to aggregators with documented creator royalties rounding to zero. The pool total tells you about leverage, not about what text is worth."
    difficulty: core

  - id: v1-q6
    concept: d-data-market
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A colleague argues: "The $1.5B Bartz settlement is the dam breaking. Labs
      are going to be paying rightsholders for training data from now on, so a
      royalty product has a forcing function behind it."

      State exactly what that settlement priced, compute the rational response
      of a lab that reads the judgment, and name the specific pending question
      that could still change the answer.
    answer: |
      It priced acquisition, once. The court held that training on lawfully
      acquired books is quintessentially transformative fair use, and that
      retaining pirated copies is not. The settlement resolves the second
      holding: roughly $3,000 per work across about 500,000 works, one time,
      with output-side claims explicitly preserved and unresolved. It
      establishes no rate for use of any kind.

      The rational lab response is to buy one clean copy of everything, at
      retail, and train freely. Nothing recurring is owed. The comparison is
      stark: at the settlement's implied $3,000 per work, one year of the
      Google-Reddit deal at about $60M would buy 20,000 works outright and
      forever - and the actual cost of a lawfully purchased book is closer to
      the cover price than to $3,000. Three jurisdictions have converged on some
      version of "acquire legitimately and you may train."

      What could still change it: the output-side theories, substitution and
      market harm, which the acquisition holding does not touch and which a
      clean-copy purchase cannot cure. NYT v. OpenAI is where they get tested -
      the court declined to hold that training is inherently transformative,
      leaving fair use fact-dependent on those questions, with trial expected
      late 2026 or early 2027. That is a genuine repricing event in either
      direction, which is the argument for building what is needed under every
      outcome rather than under one.
    check: llm
    rubric: |
      Must contain: (1) the settlement priced acquisition of pirated copies, one
      time, not use; (2) the rational response is a one-time clean-copy
      purchase, ideally with the arithmetic contrast; (3) the output-side
      claims - substitution and market harm - named as the unresolved theory
      that could still force recurring payment.
      (1) and (2) = pass. All three = full credit.
      An answer that agrees a royalty regime is now likely = fail, diagnosing
      D13, which is pitch-fatal in front of anyone who has read the opinion.
      An answer that says the case law makes any payment for training data
      impossible = fail; deals exist and are signed voluntarily for access,
      exclusivity, and peace. The holding removes the forcing function, not the
      market.
    difficulty: core

  - id: v1-q7
    concept: d-data-market
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Which statement best describes the AI content-licensing market as of
      mid-2026?
    check: choice
    options:
      - text: "Roughly 40% of recent deals include training rights and that share is falling; inference-time access deals are growing about twice a year; and the expert-labeled-data market dwarfs all disclosed content licensing combined."
        correct: true
        explain: "Correct. Training-rights share fell from near-universal in 2023-24; attribution and live-access deals went from 2 in 2023 to 18 in 2025 to roughly 34 projected in 2026; and one labeling vendor at roughly $2B annualized out-earns the entire disclosed content-licensing market. The market moved from buying content to build models toward licensing content to deliver answers."
      - text: "Training rights are the core of the market, since training is what created the demand for content in the first place."
        misconception: D12
        explain: "The original scandal was about training and the phrase everyone uses is 'training data licensing,' which keeps this framing alive after the deal flow stopped supporting it. Private training-rights deals across the whole industry are estimated at $75-100M per year, and their share of deals is falling while access deals double annually. A product aimed at training-time payment is aimed at a shrinking fraction of a small market."
      - text: "Content now has established per-unit prices, visible in posted crawler rates and standardized licensing terms adopted by around 1,500 media organizations."
        misconception: V1-M1
        explain: "Broad supply-side adoption is real and it is not a market. Pay Per Crawl never left private beta, no frontier lab participates in any per-crawl or per-inference scheme, and there is no confirmation that any AI company has agreed to pay under the standardized terms. These are asks with no recorded bids; a rate card is not a clearing price."
      - text: "The disclosed deal totals give a reliable per-document price for content, which is the right basis for sizing the market bottom-up."
        misconception: V1-M2
        explain: "Deal totals bundle content, product placement, ongoing relationships, exclusivity, and litigation peace in undisclosed proportions, which is why comparable corpora price orders of magnitude apart. Across 73 public deals the majority of value accrues to aggregators with documented creator royalties rounding to zero. Dividing a bundle by a document count produces a number with no referent."
    difficulty: warmup

  - id: v1-q8
    concept: d-data-market
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      A publisher has blocked AI crawlers at its CDN since default blocking
      shipped, and its dashboard shows millions of blocked requests. It asks you
      to confirm that its archive is therefore absent from models trained since.

      Explain why you cannot confirm that, quantify the effect blocking actually
      has, and state what you would build instead if the goal is protection
      rather than leverage.
    answer: |
      Blocking controls one host. The content exists on more than one: wire
      pickups, aggregators, quote-heavy secondary coverage, scraped mirrors, and
      archived crawls, none of which touch the publisher's CDN. A lab that wants
      the text takes it from any of them, and the block is invisible to that
      path.

      Quantify it with a simple exposure model. If the content exists on k hosts
      and a corpus builder crawls any given host with probability q
      independently, then capture probability is 1 - (1-q)^k, and blocking your
      own origin changes it to 1 - (1-q)^(k-1). With q = 0.3 and k = 10, that is
      97.2% versus 96.0%: blocking bought 1.2 percentage points. The marginal
      value of blocking one host is q(1-q)^(k-1), which decays geometrically in
      k. Origin blocking is highly effective for content that exists in exactly
      one place and asymptotically worthless for content that syndicates.

      What blocking is genuinely good for is leverage: it is why 50-plus major
      licensing agreements got signed in the past year. That is a negotiating
      instrument, not protection.

      What to build for protection: near-duplicate detection at web scale to
      find where the copies live and when they appeared, dated against model
      training cutoffs; plus evidence machinery that still works when the copy
      the model saw came from somebody else - keyed markers planted in the
      content before scraping, with a pre-committed detection procedure. That is
      units v6 and v7, and leakage tracking is one of the few genuinely open
      commercial slots in this ecosystem.
    check: llm
    rubric: |
      Must contain: (1) syndication and mirroring as the mechanism - copies that
      never touch the origin; (2) some quantified or explicitly structural
      statement that blocking's value decays as the number of copies grows -
      the exposure model, or an equivalent argument; (3) the distinction between
      leverage and protection; (4) a discovery-based answer for what to build,
      near-duplicate detection or equivalent.
      (1), (3) and (4) = pass. Adding (2) = full credit.
      An answer that confirms the archive is absent = fail, diagnosing D11.
      An answer whose entire account of leakage is crawler evasion - proxies,
      user-agent spoofing - = fail, same diagnosis: evasion is real and it is not
      the main path, and treating it as the main path sends the budget to better
      blocking.
    difficulty: core

  - id: v1-q9
    concept: d-data-market
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Make the strongest possible case against building a training-data royalty
      product. Use at least four independent lines of argument drawn from the
      market, the courts, the technology, and the competitive landscape.

      Then state what survives that case, and explain why the surviving argument
      does not require you to predict which way the market goes.
    answer: |
      The case, four or more independent lines:

      1. Demand side: no buyer has ever paid into a neutral marketplace. The
         standardized licensing terms have roughly 1,500 endorsing organizations
         and no confirmed licensee; the IETF preference vocabulary has no
         production reader at any major lab; Pay Per Crawl never left private
         beta. Every real cheque was a bilateral negotiation.
      2. Courts: the acquisition holding removes the forcing function. Training
         on lawfully acquired copies is fair use in the decided cases, and the
         large settlement priced a one-time acquisition defect.
      3. Market shape: training rights are about 40% of recent deals and
         falling, while access deals double annually, and the whole
         training-rights market is an estimated $75-100M per year - smaller than
         a mid-size financing round, and dwarfed by expert-data spend.
      4. Technology: training-time attribution is not credible at frontier scale
         as a payment basis, and RAG-time attribution is already commoditized by
         several funded vendors and a major platform marketplace.
      5. Competitive: attribution startups in this space get acquired by
         rightsholders or gatekeepers rather than becoming independent royalty
         exchanges, and the gatekeeper is vertically integrated across
         chokepoint, identity, preference, payment, index and marketplace.
      6. Substitutes: labs that can generate synthetic text spend their scarcity
         budget on expert labeling instead.

      What survives: every one of those is an argument about payment. None is an
      argument about measurement. Verification has buyers already - a disclosure
      obligation with a supervisor and a fining power from August 2, 2026;
      buy-side procurement, where labs demonstrably spend billions; and
      publishers who need evidence for negotiations they are already in.

      Why it needs no prediction: a royalty split that nobody can audit is not a
      royalty split, so measurement is required in the branch where the royalty
      market appears. Disclosure, procurement and leakage claims require it in
      the branch where it does not. A capability needed under both branches
      dominates a larger capability needed under one, and the dominance argument
      goes through without assigning a probability to either branch. That is the
      argument to lead with, because an argument that survives without a
      forecast is stronger than one that depends on a forecast.
    check: llm
    rubric: |
      Must contain: (1) at least four genuinely independent objections spanning
      at least three of {demand side, courts, market shape, technology,
      competition, substitutes}; (2) the observation that all of them concern
      payment rather than measurement; (3) at least one verification buyer that
      exists independently of a royalty market; (4) the branch-independence
      argument - measurement is needed under both outcomes, so no forecast is
      required.
      (1), (2) and (4) = pass. All four = full credit.
      An answer that rebuts the objections by predicting the market will develop
      = fail: the point of the item is that the surviving argument does not
      depend on the prediction.
      An answer that concedes the whole space is worthless = fail; it has
      swallowed the skeptical case without noticing that every line of it is
      about payment.
      Citing "courts will eventually force royalties" as a survival argument =
      fail, diagnosing D13.
    difficulty: stretch

  - id: v1-q10
    concept: d-compensation-schemes
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      You are specifying the royalty-bearing units for a proof of concept built
      on an open papers corpus. Someone proposes: "one paper, one source - it is
      the finest granularity available, and we can always aggregate later."

      Give the two independent reasons this is wrong, state the definition of a
      source you would use instead, and name the two manifest fields whose
      absence would make a later payout dispute unanswerable.
    answer: |
      Reason one: a paper is not a payment counterparty. Nobody signs a contract
      or cashes a cheque as "paper #40118." A $12,000 pool over 100,000 papers
      averages $0.12 per paper, below the cost of the transfer. The attribution
      unit has to be the payment unit, and the payment unit has a hard floor set
      by transaction cost.

      Reason two: "aggregate later" assumes the aggregation rule is neutral. It
      is not - it is the allocation policy, and deferring it means the payout
      table's shape is decided later by whoever writes the rollup, with no
      justification recorded. Note that the combinatorial cost is a third
      objection but the weakest one, since sampling estimators exist; the two
      above do not go away with more compute.

      The definition: a source is a payment counterparty - an entity that could
      sign a contract and receive money. Not a file, not a shard, not a
      document. If you cannot name who would be paid, it is not a source. Two
      constraints follow: the identity must be stable across pipeline reruns, or
      contributions computed in different weeks are not comparable; and source
      assignment must happen before deduplication, because when the pipeline
      keeps one copy of a shared passage the surviving copy silently receives
      credit for everything that passage teaches.

      The two fields whose absence is fatal: the duplicate-cluster ID together
      with the full set of sources in that cluster, without which the objection
      "you paid them for my text" cannot be answered at all; and a stable
      source_id, without which this run's numbers cannot be tied to the entity
      being paid or compared with any other run. Token counts and the extraction
      code version are close behind, but those two are the ones that make a
      dispute unanswerable rather than merely awkward.
    check: llm
    rubric: |
      Must contain: (1) a paper is not a payment counterparty and/or the payouts
      fall below transaction cost - the attribution unit must match the payment
      unit; (2) that deferring aggregation defers the allocation policy rather
      than avoiding it; (3) the payment-counterparty definition of a source;
      (4) duplicate-cluster membership named among the fatal missing fields.
      (1), (3) and (4) = pass.
      An answer whose only objection is that 2^n coalitions is too large = fail:
      the compute objection is answerable by sampling and it conceals the real
      defect.
      An answer that treats deduplication as neutral cleanup = fail, diagnosing
      D9 - which copy survives is a payout decision.
      An answer that assigns source identity after deduplication = fail; the
      information required to do it is destroyed by then.
    difficulty: stretch

