  - id: v1-q12
    concept: d-data-market
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Crawlers now sign their requests with Ed25519 keys under Web Bot Auth, and
      the scheme is enforced at several major infrastructure providers with
      Anthropic, OpenAI, Perplexity, Google and Common Crawl among the signers.
      What does this solve?
    check: choice
    options:
      - text: "Crawler identity: which agent made a request. It says nothing about what happened to the bytes afterwards."
        correct: true
        explain: "Correct, and the boundary matters. A signature authenticates the fetch. It carries no information about whether the response entered a training corpus, a retrieval index, or a bucket, and no signature scheme can, because the disposition of the bytes happens entirely on the other party's infrastructure. Identity is solved; use is not observable from the wall."
      - text: "It creates a cryptographic record of what each lab trained on, since every fetch is signed and attributable."
        misconception: D14
        explain: "The 'cryptography proves training' reflex, at the transport layer. A signed fetch log proves a request was made; it cannot prove what was done with the response, and it cannot detect content that arrived by any other route. The general failure is more severe: the best published zero-knowledge proof-of-training throughput would take on the order of ten thousand years for a 1B-parameter model, and attestation only covers a cooperating trainer."
      - text: "It closes the gap that let content into training sets, because unsigned and impersonating crawlers can now be refused."
        misconception: D11
        explain: "It does close the impersonation gap at participating origins, which is worth having. It does not close the leakage path, because the main route is not evasion - it is syndicated and mirrored copies on hosts that were never blocked and never needed to sign anything. Signature enforcement at your origin has no effect on a wire copy sitting on 300 other domains."
      - text: "It establishes a neutral, open identity layer, which levels the ground for anyone building a licensing marketplace on top."
        misconception: V1-M3
        explain: "The specification really is an open IETF draft, which is what makes this attractive. But identity is one layer of a stack whose chokepoint, preference vocabulary, payment rails, index and marketplace are all held by the same party, and enforcement is the only layer with pricing power. An open spec above a closed enforcement point does not level anything; publishers already call the result vendor-locked."
    difficulty: core

  - id: v1-q13
    concept: d-contributive-corroborative
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      Classify each of the following as contributive, corroborative, or
      neither, and give the one-line reason:

      1. ProRata's Gist answer engine splitting ad revenue pro-rata across the
         sources cited in an answer.
      2. Perplexity's Comet Plus pool paying publishers on visits, citations,
         and agent actions.
      3. Microsoft's Publisher Content Marketplace paying when Copilot grounds
         an answer in a publisher's page.
      4. Cloudflare's Pay Per Use charging a crawler when it fetches a page.
      5. Retraining a model with one source removed and measuring the change in
         held-out loss.
    answer: |
      1. Corroborative. The split is over the sources a retriever placed in the
         context window for that answer; it is a fact about the index, not
         about training.
      2. Corroborative. Visits and citations are retrieval and traffic events at
         answer time. Agent actions are further from attribution still - they
         measure product behavior.
      3. Corroborative. "Grounds an answer in your page" is a description of
         retrieval: the page was in the context when the answer was produced.
      4. Neither. A per-fetch charge is metering at the transport layer. It
         measures transfer, is charged identically whether the bytes end up in
         a training corpus, an index, or a bucket, and makes no attribution
         claim of any kind. Honest, and about a different quantity.
      5. Contributive, and it is the definition rather than an estimate of it:
         the change in what the model can do when a source is absent. It is
         also the only one of the five that requires touching the training
         process, which is why it is the only one that costs a training run and
         the only one nobody sells.
    check: llm
    rubric: |
      Required classifications: 1, 2 and 3 corroborative; 4 neither (accept
      "neither" or an explicit statement that metering makes no attribution
      claim); 5 contributive.
      Pass = at least 4 of 5 correct with reasons, including 5 correct.
      Classifying any of 1-3 as contributive = fail, diagnosing D1: these are
      the deployed products the confusion is built on, and getting them wrong
      in a pitch is the failure mode this unit exists to prevent.
      Classifying 4 as corroborative = partial, do not deduct heavily: it is a
      reasonable slip, but per-fetch metering makes no claim about what supports
      an answer either.
      Treating 5 as impractical rather than as the definition = flag: units v4
      and v5 do exactly this at small scale, and the whole book depends on it
      being the reference against which cheap methods are measured.
    difficulty: core
