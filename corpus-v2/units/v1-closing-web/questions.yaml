# v1 closing-web: pretest + terminal check bank.
# Solo fade item: v1-q3 (v1-pool-split). It is the third appearance of the
# pool-split procedure - worked in canon prose in the opening section, drilled
# as completion beat v1-b6, then solo here.
# Money figures are as of mid-2026. Figures carrying verification flags in
# corpus-v2/research (the Getty UK judgment details) appear nowhere in this file.

pretest:
  - id: v1-p1
    concept: d-contributive-corroborative
    kind: mcq
    prompt: |
      An AI answer engine responds to a question and lists three sources under
      the answer, with links. Which statement is true of what those three
      citations establish about the data that produced the model's ability to
      answer?
    check: choice
    options:
      - text: "Nothing about it: the citations name what a retriever placed in the context window seconds before the answer, so swapping the index changes them while every weight stays identical."
        correct: true
        explain: "Right. Citation is corroborative - these sources support this claim - and is a fact about a retriever's ranking, not about training. Hold the weights fixed and swap the index and the citations change completely; turn retrieval off and the model usually still answers with no citations at all."
      - text: "They name the training documents the model drew on for this answer, ranked by how much each one contributed."
        misconception: D1
        explain: "This is the inference every AI search interface is built to produce, because citations use the visual grammar of footnotes. But no deployed system computes a training-data ranking per answer; the list is the retrieved set, and it would change under a new index with the model untouched."
      - text: "They establish that the answer's content was not memorized verbatim from training data, since a memorized answer would need no sources."
        misconception: D3
        explain: "This makes verbatim reproduction the test of whether training data was used. Citations say nothing either way about memorization - the model can cite while also having been shaped by the same text, and most training contribution is semantic and never resurfaces verbatim."
      - text: "Nothing, because the citations are generated text and need not correspond to any real document."
        misconception: D1
        explain: "The conclusion is right by accident and the reason is wrong. In a RAG product the citations are real facts about a real retrieval - they just are not facts about training. Treating them as fabrications misses the actual distinction the unit turns on."
      - text: "They establish the model's weights contain copies of those three documents, since it could quote them."
        misconception: D4
        explain: "Model capacity is roughly 3.6 bits per parameter, far too small to hold a corpus as an archive. And the cited documents were pasted into the prompt as text at answer time; the model read them the way it reads anything in its context."

  - id: v1-p2
    concept: d-data-market
    kind: mcq
    prompt: |
      As of mid-2026, which pair correctly states (i) the share of recent AI
      content licensing deals that include training rights and its direction,
      and (ii) the largest category of AI data spending relative to the whole
      disclosed content-licensing market?
    check: choice
    options:
      - text: "About 40% and falling from near-universal; expert-labeled data is the largest category - Meta paid $14.3B for 49% of Scale AI and Mercor booked $614M in H1 2026 (~$2B annualized), so one labeling vendor out-earns all disclosed content licensing."
        correct: true
        explain: "Right on both counts. Training rights fell from near-universal in 2023-24 to about 40% while inference-time access and attribution deals roughly double year over year, and labs' scarcity budget goes to expert judgment about text, not to text."
      - text: "Near-universal and holding steady; content licensing is the largest category, at low-single-digit billions cumulative."
        misconception: D12
        explain: "This is the received framing - the original scandal was about training and the earliest deals really were training deals. Both halves fail on the public record: the training-rights share is a falling ~40%, and a single labeling vendor at ~$2B annualized dwarfs the whole disclosed content market."
      - text: "About 40% and falling; content licensing is still the largest data spending category because inference-time access deals are also content deals."
        misconception: D12
        explain: "The trend is right and the scale is wrong, which is the half that changes a pitch. Access deals are growing but the money in data is in expert labeling: Scale at $14.3B for a minority stake, Mercor at ~$2B annualized with about 90% from labs."
      - text: "About 40% and rising as the market matures; expert-labeled data is the largest category."
        misconception: D12
        explain: "If training rights were the demand, their share would be stable or rising as the market matured. It is the reverse: down from near-universal, while attribution and live-access deals went from 2 in 2023 to 18 in 2025 to roughly 34 projected in 2026."
      - text: "About 40% and falling; litigation settlements are the largest category of AI data spending, given the $1.5B Bartz figure."
        misconception: D13
        explain: "A settlement is not data spending, and $1.5B priced the one-time acquisition of ~500,000 pirated copies after the court held that training on lawfully acquired copies is fair use. The recurring spend is on expert labeling."
    band: 3

  - id: v1-p3
    concept: d-compensation-schemes
    kind: mcq
    prompt: |
      A marketplace collects subscription fees into a single pool and pays
      sources pro-rata by their share of platform-wide usage - the Spotify
      model, $s_i = w_i / \sum_j w_j$ with payout $s_i \times P$.

      You subscribe and consume exactly one source all month. Which statement
      correctly describes where your fee goes and what follows from it?
    check: choice
    options:
      - text: "It is distributed across every enrolled source in proportion to everyone else's usage, so money flows to sources you never touched; the design cross-subsidizes toward whatever dominates the platform and concentrates - in music 99.8% of artists receive effectively nothing."
        correct: true
        explain: "Right, and it follows straight from the formula: nobody's payout is a function of their own usage, only of their weight relative to a denominator that belongs to everyone. Cross-subsidy, winner-take-most concentration and farming are what the rule says, not implementation bugs."
      - text: "It goes to the source you consumed, since your share of usage was entirely that source - which is why pro-rata pays in proportion to actual use."
        misconception: D10
        explain: "'Share of streams' sounds like 'share of use', but the share is computed platform-wide, not per subscriber. Your one source receives a fraction determined by the whole platform's behavior; your listening changes the numerator by a rounding error."
      - text: "It goes mostly to the source you consumed, with a small platform-wide component, so the tail is protected against concentration."
        misconception: D10
        explain: "There is no per-subscriber component in pro-rata at all. And a pool divided by a power-law weight pays a power law: the user-centric repair that would do what this option imagines has been modeled and shifts only 1 to 5 percentage points toward independents."
      - text: "It is held back until a causal measurement determines which sources actually shaped the answers you received, then paid on measured contribution."
        misconception: D20
        explain: "This describes a different scheme, and one nobody deploys. Pooled pro-rata pays on a countable weight because it is cheap; measured contribution is noisy enough that below a proven signal-to-noise threshold the welfare-optimal contract is a flat fee."
      - text: "It goes to the source you consumed once the platform corrects for gaming, since farming is the only reason payouts diverge from usage."
        misconception: D10
        explain: "Farming is a consequence of the design, not the cause of the divergence. Even with zero fraud, the formula routes your fee by platform-wide share; whatever a scheme counts, somebody will also manufacture."
    band: 3

check:
  - id: v1-q1
    concept: d-contributive-corroborative
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A vendor's marketing says: "our system attributes every generated answer
      back to the training data that produced it, and pays rightsholders
      accordingly."

      Which single test settles what kind of attribution the vendor is doing,
      and what does it predict?
    check: choice
    options:
      - text: "Hold the weights fixed and change the retrieval index, then re-ask the identical question: if the attributions move they were computed over the retrieved set and are corroborative, since a contributive number cannot change without retraining."
        correct: true
        explain: "Right - the intervention, not the vendor's vocabulary, is the test. The cheap variant is to disable retrieval: if the system still answers but shows no attributions, the attributions were about retrieval. Deployed systems attribute to context because that is what is available at answer time at production latency."
      - text: "Ask which estimator the vendor uses: if the answer is gradient influence functions rather than similarity, the attributions are contributive."
        misconception: D1
        explain: "The method name is not the test. A gradient-flavored score computed over the three documents in the context window is still a statement about retrieval, and no per-answer gradient attribution over a full corpus runs at production latency."
      - text: "Check whether the attributed documents share n-grams with the generated sentence: overlap means the training data was genuinely used."
        misconception: D3
        explain: "Lexical overlap is a corroborative baseline and a lower bound. Large models are shaped by documents sharing no n-grams with the outputs they influence, so this test finds surface form, not contribution - and would pass just as happily on retrieved context."
      - text: "Confirm the per-sentence weights sum to 100%: a normalized allocation over the corpus is what contributive attribution produces."
        misconception: D1
        explain: "Backwards - a tidy sum to 100% over a handful of documents is evidence the denominator is the retrieved set. Contribution measured against millions of documents does not conveniently normalize over three."
      - text: "Ask for a zero-knowledge proof of the training run: cryptographic attestation is the standard that settles contributive claims."
        misconception: D14
        explain: "The best published proof-of-training throughput is ~0.4 GFLOP/s, putting a 1B-parameter model on the order of 10,000 years, and attestation only covers a cooperating trainer. The standard for the stronger claim is a measured correlation against counterfactual retraining with a reported noise floor."
    difficulty: core

  - id: v1-q2
    concept: d-contributive-corroborative
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      An AI answer engine cites three sources beneath a correct answer. Which
      statement about those citations is correct?
    check: choice
    options:
      - text: "They identify documents a retriever placed in the context window for this query. They are evidence about the retrieval index, not about the model's training data."
        correct: true
        explain: "Correct. The retriever selects by similarity to the query over an index built independently of the model. Hold the weights fixed, swap the index, and the citations change while nothing the model learned changes - which is the whole demonstration that citation is corroborative rather than contributive."
      - text: "They identify the training documents that gave the model the ability to produce this answer."
        misconception: D1
        explain: "This is the inference every AI search interface is designed to produce, and it is the reason the whole 'attribution' product category can charge for citations. It fails the swap-the-index test: a fact about what the model learned cannot change when you replace an index seconds before the query. A compensation scheme built on this pays for retrieval placement."
      - text: "They identify the documents that contain the fact, which is the same thing as the documents that taught it to the model."
        misconception: D5
        explain: "Attractive because 'which data is responsible' sounds like one question. It is two. Influence measures what moved the loss during training; entailment measures what contains the claim. At real scale the two rankings systematically disagree - plain lexical search beats gradient-influence methods at finding the document that contains a fact, which unit v8 covers. Containing and causing are different targets."
      - text: "They are the sources the model can reproduce most closely, which is how the system knows it used them."
        misconception: D3
        explain: "The verbatim-overlap intuition: if the model can echo it, it came from there. Verbatim match is a measurement artifact and a lower bound - most of what training data contributes is semantic and never resurfaces as matching text - and in a retrieval system, closeness to the cited passage is a consequence of that passage being in the prompt right now, not evidence about training."
    difficulty: warmup

  - id: v1-q3
    concept: d-compensation-schemes
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A royalty pool of $50,000 is split among four sources in proportion to
      their measured contributions, using share = weight / total weight and
      payout = share x pool.

      Measured contributions, in nats of held-out loss reduction:
        S1 = 0.08
        S2 = 0.22
        S3 = 0.10
        S4 = 0.40

      What is S2's payout, in dollars? Answer with digits only, no currency
      symbol and no separators.
    answer: "13750"
    check: exact
    difficulty: core

  - id: v1-q4
    concept: d-compensation-schemes
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Three sources feed an AI legal-research product:

      - A: a court-reporting service publishing opinions the day they issue;
        its text is the official record and is republished verbatim by a dozen
        aggregators within hours.
      - B: a treatise publisher whose commentary exists nowhere else, behind a
        paywall the aggregators never reach.
      - C: a large open Q&A forum discussing the same cases, enormous volume,
        highly variable quality.

      Under causal attribution (leave-one-source-out effect on held-out loss),
      which source does best and which does worst, and why?
    check: choice
    options:
      - text: "B best, A worst: B's commentary has no substitute, so removing it removes capability, while removing A changes little because a dozen aggregators carry the same text verbatim."
        correct: true
        explain: "Right, and it is the load-bearing insight: counterfactual measurement prices substitutability, so the more widely a source is copied the less it appears to be worth. Paying origins therefore needs an explicit duplicate-cluster policy - no marginal-effect measurement finds the origin on its own."
      - text: "A best, C worst: A is the authoritative original that every other source is derived from, so it must carry the largest measured effect."
        misconception: D5
        explain: "This is the most common wrong intuition about counterfactual attribution and it recurs in units v4 and v5. Influence measures what moved the loss, not what originated or entails the claim; A's own redundancy destroys its measured value."
      - text: "C best, B worst: C's volume dominates the token count, and B is behind a paywall so the retriever cannot reach it."
        misconception: D1
        explain: "Paywall reachability is a fact about a retrieval index, which governs citation counting, not contribution. Under causal attribution what matters is whether the text was in the training corpus and whether removing it hurts; C's volume is largely redundant with A and with itself."
      - text: "A best, B worst: B's contribution is too small to separate from the seed noise floor, so it measures at zero and the official record wins by default."
        misconception: D16
        explain: "The noise point is real - contribution is a noisy random variable and small effects can be indistinguishable from zero - but it is applied to the wrong source. B is the one source with no substitute; C's small, redundant effect is the one most likely to sit inside the noise floor."
      - text: "All three measure roughly equally, since each supplies a comparable share of the corpus and contribution tracks token count."
        misconception: D8
        explain: "Contribution does not track volume. Past a floor, quality and non-redundancy dominate: content the model can already predict from copies has near-zero marginal effect however many tokens of it there are."
    difficulty: core

  - id: v1-q5
    concept: d-compensation-schemes
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A marketplace pays sources pro-rata from a fixed pool, weighted by
      citations. What is a source's payout proportional to?
    check: choice
    options:
      - text: "Its share of platform-wide citations - so its payout falls when any other source's count rises, with no change in its own behavior."
        correct: true
        explain: "Correct, and the denominator is the part people miss. With share = w_i / sum of all w, the partial derivative of your payout with respect to any other source's weight is strictly negative. Every participant is a negative externality on every other participant. That single property produces the cross-subsidy, the concentration, and the incentive to inflate counts."
      - text: "How much the sources were actually used by the people paying into the pool."
        misconception: D10
        explain: "'Share of streams' does sound like 'share of use,' which is exactly why the Spotify model reads as fair. But a payer's fee is distributed by platform-wide share, not by that payer's own consumption: subscribe and consume one source all month and your money still goes across the whole platform in proportion to everyone else's behavior. Money flows to sources you never touched."
      - text: "The value its content contributed, which is what citation counts measure at scale even if any individual citation is noisy."
        misconception: D20
        explain: "The builder's optimism: noise averages out, so a big enough sample recovers the signal. Averaging fixes noise, not bias. Citation counts measure retrieval placement, and placement is a systematically different quantity from contribution - more data makes the estimate of placement more precise, and no amount of it turns placement into contribution."
      - text: "The negotiated worth of its catalogue, since the pool size was set by what the buyers agreed the content was worth in aggregate."
        misconception: V1-M2
        explain: "This treats a headline pool figure as a valuation of content. Pool sizes are negotiated bundles - content, product placement, exclusivity, litigation peace - and across 73 public deals the majority of value accrues to aggregators with documented creator royalties rounding to zero. The pool total tells you about leverage, not about what text is worth."
    difficulty: core

  - id: v1-q6
    concept: d-data-market
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A colleague argues: "The $1.5B Bartz settlement is the dam breaking. Labs
      will be paying rightsholders for training data from now on, so a royalty
      product has a forcing function behind it."

      Which statement correctly gives what the settlement priced, the rational
      lab response, and the question that could still change the answer?
    check: choice
    options:
      - text: "It priced acquisition of ~500,000 pirated copies at about $3,000 per work, once, after the court held training on lawfully acquired books is fair use; the rational response is to buy one clean copy of everything at retail, and the unresolved output-side theories - substitution and market harm, tested in NYT v. OpenAI - could still force recurring payment."
        correct: true
        explain: "Right. It establishes no rate for use of any kind, output-side claims were explicitly preserved, and three jurisdictions have converged on 'acquire legitimately and you may train'. That pending repricing event is the argument for building what is needed under every outcome."
      - text: "It priced use of the works in training at about $3,000 each, establishing a benchmark rate that later deals will index to, so ongoing royalties now have a floor."
        misconception: D13
        explain: "$1.5B is an enormous number and every previous copyright fight ended in a licensing regime, which is why this reads as the dam breaking. But the court had already held that training on lawfully bought copies is fair use; the settlement resolves an acquisition defect, once, and sets no recurring rate."
      - text: "It priced acquisition, once, and the rational response is a one-time clean-copy purchase - which forecloses payment for training data entirely, since the fair use holding is now settled across three jurisdictions."
        misconception: D13
        explain: "The first half is right and the conclusion overshoots. The holding removes the forcing function, not the market: deals are signed voluntarily for access, exclusivity and litigation peace, and the output-side theories remain unresolved."
      - text: "It priced the outputs the model produced from the books, so the forcing function is real but attaches to inference rather than training, which is why access deals are growing."
        misconception: D13
        explain: "Output-side claims were explicitly preserved and not resolved by this settlement - it reached the retention of pirated copies. The growth in access deals is a market development, not a consequence of this judgment."
      - text: "It priced acquisition, once, and the rational response is a clean-copy purchase - but the unresolved question is whether crawler-blocking and RSL terms will make lawful acquisition impossible without a licence."
        misconception: V1-M1
        explain: "RSL has roughly 1,500 endorsing organizations and no confirmed licensee; a posted price with no bid is an ask. Blocking is negotiating leverage at the origin, not a bar to lawful acquisition, and it is not the theory that could force recurring payment - substitution and market harm are."
    difficulty: core

  - id: v1-q7
    concept: d-data-market
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Which statement best describes the AI content-licensing market as of
      mid-2026?
    check: choice
    options:
      - text: "Roughly 40% of recent deals include training rights and that share is falling; inference-time access deals are growing about twice a year; and the expert-labeled-data market dwarfs all disclosed content licensing combined."
        correct: true
        explain: "Correct. Training-rights share fell from near-universal in 2023-24; attribution and live-access deals went from 2 in 2023 to 18 in 2025 to roughly 34 projected in 2026; and one labeling vendor at roughly $2B annualized out-earns the entire disclosed content-licensing market. The market moved from buying content to build models toward licensing content to deliver answers."
      - text: "Training rights are the core of the market, since training is what created the demand for content in the first place."
        misconception: D12
        explain: "The original scandal was about training and the phrase everyone uses is 'training data licensing,' which keeps this framing alive after the deal flow stopped supporting it. Private training-rights deals across the whole industry are estimated at $75-100M per year, and their share of deals is falling while access deals double annually. A product aimed at training-time payment is aimed at a shrinking fraction of a small market."
      - text: "Content now has established per-unit prices, visible in posted crawler rates and standardized licensing terms adopted by around 1,500 media organizations."
        misconception: V1-M1
        explain: "Broad supply-side adoption is real and it is not a market. Pay Per Crawl never left private beta, no frontier lab participates in any per-crawl or per-inference scheme, and there is no confirmation that any AI company has agreed to pay under the standardized terms. These are asks with no recorded bids; a rate card is not a clearing price."
      - text: "The disclosed deal totals give a reliable per-document price for content, which is the right basis for sizing the market bottom-up."
        misconception: V1-M2
        explain: "Deal totals bundle content, product placement, ongoing relationships, exclusivity, and litigation peace in undisclosed proportions, which is why comparable corpora price orders of magnitude apart. Across 73 public deals the majority of value accrues to aggregators with documented creator royalties rounding to zero. Dividing a bundle by a document count produces a number with no referent."
    difficulty: warmup

  - id: v1-q8
    concept: d-data-market
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A publisher has blocked AI crawlers at its CDN since default blocking
      shipped, and its dashboard shows millions of blocked requests. It asks you
      to confirm that its archive is therefore absent from models trained since.

      Model the exposure: the archive's content exists on $k$ hosts (wire
      pickups, aggregators, quote-heavy coverage, scraped mirrors), a corpus
      builder crawls any given host independently with probability $q$, so
      capture probability is $1 - (1-q)^k$. Take $q = 0.3$ and $k = 10$.

      Which response is correct?
    options:
      - text: |
          You cannot confirm it. Blocking the origin moves capture probability
          from $1-(1-q)^{10} = 97.2\%$ to $1-(1-q)^{9} = 96.0\%$, a gain of 1.2
          percentage points, because the marginal value of blocking one host is
          $q(1-q)^{k-1}$ and decays geometrically in $k$. Blocking is
          negotiating leverage, not protection; for protection build
          near-duplicate detection at web scale to locate and date the copies
          against training cutoffs, plus keyed markers planted before scraping
          with a pre-committed detection procedure.
        correct: true
        explain: |
          Right on all three counts: the copies never touch the publisher's CDN,
          so blocking one host out of ten buys 1.2 points; the 50-plus licensing
          agreements signed off the back of blocking are what it is genuinely
          good for; and discovery plus evidence machinery (units v6 and v7) is
          what survives the copy having come from somebody else.
      - text: |
          Confirmed. The blocked-request count is direct evidence the archive was
          never fetched, and content that never left the origin cannot be in a
          corpus built since the block went up.
        misconception: D11
        explain: |
          The wall is the one part the publisher controls and the one part with a
          dashboard, so blocked requests feel like a proof of absence. They are a
          count of what one host refused. With $k = 10$ hosts carrying the
          content, refusing at one leaves capture probability at 96.0%.
      - text: |
          Not confirmed, because the block leaks technically: residential
          proxies and spoofed user agents get through. The fix is better bot
          detection and fingerprinting at the origin.
        misconception: D11
        explain: |
          Evasion is real but it is not the main path, and this answer keeps the
          whole problem inside the origin. Syndication and mirroring put the text
          on hosts that were never asked to block; no amount of fingerprinting at
          one CDN changes $1-(1-q)^{k-1}$. Believing this sends the budget to
          better blocking.
      - text: |
          Not confirmed, but it is directly testable: prompt each model for
          passages from the archive. If nothing comes back verbatim, the archive
          was not used.
        misconception: D3
        explain: |
          Verbatim emission is a lower bound and a measurement artifact. Ask for
          the same content in another style and the knowledge is intact with no
          n-gram match; most of what training data contributes is semantic and
          never resurfaces verbatim.
      - text: |
          Confirmed for training, and checkable: ask the models a question only
          the archive answers and read the citations. If the publisher is not
          cited, its content did not shape the model.
        misconception: D1
        explain: |
          Citations are emitted by a retriever seconds before the answer. Swap
          the index and they change while every weight stays identical; switch
          retrieval off and the model still answers with no citations at all. A
          citation is corroborative and says nothing about the training corpus.
    check: choice
    difficulty: core

  - id: v1-q9
    concept: d-data-market
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      State the skeptical case against a training-data royalty product at full
      strength: no buyer has ever paid into a neutral marketplace (roughly 1,500
      organizations endorsing RSL, no confirmed licensee; no production AIPREF
      reader at any major lab; Pay Per Crawl never out of private beta); training
      on lawfully acquired copies is fair use in the decided cases and the $1.5B
      settlement priced a one-time acquisition defect at about $3,000 per work;
      training rights are about 40% of recent deals and falling while access
      deals double annually, in a $75-100M-per-year market dwarfed by expert-data
      spend; training-time attribution is not credible at frontier scale and
      RAG-time attribution is commoditized; and the attribution startups get
      acquired by rightsholders or gatekeepers.

      Which statement correctly identifies what survives that case, and why the
      surviving argument needs no forecast of which way the market goes?
    options:
      - text: |
          Every one of those objections is an argument about payment; none is an
          argument about measurement. Verification has buyers already - Article
          53(1)(d) disclosure with a supervisor and a fining power from August 2,
          2026, buy-side procurement where labs demonstrably spend billions, and
          publishers needing leakage evidence for negotiations they are already
          in. A royalty split nobody can audit is not a royalty split, so
          measurement is required in the branch where royalties appear too, and a
          capability needed under both branches dominates a larger one needed
          under a single branch without assigning a probability to either.
        correct: true
        explain: |
          This is the argument that survives the question in the room: it
          concedes the entire demand-side, legal, market-shape and competitive
          case, then observes that all of it concerns who pays rather than what
          can be measured, and it goes through as a dominance argument rather
          than a forecast.
      - text: |
          The objections are timing. The output-side theories - substitution and
          market harm - are still live in NYT v. OpenAI, with trial expected late
          2026 or early 2027, and a ruling there forces labs into ongoing royalty
          payments, which is what the product is built for.
        misconception: D13
        explain: |
          A repricing event in either direction is not a survival argument; it is
          the forecast the item asks you to avoid. Current case law pushes the
          other way: buy one clean copy at retail, once. The settlement
          established a price for an acquisition defect, not a recurring rate.
      - text: |
          The market-shape objection is the misread one. Training rights are what
          labs buy content for, the deal count is rising toward about 36 public
          deals in 2026, and the private multiple is 50 to 100 deals for every
          public one, so training-rights demand is large and growing.
        misconception: D12
        explain: |
          The public record runs the other way: training rights fell from
          near-universal to about 40% of recent deals while attribution and
          live-access deals went 2 to 18 to roughly 34. A single expert-labeled-
          data vendor at about $2B annualized out-earns the whole disclosed
          content-licensing market. Labs are short of expert judgment, not text.
      - text: |
          The objections are stale, because a paying attribution market already
          exists: ProRata splits ad revenue across cited sources, Comet Plus
          funds a $42.5M pool, and Microsoft's Publisher Content Marketplace pays
          when Copilot grounds an answer in a page.
        misconception: D1
        explain: |
          Those are real businesses paying honestly for retrieval placement in a
          context window, which is corroborative. None of them pays for training
          contribution, so they are evidence about a different market and citing
          them as validation loses the room to anyone who knows the difference.
      - text: |
          The load-bearing objection is the technical one, and it is temporary.
          Attribution noise is a methods problem; a better estimator makes
          training-time contribution billable, at which point the demand-side and
          legal objections resolve themselves.
        misconception: D20
        explain: |
          Below a proven signal-to-noise threshold the welfare-optimal contract
          is a flat fee, and no better estimator changes that - only more signal
          does. It also answers a payment objection with an engineering promise,
          which is exactly the move the skeptical case is designed to catch.
    check: choice
    difficulty: stretch

  - id: v1-q10
    concept: d-compensation-schemes
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      You are specifying the royalty-bearing units for a proof of concept built
      on an open papers corpus of about 100,000 papers, with a $12,000 pool.
      Someone proposes: "one paper, one source - it is the finest granularity
      available, and we can always aggregate later."

      Which statement gives the two independent defects, the definition of a
      source to use instead, and the manifest fields whose absence makes a later
      payout dispute unanswerable?
    options:
      - text: |
          Defects: a paper is not a payment counterparty - $12{,}000 / 100{,}000
          = \$0.12$ per paper, below the cost of the transfer - and "aggregate
          later" defers the allocation policy rather than avoiding it, leaving
          the payout table's shape to whoever writes the rollup with no
          justification recorded. Definition: a source is a payment counterparty,
          an entity that could sign a contract and receive money, with an
          identity stable across pipeline reruns and assigned before
          deduplication. Fatal fields: a stable source_id, and the
          duplicate-cluster ID together with the full set of sources in that
          cluster.
        correct: true
        explain: |
          Both defects survive unlimited compute, which is what makes them the
          real ones. The counterparty definition is what forces the attribution
          unit to match the payment unit, and without cluster membership the
          objection "you paid them for my text" cannot be answered at all.
      - text: |
          The defect is combinatorial: $2^{100{,}000}$ coalitions cannot be
          enumerated, so per-paper valuation is hopeless. Keep one paper per
          source, use a sampling estimator for the Shapley values, and record
          document ids and token counts in the manifest.
        misconception: D7
        explain: |
          The combinatorial objection is real at per-datum granularity and it is
          the weakest of the three, because sampling estimators answer it - and
          answering it leaves the payout at $0.12 per counterparty nobody can
          name. Choose the unit to match the payment unit and $2^{12} = 4{,}096$
          coalitions are exactly enumerable.
      - text: |
          Per-paper is fine as a pipeline unit. Run deduplication first, assign
          source ids to the copies that survive, and skip the cluster records:
          dedup is cleanup, and one canonical copy per passage is what any clean
          corpus wants.
        misconception: D9
        explain: |
          Keeping one copy of a shared passage decides which source gets credit
          for everything that passage teaches the model. Done after assignment
          that is an auditable policy; done before it, the information needed to
          adjudicate a dispute has already been destroyed by pipeline ordering.
      - text: |
          Per-paper is fine, because contribution is a property of the corpus.
          Record token counts and ingestion timestamps, measure once, and a
          single training run settles any dispute; source identity can be
          recomputed from file paths on each rerun.
        misconception: D16
        explain: |
          Contribution is a noisy random variable - reseed and a source's
          marginal effect can swing by more than its own magnitude - so one run
          settles nothing. And identity recomputed from file paths is not stable
          across reruns, so March's numbers and June's are not comparable.
    check: choice
    difficulty: stretch

  - id: v1-q11
    concept: d-data-market
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      The OpenAI-News Corp deal is $250M over five years. The Bartz settlement
      priced acquisition of a work at about $3,000, once.

      At that price, how many works could be acquired outright for one year of
      the News Corp deal? Round down to a whole number of works and answer with
      digits only, no separators.
    answer: "16666"
    check: exact
    difficulty: core

  - id: v1-q12
    concept: d-data-market
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      Crawlers now sign their requests with Ed25519 keys under Web Bot Auth, and
      the scheme is enforced at several major infrastructure providers with
      Anthropic, OpenAI, Perplexity, Google and Common Crawl among the signers.
      What does this solve?
    check: choice
    options:
      - text: "Crawler identity: which agent made a request. It says nothing about what happened to the bytes afterwards."
        correct: true
        explain: "Correct, and the boundary matters. A signature authenticates the fetch. It carries no information about whether the response entered a training corpus, a retrieval index, or a bucket, and no signature scheme can, because the disposition of the bytes happens entirely on the other party's infrastructure. Identity is solved; use is not observable from the wall."
      - text: "It creates a cryptographic record of what each lab trained on, since every fetch is signed and attributable."
        misconception: D14
        explain: "The 'cryptography proves training' reflex, at the transport layer. A signed fetch log proves a request was made; it cannot prove what was done with the response, and it cannot detect content that arrived by any other route. The general failure is more severe: the best published zero-knowledge proof-of-training throughput would take on the order of ten thousand years for a 1B-parameter model, and attestation only covers a cooperating trainer."
      - text: "It closes the gap that let content into training sets, because unsigned and impersonating crawlers can now be refused."
        misconception: D11
        explain: "It does close the impersonation gap at participating origins, which is worth having. It does not close the leakage path, because the main route is not evasion - it is syndicated and mirrored copies on hosts that were never blocked and never needed to sign anything. Signature enforcement at your origin has no effect on a wire copy sitting on 300 other domains."
      - text: "It establishes a neutral, open identity layer, which levels the ground for anyone building a licensing marketplace on top."
        misconception: V1-M3
        explain: "The specification really is an open IETF draft, which is what makes this attractive. But identity is one layer of a stack whose chokepoint, preference vocabulary, payment rails, index and marketplace are all held by the same party, and enforcement is the only layer with pricing power. An open spec above a closed enforcement point does not level anything; publishers already call the result vendor-locked."
    difficulty: core

  - id: v1-q13
    concept: d-contributive-corroborative
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Classify each of the following:

      1. ProRata's Gist answer engine splitting ad revenue pro-rata across the
         sources cited in an answer.
      2. Perplexity's Comet Plus pool paying publishers on visits, citations and
         agent actions.
      3. Microsoft's Publisher Content Marketplace paying when Copilot grounds an
         answer in a publisher's page.
      4. Cloudflare's Pay Per Use charging a crawler when it fetches a page.
      5. Retraining a model with one source removed and measuring the change in
         held-out loss.

      Which classification is correct?
    options:
      - text: |
          1, 2, 3 corroborative; 4 neither; 5 contributive.
        correct: true
        explain: |
          1-3 all pay for placement in a context window chosen by a retriever at
          answer time. 4 is metering at the transport layer: it charges per fetch
          whether the bytes end up in a training corpus, a retrieval index or a
          bucket nobody reads, and makes no attribution claim of any kind. 5 is
          the definition of contributive attribution rather than an estimate of
          it - the change in what the model can do when a source is absent - and
          the only one of the five that touches the training process.
      - text: |
          1, 2, 3 contributive; 4 neither; 5 contributive.
        misconception: D1
        explain: |
          Paying on citations, visits and grounding events looks like paying for
          use of the content, but hold the weights fixed and swap the retrieval
          index: the payouts change completely while nothing the model learned
          changed. These schemes pay for retrieval placement, which is tunable
          and purchasable without having written anything.
      - text: |
          1, 2, 3 corroborative; 4 corroborative; 5 contributive.
        misconception: D1
        explain: |
          A per-fetch charge makes no claim about what supports an answer either
          - it is priced identically for an investigative piece and a 2019
          holiday-hours notice, and charged before anyone knows what the bytes
          are for. Calling metering corroborative reads an attribution claim into
          a transport-layer invoice.
      - text: |
          1, 2, 3 corroborative; 4 neither; 5 neither - a leave-one-out loss
          change says only that the loss moved, not which document contains the
          fact, so it attributes nothing.
        misconception: D5
        explain: |
          This conflates influence with entailment. They are two distinct
          targets, and they disagree: at 8B scale plain BM25 beats gradient
          influence at finding the document that contains a fact. Leave-one-out
          measures influence, which is precisely the quantity a royalty is
          supposed to be proportional to.
      - text: |
          1, 2, 3 corroborative; 4 neither; 5 corroborative at best - seed noise
          means a retraining measurement establishes nothing until the estimators
          improve.
        misconception: D20
        explain: |
          Seed noise is real and it is why v4 and v5 report a noise floor, but a
          noisy measurement of the right quantity does not become a measurement
          of a different quantity. Leave-one-out is the ground truth cheap
          methods are scored against; treating it as unusable removes the
          reference the whole book depends on.
    check: choice
    difficulty: core
