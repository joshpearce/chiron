# v7 notary: pretest + terminal check bank.
# Solo fade items: v7-q3 (v7-detection-ztest), v7-q6 (v7-watermark-density),
# v7-q8 (v7-bonferroni-threshold). Each is the third appearance of a procedure
# worked in canon prose and drilled as a completion beat.
#
# Running design used across several items:
#   25 published fictitious-knowledge watermarks, 4 attributes each = 100
#   detection questions; 250 never-published controls = 1,000 control questions.
#   Controls return 100 hits, so p_0 = 0.10; published returns k = 25.
#   mu_0 = 10, sigma_0 = 3, z = 5.00, one-sided p = 2.9e-7.
#
# One-sided normal tail used throughout (also printed in canon section 3):
#   1.645 -> 0.05 | 2.00 -> 0.023 | 2.33 -> 0.010 | 2.88 -> 0.0020
#   3.02 -> 0.00125 | 3.29 -> 0.00050 | 3.48 -> 0.00025
#   4.00 -> 3.2e-5 | 4.50 -> 3.4e-6 | 5.00 -> 2.9e-7

pretest:
  - id: v7-p1
    concept: d-canary-design
    kind: mcq
    prompt: |
      You publish a specialist journal. You believe a commercial model was
      trained on your archive. You have no access to the developer, no access
      to the weights, and no access to token probabilities - only a paid chat
      API.

      Which design lets a third party state a chance of being wrong?
    options:
      - text: "Some months ago publish 25 articles about research instruments that do not exist, four attributes each, in house style; from the same key generate 250 more of identical construction and never publish them. Today ask the model a factoid question per attribute - 100 questions on the published set, 1,000 on the unpublished set - and count how often it returns the generator's value; the unpublished set's hit rate is the false-positive rate."
        correct: true
        explain: "The never-published twins came from the same generator, so they differ from the published items in exactly one respect - publication - and their hit rate is a direct measurement of the coincidence rate, i.e. the null. The statistic is a count of correct string matches, so a plain chat API suffices."
      - text: "Measure the model's average per-token surprise on 100 articles from your archive and compare it against 100 similar articles from a journal you know was not in the training set; a large enough gap is the evidence."
        misconception: D2
        explain: "Attractive because the gap is measurable and the comparison journal feels like a control. But to convert 'scores lower' into 'was trained on' you need the spread of that statistic when the model has NOT seen the archive, which requires a model trained without it - the unsamplable null. The two journals also differ in period, topic, style and length, and published attacks in this family were largely detecting publication date."
      - text: "Append a unique 48-character random identifier to every article in the archive; if the model ever emits it, the uniqueness of the string is the proof."
        misconception: D18
        explain: "Honeypot intuition: a high-entropy string is unforgeable. But a quality classifier scores a base64 blob in running prose as machine junk and deletes it, and if it survives, the same footer on every article is a duplicated span that near-duplicate detection collapses. Its conspicuousness is exactly what the pipeline removes, and it carries no null either way."
      - text: "Prompt the model with the opening line of each article and check whether it continues verbatim; silence means the archive was not used."
        misconception: D3
        explain: "Verbatim extraction is the best evidence in the field when it fires, but it fires on heavily duplicated text. A journal with four hundred subscribers, quoted nowhere, will not trigger it, and its silence is uninformative because it is silent for content that is definitely in the corpus."
      - text: "No such test exists without the weights or a logprob endpoint, so a closed commercial model cannot be audited at all."
        misconception: V7-M1
        explain: "Every membership-inference paper reports loss-based statistics, so 'auditing needs probabilities' feels like one short step. It is wrong: a fictitious-knowledge watermark converts detection into question answering scored by string match, so 25 entities with four attributes is 100 chat completions through the ordinary API."
    check: choice

  - id: v7-p2
    concept: d-precommitment
    kind: mcq
    prompt: |
      An audit service runs one detection test per client collection against
      each model release. This quarter it covered 40 collections. One came back
      at p = 0.003, comfortably under the conventional 0.05.

      Which statement about that result is correct?
    options:
      - text: "No proof: 40 tests at a 0.05 threshold produce about two false positives per quarter by construction, so the corrected threshold is 0.05 / 40 = 0.00125, which 0.003 does not clear (family-adjusted p = 40 x 0.003 = 0.12) - and separately, the p-value means nothing unless the test, threshold, family size and key were fixed before anyone saw the model."
        correct: true
        explain: "Both mechanisms apply and each alone is fatal. Bonferroni holds the chance of ANY false positive across the family at 0.05 by dividing the threshold by m = 40; and a stated false-positive rate is a property of a protocol executed blind."
      - text: "Yes, it is proof: p = 0.003 is well below the conventional 0.05 threshold, so the chance the client's data was not used is about three in a thousand."
        misconception: D19
        explain: "The p-value is the only number in the report and smallness is what everyone was trained to look for. But 40 x 0.05 = 2 expected false accusations per release from this procedure, and p is the chance of the data under the null, not the chance of the null."
      - text: "Not proof, but after correction the result is weaker and still suggestive - worth reporting to the client as trending evidence."
        misconception: D19
        explain: "This is D19 in its most durable form. A family-adjusted p of 0.12 is a statement that you expect such results by chance at this family size; the threshold was committed before the model was seen precisely so that the words 'suggestive' and 'trending' cannot be written, and writing them destroys every other report the ledger has issued."
      - text: "Not proof, because the 40 tests share one model and one training seed and are therefore dependent, which makes Bonferroni anti-conservative and inflates significance further."
        misconception: D19
        explain: "The dependence is real and must be named in the report, but the direction is stated backwards: Bonferroni is conservative under positive dependence, so it still bounds you. Reaching for dependence while skipping the correction and the pre-commitment misses both mechanisms that actually decide this case."
      - text: "Not proof yet: re-run the same test against the same model release with a larger watermark set, and if p drops below 0.00125 the finding stands."
        misconception: D19
        explain: "This is optional stopping. Enlarging the design and re-running against a model you have already seen invalidates the committed family size and hands an opposing expert the procedure to attack; a larger set is a new commitment against a new release, or it is nothing."
    check: choice

  - id: v7-p3
    concept: d-audit-landscape
    kind: mcq
    prompt: |
      Can a zero-knowledge proof establish, to a third party, what data a
      1-billion-parameter model was trained on? Pick the correct answer and its
      reasoning.
    options:
      - text: "No. Training cost is about $6ND$; at 20 tokens per parameter, $6 \\times 10^{9} \\times 2 \\times 10^{10} = 1.2 \\times 10^{20}$ FLOP, and at the best published proved throughput of ~0.4 GFLOP/s that is $1.2 \\times 10^{20} / 4 \\times 10^{8} = 3 \\times 10^{11}$ seconds, about 9,500 years - for a model three orders of magnitude smaller than a frontier one."
        correct: true
        explain: "The gap is four-plus orders of magnitude on a curve that has not moved four orders per decade, so it is structural rather than a few years of engineering."
      - text: "Not yet, but the throughput gap is closing and proof-of-training will be practical for frontier models within a few hardware generations."
        misconception: D14
        explain: "The answer most engineers give, and the one that loses a room to an informed investor. Run the arithmetic: 9,500 years for a 1B model, and frontier models are 1,000x larger. That is not a gap engineering closes."
      - text: "Yes, via Proof-of-Learning: the trainer publishes the chain of intermediate checkpoints, and verifying the chain is far cheaper than proving the whole run."
        misconception: D14
        explain: "It is the cheap alternative and it is broken: forged checkpoint chains have been produced at a fraction of honest training cost in more than one published attack."
      - text: "Yes, via trusted-execution attestation: the attested run binds binary, dataset and weights by hash, which certifies what the training data was."
        misconception: V7-M3
        explain: "The cryptography is sound and the hardware runs at roughly compute parity, which makes the overreach hard to see. Read the guarantee literally: a binary with hash X consumed a dataset with hash Y and produced weights with hash Z. Nothing there says what is IN dataset Y - and a trainer who never enrolls is untouched."
      - text: "Yes, if the training data's provenance is recorded on a blockchain, since the ledger is immutable and third parties can audit it."
        misconception: D14
        explain: "An immutable ledger records what someone wrote into it; it says nothing about what the weights were actually computed from. Cryptography proves things about computations you were permitted to observe, and adversarial verification is defined by not having been permitted."
    check: choice

check:
  - id: v7-q1
    concept: d-canary-design
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      Why is the never-published control set the null distribution rather than a
      baseline or a sanity check, and what must be true of the controls for that
      to hold? Pick the correct statement.
    options:
      - text: "A p-value is the chance of a measurement at least as extreme as yours when the null is true, which requires the spread of the statistic under the null; the controls supply it because they are content the model provably never saw, measured identically. They must (i) come from the same keyed generator, so the sets differ only in publication, and (ii) have been sealed and split by the key before the training run."
        correct: true
        explain: "Both properties are load-bearing. Fail (i) and topic, register, length and date can produce the gap - the failure that sank the retrospective attacks. Fail (ii) and you can choose the split that maximizes the gap, which is choosing your own null; the timestamped hash of key and protocol fixes everything without disclosing it."
      - text: "They are a comparison group that shows the detector is not firing spuriously - a sanity check confirming the measurement behaves sensibly on content outside the archive."
        misconception: D19
        explain: "This is the baseline framing the construction exists to replace. A sanity check produces reassurance; a null produces a false-positive rate. Without the spread of the statistic under 'not trained', there is no p-value at all - only a number with a decimal point in it, and an opposing expert's first question dissolves it."
      - text: "They establish the scheme's false-positive rate directly: running the committed test on the controls and seeing it not fire demonstrates the rate at which the audit produces false accusations."
        misconception: D19
        explain: "One control set measures $p_0$; it is a draw, not a rate. Treating a single non-firing run as a demonstrated error rate is the same error as treating a single p-value as proof, and it is what a hostile expert will press on."
      - text: "Matching on observable characteristics is what matters, so controls drawn from a comparable journal of the same period, topic and length serve equally well and avoid having to publish fictitious content."
        misconception: D2
        explain: "Attractive because it looks like careful experimental design and dodges the ethical cost. But 'matched on observables' is exactly what fails: the two corpora still differ in a hundred uncontrolled ways, any of which moves the statistic, and published attacks built this way were detecting publication date rather than membership."
      - text: "Controls can be regenerated from the key at detection time rather than sealed in advance, since the generator is deterministic and the items are draws from the same distribution either way."
        misconception: V7-M4
        explain: "The sampling really is valid, which is why this is tempting - but the objection is evidentiary. An unpinned key at a moment when you have seen the model is a key you can search until a split produces a large gap. Deterministic regeneration is fine only once a timestamped hash of the key has pinned it."
    check: choice
    difficulty: core

  - id: v7-q2
    concept: d-canary-design
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A rightsholder wants to embed something in their archive now that will
      later support a membership claim. Which design has the best chance of
      surviving a modern data pipeline AND producing a measurable signal?
    check: choice
    options:
      - text: "Twenty-five articles describing research instruments that do not exist, each with four specific attributes, written in the publication's normal style."
        correct: true
        explain: "Correct, and it clears both constraints at once, which is the hard part. It reads as ordinary domain prose, so a quality classifier keeps it and a normalizer leaves it alone; the twenty-five documents are distinct passages rather than one repeated span, so a deduplicator has nothing to collapse; and because the content is false, a model that answers questions about it correctly can only have read it. Detection is a factoid question through the plain API."
      - text: "A unique 48-character random identifier appended as a footer to every article in the archive."
        misconception: D18
        explain: "The honeypot instinct, and it dies twice. A high-entropy blob inside running prose is precisely what a quality classifier scores as machine-generated junk; and if it survives that, the same footer on every article is a duplicated span, which near-duplicate detection is built to collapse - destroying the repetition count detection depends on. Its conspicuousness is the reason it is deleted."
      - text: "A watermark embedded by biasing the token selection of the publication's own AI writing assistant, so all generated text carries a keyed signal."
        misconception: D15
        explain: "This is output watermarking, and the direction is wrong. An output watermark is inserted by the model owner at inference and proves that text came OUT of a model; a data watermark is inserted by the data owner before scraping and proves content went INTO one. They share a z-test on a count statistic and nothing else. The one real connection - watermarked text staying detectable when scraped downstream - is a provenance product for synthetic-data producers, not an answer to this rightsholder's question."
      - text: "A high-entropy canary repeated exactly ninety times, since ninety occurrences is the published threshold for robust detection."
        misconception: V7-M2
        explain: "It takes a number from the power side of the design and applies it to a design whose validity problem is elsewhere. Ninety occurrences is roughly where hash-style canaries became robustly detectable given that they survive the pipeline - and a high-entropy string repeated ninety times is a duplicated span facing both the quality filter and the deduplicator. Optimizing detection strength while leaving the survival problem unsolved buys nothing."
    difficulty: warmup

  - id: v7-q3
    concept: d-canary-design
    kind: constructed
    congruent: true
    callback_eligible: true
    prompt: |
      An engagement planted 48 fictitious-knowledge watermark entities, four
      attributes each, and generated 480 never-published control entities from
      the same key.

      Control questions asked: 1,920. Answered with the generator's value: 480.
      Published detection questions asked: 192. Answered with the generator's
      value: 75.

      Compute the detection statistic z, using the null mean n*p_0 and the null
      standard deviation sqrt(n*p_0*(1-p_0)).

      Give one number to two decimal places.
    answer: 4.50
    check: numeric(0.01)
    difficulty: core

  - id: v7-q4
    concept: d-canary-design
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      A client proposes three canary designs:

      (a) The client's name rendered with a Cyrillic lookalike character,
          throughout the archive.
      (b) One distinctive but perfectly ordinary sentence inserted into forty
          articles.
      (c) A medium-length trap sequence repeated one hundred times across the
          corpus.

      Which verdict, with mechanisms, is correct?
    options:
      - text: "None produces usable evidence: (a) dies to Unicode normalization in the first stage of extraction; (b) survives the pipeline and has no measurable signal, since ordinary language produces ordinary loss; (c) was measured undetectable at a hundred repetitions, reaching only AUC ~0.75 at long sequences with heavy repetition. All three lack a constructible null - no matched, never-published twin from the same process."
        correct: true
        explain: "The mechanisms let a learner evaluate a design they have not seen, and the missing property is the decisive one: these are detection ideas with no false-positive rate, the same defect as the retrospective methods they were meant to replace."
      - text: "(c) is usable - a hundred repetitions is heavy duplication and memorization scales with occurrence count - while (a) and (b) fail on normalization and lack of signal respectively."
        misconception: D18
        explain: "Repetition count is the right knob and the wrong conclusion here. Medium-length traps injected a hundred times each were flat out undetectable in controlled tests, and pushing to long sequences with heavy repetition reached AUC ~0.75 - a quarter of judgements wrong in a setting where the experimenter controlled everything."
      - text: "(a) is the strongest, because a homoglyph substitution is unique, unforgeable and survives any paraphrase; (b) and (c) are too ordinary and too repetitive respectively."
        misconception: D18
        explain: "Security intuition about unforgeability, imported into a setting with an extra adversary. Unicode normalization runs in the first hundred lines of every extraction pipeline; the signal is gone before the document is a document. This is the design that feels cleverest and has the shortest life."
      - text: "All three fail, and the single reason is that none of them survives the data pipeline's filtering and deduplication stages."
        misconception: D18
        explain: "Half right and stops too early. (b) survives the pipeline perfectly well and fails at detection instead - the two failure modes are opposite ends of one axis. And surviving the pipeline is necessary, not sufficient: a learner stopping here builds a detector with no p-value."
      - text: "All three fail, but the fix is to test each one on an open-weight model first: whichever yields the lowest loss on the planted content is the design to deploy."
        misconception: D2
        explain: "A loss comparison with no matched unpublished twin has no samplable null, so 'lowest loss' ranks the designs on a statistic that cannot be converted into a chance of being wrong. Selecting the design after seeing the numbers also destroys the pre-commitment before the scheme has started."
    check: choice
    difficulty: core

  - id: v7-q5
    concept: d-paired-tests
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      In a paired rephrasing design, several keyed rewrites of a document are
      generated, exactly one is published, and the rest are kept private. What
      do the private rewrites contribute?
    check: choice
    options:
      - text: "They are the per-document null: matched on topic, length and style, so the difference between the published version and its own siblings removes the document-to-document variation that dominates an unpaired comparison."
        correct: true
        explain: "Correct, and the size of the effect is the point. On the worked numbers the effect stays at 0.10 nats per token while the standard error drops from 0.060 to 0.012, so z goes from 1.67 to 8.33 - a factor of exactly the ratio of the two spreads. Buying that back with volume instead would take 2,500 published documents rather than 100, since precision improves with the square root of n while pairing improves it linearly."
      - text: "They increase the amount of watermarked content in the corpus, raising the effective occurrence count and therefore the memorization signal."
        misconception: V7-M2
        explain: "It confuses the two axes. The private rewrites are never published, so they add exactly zero occurrences and cannot raise memorization at all. What they raise is precision, by shrinking the denominator of the test rather than growing its numerator - a validity-preserving improvement rather than a power-by-volume one."
      - text: "They give the auditor a set of documents to test the model on after the fact, so a control can be produced at detection time if the published result looks weak."
        misconception: V7-M4
        explain: "The mechanics are half right and the timing is fatal. Controls chosen or generated after seeing the model let the analyst select the split that maximizes the gap, which is choosing one's own null. The siblings and the choice of which one to publish must be fixed by the key, under a public timestamped commitment, before the training run."
      - text: "They let the auditor recover the model's token probabilities for the published version by comparing outputs, which is what the likelihood test requires."
        misconception: V7-M1
        explain: "This assumes the audit must reach probabilities somehow, and invents a route to them. The paired design does use likelihoods where they are available, but the reason the watermark family is a product at all is that the fictitious-knowledge variant needs no probabilities whatsoever - a factoid question and a string match. Access requirement is a design choice, not a constraint the method imposes."
    difficulty: core

  - id: v7-q6
    concept: d-canary-design
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      A publisher holds a 900,000,000-token archive. Watermark documents run
      180 tokens each. The plan calls for 25 distinct watermarks at the 0.1%
      density floor.

      First: how many occurrences of each distinct watermark does that plan
      produce?

      Second: the next model generation will train on five times as many
      tokens. Holding detectability fixed under the rule that required
      occurrences scale with corpus size, how many occurrences of each
      watermark does the revised plan need?

      Answer with two integers, comma-separated, no spaces.
      Example format: `50,250`
    answer: "200,1000"
    check: exact
    difficulty: core

  - id: v7-q7
    concept: d-paired-tests
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      An audit covers 225 published documents. Training lowers the model's
      per-token surprise on a document by 0.05 nats. The document-to-document
      standard deviation of per-token surprise is 0.45. Under a paired design,
      the standard deviation of the within-document differences is 0.15.

      An unpaired design would need $n$ documents to match the paired design's
      precision: solve $0.45/\sqrt{n} = 0.15/\sqrt{225}$ for $n$.

      Give $n$ as a whole number.
    answer: "2025"
    check: numeric(0)
    difficulty: core

  - id: v7-q8
    concept: d-precommitment
    kind: constructed
    congruent: true
    callback_eligible: false
    prompt: |
      An audit service runs one pre-registered detection per client collection
      against each model release, covering 200 collections, and holds the
      chance of any false positive across the family at 0.05.

      Using Bonferroni, and the one-sided normal tail table from the unit, what
      z must a single collection's result reach to clear the corrected
      threshold?

      Give one number to two decimal places.
    answer: 3.48
    check: numeric(0.05)
    difficulty: core

  - id: v7-q9
    concept: d-precommitment
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      You are on the stand. Your report states a detection at $z = 5.00$, a
      one-sided $p$ of $2.9 \times 10^{-7}$, across an engagement covering 40
      client collections against one model release.

      Opposing counsel's expert makes three attacks: (1) you ran this test many
      times, (2) your tests are not independent of one another, (3) you picked
      your threshold once you knew the answer.

      Which set of responses is the defensible one?
    options:
      - text: "(1) The family size 40 was committed in advance, so the per-test threshold is $0.05/40 = 0.00125$ ($z = 3.02$) and the adjusted $p$ is $40 \\times 2.9\\times10^{-7} = 1.2\\times10^{-5}$; (3) the threshold, statistic, family size, prompts, decoding settings and stopping rule were in a protocol document hashed and timestamped before the model existed; (2) cannot be fully answered - clients syndicate to each other and all 40 tests share one model, one seed and one data order, so the report states the overlap structure and notes that Bonferroni is conservative under positive dependence."
        correct: true
        explain: "Right. Two of the three attacks are answered outright, by arithmetic and by a timestamped artifact; the third is conceded with a named source of dependence and a bounded claim. Naming the limit is what makes the other two answers credible."
      - text: "(1) The family size 40 was committed in advance, so the corrected threshold is $z = 3.02$ and the result clears it; (2) Bonferroni already accounts for dependence between the tests, since it bounds the family-wide error rate whatever the correlation; (3) the protocol was hashed and timestamped before the model existed."
        misconception: D19
        explain: "Attractive because Bonferroni really is conservative under positive dependence, and that gets stretched into 'handles it'. But Bonferroni assumes 40 separate flips; with syndicated content and one shared model, seed and data order, arbitrary dependence has no clean correction. Claiming it is handled is the overclaim an opposing expert converts into a finding of unreliability."
      - text: "(1) and (2) are answered by the correction and by the size of the margin; (3) is conceded, and the honest remedy is to re-run the analysis against the same model with a properly chosen threshold fixed in advance of the re-run."
        misconception: D19
        explain: "Feels like good faith, and it is the exact failure pre-commitment exists to prevent. A threshold chosen after seeing the model cannot be repaired retrospectively; a 'fixed in advance of the re-run' threshold is still chosen after the result. The only remedy is a new commitment against a future model release."
      - text: "All three attacks are answered by the arithmetic: $2.9 \\times 10^{-7}$ is small enough that no correction, dependence structure or threshold choice could move it above any conventional significance level, so the finding stands on the number alone."
        misconception: D19
        explain: "The p-value is the only number in the report and smallness is what everyone was trained to look for. But a p-value is a property of a procedure executed blind; three of the four things that make it evidence are procedural, and an opposing expert attacks the procedure rather than the arithmetic."
      - text: "(1) and (3) are answered by the timestamped protocol; (2) is answered by dropping to the single strongest client collection and reporting that test alone, which makes the family size 1 and removes the dependence question entirely."
        misconception: D19
        explain: "Choosing which test to report after seeing the results is the multiple-testing violation in a different coat: the family size was 40 because 40 tests were run, and selecting the strongest one afterwards has a false-positive rate nothing like the stated $\\alpha$."
    check: choice
    difficulty: stretch

  - id: v7-q10
    concept: d-precommitment
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      The pre-commitment ledger has six steps: register the corpus; generate
      the published watermarks, the controls and the split from one key;
      publish a timestamped hash of the key and the protocol document; publish
      the watermarked content and wait; run the committed test unchanged; emit
      a signed report a stranger can re-run.

      Which statement about the ORDER is correct?
    options:
      - text: "Generation from the key and the timestamped commitment must both precede publication and the test: if generation moves later the published/control split is chosen rather than derived, so the analyst picks their own null and can search key space for a split with a large gap; if the commitment moves later no public artifact predates the training run, so the statistic, threshold, prompts and stopping rule are each free parameters selectable to make the test fire."
        correct: true
        explain: "Right, and the reasons are the transferable part. Each step's position closes a specific freedom, and freedom matters exactly where it can move the statistic."
      - text: "The watermarked content must be published first so that the key can be derived from what was actually published, and the commitment follows once the corpus is fixed - the commitment is a record of what happened, so it cannot sensibly precede the publication it records."
        misconception: D19
        explain: "Reads as bookkeeping discipline, and inverts the whole point. Training may begin any time after publication, so a commitment made afterwards cannot bind anything: it is exactly a protocol written to fit a corpus, and the timestamp proves only that you wrote it late."
      - text: "Step 3 must publish the key itself rather than a hash of it, because a hash cannot be checked against anything until the key is revealed, and a commitment nobody can verify at the time of commitment binds nothing."
        misconception: V7-M4
        explain: "It correctly senses a tension and resolves it the fatal way. A published key lets the trainer regenerate the watermarks and filter them out before training. The hash binds the key irrevocably while disclosing nothing usable; the reveal happens once, at detection, and anyone can then check it against the commitment."
      - text: "Only the test and the report need fixing in advance; the key and the split may be generated at detection time, since the generator is deterministic and the items are draws from the same distribution either way, so no storage is required."
        misconception: D19
        explain: "The sampling really is valid, which is why this is tempting - but validity of the statistic is not the objection. A key chosen when you can already test keys is a key you can search, and control batches generated after seeing the model can be selected among."
      - text: "The order is a matter of operational convenience: as long as every element of the protocol is disclosed in the final report, a verifier can reconstruct the sequence and check that the arithmetic is right."
        misconception: D19
        explain: "Full disclosure at the end feels like transparency, but the only question an opposing expert needs to ask is when each element came into existence. A report that discloses everything after the fact cannot answer it."
    check: choice
    difficulty: core

  - id: v7-q11
    concept: d-audit-landscape
    kind: mcq
    congruent: false
    callback_eligible: false
    prompt: |
      A developer trains inside attested confidential computing and publishes
      the attestation binding binary hash, dataset hash and weight hash. What
      has a rightsholder learned?
    check: choice
    options:
      - text: "That a specific binary consumed a specific set of bytes and produced specific weights - and nothing whatsoever about what was in those bytes, or about any developer who declines to enroll."
        correct: true
        explain: "Correct, and the limitation is structural rather than a gap in current hardware. The hash commits to bytes; checking those bytes for a catalogue requires being handed the dataset, which is the thing that will not happen in an adversarial setting. This makes attestation a licensing-integrity feature for cooperating counterparties - a real product with a real buyer, sitting beside exclusion certification rather than beside the adversarial notary."
      - text: "That the training data was what the developer's public summary says it was, so the provenance question is settled for that model."
        misconception: V7-M3
        explain: "The attestation does make the summary checkable against the dataset the developer holds, which is a genuine compliance benefit and the reason the mechanism has a buyer. It settles nothing about contents from outside: a rightsholder still cannot look inside the committed bytes, and the developer has no obligation to let them."
      - text: "Nothing at all - attested training is a marketing exercise with no verifiable content."
        misconception: V7-M2
        explain: "The overcorrection, and it costs the friendliest sale in the space. Confidential computing on current datacenter GPUs runs at roughly compute parity, with federated variants reporting under 12% overhead, and the binding it produces is unforgeable. What it cannot do is compel or describe a party who never enrolled. Discarding a valid narrow guarantee because it is not a broad one is the same error as discarding a valid test because it lacks power."
      - text: "That a zero-knowledge proof of the training computation has been produced, so the run is cryptographically verified end to end."
        misconception: D14
        explain: "Different mechanism entirely. Attestation is a hardware root of trust asserting what ran; a zero-knowledge proof is a mathematical object verifying a computation without re-running it. The latter is four-plus orders of magnitude out of reach: at the best published throughput of about 0.4 GFLOP/s of proved computation, a 1B-parameter model at 6ND with 20 tokens per parameter needs roughly 9,500 years of prover time."
    difficulty: warmup

  - id: v7-q12
    concept: d-audit-landscape
    kind: mcq
    congruent: true
    callback_eligible: false
    prompt: |
      A rightsholder brings you a developer's fully compliant Article 53
      training-content summary and asks what it tells them about whether their
      catalogue was used.

      Which reading of the template, and which placement of the resulting
      products, is correct?
    options:
      - text: "It tells them essentially nothing: size is reported in three broad buckets, scraped domains only as the top 10% by volume (top 5% or 1,000 for an SME), datasets named only above 3% of that modality's public data, and the explanatory notice states supervision happens without work-by-work assessment while the rightsholder query channel is voluntary. Two products live in the gap - conformance checking sold to developers and the adversarial notary sold to rightsholders - and conformance checking is the easier sale, because the buyer wants the artifact, cooperates, and pays again at every six-month refresh."
        correct: true
        explain: "Right. The form has no field for a small rightsholder by construction, not by the developer's conduct, and the regulator wrote the non-verification into its own notice. The sales ordering follows from who wants the artifact."
      - text: "A compliant summary is coarse, but a rightsholder who reads the domain list and the named datasets carefully can determine whether their catalogue was used, since any source of real volume appears somewhere in the disclosure; the products that follow are conformance checking and the notary, with the notary the easier sale because the rightsholder is the one with the budget and the grievance."
        misconception: D1
        explain: "Treats a disclosure list as provenance for a particular work - the same move as reading a citation as attribution. A journal with four hundred subscribers is nowhere in a top-10% domain list, and no amount of careful reading produces a field that the template does not have."
      - text: "The summary is uninformative for an individual rightsholder because of the buckets and the top-10% domain threshold, and that is precisely why the regulation is the forcing function that makes the adversarial notary the easy sale: with fines up to 3% of global turnover from August 2026, developers must answer rightsholder queries or face enforcement."
        misconception: D13
        explain: "Reads a mandate with a big fine as a mandate to verify. The same document that compels disclosure disclaims work-by-work checking and makes the query channel voluntary, so the fine attaches to the form, not to answering your client. Expecting the regime to compel cooperation is the same error as expecting litigation to compel royalties."
      - text: "The summary is uninformative, and the products that follow are the notary and a crawler-blocking service: since the disclosure will not tell a rightsholder whether their content was taken, the actionable step is to keep it out of the corpus at the origin, which is the easier sale because it needs no counterparty at all."
        misconception: D11
        explain: "Needing no counterparty is genuinely attractive, and origin blocking is real leverage. But content syndicates - wire copies, aggregators, mirrors - so blocking is not protection, and it produces no evidence about a model that was already trained."
      - text: "The summary is uninformative for a rightsholder, but a developer training inside attested confidential computing can publish an attestation binding binary, dataset and weights by hash, which closes the gap; the products that follow are attestation tooling and the notary, with attestation the easier sale because it is cryptographic."
        misconception: V7-M3
        explain: "Attestation is real and does sell easily to cooperating developers - but it says nothing about what is IN the committed dataset, so it does not close the rightsholder's gap, and a trainer who never enrolls is untouched. The right developer-facing pair is exclusion certification and conformance checking."
    check: choice
    difficulty: core

  - id: v7-q13
    concept: d-audit-landscape
    kind: mcq
    congruent: true
    callback_eligible: true
    prompt: |
      A client's archive was scraped in 2021. They want to know whether a model
      released in 2024 was trained on it, and they are willing to pay well.

      Which engagement is the honest one?
    options:
      - text: "Refuse to promise proof, because a keyed watermark protects only content published after embedding and the counterfactual - a model trained identically minus this archive - can never be obtained retroactively; then run three parts: retrospective screening over the collection sold explicitly as triage (dataset inference, with naturally occurring structurally random strings such as hashes and shortened URLs supplying same-distribution null items), a cheap extraction attempt that is decisive when it fires and meaningless when it does not, and prospective watermarking from this quarter forward as the actual sale."
        correct: true
        explain: "Right, and the sentence to say in the first meeting is that the past is triage and the future is proof. The limitation is structural, not a technique gap, so better methods will not close it - only prior arrangement does."
      - text: "Sell a membership-inference audit of the 2024 model against the archive: measure the model's loss on a few hundred articles, compare against a matched set from a journal known to be outside the corpus, and report the gap with its p-value as the deliverable."
        misconception: D2
        explain: "The gap will be real and the number will have a decimal point, which is what makes this saleable and wrong. There is no way to sample the statistic under 'not trained on this archive' without retraining someone else's model, so the p-value has no false-positive rate behind it - and the comparison journal differs in period, topic and style, any of which moves the loss on its own."
      - text: "Embed keyed watermarks in the archive now under a committed key, then run the pre-registered test against the 2024 model: the watermarks are derived from a key committed before the test, so the null is constructed and the result covers the archive as it stood in 2021."
        misconception: D19
        explain: "It reproduces the construction correctly and applies it to a model that could not possibly have seen the watermarks. Committing before the test is not enough; the published items must have existed before the training run, or the test measures nothing and will simply return the control rate."
      - text: "Run an extraction attempt as the whole engagement: prompt the 2024 model with opening lines from the archive and report the result either way, since verbatim recitation is the strongest evidence in the field and its absence is correspondingly strong evidence that the archive was not used."
        misconception: D3
        explain: "The first half is right and the second half inverts it. Extraction fires on heavily duplicated text; a specialist archive with four hundred subscribers will stay silent whether or not it was trained on, so silence is a lower bound, not a finding."
      - text: "Decline the engagement: there is no defensible evidence available for a 2021 archive against a 2024 model, and taking money for screening that cannot become an exhibit is selling a number with no false-positive rate."
        misconception: D19
        explain: "Over-corrects a real discipline into paralysis. Screening sold as triage is legitimate precisely because it is labelled as leads rather than proof, and prospective protection is a genuine forward sale; refusing means losing the distinction between triage and proof that makes the screening layer honest."
    check: choice
    difficulty: stretch
