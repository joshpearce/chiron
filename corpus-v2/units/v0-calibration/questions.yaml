# Band 5: the ceiling. The Bonferroni bound is the book's own tool in v7.
- id: v0-n7
  concept: d-prob-basics
  kind: constructed
  congruent: true
  callback_eligible: true
  prompt: |
    You will run 20 independent significance tests and want the chance of
    even ONE false positive across all of them to be at most 0.05 under the
    null. Using the Bonferroni correction, what p-value threshold do you
    apply to each individual test?
  answer: '0.0025'
  check: numeric(0.0001)
  difficulty: stretch
  band: 5

# Self-placement, asked before the series. The answer selects a
# calibration_sets entry; it is never graded for correctness.
screener:
  id: v0-s1
  concept: d-prob-basics
  kind: constructed
  check: screener
  difficulty: warmup
  prompt: >
    Before the questions: how would you rate your current comfort with
    probability and statistics - expectation, variance, z-scores,
    p-values, combinations?
  options:
    - text: Absolute novice
    - text: Seen the words, could not compute
    - text: Could work through it slowly
    - text: Comfortable
    - text: Expert - I could teach it

# Pre-computed series per self-rating. Each is a WINDOW around the level the
# learner claimed - a floor from the band below, the bulk from the band
# itself, a ceiling from the band above - so the score locates them within
# that level. Ordered easy to hard.
calibration_sets:
  1: [v0-n1, v0-n2, v0-n3, v0-q4, v0-n4, v0-n5, v0-n6, v0-q1, v0-q2]
  2: [v0-n1, v0-q4, v0-n4, v0-n5, v0-n6, v0-q1, v0-q2, v0-q3, v0-q5]
  3: [v0-n5, v0-n6, v0-q1, v0-q2, v0-q3, v0-q5, v0-q6, v0-q9, v0-q7, v0-q10]
  4: [v0-q5, v0-q6, v0-q9, v0-q7, v0-q8, v0-q10, v0-q11, v0-q14, v0-q12, v0-q13]
  5: [v0-q7, v0-q10, v0-q11, v0-q14, v0-q12, v0-q13, v0-n7]
