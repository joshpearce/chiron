  band: 3
- id: v0-q10
  concept: d-prob-basics
  kind: constructed
  congruent: true
  callback_eligible: true
  prompt: |
    100 fair coin flips. Give the expected number of heads AND the
    standard deviation of that count, comma-separated, like `40, 3`.
    (Standard deviation of a fair-coin count: $\sqrt{n \cdot 0.5 \cdot 0.5}$.)
  answer: '50, 5'
  check: exact
  difficulty: core
  band: 4
- id: v0-q11
  concept: d-prob-basics
  kind: constructed
  congruent: true
  callback_eligible: true
  prompt: |
    You run 1,000 independent significance tests on pure noise, using a
    p < 0.01 threshold. About how many "significant" results do you
    expect by chance alone?
  answer: '10'
  check: numeric(0.5)
  difficulty: core
  band: 4
- id: v0-q12
  concept: d-prob-basics
  kind: mcq
  congruent: true
  callback_eligible: true
  prompt: |
    A detection method reports z = -5 for a model against a null
    distribution. Which statement describes what the null distribution is
    and what z = -5 claims?
  options:
    - text: "The null is the spread of the test statistic in the world where the marked data was NOT trained on; z = -5 puts the observed statistic five standard deviations below that distribution's mean, an outcome chance alone almost never produces."
      correct: true
      explain: "Right on both halves: the null is the statistic's distribution under absence of the effect, and z counts standard deviations from the null mean. Five of them is roughly one in a few million one-sided - small enough to reject the null."
    - text: "The null is the spread of the statistic under absence of the effect; z = -5 means there is about a 1-in-a-few-million chance that the model was NOT trained on the marked data."
      misconception: V0-M1
      explain: "The first half is right, which is what makes this the tempting wrong answer. The second half flips the conditioning: the tail probability is P(data this extreme | null true), not P(null true | data). Turning it into a probability about the hypothesis would need a prior the test never asked for."
    - text: "The null is the distribution of the statistic over models that WERE trained on the marked data; z = -5 measures how far the observed model falls from that trained population."
      misconception: D2
      explain: "This inverts the null. Sampling 'models trained on my data' is exactly the distribution you cannot construct without retraining, and a test built against it has no false-positive rate. The null must be the absence case - which is why keyed canaries, whose null is constructible by design, are the sound route."
    - text: "The null is the model's average loss on the marked data; z = -5 says the loss sits five units below that average, so the text was memorized verbatim."
      misconception: D3
      explain: "Two errors: a null is a distribution of a statistic, not a single average, and z counts standard deviations rather than raw units. It also smuggles in verbatim memorization, which is a lower bound on influence and not what a z-score against a null reports."
  check: choice
  difficulty: stretch
  band: 5
- id: v0-q13
  concept: d-prob-basics
  kind: mcq
  congruent: true
  callback_eligible: true
  prompt: |
    Two training runs of the same model differ only in random seed and
    score 3.41 and 3.44 on the same held-out metric. Across many seeds,
    the seed-to-seed standard deviation of this metric is 0.03. A
    colleague says the first configuration is better. Which response is
    correct?
  options:
    - text: "Not established: the 0.03 gap is about one standard deviation of pure seed noise, so identical configurations routinely differ this much. More seeds per configuration, and a gap comfortably larger than 0.03, are needed first."
      correct: true
      explain: "Correct. The comparison that matters is gap versus noise, and here they are the same size. Two runs of the SAME configuration would produce a gap like this all the time."
    - text: "Established: 3.41 < 3.44, and the two runs differ only in seed, so the difference is attributable to the configuration."
      misconception: D16
      explain: "This treats a run's score as a stable property of the configuration. It is a draw from a distribution: with sigma = 0.03 seed-to-seed, the direction of a 0.03 gap is close to a coin flip, and holding everything but the seed fixed is precisely the condition under which the noise shows up."
    - text: "Established, but only weakly: 0.03 is exactly one standard deviation, which corresponds to about 68% confidence that the first configuration is better."
      misconception: V0-M1
      explain: "The 68% figure is a statement about how often chance stays within one sigma, not a probability that a hypothesis is true - and it is attached to the wrong quantity here besides. A tail area under the null never converts into confidence about which configuration is better."
    - text: "Not established, because 3.41 and 3.44 are both far from the expected value of the metric, so neither run is a typical outcome for its configuration."
      misconception: V0-M2
      explain: "The conclusion is right by accident and the reasoning is wrong. Both scores sit within a standard deviation of the mean, and an expectation is a probability-weighted mean rather than the outcome a run is supposed to land on. The real reason is that the gap is the size of the noise."
  check: choice
  difficulty: stretch
  band: 5
- id: v0-q14
  concept: d-vol1-floor
  kind: constructed
  congruent: true
  callback_eligible: false
  prompt: |
    Gradient descent updates a weight $w$ using the gradient
    $\partial L / \partial w = -2$ and learning rate 0.1. What is the
    SIGNED change applied to $w$? (A positive answer means $w$ grows.)
  answer: '0.2'
  check: numeric(0.001)
  difficulty: stretch
  band: 4

# Bands 1 and 2: the floor. Band 1 is the arithmetic of chance - a fraction,
# an average, a coin. Band 2 is recognising the objects (probabilities sum to
# 1, an expected value is a weighted sum) or following a recipe that is
# spelled out. "Absolute novice" is sized here, not at z-scores.
- id: v0-n1
  concept: d-prob-basics
  kind: constructed
  congruent: true
  callback_eligible: false
  prompt: |
    A fair coin is flipped once. What is the probability it lands heads?
    Answer as a decimal.
  answer: '0.5'
  check: numeric(0.001)
  difficulty: warmup
  band: 1
- id: v0-n2
