# Container paths are intentionally explicit. Back up data_dir and
# generated_corpora_dir; cache_dir and temp_dir are disposable.
data_dir: /var/lib/chiron/data
generated_corpora_dir: /var/lib/chiron/generated
cache_dir: /var/cache/chiron
temp_dir: /var/tmp/chiron
builds_dir: /var/lib/chiron/builds
requests_dir: /var/lib/chiron/requests
readings_dir: /var/lib/chiron/readings
primers_dir: /var/lib/chiron/primers
fonts_dir: /opt/chiron/content/fonts

subjects:
  - id: ai
    title: How AI Works
    corpus_dir: /opt/chiron/content/corpus
    state_dir: /var/lib/chiron/data/subjects/ai
  - id: data
    title: Where the Words Come From
    corpus_dir: /opt/chiron/content/corpus-v2
    state_dir: /var/lib/chiron/data/subjects/data

vision_model: Qwen/Qwen3-VL-30B-A3B-Instruct
upstreams:
  - name: deepinfra
    base_url: https://api.deepinfra.com/v1/openai
    model: meta-llama/Llama-3.3-70B-Instruct-Turbo
    enabled: true
llm:
  api_key_file: /run/secrets/deepinfra_api_key
  temperature: 0.7
  timeout_s: 600
  max_tokens:
    grader: 900
    planner: 1200
    author: 3500

auth_token_file: /run/secrets/chiron_auth_token
session:
  mastery_gate: 0.80
  extension_trigger: 0.90
  check_items: 9
  callback_fraction: 0.4
  chunk_minutes: 22
  break_minutes: 5
  long_break_every_chunks: 4
