# chiron-server configuration
subjects:
  - id: ai
    title: "How AI Works"
    corpus_dir: ../corpus
    state_dir: ../state/ai
static_dir: static
katex_dir: ../ipad-app/Chiron/Resources/katex
fonts_dir: ../assets/fonts
# Transcribes handwritten ink submissions from the paper client.
vision_model: google/gemma-3-4b

upstreams:
  # First healthy upstream wins. Health = GET {base_url}/models within 3s.
  - name: lmstudio
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.6-35b-a3b
    enabled: true
  - name: hodar
    base_url: http://hodar:11434/v1     # via tailscale, only if flight wifi; TODO Matt: url + model
    model: ""
    enabled: false

llm:
  temperature: 0.7
  timeout_s: 240          # hard client timeout (documented infinite-loop pathology)
  max_tokens:
    grader: 900
    planner: 1200
    author: 3500

session:
  mastery_gate: 0.80
  extension_trigger: 0.90
  check_items: 9
  callback_fraction: 0.4
  chunk_minutes: 22
  break_minutes: 5
  long_break_every_chunks: 4

# Shared secret for the exchange API. Empty = open (correct on the flight LAN,
# where the only client is the iPad on a Mac-hosted network). Set this before
# exposing the server on a public URL.
auth_token: ""

# Grade all free-text items of a check in one model call. Off by default;
# the per-item path is the verified one. Turn on where per-call startup
# dominates (e.g. the claude-cli upstream).
batch_grading: false
