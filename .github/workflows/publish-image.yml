name: Publish OCI image

on:
  push:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-chiron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/joshpearce/chiron:sha-${{ github.sha }}
            ghcr.io/joshpearce/chiron:personal
          labels: |
            org.opencontainers.image.source=https://github.com/joshpearce/chiron
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
